cted, and the one that costs least to keep. A back door unbolted. A ladder left up. A gap in a wall kept clear. Whatever else you do to a building, do not reduce it to a single exit in the name of making it safe. Every improvement that seals a place is also sealing you inside it.","ch":7},{"n":56,"quote":"Choose ground for its water first and its walls second.","bare":true,"attribution":"Samuel Oyelaran","means":"A place that works for years rather than a place that survives a night. A spring or a beck above the buildings, so it comes to you and does not have to be carried up. Sam's ranking was water, then approach, then exits, then shelter, then walls, and he would not move on the first one. A perfect house that is four hundred yards from water is a house where somebody makes eight hundred trips a year in the open with both hands full.","use":"The slow bleed. Every trip is exposure, every trip is time, and the household adapts by fetching less, which means washing less and drinking less, and you are back in chapter four. Two families in the second year abandoned good stone buildings for worse ones with better water. Both said the same thing afterwards: they should have done it in the first month instead of the fourteenth.","ch":7},{"n":57,"quote":"A wall you cannot watch is a wall you do not have.","bare":true,"attribution":"Deniz Aksoy","means":"An honest picture of your own perimeter. Walk it at three in the morning and ask, from the kitchen window, what you can see and what you would hear. A hundred yards of good stone wall behind a barn where nobody ever looks is not protecting you; it is telling you a story about being protected while somebody stands behind it.","use":"Effort spent in the wrong place. People build. It is satisfying, visible work that feels like progress, and households will spend a fortnight raising a barrier they cannot observe rather than an afternoon cutting the hedge that blinds them. Deniz's version was blunter than mine: you do not need a wall, you need to know. Watch first. Build only where watching has told you to.","ch":7},{"n":58,"quote":"Cut the sightlines before you build anything.","bare":true,"attribution":"the Bracewell standing orders","means":"Distance, which is the only resource that matters when somebody arrives. Take out the hedge that hides the bend, the shed that blocks the view of the lane, the elder in the corner of the yard. Four hundred yards of warning is enough for a household to be inside, quiet and counting. Forty yards is enough to be surprised at.","use":"Every problem arrives at arm's length. There is a caution attached, and Bracewell learned it the hard way. Land you have cleared is also land you are visible on, and a farm stripped of every hedge announces itself as a farm somebody is holding. Cut what blinds you on your own approaches. Leave the screen that hides your roof from the ridge. It is a trade, not a principle, and the orders are wrong to state it as flatly as they do.","ch":7},{"n":59,"quote":"Upstairs is a trap with a view.","bare":true,"attribution":"Aiden Kerr","means":"A correct use for the first floor, which is watching, and a correct place to sleep, which is not up there. Height is the best observation you have and the worst position you can be caught in. Aiden scavenged houses for two years and had a rule about never going above ground level in a building he had not first walked the outside of.","use":"A staircase is a corridor with one end. Everybody who has been trapped in a building in this valley was trapped upstairs, and in three of those cases the ground floor was clear and stayed clear the whole time. Use the height in the day. Sleep near a door. If you must sleep upstairs, put a rope on the window sill and leave it there, and check the knot in daylight now and again.","ch":7},{"n":60,"quote":"Make every route in noisy on purpose.","bare":true,"attribution":"Tom Shackleton","means":"Warning that works while you are asleep, for the price of an afternoon. Gravel on the two paths people would actually use. A gate that is wired so it rattles. Tins on a line across the gap in the wall. Tom did it in the second month, and he did the thing most people miss. He left one silent route for his own household, so they were not setting off their own alarms four times a night.","use":"A watch rota that has to be kept by human beings, all night, in winter, for years. That is the alternative and it is not sustainable; watches degrade, people doze, and the third winter is when it happens. Passive warning does not get tired. It is also the only thing that protects you on the night everybody is ill.","ch":7},{"n":61,"quote":"Fire ends places. Plan for it before it is on you.","bare":true,"attribution":"the Settle school log","means":"The one disaster that can finish a well-run household in twenty minutes. Water in the yard where it can be reached without going through the building. A break between the store and the house. Nothing burning left unattended, ever, and the stove out at night. The school log has eleven pages about a chimney and then stops.","use":"Everything you have built and everybody asleep in it. We are all burning wood indoors in buildings wired for a different century, with candles and lamps and no water above the ground floor, and we are doing it while exhausted. Fire is more likely to kill you now than it was before, by a long way. It receives the least attention in every household I have visited, including my own until the school burned.","ch":7},{"n":62,"quote":"Do not fortify what you cannot leave.","bare":true,"attribution":"Deniz Aksoy","means":"A clear head about a thing people become sentimental about. Three years of work makes a place into an argument you cannot lose. Deniz tested every improvement against one question. Does this make it harder for us to walk out of here in ten minutes. Barred windows fail that test. A dug well passes it. Stored food in one cellar fails it, which is chapter six's third cache.","use":"You will stay when you should go, and you will not experience it as a mistake. You will experience it as loyalty to the place. Everybody who died at the mill died because the mill was worth defending, and it was, and they were right about that, and it did not matter.","ch":7},{"n":63,"quote":"The place is worth less than the people in it, and you will not believe that when it matters.","bare":true,"attribution":"Ruth Cadogan","means":"Permission, decided in advance, on a calm day, in front of witnesses. Ruth made her household say it out loud once a year: this is a building, we are not going to die in it, and if we go the seed and the medicine and the children go first and the rest stays. Say it while nothing is happening. It will not be sayable later.","use":"This rule contradicts the one before it and the whole of chapter two, and I have left all three of them standing. Some ground is worth holding and Tom was right to hold it. But every household that lost people to a place lost them the same way, which is by making a decision to leave four hours after the decision was available. The building will still be there in a month. You can come back. Nobody has ever come back to a person.","ch":7}]},{"n":8,"title":"Strangers","part":"Three","partRoman":"III","partName":"Ground and Other People","opening":"<p>I have been on both sides of a gate and I am going to say the uncomfortable thing first, because every book of this kind gets it wrong in the same direction.</p><p>The people at the gate are almost never the danger. In three years I can count the genuinely predatory groups in this district on one hand, and four of the five were formed out of households that had been turned away from somewhere in the first winter. Nearly everybody who has ever stood at the end of our lane was what they appeared to be: a family, walking, with the wrong shoes on, asking whether we knew anything about the road east. The arithmetic is not close, and the reason it feels close is that the one bad group is the only one anybody tells stories about.</p><p>But the caution in this chapter is real, and it is not about the arithmetic. It is about the fact that being wrong once is different in kind from being wrong ninety times. The households that were destroyed by other people were not destroyed by strangers arriving. They were destroyed by strangers arriving in a way that gave the household no time and no room, at the gate, in the dark, with everything visible behind them.</p><p>So the rules here are almost all about geometry and sequence rather than judgement. Where you stand. How far away. Who speaks. What can be seen from where they are. What happens before a decision has to be made. Get the geometry right and you can afford to be generous, which is the actual aim, and the only households in this valley that are still worth living in are the generous ones.</p><p>The last rule is the reason for the chapter and it is Marta&#x27;s.</p>","entries":[{"n":64,"quote":"Talk first, from a distance, with something solid between you.","bare":true,"attribution":"Deniz Aksoy","means":"Time, and the ability to change your mind. Sixty yards, a wall, a raised voice, and a conversation that begins before anybody is committed. Almost every situation that goes wrong between two groups goes wrong inside fifteen feet, in the first ninety seconds, because both sides were surprised and both were frightened and somebody moved a hand.","use":"You will make a decision about eight people in the time it takes them to cross a yard. Deniz's whole method was to slow the encounter down: talk across a distance for five minutes about nothing, the weather, the road, where they have come from, and let both sides get bored. Boredom is the thing you are trying to manufacture. Nobody has ever been killed by a group they had already been bored with.","ch":8},{"n":65,"quote":"Never meet anybody at your own gate.","bare":true,"attribution":"the Bracewell standing orders","means":"A meeting place of your choosing, which is worth more than any weapon. Bracewell used a bend in the lane three hundred yards out with a wall on one side, and every conversation with an outsider happened there. It shows nothing, commits nothing, and gives you a walk home during which you can talk it over.","use":"Everything you own becomes part of the negotiation. At your own gate they can see the roof, the stock, the store, the children, the number of you, and whether the men are older than they look, and all of that is now in the head of somebody you may never see again, or may see in four months with company. Meet away from the place. Always. Even for people you like.","ch":8},{"n":66,"quote":"Feed them outside the wall.","bare":true,"attribution":"Ruth Cadogan","means":"The ability to be decent without being opened. Bread, hot water, a bag of potatoes, and directions, handed over at the meeting place, is a real kindness and costs you almost nothing, and it is what the great majority of people at your gate actually need. Ruth did it more than a hundred times and never once regretted it.","use":"The two failure modes are opposite and both are expensive. A household that gives nothing accumulates people who have nothing and know where you are, which is exactly how the group at the mill formed. A household that brings everybody in has lost the only thing that lets it keep giving. Between them there is a wide, workable middle, and Ruth lived in it for three years.","ch":8},{"n":67,"quote":"Believe the children.","bare":true,"attribution":"Joyce Attwell","means":"The most reliable information available at a meeting. Adults arrive with a prepared account because they have learned they must. Children answer what you ask. How many nights have you been walking. Was there a house. Did the men come with you from there. Joyce would talk to the children while somebody else talked to the parents, and she said she had never had a false picture from doing it.","use":"You will take an adult's story at face value and it will be a story built to get them in, which is what a frightened parent should be doing and not a sign of bad faith. The rule has a limit that Joyce insisted on: this is for building a picture, not for cross-examining a nine year old about their family in front of them. Ask two gentle questions. That is usually the whole of it.","ch":8},{"n":68,"quote":"A group that will not give you a name will not give you anything else.","bare":true,"attribution":"Aiden Kerr","means":"The single most useful signal at a distance. Names, where you have come from, where you are going, who is hurt. The great majority of people answer these, and answer them at once, because they have nothing to hide and a great deal to gain from being known. Aiden's line was that honest people over-explain and frightened people over-explain more.","use":"You will miss the small number of encounters that are actually dangerous, and they announce themselves early if you are listening for it: no names, questions in both directions but no answers, a count of you being taken, a story that adjusts to what you seem to want. That is a different thing from what a nervous family does, and once you have met it you will not confuse the two.","ch":8},{"n":69,"quote":"Trade at distance, in the open, in daylight, or not at all.","bare":true,"attribution":"the Whitewell list","means":"Trade, which is worth having, and which almost stopped in the second winter because nobody had a safe shape for it. Neutral ground both parties can see across. Goods set down and stepped back from. Two people, not eight. And an agreement made the meeting before about what is coming, so that nobody is improvising.","use":"The trade that goes wrong is almost always the one arranged quickly, at dusk, at somebody's buildings, with more people present than were expected. Whitewell lost salt and a man in one afternoon by breaking three of the four conditions at once, and the list was written the following week by people who were arguing about whose fault it had been.","ch":8},{"n":70,"quote":"Nobody tells the same story twice unless they have rehearsed it.","bare":true,"attribution":"Hanna Volk","means":"A quiet check that costs nothing. Ask about the route again an hour later, in a different order, and a true account will come back with different details and the same shape, because that is how memory works. A prepared one comes back word for word, or comes back different in the shape and the same in the words.","use":"Hanna was careful about this and I want to repeat her warning rather than her method. People lie for good reasons. A family that has been turned away from four places will have learned a story that works, and the fact that it is polished does not make them dangerous, it makes them experienced. The signal is worth having and it is not a verdict. Use it to ask a better question, not to close the gate.","ch":8},{"n":71,"quote":"Never let anybody see the whole of what you have.","bare":true,"attribution":"Tom Shackleton","means":"A margin that survives your own generosity. Whatever is visible from the meeting place is what you are known to have, so the store is out of sight, the stock is in the back field on the days you are expecting anybody, and the third cache is a thing nobody outside the household has ever heard mentioned. Tom went further and kept a small obvious store that could be given away.","use":"You become a number in other people's plans. This is the rule that sounds least generous and is actually what makes generosity survivable, because a household that is known to be thin can afford to give a stranger bread, while a household that has been seen to be rich will be visited by the fifth group in a way the first four did not consider.","ch":8},{"n":72,"quote":"Take somebody in, or admit what you are becoming.","bare":true,"attribution":"Marta Ellison","means":"A household you would want to survive into. Everyone in this valley who is still here is here because at some point somebody who owed them nothing opened a gate. Marta's position, and she argued it hard at Whitewell against people with better reasons than hers, was that a household which has decided in principle never to take anybody in has already made its decision about the rest of it too, and will keep making that decision until there is nothing left inside the wall worth the walls.","use":"She was not naive and she was not talking about taking in everybody, which is not possible and gets people killed. She was talking about the third winter, and about what a household becomes after a hundred consecutive refusals: quiet, efficient, sealed, and unable to remember why it is doing any of this. We took in four people that Marta argued for. Two of them are the reason Hillfoot came through the second winter. One of them wrote a third of the chapter you have just read.","ch":8}]},{"n":9,"title":"Living in a Group","part":"Three","partRoman":"III","partName":"Ground and Other People","opening":"<p>Not one household in this valley has failed because of what was outside it. I have thought about that sentence for a long time and I cannot find an exception.</p><p>They failed over the rota. They failed because two people wanted the same thing and there was no way of settling it that both of them had agreed to in advance. They failed because a man was counting the stores alone and everybody knew it, and nobody said anything for four months, and then somebody said it badly at the wrong moment in front of the children. Bracewell held sixteen people for three years and it did that on the strength of nine lines of gloss paint, and the lines are not about the dead at all. They are about who decides, who counts, who cooks and what happens when somebody is impossible to live with.</p><p>That is the real work and nobody prepares for it. Everybody has thought about the fence. Nobody has thought about what to do with a competent, hard-working, frightened man who is quietly certain that he should be running the place, and there is one of him in every group of more than six people, and if you do not have a way of handling him then the way you handle him will be a shouting match in February.</p><p>Ruth Cadogan ran Bracewell without ever holding a title. Her view was that a group needs three things written down: who has the final word in an emergency, how food is decided, and how somebody leaves. She reckoned that groups which had settled all three could survive nearly anything and groups that had settled none of them would come apart in the first hard winter without any help from outside at all.</p><p>She was right. I have watched it seven times.</p>","entries":[{"n":73,"quote":"Write the rules down before you need them, and put them where they can be read.","bare":true,"attribution":"the Bracewell standing orders","means":"Arguments about a document instead of arguments about a person. Once it is on a wall, disagreement is directed at nine lines of paint rather than at whoever is standing in the kitchen, and the thing can be amended in daylight by people who have eaten. It also means that everybody who joins the group learns the rules in the first hour rather than in their first row.","use":"Every dispute becomes personal and every precedent has to be argued from scratch. Unwritten rules always exist, they are just held differently by each person, and the discovery that they differ happens in the middle of a crisis. The nine lines took Bracewell an evening. Nothing else they did bought so much for so little.","ch":9},{"n":74,"quote":"Somebody has the final word in an emergency, and everybody agrees who before there is one.","bare":true,"attribution":"Deniz Aksoy","means":"Ninety seconds, which is the whole of an emergency. It does not need to be the same person for everything, and Bracewell had three: one for anything outside the wall, one for anything medical, one for fire. Named, agreed, written up, and holding only until the thing is over.","use":"A committee in a yard at night with something coming up the lane. Deniz had seen it and described it as the worst thing he had ever watched: eleven capable adults, all of them right, none of them able to move, losing four minutes. The rule is not about hierarchy and it collapses if it becomes hierarchy. It is about a temporary, bounded authority that ends when the noise stops, and about everyone knowing which voice to obey without checking whose it is.","ch":9},{"n":75,"quote":"The person who holds the food does not also hold the rota.","bare":true,"attribution":"Ruth Cadogan","means":"Trust that does not depend on anybody's character. Split the jobs that carry power: stores, work allocation, the medicine, the decision to trade. Different people, rotated on a known cycle, each of them counted in front of somebody else. Ruth's design assumed that everybody was decent and that being decent would not be enough.","use":"Suspicion, which is slower and more destructive than theft and does not need any theft to happen. A single person who decides who works and who eats will be believed to be favouring somebody within about two months, and they may well be, because they are a human being deciding those things about people they like unevenly. Do not ask anybody to be that good. Split it.","ch":9},{"n":76,"quote":"Everybody works, including the ones who cannot.","bare":true,"attribution":"Joyce Attwell","means":"People who are still part of the group. The old, the injured, the ill and the very young all have work available to them: watching, sorting, mending, teaching, minding, peeling, keeping the log. Joyce had a woman of eighty-one who could not walk to the gate and who ran the entire seed inventory and taught four children to read.","use":"Two things at once. The group loses hours it needs. And the person loses their place in it, which happens fast, and after a fortnight of being carried they will start apologising for eating, and then they will start refusing food, and I have seen where that goes twice. Give everybody a job that genuinely matters and let them do it badly if that is how it gets done.","ch":9},{"n":77,"quote":"Say the bad news at breakfast.","bare":true,"attribution":"Hanna Volk","means":"A group that can absorb it. Bad news delivered in the morning, to everybody at once, in plain words, gets a day of daylight and work to be metabolised in. The same news at nine at night sits in the dark with people and comes out as something else entirely by morning.","use":"Rumour, which is always worse than the fact and always arrives anyway. Hanna's rule came out of the second winter when a decision about the stores was taken quietly by three people who were trying to avoid frightening anybody, and it was known in an inaccurate form within a day and a half, and the version that circulated was so much worse than the truth that two families left. Tell them at breakfast. Tell them the actual number.","ch":9},{"n":78,"quote":"A grievance kept for a fortnight is no longer about the thing.","bare":true,"attribution":"the Settle school log","means":"Small problems that stay small. There is an entry in the log, in a teacher's handwriting, listing three arguments and the number of days each had been running before it was raised, and the conclusion at the bottom is that nothing raised in the first two days had ever needed more than a conversation. Have a way of raising things that does not require courage: a weekly hour, a person whose job it is, anything.","use":"In a group of nine people who cannot leave, a fortnight is long enough for an irritation about washing up to become a settled belief about somebody's character, and once it is about character it cannot be resolved by fixing the washing up. Everything I have watched come apart came apart at that stage and not before.","ch":9},{"n":79,"quote":"Count the stores in front of two people, on a fixed day.","bare":true,"attribution":"Samuel Oyelaran","means":"A number everybody believes, which is the foundation of every hard decision you are going to have to make together. First Sunday of the month, two people, written in the book, read out at breakfast. Sam argued for it not because he expected theft but because he expected disbelief, and disbelief is the thing that actually breaks a group.","use":"A household where everybody is privately estimating, and where the estimates diverge, and where the people who think there is less are hoarding and the people who think there is more are resentful of the rationing. Bracewell's count took twenty minutes a month. Sam's phrase for it was that the count is not an audit, it is a conversation everybody is allowed to be in.","ch":9},{"n":80,"quote":"Nobody watches alone for more than two hours.","bare":true,"attribution":"Tom Shackleton","means":"A watch that is actually being kept. Attention collapses after about two hours in the cold and dark, and the person on watch does not notice it collapsing, which is the whole difficulty. Short shifts, a proper handover with something said out loud, and a warm place to go afterwards.","use":"Four hours of theatre. A household that runs long watches has people sitting in the dark achieving nothing, sleeping worse, working worse the next day, and providing a sense of security that is not connected to anything. Tom would rather have had passive warning on the approaches and everybody asleep than a man out for six hours, and after the second winter that is what he did.","ch":9},{"n":81,"quote":"You are allowed to leave.","bare":true,"attribution":"Aiden Kerr","means":"The thing that makes all of the above voluntary. A group people cannot leave is a different kind of place, and it becomes that kind of place by degrees without anybody choosing it. Bracewell wrote down what a person takes with them when they go, which was their own gear, a fortnight of food and a share of the seed, and agreed it in a good month so that nobody had to negotiate it in a bad one.","use":"People stay in groups that are going wrong, and they stay for the reason that leaving means starving, and a group that knows its members cannot leave stops having to be worth staying in. Aiden left two places in his first year and both of them tried to keep him and one of them took his boots. Write down the terms of leaving. Then hope nobody uses them.","ch":9}]},{"n":10,"title":"Winter","part":"Four","partRoman":"IV","partName":"The Long Middle","opening":"<p>The first winter took four people out of this valley. The second took nineteen. There was no attack in the second winter, the harvest had been better, and the weather was milder by any measure you like.</p><p>That is the fact that organises this chapter, and it took me most of a year to understand it. Winter does not kill people in December. It kills them in February, and it does it to households that came through the autumn in good order, and the mechanism is not cold. It is accumulation. Everybody is a little wetter than they should be, has been for eleven weeks. Everybody is sleeping badly in a cold room. Nobody has eaten fat since November. The wood is green because it was cut in October by people who were busy. Small jobs get postponed because it is raining, and then it is always raining. By the second week of February a household has fifty postponed jobs and no capacity. One ordinary problem arrives and there is nothing left to meet it with.</p><p>The people who died in the second winter did not die of the winter. They died of the accumulated cost of getting through it badly, and every one of those costs was set in September by somebody with time on their hands.</p><p>So this chapter is mostly about autumn. That is the trick of it. Almost nothing in here can be done in January, and almost all of it is easy in October, when the danger feels remote and the days are still long enough to work in. Read it in September. If you are reading it in January, read the last two and let the rest go until spring.</p>","entries":[{"n":82,"quote":"Wet kills. Cold only helps it.","bare":true,"attribution":"Deniz Aksoy","means":"The correct enemy. A dry person in bad clothes at freezing will be uncomfortable for a long time and will live. A wet person in good clothes at eight degrees is on a clock, and eight degrees and raining is the ordinary weather here for five months. Everything about a winter routine should be built around getting dry and staying dry: a drying place, a spare set, and a hard rule about changing.","use":"People will work all day in the wet because they are not cold while they are working, and the bill arrives when they stop. Deniz put the drying rack in the kitchen at Bracewell and made it the most valuable square yard in the building. He made changing out of wet clothes a rule and not a choice. The person who most needs to change is always the one who says they are fine.","ch":10},{"n":83,"quote":"Heat the person, then the bed, then the room. Never the house.","bare":true,"attribution":"Samuel Oyelaran","means":"A winter's fuel that lasts a winter. Warm clothes and a hat indoors, a hot stone or a bottle in the bed an hour before it is used, one room with the door shut, and everything else left to the weather. Sam reckoned the difference between heating a room and heating a farmhouse was a factor of six in wood, which is the difference between cutting in October and cutting in January.","use":"You burn the whole store by the middle of February trying to make a stone building comfortable, which it will not become. Then you are cold in the worst month with nothing left and a green woodpile. The households that were warm in the second winter were not the ones with the most wood. They were the ones living in one room and wearing coats in it.","ch":10},{"n":84,"quote":"Cut your wood a year before you burn it.","bare":true,"attribution":"Tom Shackleton","means":"Twice the heat and a quarter of the smoke, which is chapter three's problem solved as a side effect. Green wood has half its weight in water and burns cold, dirty and slow, and it lines a chimney with the thing that later burns the house down. A year under cover, split, off the ground. Tom worked two winters ahead and always had.","use":"A cold February with a full woodpile, which is the most demoralising thing I have watched a household go through. They did the work. They cut, hauled, split and stacked four tons, and it will not burn properly, and there is no fixing it now. This is the purest example in the book of a rule about time rather than effort. You cannot work harder in January to undo not having cut in the previous January.","ch":10},{"n":85,"quote":"Two pairs of dry socks are a survival stock.","bare":true,"attribution":"Aiden Kerr","means":"Feet you can still walk on in March. Wool, changed daily, dried by the fire overnight, with the wet pair going inside your coat during the day if there is no fire. Aiden had four pairs and treated them the way other people treated the medicine box, and he walked more miles than anybody in this valley and never had a foot problem.","use":"Trench foot, which nobody expects and which took three people out of action for weeks in the second winter, and one of them permanently. It comes from days of damp rather than from cold, and it arrives without pain until it is well established. Feet, hands and head. Everything else about winter clothing is negotiable and those three are not.","ch":10},{"n":86,"quote":"Sleep small and sleep together.","bare":true,"attribution":"Ruth Cadogan","means":"The eight hours a day when you are producing no heat and losing it fastest. A small room, a low ceiling or a canopy over the bed, bodies together, straw or bracken under the mattress rather than a cold floor beneath it. Ruth put nine people in two rooms at Bracewell and there was some grumbling about it in the first November and none at all by January.","use":"A household that is cold all night for five months does not recover during the day. It shows up as illness, accidents, short tempers and a general slowness that everybody blames on the diet. This is also the cheapest of all the winter rules. It costs nothing at all except the idea that adults are entitled to their own rooms, which is a thing worth having and not worth a winter.","ch":10},{"n":87,"quote":"Do the outside jobs in November.","bare":true,"attribution":"the Gisburn stock book","means":"A January you can survive on the inside. Roof, gutters, drains, gate, wall gaps, the path to the store, the woodshed door, and the state of the boots, all done while there is still light and the ground is workable. The stock book has a November list four pages long and a January list with six items on it, and the discipline is in the difference.","use":"Every one of those jobs done in the wet, in the dark, badly, by somebody who is already cold, at the exact moment when the failure of any of them is most expensive. A blocked drain in November is a morning's work. In February it is a flooded store, a fortnight of damp and a household eating wet flour.","ch":10},{"n":88,"quote":"Nobody travels alone between December and March.","bare":true,"attribution":"Elin Pryce","means":"Somebody to fetch help. Winter travel here is not dangerous because of what is on the road. It is dangerous because a turned ankle four miles out at three in the afternoon is a night outside. A night outside in January is not survivable in the clothes people actually wear. Elin lost a colleague that way in the first year on a journey of five miles that she had made forty times.","use":"The whole margin. A pair can carry an injured person, keep them warm, or leave one and go, and any of the three is a survivable afternoon. Alone, all of it is the same afternoon. The rule has one exception and it is not the one people reach for: a short familiar journey in daylight with somebody at both ends who knows your timing and will come looking. Being expected is the actual protection.","ch":10},{"n":89,"quote":"Watch for whoever has gone quiet.","bare":true,"attribution":"Hanna Volk","means":"The person you are about to lose to something that is not cold. February in a dark house with the same eleven people is when the grief that everybody has parked since the first spring comes back for its answer. Hanna's method was simple and I have never seen it fail: notice who has stopped talking, and go and sit next to them and do a job together without asking them anything.","use":"Two of the nineteen we lost in the second winter were not lost to the winter. Both had been quiet for a fortnight in a full house. Everyone said afterwards that they had noticed and had not wanted to intrude, which is the most understandable sentence in this book and the most expensive.","ch":10},{"n":90,"quote":"You are allowed to spend the winter doing nothing.","bare":true,"attribution":"Joyce Attwell","means":"Spring, with people left in it. There is no useful outside work for a great deal of January and February in this country. A household that treats the whole winter as a productivity problem will grind through it and arrive at March exhausted, in the month when the year's actual work begins. Joyce's winter timetable had three hours of jobs in it and the rest was reading, teaching, sleeping, cards and talking.","use":"Everything that matters and nothing you can point at. Rest is not idleness and it is not a reward for having earned it. It is the thing that puts a household on its feet in the spring. The seasons in this country have been arranged so that there is a stretch in the middle where the only sensible thing to do is very little. Take it. The list will still be there.","ch":10}]},{"n":11,"title":"When to Break a Rule","part":"Four","partRoman":"IV","partName":"The Long Middle","opening":"<p>Colm Reidy wrote three of the rules in this book. He was right about all three. He was right in a way that saved people who are still alive. He has been dead for fourteen months.</p><p>He died four miles from here keeping two rules that are printed in this book, in a barn, in October, with a fire he would not light because of chapter three. There was a house with people in it eight hundred yards away and he knew that. His leg had been broken since the afternoon. He had spent two years being right about things, in front of people. By the end he could not be the man who arrived somewhere at night, cold, needing help, having broken his own instruction. I do not think he decided to die. I think he could not find the version of himself that was allowed to.</p><p>So this chapter exists, and it is the shortest one, and I have thought about it more than the other ten put together.</p><p>A rule is a bet that the ground has not changed. Every line in this book was written by somebody standing in a particular field in a particular year with particular people, and it is right there. Carried far enough from where it was made, any of them turns into a way of dying with your principles intact. But the reverse is worse, and it is much more common. A person who breaks rules whenever the situation feels exceptional has no rules at all, and every situation feels exceptional at the time. That is what makes this hard. Both failures are real, and there is no formula.</p><p>What follows is the nearest thing I have to one. It is a set of conditions for breaking a rule rather than a list of the ones to break, and the last of them is the last thing in the book.</p>","entries":[{"n":91,"quote":"Know which rule you are breaking, and say it out loud first.","bare":true,"attribution":"Ruth Cadogan","means":"The difference between a decision and a drift. Naming it, aloud, to another person, in the moment, takes four seconds and converts an impulse into a choice somebody else has heard. We are lighting a fire in the open. We are going out after dark. Ruth's household did it dozens of times and the saying of it was the whole discipline.","use":"Rules do not get broken. They get eroded, one reasonable exception at a time, until the household is doing something it would never have agreed to do and cannot remember deciding. Nobody at the mill ever voted to stop keeping watch.","ch":11},{"n":92,"quote":"Break a rule for a person. Never for a thing.","bare":true,"attribution":"Marta Ellison","means":"A test you can apply in twenty seconds under pressure, and the only one in this chapter that has never let me down. Going out at night for somebody who is hurt is a rule worth breaking. Going out at night for a store of flour is not, and it will feel identical while you are pulling your boots on.","use":"Almost everybody who has died breaking a rule in this valley died going back for an object. Fuel, tools, a generator, a box of tins. Every one of those journeys was justified at the time by arithmetic that was correct. The flour is still there. So is the man who went for it.","ch":11},{"n":93,"quote":"A rule you learned in the first winter is about the first winter.","bare":true,"attribution":"the Gisburn stock book","means":"Rules that keep up with the world. The valley of the first year had cars in it, open shops, a functioning road east and eleven times as many people. Half the instructions that were correct then are now costing somebody a morning's work for nothing. The stock book has whole pages crossed out with a date and a note beside them.","use":"Effort spent defending against a year that has finished. Review the list once a year, in the quiet part of the winter. Ask of each rule what it is protecting you from, and whether that thing is still out there.","ch":11},{"n":94,"quote":"Two of you have to agree. One of you can always keep it.","bare":true,"attribution":"Deniz Aksoy","means":"A brake that does not depend on being the calmest person in the room. Any rule in this book can be broken by a household that agrees to break it, and any single member can refuse and the thing does not happen. It sounds slow. It takes about a minute and it has stopped more bad journeys here than any other arrangement.","use":"The person who is most frightened, most tired or most certain makes the decision, and those three are usually the same person, and they are always the one moving first. Deniz's addition was that the one who refuses does not have to explain, because the requirement to give reasons is how a refusal gets talked out of.","ch":11},{"n":95,"quote":"Distrust anybody who has never been wrong.","bare":true,"attribution":"the Bracewell standing orders","means":"Protection from the most dangerous person in a group, who is not the reckless one. It is the competent one with a good record, whose judgement everybody has learned to defer to, and who has therefore stopped receiving any correction at all. Colm was that man. He earned it honestly.","use":"A group with one voice in it, which is a group with one point of failure. It is also unkind to the person, who ends up unable to be uncertain in front of anybody and then unable to arrive at a door at night asking for help. If you are the one being deferred to, be wrong out loud about something small, on purpose, in front of everybody, twice a year.","ch":11},{"n":96,"quote":"When the rule and the room disagree, believe the room.","bare":true,"attribution":"Aiden Kerr","means":"Your own eyes back. The rules in this book are averages taken across three years and a whole district. You are standing in one place, looking at one particular thing that none of us has seen. Where the ground in front of you plainly contradicts the page, the ground is the better evidence. It knows about today.","use":"Aiden broke chapter eight's rules to bring two children in through the back field at dusk without meeting anybody at the meeting place first, and by every line of that chapter he was wrong. They are both still here. He also, in the same month, trusted a room over a rule and lost a coat, a bag and a fortnight of food. The room is better evidence. It is not good evidence.","ch":11},{"n":97,"quote":"Write down what you broke and what happened.","bare":true,"attribution":"Joyce Attwell","means":"A book that improves. Every rule in here came from somebody keeping a record, and the exceptions are more informative than the rules. A rule that gets broken four times a year with no consequence is not a rule. It is a habit with a uniform on. Joyce kept the log at Whitewell in a school exercise book.","use":"The same argument every year and nothing learned from any of it. Half the entries in this book are in the shape they are because somebody broke them and wrote down why. Three were removed when the log made it clear they had never once been right.","ch":11},{"n":98,"quote":"Four of these are not for breaking.","bare":true,"attribution":"the Hillfoot parlour door","means":"A floor. Everything in this book is negotiable except four things, and I have chosen them by looking at the ground behind the chapel and not by reasoning about it. Boil the water. Keep the second door. Talk from a distance before anybody moves. And no decision about a human being gets made by one person in a hurry.","use":"These are the four where the cost of being wrong lands on somebody who did not make the decision, and that is the whole basis for the list. Break any of the other ninety-five when the room tells you to. Break these when you have run out of ways of being a person, and not before.","ch":11},{"n":99,"quote":"Put this down and go and live.","bare":true,"attribution":"Nell Shackleton","means":"The point of the exercise. Nell is nineteen now. She has read this list more carefully than anybody and she is scathing about it, and her objection is the correct one. It is a book about not dying, and there is nothing in it about anything else. She has a garden that is not a food garden. She is teaching two children to swim in a river that four of these rules would keep them out of.","use":"Ninety-eight rules will get a household through a winter. They will not give anybody a reason to want the spring. I have watched people learn all of this and keep every line of it, and become careful, and quiet, and unbeatable. By the third year there was nothing left inside the wall except the arrangements for staying alive. That is not survival. It is a slower version of the other thing. Learn the ninety-eight. Then close the book, because it is a list of ways not to die and you were not put here to spend your life reading one.","ch":11}]}],"index":[{"name":"Aiden Kerr","letter":"A","items":[{"n":12,"quote":"Everything you carry has to go six miles uphill.","ch":2,"q":""},{"n":24,"quote":"Metal on stone carries further than a voice.","ch":3,"q":""},{"n":51,"quote":"Cache in three places and never all of it anywhere.","ch":6,"q":""},{"n":59,"quote":"Upstairs is a trap with a view.","ch":7,"q":""},{"n":68,"quote":"A group that will not give you a name will not give you anything else.","ch":8,"q":""},{"n":81,"quote":"You are allowed to leave.","ch":9,"q":""},{"n":85,"quote":"Two pairs of dry socks are a survival stock.","ch":10,"q":""},{"n":96,"quote":"When the rule and the room disagree, believe the room.","ch":11,"q":""}]},{"name":"Bibi Farooq","letter":"B","items":[{"n":36,"quote":"A dirty person who is drinking beats a clean one who is not.","ch":4,"q":""},{"n":38,"quote":"Clean water and pressure beat every ointment in the house.","ch":5,"q":""},{"n":40,"quote":"Antibiotics are a course or they are nothing.","ch":5,"q":""},{"n":43,"quote":"Fever is a clock. Start it at the first shiver.","ch":5,"q":""},{"n":52,"quote":"Fat is the thing you run out of.","ch":6,"q":""}]},{"name":"the Bracewell standing orders","letter":"B","items":[{"n":58,"quote":"Cut the sightlines before you build anything.","ch":7,"q":""},{"n":65,"quote":"Never meet anybody at your own gate.","ch":8,"q":""},{"n":73,"quote":"Write the rules down before you need them, and put them where they can be read.","ch":9,"q":""},{"n":95,"quote":"Distrust anybody who has never been wrong.","ch":11,"q":""}]},{"name":"Colm Reidy","letter":"C","items":[{"n":16,"quote":"Have a second destination, and tell nobody outside the house what it is.","ch":2,"q":""},{"n":19,"quote":"Assume every sound you make travels twice as far as you think.","ch":3,"q":""},{"n":32,"quote":"Rain is the cheapest water you will ever have.","ch":4,"q":""}]},{"name":"Deniz Aksoy","letter":"D","items":[{"n":4,"quote":"Take the shoes, not the photographs.","ch":1,"q":""},{"n":11,"quote":"Leave in daylight or not at all.","ch":2,"q":""},{"n":23,"quote":"Never run where you can walk, and never walk where you can wait.","ch":3,"q":""},{"n":49,"quote":"Hunger makes bad plans look reasonable. Eat before you decide.","ch":6,"q":""},{"n":57,"quote":"A wall you cannot watch is a wall you do not have.","ch":7,"q":""},{"n":62,"quote":"Do not fortify what you cannot leave.","ch":7,"q":""},{"n":64,"quote":"Talk first, from a distance, with something solid between you.","ch":8,"q":""},{"n":74,"quote":"Somebody has the final word in an emergency, and everybody agrees who before there is one.","ch":9,"q":""},{"n":82,"quote":"Wet kills. Cold only helps it.","ch":10,"q":""},{"n":94,"quote":"Two of you have to agree. One of you can always keep it.","ch":11,"q":""}]},{"name":"Elin Pryce","letter":"E","items":[{"n":15,"quote":"A vehicle is a loud room with windows.","ch":2,"q":""},{"n":17,"quote":"Go back for the animals once.","ch":2,"q":""},{"n":22,"quote":"A dog is a decision, not a companion.","ch":3,"q":""},{"n":33,"quote":"Never drink from still water, whatever it looks like.","ch":4,"q":""},{"n":41,"quote":"Teeth will take more of you than anything with teeth.","ch":5,"q":""},{"n":50,"quote":"Learn three wild foods properly instead of thirty badly.","ch":6,"q":""},{"n":88,"quote":"Nobody travels alone between December and March.","ch":10,"q":""}]},{"name":"the Gisburn stock book","letter":"G","items":[{"n":47,"quote":"Salt is worth more than ammunition.","ch":6,"q":""},{"n":53,"quote":"A garden sown in March feeds you in August, and not one day sooner.","ch":6,"q":""},{"n":87,"quote":"Do the outside jobs in November.","ch":10,"q":""},{"n":93,"quote":"A rule you learned in the first winter is about the first winter.","ch":11,"q":""}]},{"name":"Hanna Volk","letter":"H","items":[{"n":45,"quote":"You are allowed to stop treating and start comforting.","ch":5,"q":""},{"n":70,"quote":"Nobody tells the same story twice unless they have rehearsed it.","ch":8,"q":""},{"n":77,"quote":"Say the bad news at breakfast.","ch":9,"q":""},{"n":89,"quote":"Watch for whoever has gone quiet.","ch":10,"q":""}]},{"name":"the Hillfoot parlour door","letter":"H","items":[{"n":1,"quote":"Believe it on the first day, not the third.","ch":1,"q":""},{"n":28,"quote":"Boil it.","ch":4,"q":""},{"n":55,"quote":"Two doors, always.","ch":7,"q":""},{"n":98,"quote":"Four of these are not for breaking.","ch":11,"q":""}]},{"name":"Joyce Attwell","letter":"J","items":[{"n":5,"quote":"Write down where you have gone and leave it where they will look.","ch":1,"q":""},{"n":13,"quote":"Take the map, not the phone.","ch":2,"q":""},{"n":27,"quote":"Keep something loud that you are allowed to do.","ch":3,"q":""},{"n":67,"quote":"Believe the children.","ch":8,"q":""},{"n":76,"quote":"Everybody works, including the ones who cannot.","ch":9,"q":""},{"n":90,"quote":"You are allowed to spend the winter doing nothing.","ch":10,"q":""},{"n":97,"quote":"Write down what you broke and what happened.","ch":11,"q":""}]},{"name":"the Long Preston roadblock","letter":"L","items":[{"n":6,"quote":"Get off the main roads before dark on the first night.","ch":1,"q":""}]},{"name":"Marta Ellison","letter":"M","items":[{"n":3,"quote":"Do not go to the hospital.","ch":1,"q":""},{"n":29,"quote":"Two containers, and they never touch.","ch":4,"q":""},{"n":31,"quote":"Wash your hands before you eat, every time, with no exceptions and no soap.","ch":4,"q":""},{"n":37,"quote":"Every wound is dirty. Treat it as dirty.","ch":5,"q":""},{"n":39,"quote":"Draw a line round the redness and write the time on the skin.","ch":5,"q":""},{"n":72,"quote":"Take somebody in, or admit what you are becoming.","ch":8,"q":""},{"n":92,"quote":"Break a rule for a person. Never for a thing.","ch":11,"q":""}]},{"name":"Nell Shackleton","letter":"N","items":[{"n":9,"quote":"You are allowed to decide it is nothing and go home.","ch":1,"q":""},{"n":54,"quote":"Keep one thing back that is only for pleasure.","ch":6,"q":""},{"n":99,"quote":"Put this down and go and live.","ch":11,"q":""}]},{"name":"Ruth Cadogan","letter":"R","items":[{"n":10,"quote":"Decide your trigger before you need it, and write it down.","ch":2,"q":""},{"n":20,"quote":"Cook before dusk.","ch":3,"q":""},{"n":34,"quote":"Put the water on a rota and never let one person own it.","ch":4,"q":""},{"n":44,"quote":"Whoever is nursing eats and sleeps first.","ch":5,"q":""},{"n":46,"quote":"Eat the perishable first, in order, and write the order on the wall.","ch":6,"q":""},{"n":63,"quote":"The place is worth less than the people in it, and you will not believe that when it matters.","ch":7,"q":""},{"n":66,"quote":"Feed them outside the wall.","ch":8,"q":""},{"n":75,"quote":"The person who holds the food does not also hold the rota.","ch":9,"q":""},{"n":86,"quote":"Sleep small and sleep together.","ch":10,"q":""},{"n":91,"quote":"Know which rule you are breaking, and say it out loud first.","ch":11,"q":""}]},{"name":"Samuel Oyelaran","letter":"S","items":[{"n":2,"quote":"Fill everything that holds water before the pressure goes.","ch":1,"q":""},{"n":26,"quote":"Smoke is a letter with your address on it.","ch":3,"q":""},{"n":30,"quote":"Site the latrine downhill of the water and twice as far away as feels necessary.","ch":4,"q":""},{"n":35,"quote":"Filter for grit, boil for life, and do not confuse the two.","ch":4,"q":""},{"n":56,"quote":"Choose ground for its water first and its walls second.","ch":7,"q":""},{"n":79,"quote":"Count the stores in front of two people, on a fixed day.","ch":9,"q":""},{"n":83,"quote":"Heat the person, then the bed, then the room. Never the house.","ch":10,"q":""}]},{"name":"the Settle school log","letter":"S","items":[{"n":61,"quote":"Fire ends places. Plan for it before it is on you.","ch":7,"q":""},{"n":78,"quote":"A grievance kept for a fortnight is no longer about the thing.","ch":9,"q":""}]},{"name":"the six o'clock radio","letter":"S","items":[{"n":7,"quote":"The radio is worth more than the car by the third day.","ch":1,"q":""}]},{"name":"Tom Shackleton","letter":"T","items":[{"n":8,"quote":"Lock the door behind you even when you are coming straight back.","ch":1,"q":""},{"n":14,"quote":"Siphon on the way out, not on the way back.","ch":2,"q":""},{"n":18,"quote":"Staying is a decision too, and for some people it is the right one.","ch":2,"q":""},{"n":25,"quote":"Fix the hinge before it needs fixing.","ch":3,"q":""},{"n":48,"quote":"Never eat the seed.","ch":6,"q":""},{"n":60,"quote":"Make every route in noisy on purpose.","ch":7,"q":""},{"n":71,"quote":"Never let anybody see the whole of what you have.","ch":8,"q":""},{"n":80,"quote":"Nobody watches alone for more than two hours.","ch":9,"q":""},{"n":84,"quote":"Cut your wood a year before you burn it.","ch":10,"q":""}]},{"name":"the Whitewell list","letter":"W","items":[{"n":21,"quote":"One lamp, one room, and cover the window before you strike the match.","ch":3,"q":""},{"n":42,"quote":"A bite is not a diagnosis, and it is never yours to pass sentence on.","ch":5,"q":""},{"n":69,"quote":"Trade at distance, in the open, in daylight, or not at all.","ch":8,"q":""}]}],"blurb":["Seven rules were nailed to the door of a milking parlour in the first spring. Boil it. Don't shout. Two doors. By the third winter there were ninety-nine, and the man keeping the list had stopped writing down anything he had not watched cost somebody something.","Ninety-nine rules for staying alive after the outbreak. Each one carries the name of whoever paid for it, what keeping it buys you, and, in the paragraph that matters, what ignoring it costs.","The rules contradict each other, and the book says so. One tells you to keep moving and never sleep twice in the same building. Another tells you to choose ground and hold it until the frost. One says take the stranger in. Another says never open the gate after dark, whatever you can hear on the other side of it. Both halves of every pair were written by people who were right where they stood.","The last chapter is about when to break them. It is the shortest chapter in the book and the reason for the other ten."],"intro":"<p>This is a list of ninety-nine rules. I invented none of them. Every one was paid for by somebody, and where I know who paid, I have put the name underneath.</p><p>It began as a sheet of paper nailed to the door of the milking parlour at Hillfoot, in the first spring, with seven rules on it in a hand that was not mine. Boil it. Don&#x27;t shout. Two doors. I do not know who wrote them and I have never met anybody who did. The sheet is gone now, along with the parlour and most of the people who walked past it every morning without reading it, but the seven are all still in here, three of them word for word, and not one of them has needed correcting in three years.</p><p>Each entry is built the same way. The rule, in as few words as it can be carried in. Underneath it, whoever it came from. Then two paragraphs: what keeping it buys you, and what ignoring it costs.</p><p>The second paragraph is the reason for the book. A rule with only the first half is a slogan, and slogans get you through about a fortnight. Anybody can tell you to boil your water. What makes a person actually do it, at two in the morning, in the rain, when the stove is outside and they are already ill, is knowing precisely what the alternative looks like on the fourth day, in a room with no plumbing, in front of their children. I have written those paragraphs plainly and without softening them. Skip them if you like. They are what the rest of the book is standing on.</p><p>You will find that the rules contradict each other. Rule eighteen tells you that staying is a decision, and that a man of seventy with bad hips should never take the road. Rule sixty-three tells you that the place is worth less than the people in it, and that you must be ready to walk out of three years of work in ten minutes. Both are true. They were written by different people, in different country, in different years of this, and each of them was right about the ground they were standing on. Where two rules disagree I have left them disagreeing and said so underneath. A list that never argues with itself has been tidied until it is useless, and I would rather hand you the argument than the tidy version.</p><p>The names are real to me and will mean nothing to you. Marta Ellison was a district nurse out of Settle who taught half the valley to clean a wound properly and then died of something a hospital would have shrugged off. The Bracewell standing orders were nine lines of gloss paint on the side of a grain store, and whoever painted them understood people better than they understood the dead. The Whitewell list came off a school noticeboard with the drawing pins still in it. Some of the sources in the index are camps, some are documents, and two of them are single sentences shouted across a river by somebody I never saw again. The index at the back tells you which is which.</p><p>There is nothing in here about how it started. I do not know how it started, and neither does anybody I have met whose word I would take on the weather.</p><p>The chapters are arranged by the trouble you are in, not by the order things happened. Nobody comes to a book like this at leisure. They come to it because there is a noise downstairs, or a wound that has gone hot, or a stranger at the gate with a child, and they need the nine pages that bear on that and none of the others. Chapter one is the first hour. Chapter eleven is three winters in. If you are somewhere in the middle, start at the chapter that names your problem and read the rest later, if there is a later.</p><p>One warning, and then I will get out of the way. A list like this turns dangerous at the point where people stop reading it as advice and start reciting it as law. I have watched that happen. It ends with somebody quoting rule forty at a woman who is asking for the last of the tablets for her husband, and the terrible thing is that the rule was correct and the room was still wrong. Chapter eleven is about when to break these, and it is the reason for the other ten.</p><p>Nine of these rules will not apply to your ground. I cannot tell you which nine. Learn the other ninety and you will work it out.</p>","note":"<p>This book is fiction, and it is worth stepping out from behind the narrator to say so plainly.</p><p>There was no outbreak. Hillfoot, Bracewell and Whitewell are invented, along with everybody named in the index and every rule they are credited with. The valley is put together out of real country in the north of England and then bent wherever the story needed it bent. Nobody in these pages ever lived.</p><p>That matters more here than it would in an ordinary novel, because the book is shaped like a manual, and a manual invites you to use it. So: do not. The rules in here were written to be true inside their own world and to be repeated by people under pressure. They were not checked against medicine, hydrology, structural engineering or cold-weather physiology, and in several places I have kept a rule that is wrong in our world because it is the kind of thing survivors would believe, and believing it is part of the story. A reader who cannot tell which ones those are should assume it is all of them.</p><p>If you want the real version, it exists and it is better than this. A first aid course from any recognised provider will teach you more about a wound in one afternoon than the whole of chapter five. Your national flood, fire and civil emergency guidance is written by people who have studied actual disasters, and it is free. Water treatment, hypothermia and food storage are all well documented by public health bodies whose interest is in you not dying. None of them will entertain you. All of them are correct, which this is not trying to be.</p><p>On the shape of the thing. The entries argue with each other on purpose. Advice that never contradicts itself has been simplified into decoration, because real situations differ and the honest form of guidance is a rule plus the conditions it holds under. Every chapter ends with a rule that lets you off: permission to stay put, to keep the grief, to leave the wound alone, to break the list. That was the hardest part to write and the part readers of the drafts kept naming as the reason they believed the rest.</p><p>On the sources. Attributing invented rules to invented people is a device, and it does one job: it keeps the book from sounding like an authority. Every rule in here is somebody&#x27;s opinion, formed in bad light, on incomplete information, by a person who was frightened. The index of sources is at the back so you can see how thin the evidence is. Three of the most confident rules in the book come from the same man, and chapter eleven tells you what happened to him.</p>","introTitle":"Introduction","noteTitle":"A Note on This Book","indexTitle":"Index of Sources"}</script>
