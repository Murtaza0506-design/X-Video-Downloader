rue,"attribution":"The Gastroenterological Society of Australia, 1983","means":"Two years, and a flask of bacteria. Barry Marshall and Robin Warren had cultured Helicobacter pylori from the stomachs of ulcer patients. The consensus was that ulcers were caused by stress and acid, that nothing could live in stomach acid, and that treatment meant acid suppression for life or surgery. Their abstract was rejected. In 1984 Marshall drank a flask of the culture, gave himself gastritis, and demonstrated the point on himself. Ulcers are now cured with a fortnight of antibiotics. The two shared the Nobel prize in 2005.","use":"A background assumption nobody had checked because it was too obvious to check. Everything followed from *nothing lives in the stomach*, which was not a finding but an inference. Pathologists had been seeing spiral bacteria in gastric biopsies for decades and recording them as contamination. The most dangerous belief in any field is not the contested one. It is the one so uncontroversial that no experiment has ever been pointed at it. Ask what nobody has tested.","ch":5},{"n":50,"quote":"Vioxx is a safer anti-inflammatory, gentler on the stomach, appropriate for long-term use in arthritis.","bare":true,"attribution":"Merck, 1999","means":"It was withdrawn in 2004. It was prescribed to something like eighty million people. The VIGOR trial in 2000 was designed to show the gastrointestinal advantage. It also showed a much higher rate of heart attacks in the Vioxx arm than in the comparator. The published interpretation put this down to a protective effect of the older drug, and not to a harmful effect of the new one. The company withdrew Vioxx in 2004 after a further trial confirmed the cardiovascular risk. Estimates of the excess events run into the tens of thousands.","use":"An unexpected finding explained away by the hypothesis it threatened. The alternative reading was available to everyone from the moment the data came in, and it was less comfortable and turned out to be correct. It is worth being precise, because the failure is not exotic. A trial designed to answer one question produced an answer to a different one, and the different one was assessed by people who had already committed. What protects against this is not integrity, which most of them had. It is having the awkward result adjudicated by somebody with nothing at stake. Give the awkward result to a stranger.","ch":5}]},{"n":6,"title":"Safe, According to the Model","part":"Two","partRoman":"II","partName":"The Settled Question","opening":"<p>An engineer&#x27;s confidence is different from a scientist&#x27;s, because it is written down as a number and somebody&#x27;s life is resting on it.</p><p>That ought to make it more reliable, and mostly it does. The buildings stand up. What this chapter collects is the small proportion of cases where the number was produced correctly by a method that had quietly stopped describing the thing being built. The arithmetic looks identical either way. A calculation cannot tell you that it is answering the wrong question.</p><p>Three failures recur. The first is the untested extrapolation. A design method that has worked for twenty structures is applied to one that is longer, thinner, faster or deeper than any of them. The range over which it was validated goes unmentioned, because everyone has forgotten there was one. The second is the missing failure mode, where every load anybody thought of was analysed properly and the one that killed it was not on the list. The third is organisational, and it is the worst: the number was right, somebody said so, and the structure was built anyway.</p><p>Notice how many of these had a warning. Not a vague misgiving afterwards, but a specific person saying a specific thing beforehand, in writing, and being overruled or ignored. That pattern is so consistent it is nearly a law, and it is the strongest practical argument in this book. If you want to know whether your project is about to fail, the useful question is not whether you are confident. It is who has already told you it will, and what happened to them. The shape is the same in a warship of 1628 and a submersible of 2023: somebody measured the thing, somebody said out loud what the measurement meant, and the decision was taken by a person for whom stopping had become more expensive than continuing.</p>","entries":[{"n":51,"quote":"The ship is stable enough. Sail her.","bare":true,"attribution":"Gustavus Adolphus, 1628","means":"She sank in the harbour. The Vasa was the most powerful warship in the Baltic, built in haste for a war, with a second gun deck added at the king's request while she was on the stocks. Before launch the shipyard ran a stability test in which thirty men ran from side to side across the deck; it was stopped after three passes because the ship was rolling dangerously. She sailed on 10 August 1628, caught a gust in Stockholm harbour, heeled over, took water through the open lower gunports and sank about 1,300 metres into her maiden voyage. The inquiry found nobody at fault. She was raised in 1961 and is intact.","use":"A test that was performed, understood and then not allowed to mean anything. This is the purest version of the pattern in this chapter: nobody lacked the information. The men on the deck knew, and so did the officer who stopped the test. The knowledge did not travel upwards, because the man it had to reach had already decided and was at war. Every subsequent entry here is a more sophisticated version of the same thirty men running from side to side.","ch":6},{"n":52,"quote":"The captain can, by simply moving an electric switch, instantly close the doors throughout, practically making the vessel unsinkable.","bare":false,"attribution":"The Shipbuilder, 1911","means":"One year. The Titanic's hull was divided into sixteen watertight compartments and could float with any two of them flooded, or with the first four. The iceberg opened six. She sank on 15 April 1912 with about 1,500 people aboard, having carried lifeboats for roughly half those on board, which was more than the regulations of the day required.","use":"A design case treated as a guarantee. The compartment system was real, it was well engineered, and the phrase in the trade press was hedged with the word *practically*, which everybody dropped. The failure is worth stating plainly, because it repeats. The ship was designed against the worst accident anyone had seen, which was a collision at a bulkhead. The sea is not obliged to stay inside the range of your experience. The lifeboats are the more damning half. They were adequate for the ship in the model and not for the ship that existed.","ch":6},{"n":53,"quote":"The deflection theory permits a far lighter and shallower deck than earlier practice, at no cost in safety.","bare":true,"attribution":"Leon Moisseiff, 1940","means":"Four months. The Tacoma Narrows Bridge opened in July 1940 with a deck eight feet deep on a span of over eight hundred metres, the most slender suspension bridge ever built. It moved in light winds from the first day and was nicknamed Galloping Gertie by the people who drove over it. On 7 November, in a wind of about forty miles an hour, well below its design load, it went into a twisting oscillation and tore itself apart. The film of it is the most-watched engineering failure in history.","use":"A method extrapolated past the conditions that validated it. Moisseiff's theory was sound and had produced excellent bridges; it treated wind as a static horizontal force, which is adequate for a stiff deck and catastrophic for a flexible one. Aerodynamic flutter was not a phenomenon suspension bridge engineers had needed to think about, because no previous deck had been light enough to flutter. Every design method has a range of validity, and the range is invisible from inside it until something leaves it.","ch":6},{"n":54,"quote":"The pressurised cabin is amply strong. The airframe is good for tens of thousands of cycles.","bare":true,"attribution":"de Havilland, 1952","means":"Three broke up in the air. The Comet was the first jet airliner and a genuine triumph, in service in May 1952 and a year ahead of anything else in the world. Three broke up in flight within twenty-six months. The investigation submerged an entire fuselage in a water tank and pressurised it thousands of times. It found metal fatigue starting at the corners of cutouts in the skin, where the stress concentrated far more than the calculations assumed. The design was corrected, the type flew safely for decades afterwards, and Boeing and Douglas took the market.","use":"A material behaviour that had not mattered before and did now. Fatigue was known. What was new was a pressurised cabin cycled twice a day behind a thin skin at high altitude, and the safety factor that covered every previous aircraft did not cover it. The reason this entry is here rather than in a chapter about ordinary bad luck is the water tank: the test that found the answer was not exotic, and it existed. It was simply not thought necessary until after the crashes.","ch":6},{"n":55,"quote":"The walkway connection as fabricated is equivalent to the design.","bare":true,"attribution":"The Hyatt Regency engineers, 1979","means":"Two years. Two suspended walkways in the atrium of the Kansas City hotel were to hang from single continuous rods. During fabrication the detail was changed to two shorter rods, with the upper walkway hanging from the lower one's box beam, because a continuous threaded rod is awkward to make and install. The change doubled the load on that connection. On 17 July 1981, during a crowded tea dance, both walkways came down. A hundred and fourteen people died. It remains one of the worst structural failures in American history, and both engineers lost their licences.","use":"A change nobody costed because it looked like a detail. The original design was already marginal, which is the part usually left out, and the modification turned marginal into fatal. What makes it the standard teaching case is how ordinary the failure is. A fabricator proposed a simpler way to build a joint. A shop drawing came back and somebody approved it under time pressure without redoing the arithmetic, and the arithmetic was five minutes of work. Almost nothing here required expertise. It required somebody to treat a small change as a change.","ch":6},{"n":56,"quote":"A reactor of this type could be installed on Red Square. It is no more dangerous than a samovar.","bare":false,"attribution":"attributed to Anatoly Aleksandrov, 1980","means":"Unit 4 exploded. Aleksandrov was president of the Soviet Academy of Sciences and one of the fathers of the RBMK design. The reactor had a positive void coefficient, meaning that in certain conditions a loss of cooling increases the reaction rather than damping it, and control rods that briefly added reactivity as they entered. Both were known to the designers and neither was in the operating manuals at Chernobyl. Unit 4 exploded on 26 April 1986 during a test of the turbine at low power.","use":"A hazard known at the top and absent at the bottom. This is what happens where admitting a defect is politically costly. The information does not disappear. It gets classified, and the people who need it most are cleared least. The operators at Chernobyl did the wrong thing that night, and there is no version of the story in which they could have known why it was wrong. A safety culture is not a set of attitudes. It is a question about who is allowed to know what.","ch":6},{"n":57,"quote":"The probability of a catastrophic failure is about one in a hundred thousand flights.","bare":true,"attribution":"NASA management, 1986","means":"Seventy-three seconds. Challenger broke up seventy-three seconds after launch on 28 January 1986, on the twenty-fifth shuttle flight. The night before, engineers at Morton Thiokol had recommended against launching. The O-ring seals in the solid rocket boosters had never been tested near the forecast temperature and had shown erosion on earlier cold flights. They were asked to reconsider as managers rather than as engineers, and the recommendation was reversed. Richard Feynman sat on the commission afterwards. He found that working engineers put the odds of loss at around one in a hundred while management used a figure a thousand times better, and he asked, in the report's appendix, what the basis for it was.","use":"Evidence of a problem reclassified as evidence of margin. The O-rings had been eroding for years without a loss. That record was read as proof that erosion was survivable, and not as a warning that the seal was not doing its job. Once a deviation has occurred a few times with no consequence it stops being a deviation and becomes the expected condition, and the standard quietly moves. Feynman's closing line is the one to keep: for a successful technology, reality must take precedence over public relations, for nature cannot be fooled.","ch":6},{"n":58,"quote":"The design basis tsunami for the site is 5.7 metres. Higher estimates are not sufficiently established to require action.","bare":true,"attribution":"TEPCO, 2008","means":"The wave was fifteen metres. An internal study in 2008 concluded that a tsunami of over fifteen metres was possible at Fukushima Daiichi on the basis of historical events, including one in the year 869. It was treated as provisional and passed for further study rather than acted on. On 11 March 2011 the wave reached roughly fourteen to fifteen metres at the site, flooded the emergency generators in the basements, and three reactors melted down. The Diet's independent commission called the accident profoundly man-made.","use":"A conclusion nobody had to reject because it could be kept pending. The finding was made by the company's own people and never overturned. It was held in the queue, because acting on it meant an enormous expense against an event that had not happened in a thousand years. This is not ignorance, and it is far more common. An organisation never has to decide against an inconvenient finding, because indefinite study is available and looks responsible from every angle.","ch":6},{"n":59,"quote":"The negative pressure test result is anomalous but explainable. The well is secure.","bare":true,"attribution":"BP and Transocean, 20 April 2010","means":"The well blew out that evening. A test to confirm the Macondo well was sealed produced pressure readings that should not have been possible if the seal were good. The crew debated it for an hour and settled on an explanation involving a bladder effect in the drilling fluid, a phenomenon with no real basis. They proceeded. The well blew out that evening, eleven men died, the rig sank, and around four million barrels of oil went into the Gulf of Mexico over the following three months.","use":"A rescuing explanation invented at the point of decision. The reading was unambiguous and everyone saw it. One interpretation meant stopping, which was expensive and embarrassing forty days behind schedule. The other meant continuing. So the group looked for a reason the instrument might be lying, and found one. A hypothesis produced only in order to permit the action you already wanted is not a hypothesis, and the moment to notice this is when it is being generated, not afterwards.","ch":6},{"n":60,"quote":"At some point safety is just pure waste. I mean, if you just want to be safe, don't get out of bed, don't get in your car, don't do anything.","bare":false,"attribution":"Stockton Rush, 2019","means":"Four years. Rush's company took paying passengers to the wreck of the Titanic in a submersible with a carbon fibre hull. The material had no service history at that depth and is known to degrade in ways that are hard to inspect. He declined classification by any marine society, arguing publicly that certification stifles innovation. Employees and outside experts wrote to him warning of catastrophic risk; one was dismissed. The vessel imploded in June 2023, killing him and four others.","use":"A true general observation used to dismiss a specific one. It is perfectly correct that safety has diminishing returns and that a fully risk-averse life is not a life. None of it says anything about whether a particular pressure hull will hold at four thousand metres. The move is a common one and worth being able to name: a philosophical point about risk in general, deployed to avoid an engineering point about this object. The warnings he received were not about the value of caution. They were about the hull.","ch":6}]},{"n":7,"title":"A Permanently High Plateau","part":"Three","partRoman":"III","partName":"Money","opening":"<p>Financial forecasting is the only field in this book where being wrong is the normal condition and everybody knows it. That should make it humble. It does the opposite, and the reason is worth understanding before you read a single entry.</p><p>A forecast about flight is checked by an aeroplane. A forecast about the market is checked by other people&#x27;s forecasts, and in the short run the market does whatever the consensus does, so the consensus is correct until abruptly it is not. Anybody who dissents is wrong for years first, and being wrong for years is fatal to a career even when it ends in being right. The incentives do not reward accuracy. They reward being wrong at the same time as everybody else, which is survivable, over being right alone, which is not.</p><p>Then there is the position of the speaker. Several people in this chapter were paid by an industry to comment on that industry, and at least one has said so himself since, in as many words. That is not fraud and it does not feel like distortion from inside. It is that a man whose salary depends on a market does not have the same relationship to bad news about it as you do.</p><p>The last thing to notice is the vocabulary. <em>Contained. Froth. Transitory. Localised.</em> Every one of these is a word that acknowledges a problem while denying it can travel, and the whole history of financial crisis is the history of things travelling. When you see a forecast that concedes the fact and disputes the transmission, mark it. That is the exact place where this chapter&#x27;s errors live. It is worth holding on to the fact that every person quoted here had access to the same numbers as the people who got it right, and in several cases had produced those numbers himself, which is why none of these are failures of information.</p>","entries":[{"n":61,"quote":"Stock prices have reached what looks like a permanently high plateau.","bare":false,"attribution":"Irving Fisher, 1929","means":"Eight days. He said it on 16 October. The market broke eight days later and lost about eighty-nine per cent of its value over the next three years. Fisher was the leading American economist of his generation and one of the founders of modern monetary theory. His work on debt deflation, written afterwards to explain what had happened, is still read. He was also personally invested and lost everything, including his house, which Yale bought and rented back to him for the rest of his life.","use":"A new theory of value arriving at the top of a boom. Fisher's argument was that prohibition and scientific management had permanently raised the productivity of American industry, so the higher earnings were real and the prices justified. It is a serious argument, and some of it was true. The trouble with a story that explains why the old valuation rules no longer apply is that one always appears near a peak, because that is precisely when people need one. The story arrives with the price.","ch":7},{"n":62,"quote":"The fundamental business of the country, that is the production and distribution of commodities, is on a sound and prosperous basis.","bare":false,"attribution":"Herbert Hoover, 25 October 1929","means":"He said it the day after the first great break. Industrial production fell by about half over the next three years, unemployment reached roughly a quarter of the workforce, and thousands of banks failed. Hoover was not a stupid man and he was not idle; he did more than any previous president had to intervene, which was still not remotely enough.","use":"A statement whose purpose was to steady the room, said in the voice of an assessment. There is a real dilemma here and it is not hypocrisy. A president who says the truth about a bank run makes the run worse, and every official facing a panic has to weigh accuracy against the effect of saying it. The cost comes later. Once the reassurance has failed, nothing that office says about the economy is believed for a decade, and that mattered more than any single day's confidence.","ch":7},{"n":63,"quote":"The Harvard Economic Society's index indicates that a severe depression is outside the range of probability. A recovery in business is to be expected shortly.","bare":true,"attribution":"The Harvard Economic Society, 1929","means":"They called the trough again and again. The Society was the most respected forecasting operation in America, run by academics using a statistical barometer of leading indicators. Through 1930 and 1931 it repeatedly announced that the trough had been reached. It was wrong at every turn, lost its subscribers, and was wound up in 1931.","use":"A model fitted to a range of history that did not contain the event. The barometer had been built from the business cycles of the previous thirty years, none of which was a depression. It could describe a recession accurately and had no vocabulary at all for what was happening. This is the most reliable failure in quantitative forecasting and better statistics will not fix it. A model can only recognise a kind of event that occurred in the data it was fitted to. The data had never seen one.","ch":7},{"n":64,"quote":"The models put a loss of this size at many standard deviations, an event not expected within the lifetime of the universe.","bare":true,"attribution":"Long-Term Capital Management, 1998","means":"Four years. The fund was run by John Meriwether, with Myron Scholes and Robert Merton on the board. Both had won the Nobel prize in economics the previous year, for the mathematics of option pricing. It had returned about forty per cent a year on enormous leverage. Russia defaulted in August 1998, correlations across every unrelated market went to one, and the fund lost most of its capital in weeks. The Federal Reserve Bank of New York organised fourteen banks to take it over, because its counterparty exposures were large enough to threaten the system.","use":"A distribution assumed rather than measured. The models treated price moves as normally distributed and the positions as independent, and both assumptions hold comfortably in ordinary conditions and fail together in exactly the conditions that matter. The deeper point is the one their own arithmetic should have made: if your model says an event cannot happen and the event happens, the correct inference is not that you were unlucky. It is that the model was the wrong one, and it always was. Ten sigma means check the model.","ch":7},{"n":65,"quote":"There is no national housing bubble. The boom will not bust.","bare":true,"attribution":"David Lereah, 2005","means":"Prices fell by a third. Lereah was chief economist of the National Association of Realtors. He published a book in 2005 urging readers not to miss the real estate boom, and reissued it the following year with a title promising the boom would not bust. American house prices peaked in 2006 and fell by about a third nationally, more in the states he was most positive about. He left the association in 2007 and has since said, with some grace, that he was a shill for an industry and that he should have seen it.","use":"A conflict of interest operating at the level of what looked worth investigating. He was not, as far as anyone can show, saying things he believed to be false. He was employed by an industry to explain that industry to the public. In that position the arguments for a rise get examined thoroughly and the arguments for a fall get answered quickly. Ask who pays the forecaster before you weigh the forecast, not because they are lying, but because it tells you which half of the evidence has been checked hard. Ask who pays.","ch":7},{"n":66,"quote":"We do have characteristics of bubbles in certain areas, but not, as best I can judge, nationwide.","bare":false,"attribution":"Alan Greenspan, 2005","means":"He recanted in public, later. Greenspan had run the Federal Reserve since 1987 and was treated in the press as an oracle. His position was that housing markets are local, that there was froth in some of them, and that a simultaneous national decline had no precedent. Prices fell nationally from 2006, the mortgage securities built on them failed, and the banking system came close to collapse in 2008. In congressional testimony in October 2008 he said he had found a flaw in the ideology he had held for forty years. It is a more honest sentence than most people in this book ever produced.","use":"Absence of precedent read as evidence of impossibility. He was right that there had never been a nationwide fall in American house prices in the modern data. The data began in the 1940s. What made a national fall possible this time was a national market in mortgage securities that had not existed before. The innovation that made the crash possible was also the reason the historical record looked reassuring. When somebody tells you a thing has never happened, the question is whether the world that prevented it is still the world you are in. Ask what has changed since.","ch":7},{"n":67,"quote":"These senior tranches merit a triple-A rating, equivalent in default risk to a sovereign bond.","bare":true,"attribution":"Moody's and Standard and Poor's, 2006","means":"They were downgraded ten notches. Trillions of dollars of securities built from subprime mortgages were rated at the highest grade available, which is what allowed pension funds and banks to hold them at all. Large numbers were downgraded by ten or more notches within eighteen months, some to default. The agencies were paid by the issuers of the securities they were rating.","use":"A correlation assumption at the centre of the arithmetic, chosen because it made the model tractable. Pooling mortgages removes risk only if the mortgages fail independently, and in a national downturn they do not. There was no secret about this; it is the first thing anyone says about pooling. What kept the wrong number in the model was that the right number destroyed the product. No individual had to be corrupt for an institution paid by issuers to prefer the assumption that let it issue.","ch":7},{"n":68,"quote":"We believe the effect of the troubles in the subprime sector on the broader housing market will likely be limited, and we do not expect significant spillovers to the rest of the economy or to the financial system.","bare":false,"attribution":"Ben Bernanke, May 2007","means":"Sixteen months. Lehman Brothers failed, the money markets froze, and the Federal Reserve, which Bernanke chaired, undertook the largest emergency intervention in its history. To his considerable credit he then ran that intervention with real skill. He was the leading academic historian of the Great Depression and knew exactly what a central bank must not do.","use":"Sizing a problem by the assets rather than by the plumbing. The subprime mortgages themselves were a small slice of American credit, and the arithmetic on that was correct and was widely quoted. What travelled was not the losses; it was the discovery that nobody could tell which institution held them, which turned a manageable loss into a general refusal to lend to anybody. Contagion in a financial system runs through uncertainty about counterparties, and no calculation of the size of the underlying asset will ever capture it. Size the plumbing, not the pipe.","ch":7},{"n":69,"quote":"Bear Stearns is fine. Do not take your money out.","bare":false,"attribution":"Jim Cramer, 11 March 2008","means":"Five days. Bear Stearns was sold to JPMorgan Chase in a Federal Reserve-brokered rescue at two dollars a share, against a price of about a hundred and seventy the previous year. Cramer has argued since, with some justice, that the viewer was asking whether his brokerage account was safe and not whether the stock was. A Bear Stearns account holder did get their money out.","use":"A precise answer delivered in a format that cannot carry precision. Whatever he meant, what a viewer heard on a television programme, shouted, with sound effects, was that the firm was sound. The lesson is not about him. It is that the medium determines what a message can contain, and a qualification that requires the listener to have caught the exact question does not survive the format it was said in. If a distinction is doing all the work, do not make the statement somewhere the distinction will be lost.","ch":7},{"n":70,"quote":"The current increase in inflation is transitory, driven by pandemic reopening effects that will fade.","bare":true,"attribution":"Jerome Powell, 2021","means":"Nine per cent. American consumer price inflation, running at about one and a half per cent when the word was first used, reached nine per cent in June 2022. The Federal Reserve retired the word *transitory* in November 2021 and then raised interest rates faster than at any time since the early 1980s. Inflation did come down without the recession most forecasters expected, so the underlying judgement about supply chains was partly vindicated and the timing was badly wrong.","use":"A word without a time limit doing the work of a forecast. *Transitory* has no duration in it, so it could not be wrong on any particular date, and by the time it was obviously wrong the moment to act had gone. It also functioned as a reason not to act, which is the most useful property a vague word can have inside an institution that does not want to move. Any forecast that cannot be falsified on a stated date is not a forecast. It is a mood, and it will be defended long past the point where a number would have been abandoned. Put a date on it.","ch":7}]},{"n":8,"title":"The Deal They Turned Down","part":"Three","partRoman":"III","partName":"Money","opening":"<p>This chapter is the cruellest in the book, and it is also the one most likely to make you unfairly pleased with yourself, so it comes with a warning attached.</p><p>Every entry is a decision that looks insane now and was reasonable at the time. That is not a defence offered out of politeness. It is the actual finding. Read these as stories about idiots and you will learn nothing you can use. You are not going to be offered Google for a million dollars, and if you were you would say no for the same reasons they did.</p><p>The reasons are worth naming in advance. A large company evaluates an opportunity against its existing business, which is the only yardstick it has, and by that yardstick every important new thing is small, unprofitable and a distraction. It is not that executives fail to see the new object. They see it clearly and correctly conclude that it is worth almost nothing compared with what they already own. They are right about the present and the comparison is the mistake.</p><p>The second reason is that the value in most of these deals was not in the asset. It was in what the buyer would then have had to do. No valuation can price an organisation&#x27;s willingness to destroy its own profitable business in order to build a worse one. Kodak understood digital photography better than anyone alive. That knowledge was the problem, because it told them precisely how much money they would lose.</p><p>Finally, the part that gets left out. For every declined deal in this chapter there are a hundred that were declined correctly, and a hundred more that were accepted and destroyed the acquirer. We remember these because of what the thing became. Nobody keeps a list of the offers that would have been disasters. The right way to read the chapter is as a series of correct answers to the wrong question, because in nearly every case the executive was asked what the thing was worth to the company as it stood, and answered accurately, and the company as it stood was the part that was about to end.</p>","entries":[{"n":71,"quote":"The telephone is a scientific curiosity with no commercial application. Decline the offer.","bare":true,"attribution":"attributed to Western Union, 1876","means":"They declined. Bell's backers offered the telephone patents to Western Union, then the dominant communications company in America, for a hundred thousand dollars. Western Union declined. Within four years it was in litigation with the Bell company, which it lost, and by 1900 Bell was worth many times what Western Union had ever been. The famous internal memo about a device with too many shortcomings is quoted everywhere and has never been produced; what is solid is the decision itself.","use":"Judging a new medium as a worse version of the old one. Western Union's business was messages between cities, delivered by trained operators to offices. A telephone in 1876 carried a poor voice a few miles between two fixed points. As a telegraph it was hopeless. That comparison is accurate and it is the wrong comparison, because the telephone was not competing for telegrams. It was creating a market of conversations that had never existed, and there is no way to see that market by looking harder at the one you have.","ch":8},{"n":72,"quote":"Guitar groups are on the way out. The Beatles have no future in show business.","bare":false,"attribution":"attributed to Decca Records, 1962","means":"They signed somebody else. Decca auditioned the group on the first of January 1962 and turned them down, signing Brian Poole and the Tremeloes instead, partly because they were from London and cheaper to work with. Parlophone signed the Beatles later that year. The line is Brian Epstein's account of what Dick Rowe told him, and Rowe denied the wording for the rest of his life. He also signed the Rolling Stones the following year on George Harrison's recommendation, which is the part usually left out.","use":"A judgement of taste presented as a judgement of trend. The audition was poor by all accounts, the material was mostly covers, and a professional listening that day would have heard a competent northern club act. Rowe's actual mistake, if he made one, was to convert that into a claim about the direction of popular music, which is a different and much harder thing to know. He was allowed to be wrong about one band. What sank him was the sentence about the category.","ch":8},{"n":73,"quote":"It is a cute demonstration, but nobody wants to look at photographs on a television, and we should not talk about it.","bare":true,"attribution":"Kodak, 1975","means":"They put it in a drawer. Steven Sasson, a young engineer at Kodak, built the first self-contained digital camera: a toaster-sized device recording to cassette tape at ten thousand pixels, taking twenty-three seconds a picture. He demonstrated it to management, who by his account found it charming and told him not to tell anyone. Kodak went on to invest heavily in digital, patent a great deal of it, and earn substantial licence income, and it still could not bring itself to attack its own film business. It filed for bankruptcy in 2012.","use":"Not blindness, which is the version everybody tells, but arithmetic. Kodak's profit came from film, paper and processing, sold repeatedly to the same customer for the life of a camera. Digital photography removed all three at once. The internal analysis was correct in every particular, including its estimate of when digital would become good enough. The conclusion it supported was to defend the profitable business as long as possible. There is no obvious way for a public company to choose voluntarily to make one-tenth as much money, and that, not stupidity, is what the word disruption actually means.","ch":8},{"n":74,"quote":"A tenth of this company is not worth the liability that comes with it.","bare":true,"attribution":"Ron Wayne, 1976","means":"He took the eight hundred dollars. Wayne was the third founder of Apple, drew the first logo, wrote the original partnership agreement, and held ten per cent. Twelve days in, he relinquished his stake for eight hundred dollars, later accepting a further fifteen hundred to formalise it. He was the only partner with personal assets. In a general partnership he would have been liable for the company's debts, which at that moment were real. The revenues were not.","use":"Almost nothing, which is why it is here. Wayne was forty-one with things to lose, next to two men in their twenties with nothing, and he made a defensible decision about risk given his own position. He has said many times since that he does not regret it and would probably have been squeezed out anyway. The entry is a corrective to the rest of the chapter. An outcome that turns out enormous does not make the decision that avoided it stupid. Judging a choice by a result the chooser could not see is the standard way to learn the wrong lesson.","ch":8},{"n":75,"quote":"A non-exclusive licence is acceptable. The value is in the hardware.","bare":true,"attribution":"IBM, 1980","means":"The clones arrived. IBM needed an operating system for its personal computer in a hurry and licensed one from Microsoft, allowing Microsoft to sell the same product to anyone else. Compaq reverse-engineered the IBM firmware in 1982, the clone industry followed, and every clone needed the operating system. IBM sold its personal computer division in 2005. Microsoft became for a period the most valuable company on earth.","use":"Locating the value where it had always been. In IBM's world hardware was the product and software was the thing you gave away to sell it, and that had been true for thirty years and enormously profitable. What nobody at the table could see was that the standard would become the asset once the hardware was commoditised, because hardware had never been commoditised before. The general form is worth carrying: in any deal, ask which part of this will still be scarce when the rest is easy.","ch":8},{"n":76,"quote":"A search engine is a feature, not a business, and this one is not worth a million dollars.","bare":true,"attribution":"Excite, 1999","means":"They said no more than once. Larry Page and Sergey Brin, wanting to get back to their doctorates, tried to sell Google to the portal companies for around a million dollars and were turned down more than once. Excite's management concluded that a search engine which sent users away quickly was the opposite of what a portal needed. Excite was bought, went through bankruptcy in 2001, and disappeared.","use":"A strategy correctly applied to the wrong future. The portal business model was to keep people on the page. Excite's objection to Google, that it was too good at getting people to leave, was a correct description of the product. What they could not price was that being the place people start is worth more than being the place they stay. Nobody in 1999 knew what an auction of search intent would fetch, because that market had not been invented.","ch":8},{"n":77,"quote":"Netflix is a very small niche business. Fifty million dollars is far too much.","bare":true,"attribution":"Blockbuster, 2000","means":"They laughed. Reed Hastings and Marc Randolph flew to Dallas and offered to sell Netflix, then a mail-order DVD service losing money, to Blockbuster for fifty million dollars, proposing to run its online arm. By Randolph's account they were barely able to keep a straight face in the room. Blockbuster filed for bankruptcy in 2010. Netflix is worth several hundred times the price it asked.","use":"A profit centre that could not be criticised. Blockbuster's earnings depended substantially on late fees, which customers hated and which the Netflix model abolished. Any serious internal assessment of Netflix was therefore an argument for destroying a line of revenue that everybody had been rewarded for growing. The decisive fact about an incumbent is rarely what it fails to understand. It is which sentence cannot be said out loud in its own boardroom.","ch":8},{"n":78,"quote":"Running an online bookshop is not our competence. Amazon should run it for us.","bare":true,"attribution":"Borders, 2001","means":"Amazon kept the customer. Borders handed its entire online operation to Amazon, which ran borders.com and kept the customer relationship, the data and the margin, while Borders got a fee and concentrated on its stores. The arrangement ran until 2008. By then Amazon knew what every Borders customer bought online and Borders had built nothing. It liquidated in 2011.","use":"Outsourcing a cost and giving away an asset. The reasoning was sound as far as it went: Borders was bad at the web, Amazon was superb at it, and specialisation is usually right. What the analysis missed is that the thing being outsourced was not a warehouse function but the relationship with the customer in the channel that was about to become the whole market. Before you contract out an activity, ask whether it is a cost centre or the place your business will live in ten years, because the second one is never worth a fee.","ch":8},{"n":79,"quote":"It's kind of one more entrant into an already very busy space. But in terms of a sea change for BlackBerry, I would think that's overstating it.","bare":false,"attribution":"Jim Balsillie, 2007","means":"Twenty per cent to under one. Balsillie was co-chief executive of Research In Motion, whose BlackBerry then dominated corporate email and was the object of genuine addiction among the people who carried one. RIM's share of the smartphone market went from about twenty per cent to under one per cent within six years. The company survives as a software and security business and has not made a phone since 2016.","use":"Defending a moat that was about to become irrelevant rather than being crossed. RIM's advantages were real: superb battery life, a keyboard people typed on at speed, and an enormously efficient network protocol that corporate IT departments and carriers loved. Every one of those was an answer to a constraint, and within four years batteries, screens and bandwidth had all improved enough that the constraints were gone. An advantage built on somebody else's limitation expires when that limitation does, and the expiry date is not on the balance sheet.","ch":8},{"n":80,"quote":"Thirty-one dollars a share undervalues the company. Reject it.","bare":true,"attribution":"Yahoo, 2008","means":"They held out for more. Microsoft offered about forty-four billion dollars for Yahoo in early 2008. Jerry Yang and the board held out for more, the offer was withdrawn, and the shares fell by more than half within the year. Yahoo's core internet business was sold to Verizon in 2016 for around four and a half billion, roughly a tenth of the rejected price.","use":"An anchor set by the company's own history rather than by the offer in front of it. Yahoo had been worth far more in 2000, its management remembered that number, and thirty-one dollars felt like an insult measured against it. The past price of your own asset carries no information about its future price. It is the most powerful distorting fact in any negotiation, which is why the other side will mention it. The only relevant question is what it will be worth later, and the offer itself is usually the best available evidence about that.","ch":8}]},{"n":9,"title":"The Thing That Only Goes Up","part":"Three","partRoman":"III","partName":"Money","opening":"<p>A bubble is the one error in this book that requires other people. Everything else here could have been said by a man alone in a room. This cannot, because the whole mechanism is that the price is the argument and the argument is the price.</p><p>That makes it uniquely hard to escape by thinking. You can be entirely correct about the value of an asset, say so, and watch it triple. Every day it triples is a day the market tells you, and everyone watching, that you were wrong. The economist&#x27;s version of this is that markets can stay irrational longer than you can stay solvent. The practical version is that being early is indistinguishable from being wrong, both to your clients and, after a while, to yourself.</p><p>Two things are worth having clear before the entries. The first is that most people in a bubble know it is a bubble. That is not a secret discovered afterwards; contemporary accounts are full of people saying so while buying, on the theory that they will get out first. The mania is not usually a failure to see what is happening. It is a bet on timing, made by everybody at once, and the timing is the only part that cannot be right for everybody.</p><p>The second is that a bubble almost always forms around something real. Railways did change England, the internet did change everything, houses are worth living in. The story is true. That is what makes the price possible, and it is why <em>but the technology is genuinely important</em> is the least useful sentence anybody can offer you at the top. It is always true at the top. It was true in 1845 and 1999, and the shares still fell ninety per cent. Almost nobody here was ignorant: a master of the mint, a monetary theorist, the author of the standard work on financial mania and two economists writing from a research institute all lost their footing in a market they had studied.</p>","entries":[{"n":81,"quote":"A single bulb is worth a house on the Herengracht, and the price will hold, because the supply cannot be increased.","bare":true,"attribution":"The Amsterdam tulip trade, 1637","means":"It stopped in a week. In the winter of 1636 the trade in tulip contracts, mostly conducted in taverns for delivery in spring, rose to extraordinary levels. In the first week of February 1637 the bids stopped. Prices fell by well over ninety per cent. The historian Anne Goldgar's work in the Dutch archives suggests the wider economic damage was far smaller than the legend claims and that few were ruined. The story of a nation destroyed by flowers was written later, by moralists who found it useful.","use":"A scarcity argument that ignored biology and the contract. Tulips propagate, slowly but reliably, so the supply was not fixed. More to the point, what was being traded by the end was not bulbs but promises to buy bulbs, and promises can be created without limit. Whenever a price is defended by the impossibility of making more of the thing, check whether the thing being traded is the thing or a claim on it. The claims are never scarce. Claims are printed, not grown.","ch":9},{"n":82,"quote":"The company's American trade will service the debt of France, and the shares are cheap at any price.","bare":true,"attribution":"John Law, 1720","means":"It fell apart within a year. Law, a Scottish gambler and monetary theorist, persuaded the French regent to let him merge a national bank with a trading monopoly in Louisiana and use the shares to absorb the crown's debt. Shares went from five hundred livres to around ten thousand, the word millionaire dates from the episode, and the whole structure fell apart within a year when holders began converting paper to coin. Law fled the country and died poor in Venice. France did not attempt a national paper currency again for eighty years.","use":"A circular structure that looked like a mechanism. The bank printed notes, the notes bought the shares, the rising shares justified more notes, and each part was supported by the others with nothing underneath. Louisiana produced almost nothing in this period; the trade that was supposed to service the debt never existed. A system that generates its own demand is not a business, and the test is simple: if the price stops rising, does anything remain that earns money. Ask what earns money at a standstill.","ch":9},{"n":83,"quote":"I can calculate the motions of the heavenly bodies, but not the madness of people.","bare":false,"attribution":"attributed to Isaac Newton, 1720","means":"He bought back in. Newton was Master of the Mint and the most celebrated intellect in Europe. He held South Sea stock and sold at a good profit early in 1720. Then he watched it continue upwards, bought back in near the top, and lost something like twenty thousand pounds, an enormous sum. The remark is not recorded in his lifetime and first appears more than a century later, so it belongs among the attributed rather than the documented. The losses are real and are visible in his accounts.","use":"Selling correctly and then being unable to bear watching. He got the analysis right. The second decision was not an analysis at all. It was the particular pain of watching acquaintances grow rich on a thing you have just called overvalued. That pain has no intellectual defence, and being extremely clever is no protection against it, which is why this entry has survived for three centuries as the standard warning. The dangerous moment in any mania is not the beginning. It is the point after you have got out and it keeps going up. The danger comes after you sell.","ch":9},{"n":84,"quote":"Railway shares are a sound investment for the ordinary saver, and the lines now projected will all be built and will all pay.","bare":true,"attribution":"Charles Mackay, 1845","means":"He had written the manual. Mackay had published *Extraordinary Popular Delusions and the Madness of Crowds* in 1841, the founding text on financial mania and still the best known. In 1845, as editor of the Glasgow Argus, he wrote leaders encouraging investment in railway shares at the height of the railway mania. Parliament authorised lines that could not conceivably be built; the market broke in late 1845 and shares lost about two-thirds of their value; thousands of small investors were ruined. The later editions of his book do not mention it.","use":"Knowing the pattern in the abstract and not recognising it in the room. Mackay is the control experiment, which is why the entry is here. A man who had written the manual, with the tulips and the South Sea in his own index, stood inside the next one and saw a sound investment. Pattern recognition after the fact is nearly free. Applying it to the present, to something you like, in a year when everyone you respect is making money, is the whole difficulty. Mackay could not pay that price either.","ch":9},{"n":85,"quote":"Florida land cannot fall. They are not making any more coastline, and the whole of the north is coming down.","bare":true,"attribution":"The Florida land boom, 1925","means":"It turned in the spring of 1926. Miami lots changed hands several times in a day, often on a ten per cent deposit and a signed binder, by young men who never intended to complete. Prices in some districts rose tenfold in three years. The market turned in the spring of 1926, the railways embargoed non-essential freight, and a hurricane in September finished it. Land in some subdivisions became worth less than the unpaid taxes on it.","use":"A true demographic story financed on terms that could not survive a pause. Florida's population really was growing and really did keep growing for the next century; a patient buyer in 1925 would eventually have done well. What killed people was the binder, which is to say the leverage. At ten per cent down, a fifteen per cent fall wipes you out, and the timing you have to be right about goes from decades to weeks. The asset was fine. The financing was the bubble, and that is true far more often than the stories admit. Look at the deposit, not the land.","ch":9},{"n":86,"quote":"Japanese land cannot fall in price. There is very little of it and the demand is permanent.","bare":true,"attribution":"The Japanese land myth, 1989","means":"Land fell for fifteen years. At the peak, the land under the Imperial Palace in Tokyo was said to be worth more than the whole state of California. Japanese land was valued at roughly four times all the land in the United States. The Nikkei reached 38,915 on the last trading day of 1989. Land prices fell for the next fifteen years, some urban commercial land by more than eighty per cent, and the index did not see that level again for thirty-four years.","use":"A cultural belief mistaken for an economic law. The Japanese phrase for it translates as the land myth, and bankers, regulators and households held it alike. That is what made it dangerous. The belief was embedded in the collateral rules of the banking system, so land could not fall without taking the banks with it, and that is what happened. When everybody in a system believes the same thing about the value of what they lend against, the belief stops being an opinion and becomes structural. The correction is then not a price move but a solvency event.","ch":9},{"n":87,"quote":"We believe the Dow should rise to 36,000 immediately, but to be conservative we expect it to take three to five years.","bare":false,"attribution":"James Glassman and Kevin Hassett, 1999","means":"Twenty-two years. The book appeared in October 1999. The Dow peaked around 11,700 in January 2000, fell for three years, and first closed above 36,000 in November 2021, twenty-two years later. The argument was that investors had demanded too high a premium for holding shares and that the premium was about to disappear. It was a serious academic position and not a crank one.","use":"A theoretical adjustment given a date. The underlying claim, that the equity risk premium might be too high, was arguable then and is arguable now. What converted it into one of the most mocked titles in publishing was the decision to attach a level and a schedule. A valuation argument tells you about a long-run average and says nothing about which decade. The lesson is uncomfortable for anybody who forecasts. The more rigorous the reasoning behind a number, the more tempting it is to state when as well, and the when is almost never in the reasoning. Never attach a date to a valuation.","ch":9},{"n":88,"quote":"We can build a national brand for pet supplies before the money runs out.","bare":true,"attribution":"Pets.com, 2000","means":"Nine months. The company floated in February 2000 and spent enormously on advertising, including a Super Bowl slot. It shipped heavy bags of dog food below cost, because the delivery economics did not work at the volumes it had. It liquidated nine months after listing. The sock puppet is remembered better than the company. Chewy, which sells the same goods online at scale, is worth billions, twenty years later, on the same idea and a workable cost base.","use":"Treating a unit economics problem as a scale problem. Every internal projection assumed that losses per order would turn positive with volume, which is true for some businesses and false for anything whose main cost is shipping weight. Nobody was fooled about the numbers; they were published. The belief was that growth would fix them, and growth made them worse in exact proportion. The question that separates this from Amazon is not vision or nerve. It is whether the loss per unit falls as the units rise, and it is arithmetic anybody can check.","ch":9},{"n":89,"quote":"Bitcoin will be worth a million dollars by the end of 2020.","bare":false,"attribution":"John McAfee, 2017","means":"It ended 2020 at about $29,000. He first said five hundred thousand, then raised it, and attached a famously indelicate promise about what he would do if he were wrong. Bitcoin ended 2020 at about twenty-nine thousand dollars. In 2020 he said the prediction had been a device to attract new buyers into the market. That is either an admission or a further claim, depending on how much of anything he said you believe.","use":"A forecast made as a performance, in a market where the performance moves the price. That is what distinguishes speculative assets from every other subject in this book. The forecast is not an observation about the thing. It is an input to the thing, and a loud enough prediction can make itself briefly true. Nothing said publicly by a holder of a volatile asset about the future price of that asset is a forecast. It is a position being talked, and the appropriate response is to look at what they own. Look at what they own.","ch":9},{"n":90,"quote":"The old valuation measures do not apply to this class of asset, because the world has changed.","bare":true,"attribution":"The received wisdom, 1637 to 2025","means":"It is said in some form near the top of all of them, and it has been true perhaps twice. Railways did change England. The internet did change everything. In both cases the technology delivered more than the enthusiasts promised and the shares still fell by around ninety per cent. A real transformation and an overpriced claim on that transformation are two different objects, and only one of them is what you own.","use":"A category confusion, embedded so deeply in the language that most people never see it. *Is this technology important* and *is this security a good purchase at this price* are unrelated questions with unrelated answers. Every mania in this chapter ran on the answer to the first being used to settle the second. If you take one habit from this book, take the habit of separating them, out loud, every time somebody explains that the rules have changed. They may well have. The price is still a number, and the number has to come from somewhere.","ch":9}]},{"n":10,"title":"Over By Christmas","part":"Four","partRoman":"IV","partName":"People","opening":"<p>Wars are begun by people who expect them to be short. This is close to a rule, and it is not a coincidence, because a war that everybody expected to be long and ruinous would usually be settled by negotiation instead.</p><p>The consequence is bleak and worth stating at the outset. The optimistic forecast is not an unfortunate accompaniment to the decision. It is a condition of the decision, and it is generated by the same people who want to go. The estimate comes from the part of the organisation with the strongest interest in the answer.</p><p>The specific error underneath most of these is a failure to model the other side as a thinking participant. Almost every entry here treats the enemy as a fixed object with known properties. A structure that will collapse when kicked. A population that will greet you. A front that cannot be crossed. What actually happens is that the other side observes what you do and changes what it does, and the second move of the war is never in the plan.</p><p>There is also a professional distortion that deserves naming. Military planning is done in the language of capability, which is a real and measurable thing: divisions, tonnage, range, days of fuel. Will is not measurable, and so it drops out of the arithmetic and reappears as an adjective. Nearly every mistake in this chapter is a correct calculation of capability with the other side&#x27;s willingness to keep fighting set, silently, to zero.</p><p>Read this chapter with the previous one&#x27;s warning attached. Hindsight makes these look like arrogance, and some of them are. Several are ordinary institutional forecasting failures with a body count. Every one of these estimates was produced by a professional staff with maps, timetables, fuel tables and an accurate count of the other side&#x27;s divisions, and in almost every case the quantity that decided the outcome was the one quantity that appears nowhere in a staff table.</p>","entries":[{"n":91,"quote":"You will be home before the leaves have fallen from the trees.","bare":false,"attribution":"Kaiser Wilhelm II, August 1914","means":"Four years and three months. The war killed something like seventeen million people. It was not only the Kaiser. The assumption of a short war was general across every staff in Europe. The German plan in particular required a decision in the west within six weeks, because the alternative was the two-front war they knew they would lose. Trench lines were established by that autumn and barely moved for three years.","use":"A plan whose success was assumed because its failure was unbearable. The six-week requirement was not a forecast; it was an input, and once the whole strategy depended on it, examining whether it was realistic became an attack on the strategy. This is the most dangerous structure in institutional life and it is not confined to armies. When a schedule is load-bearing, the schedule stops being evidence, and nobody inside can tell the difference. A load-bearing schedule is not evidence.","ch":10},{"n":92,"quote":"The Ardennes is not a dangerous sector. The terrain itself defends it.","bare":true,"attribution":"Philippe Pétain, 1934","means":"The armour came through. France built the Maginot Line along the German border, an engineering achievement that worked exactly as designed. The Ardennes forest was left lightly held, on the grounds that armour could not pass through it. In May 1940 the German army put seven armoured divisions through the Ardennes, crossed the Meuse at Sedan, and reached the Channel in ten days. France capitulated in six weeks.","use":"A defence that told the attacker where to go. The line was not a failure of construction and the Germans did not breach it; they went round it, which is what a wall always invites. The deeper error is about dates. The impassability of the Ardennes was a judgement about the vehicles of 1934, never revisited as vehicles changed, and by 1940 it had the standing of a geographical fact. Any assumption of the form *this route is impossible* should carry the date it was last checked. Date every impossibility.","ch":10},{"n":93,"quote":"One thing is certain: he missed the bus.","bare":false,"attribution":"Neville Chamberlain, 4 April 1940","means":"He was wrong within the week. Chamberlain told a Conservative party meeting that Hitler had lost his opportunity by failing to attack in the first winter of the war. Germany invaded Denmark and Norway five days later, and France six weeks after that. The remark contributed directly to his fall, and he resigned on 10 May, the day the attack in the west began.","use":"Quiet read as weakness. Nothing had happened for seven months, and Chamberlain, who wanted the war to be winding down, took the absence of events as evidence that the moment had passed. Nothing visible was happening because preparation is invisible, and an inactive opponent is either beaten or getting ready, and the two look identical from outside. It is also a lesson about certainty as a verbal tic: the words *one thing is certain* are almost never attached to anything that is. Quiet is not the same as beaten.","ch":10},{"n":94,"quote":"The reports of an imminent German attack are British disinformation intended to draw us into war.","bare":true,"attribution":"Joseph Stalin, June 1941","means":"One day. Warnings came from Richard Sorge in Tokyo, from Churchill, from his own border commanders reporting German reconnaissance, and from a German deserter on the night of 21 June. Stalin dismissed them all and forbade actions that might provoke. Germany attacked on 22 June with three million men, and the Soviet Union lost most of its air force on the ground and several million men in the first six months.","use":"A theory of motive that explained away every piece of evidence in advance. Stalin's reasoning was not stupid: Britain did want the Soviet Union in the war, and would have benefited from provoking one. Having adopted that frame, every warning became further proof of the plot, and the more sources agreed, the more coordinated the deception appeared. A belief that converts confirming evidence into supporting evidence for itself cannot be dislodged by information, and the only defence is to decide in advance what would count against it.","ch":10},{"n":95,"quote":"We have only to kick in the door and the whole rotten structure will come crashing down.","bare":false,"attribution":"Adolf Hitler, 1941","means":"The door did not give. The Soviet Union absorbed the deepest invasion in modern history, moved its industry east of the Urals, and destroyed the German army over the following four years. Something like eighty per cent of German military casualties in the war were inflicted on the eastern front.","use":"A political prejudice used as a military estimate. The belief that the Soviet state was rotten and would collapse under pressure was ideological and held with total conviction. It formed no part of any analysis of Soviet manpower, industry or geography, all of which were available and pointed the other way. It also had the property of making planning unnecessary, which is why it was attractive. When a forecast removes the need to prepare for the difficult case, examine the forecast before you examine the case.","ch":10},{"n":96,"quote":"There is very little chance the Chinese will come in. The boys will be home by Christmas.","bare":true,"attribution":"Douglas MacArthur, October 1950","means":"Six weeks. MacArthur told Truman at Wake Island in October that Chinese intervention was unlikely and would be slaughtered if attempted. Some three hundred thousand Chinese troops were already crossing the Yalu. They struck in late November, as he launched what he had called the home-by-Christmas offensive. They drove United Nations forces back down the peninsula in the longest retreat in American military history. The war ground on for another two and a half years.","use":"Reasoning about what he would do in their position. Chinese intervention looked irrational by MacArthur's measures, since their army was poorly equipped and the Americans held the air, and by that arithmetic he was correct. What he did not weigh was that a hostile army arriving at their border was intolerable at almost any cost. That is a fact about their interests, not their capability. Estimating an opponent by whether their move would be sensible for you is the most common analytical error there is. Their interests, not yours.","ch":10},{"n":97,"quote":"We have reached an important point when the end begins to come into view.","bare":false,"attribution":"William Westmoreland, November 1967","means":"Tet. Ten weeks later the Tet offensive struck more than a hundred towns and cities across South Vietnam simultaneously, including the grounds of the American embassy in Saigon. Militarily it was a defeat for the North, which lost enormous numbers and did not hold anything. Politically it destroyed the credibility of every optimistic American statement about the war, and Johnson announced within two months that he would not seek re-election.","use":"A metric that measured the wrong war. American assessment rested heavily on enemy body counts, which really were running in their favour, and which counted a war of attrition that the other side was not fighting. The North's objective was not to win battles but to outlast a democracy's patience, and against that objective a favourable exchange rate is close to irrelevant. Choose a measure that your opponent is not optimising for and you will keep winning by it until the day you lose.","ch":10},{"n":98,"quote":"A limited contingent, in and out within a few months, to stabilise a friendly government.","bare":true,"attribution":"The Soviet Politburo, December 1979","means":"Nine years. Soviet forces entered Afghanistan on 25 December 1979 and left on 15 February 1989, nine years and seven weeks later. They lost around fifteen thousand dead, and any remaining belief at home that the leadership knew what it was doing. The war is generally counted among the causes of the Soviet collapse two years afterwards. The decision was taken by a very small group of elderly men, against the advice of the general staff.","use":"A small decision that was never re-examined as a large one. The initial commitment really was limited, and each increase was small next to what had already been spent. At no point was there a meeting at which anybody decided to fight a nine-year war. That is how nearly all long wars are entered. The defence against it is to fix in advance what result, by what date, would cause you to leave, and to write it down while leaving is still cheap. Write down the exit before you go.","ch":10},{"n":99,"quote":"I really do believe that we will be greeted as liberators.","bare":false,"attribution":"Dick Cheney, March 2003","means":"The easy part went to plan. The conventional campaign took three weeks and the regime fell. Then the army was disbanded, the ministries were looted, an insurgency began within months, and American forces remained for eight years, with a further intervention after that. Estimates of Iraqi deaths over the period run into the hundreds of thousands.","use":"Planning for the part that was understood. The invasion was modelled in enormous detail and executed almost exactly as designed, and the question of what happens on the third day was handled by a sentence about liberation. It was not an oversight in the ordinary sense: several agencies produced studies of the occupation, and those studies were unwelcome and were set aside. A plan that is superb about the phase you have practised and lyrical about the phase you have not is not half a plan. The lyrical part is where the outcome lives.","ch":10},{"n":100,"quote":"Kyiv in three days, the country in a fortnight.","bare":true,"attribution":"The Russian General Staff, February 2022","means":"Five weeks. The plan was built around the assumption that resistance would be minimal and the government would fall or flee. Its execution showed the belief: columns on single roads without secure flanks, three days of rations, and parade uniforms carried for the ceremony in Kyiv. The advance on the capital was abandoned within five weeks. The war has continued for years, with casualties on a scale not seen in Europe since 1945.","use":"Intelligence that had been shaped by what the leadership wished to hear, feeding a plan with no capacity to be wrong. The estimate of Ukrainian will was not a mistaken measurement; it was an unmeasured quantity supplied by the people who wanted the operation. What makes it the modern version of every other entry here is the design of the plan itself. A force equipped for three days cannot discover that the assumption was wrong and adapt, because it has already spent everything it would need in order to adapt. Confidence is cheap in a forecast and enormously expensive in a logistics table. Three days of rations is a forecast.","ch":10}]},{"n":11,"title":"The Verdict Was In","part":"Four","partRoman":"IV","partName":"People","opening":"<p>Predicting what people will do collectively is the hardest forecasting there is, and it is the one everybody attempts, because the answers are entertaining and nobody keeps score.</p><p>Some of this chapter is about polling, which is worth defending before it is criticised. A well-run poll is one of the few genuine instruments in social life, and over the past century it has been right far more often than it has been wrong. When it fails it fails in ways that are understood afterwards, and there are three of them. The sample is not the population. The respondents do not tell the truth. And the people who decline to answer are not a random subset of everyone. Every failure below is one of those three.</p><p>The larger part of the chapter is about something else, which is the confusion between a measurement and a forecast. A poll measures a stated intention now. Turning it into a prediction of an event later requires a model of who will actually go, what the undecided will do, and how the numbers translate into seats. Almost all the famous errors live in that second layer, and not in the polling. The instrument was reporting honestly. The interpretation was doing the work.</p><p>Then there is the probability problem, which is new and getting worse. A forecast of seventy per cent is not a prediction, it is a distribution, and it is compatible with the other thing happening three times in ten. Published in a headline it reads as a promise. When the three-in-ten happens the audience concludes the forecast was wrong, and that is not the audience&#x27;s mistake. It belongs to whoever chose to publish a probability to people who were never offered a way to be right about it. The instructive thing about the entries here is how many were produced by the best available method, applied competently, by people who published their workings, and were then undone by a single assumption so ordinary that nobody in the room had thought to write it down.</p>","entries":[{"n":101,"quote":"War between the industrial powers has become futile, and therefore will not happen.","bare":true,"attribution":"Norman Angell, 1910","means":"Four years. Angell's book *The Great Illusion* sold in enormous numbers and was translated everywhere, and the popular version of its argument is the sentence above. What he wrote was that conquest could no longer be economically profitable in an interdependent world, and that this made war irrational. It was true in 1914 and it is true now. He did not say it was impossible, and he spent the rest of his life saying so. He won the Nobel Peace Prize in 1933.","use":"Nothing, by him, and a great deal by his readers, which is why the entry is here. A careful conditional claim, that war would be unprofitable, was compressed by an audience that wanted reassurance into an unconditional one, that war would not occur. This happens to almost every popular book with a thesis, and it is worth knowing from both ends. As a reader, check whether the striking claim is the author's or the summary's. As a writer, assume the qualification will be removed.","ch":11},{"n":102,"quote":"Landon will take fifty-seven per cent of the popular vote.","bare":true,"attribution":"The Literary Digest, 1936","means":"He lost forty-six states. Franklin Roosevelt took just under sixty-one per cent and every state but two. The Digest had polled on a scale nobody has attempted since, mailing ten million ballots and receiving nearly two and a half million back. It had called the previous five elections correctly. George Gallup, with a sample of about fifty thousand, called it right, and also predicted in advance what the Digest's error would be. The magazine folded within two years.","use":"A sample drawn from lists of people who had telephones, cars and magazine subscriptions, in the middle of the Depression, when those things divided the country almost exactly along the lines of the vote. It is the founding lesson of survey research: size does not fix bias. Two and a half million responses from the wrong population are worse than fifty thousand from the right one, because they come with a confidence that the small honest sample does not.","ch":11},{"n":103,"quote":"I believe it is peace for our time.","bare":false,"attribution":"Neville Chamberlain, 30 September 1938","means":"Eleven months. Chamberlain returned from Munich having agreed to the German annexation of the Sudetenland, and read the declaration to a crowd in Downing Street. Germany occupied the rest of Czechoslovakia in March 1939 and invaded Poland in September. It should be said that the year bought was used for rearmament, and that the argument about whether Britain was better placed in 1939 than in 1938 is still live among historians.","use":"A concession read as a settlement because it had been paid for. Chamberlain had given something real and received a signature, and the natural human accounting is that a costly agreement is a solid one. The other party's incentives had not changed at all, and a promise is worth what it is worth to the promiser to keep it, not what it cost you to obtain. Any deal whose durability rests on the other side's satisfaction rather than on their interest is a truce with a date on it.","ch":11},{"n":104,"quote":"DEWEY DEFEATS TRUMAN","bare":true,"attribution":"The Chicago Tribune, 3 November 1948","means":"Truman won. The Tribune, working against a printers' strike and an early deadline, went to press on the strength of polling that had shown Dewey comfortably ahead all year. Gallup had stopped polling in mid-October on the reasoning that voters do not change their minds in the last fortnight. They did. Truman was photographed the next morning holding the paper up, delighted, and it is the most famous newspaper front page ever printed.","use":"An assumption inside the method rather than an error in the data. Everybody's polling was accurate about the moment it was taken; the fatal belief was that opinion was settled, so measurement could stop. That assumption was inherited from a period when it had been true and was never tested again. In any instrument, look for the thing that is not measured because somebody once decided it does not vary.","ch":11},{"n":105,"quote":"The Soviet Union faces serious economic difficulties but remains stable, and will be a superpower rival for the foreseeable future.","bare":true,"attribution":"Western intelligence assessments, 1988","means":"Three years. The Berlin Wall opened in November 1989, the Warsaw Pact dissolved in 1991, and the Soviet Union ceased to exist on 26 December 1991, three years later. Western agencies had documented the economic decline in detail and some analysts had called the system unsustainable. What essentially nobody produced was a forecast that the state itself would dissolve, peacefully, within five years.","use":"An institution built to answer a different question. The apparatus had been built over forty years to count divisions, warheads and factory output. It did all of that well. None of it measures whether the people running a country still believe in it. Legitimacy is not observable by the instruments an intelligence service owns, so it was not in the estimate. Its absence was invisible, because every quantity that was in the estimate looked normal until the week it did not.","ch":11},{"n":106,"quote":"The Wall will still be standing in fifty and even in a hundred years.","bare":false,"attribution":"Erich Honecker, January 1989","means":"Ten months. Honecker was removed by his own party in October and the crossings were opened on 9 November after a press conference in which a spokesman misread a note about travel regulations. The state he led ceased to exist within a year.","use":"Confusing an absence of visible dissent with the presence of consent. East Germany in January 1989 was quiet. It was quiet because dissent was punished, which tells you nothing about what people believe and everything about what they will say. Any system that suppresses the expression of a preference destroys its own ability to measure it. The leadership finds out last, being the group most insulated from the one thing that would inform it.","ch":11},{"n":107,"quote":"Liberal democracy is the end point of ideological evolution and the final form of human government.","bare":true,"attribution":"Francis Fukuyama, 1989","means":"History resumed. The next three decades produced an authoritarian and economically successful China, religious politics on a scale nobody had forecast, and a global financial crisis. Then a democratic recession measured across most indices, and major wars of conquest in Europe. Fukuyama's essay is far more careful than the slogan. Its original title ends in a question mark, and it worries out loud that the end of history might be boring enough to restart it. He has revised the argument at length since and has been unusually willing to say where it was wrong.","use":"A trend at its maximum m
