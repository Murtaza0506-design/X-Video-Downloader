istaken for a destination. The essay was written in the most favourable year for its thesis in modern history. That is not a coincidence. It is when such a thesis becomes thinkable. The general form is the one from chapter four, in political dress. A period of consolidation looks like completion from the inside, and the anomalies that will undo it are already present, filed as exceptions.","ch":11},{"n":108,"quote":"The election is too close to call, and a hung parliament is the likeliest outcome.","bare":true,"attribution":"The British polling industry, 1992","means":"They were out by eight and a half points. The Conservatives won by nearly eight points and took more votes than any party in British history. The final polls had understated them by about eight and a half points, the largest polling error in a British general election. The Market Research Society's inquiry found two causes: samples that were unrepresentative in a way the quotas did not catch, and respondents who intended to vote Conservative and would not say so. The industry rebuilt its methods and then made a related error in 2015.","use":"A measurement that changes when the respondent knows what the answer signals. A poll assumes that reporting your intention is costless. Where a vote has become socially disapproved of in somebody's own circle, it is not, and the misreporting is systematic instead of random. It is the hardest problem in the field and it has no full solution. What it does have is a warning sign: whenever the answer to a question carries a social cost, treat the resulting numbers as a floor for the unpopular option.","ch":11},{"n":109,"quote":"Romney will win by more than five points and take three hundred and twenty-five electoral votes.","bare":false,"attribution":"Dick Morris, 2012","means":"He lost the argument and his slot. Barack Obama won by about four points and took three hundred and thirty-two electoral votes. Morris was a professional political consultant and television commentator. He made the prediction repeatedly and with escalating confidence, and dismissed the aggregated public polling, all of which pointed the other way, as skewed. He lost his television contract.","use":"A conclusion arrived at first and a methodology adopted to support it. The move used at the time was to reweight published polls by a turnout model of one's own choosing. It is a legitimate technique that will produce any answer you like, because the turnout assumption is exactly the unknown. When somebody rejects a body of data by adjusting a parameter that cannot be observed, the adjustment is the argument. Ask what the parameter would have to be for their answer to hold.","ch":11},{"n":110,"quote":"The probability of a Clinton victory is over ninety-nine per cent.","bare":true,"attribution":"Sam Wang, 2016","means":"She lost the electoral college. Wang was a Princeton neuroscientist running one of the most respected election models. He had promised on air to eat a bug if Trump exceeded two hundred and forty electoral votes, and he ate a cricket on television afterwards, which is more than most people in this book did. Other models were less extreme: the most cautious of the well-known forecasters gave Trump around a three in ten chance, and was widely criticised at the time for being too generous.","use":"Treating state errors as independent when they are strongly correlated. Wisconsin, Michigan and Pennsylvania can be wrong for the same reason at the same time, and they were. Aggregating many state polls then does not shrink the uncertainty anything like as fast as the arithmetic suggests. It is the same failure as the mortgage ratings in chapter seven, in a different costume. It will keep recurring. Independence is the assumption that makes the mathematics tractable, and it is almost never true of human beings in the same country in the same month.","ch":11}]},{"n":12,"title":"When You Are the One Who Is Certain","part":"Four","partRoman":"IV","partName":"People","opening":"<p>Everything so far has been about other people. This chapter is about you, and it is the reason the book exists, because a collection of famous errors read for entertainment leaves you worse off than when you started. It makes you feel clever about hindsight and changes nothing you will do on Monday.</p><p>The estimates in this chapter are mostly ordinary. Not one was made by a fool. None required a scientific revolution to overturn. Every one was produced by professionals with an incentive to be right, using methods that had worked before. They are here because they are the version of the error you are actually going to make. You will not predict the end of physics. You will say six weeks.</p><p>Four things help, and they are all uncomfortable, which is why they are rarely used.</p><p>The first is the outside view. Ignore the details of your project and ask what happened to the last twenty things like it. This feels wrong, because you know things about your case that were not true of theirs, and that is exactly the feeling the method is designed to overrule. Everyone on all twenty of those projects also had reasons why theirs was different. The base rate beats your reasoning about your own case, consistently, and by a wide margin.</p><p>The second is the premortem. Before committing, gather the people involved and tell them it is two years from now and the thing has failed badly. Ask them to write down why. This gets you information that no request for concerns ever will, because it removes the social cost. Nobody is objecting. Everybody is explaining, and the doubts that would otherwise stay in the corridor arrive in writing.</p><p>The third is a date and a number. A belief that cannot be wrong on a particular day by a particular measure is not a belief you can learn from. <em>Transitory</em> and <em>soon</em> and <em>the end begins to come into view</em> are the sound of a claim arranging not to be scored.</p><p>The fourth is the cheapest and the one people skip. Find out who has already told you this will not work, and read what they said rather than remembering how they said it. Almost every disaster in this book had that person, and in most cases they are on the record, before the event, in the file. Take the four together and they amount to one instruction, which is to arrange in advance for the world to be able to tell you that you are wrong, at a moment when you can still act on it, through somebody whose job is not made harder by saying so.</p>","entries":[{"n":111,"quote":"Complete in 1963, for about seven million pounds.","bare":true,"attribution":"The New South Wales government, 1957","means":"Ten years late. The Sydney Opera House opened in 1973 and cost about a hundred and two million Australian pounds, some fifteen times the estimate. The architect, Jørn Utzon, resigned in 1966 and never returned to Australia or saw the finished building. It is now among the most recognised structures on earth and is generally reckoned to have been worth it, which is the honest complication in every entry in this chapter.","use":"Construction begun before the design was solved. Work started in 1959, three years before anybody knew how to build the shells, in order to make the project irreversible before the opposition could gather. It worked, and it is why the building exists. The cost is that every subsequent decision was made under the constraint of foundations already poured for a different building, and the schedule was fiction from the first day. Starting early to prevent cancellation is a real strategy with a known price, and it should at least be chosen deliberately rather than described as a plan.","ch":12},{"n":112,"quote":"Development will cost around seventy million pounds, shared between the two countries.","bare":true,"attribution":"The British and French governments, 1962","means":"Concorde cost somewhere over a billion pounds to develop, more than fifteen times the estimate in nominal terms. The treaty had been written without a break clause, so that neither government could withdraw. Around a hundred and fifty orders were expected from airlines around the world; fourteen aircraft entered commercial service, all with the two national carriers. It was a magnificent aeroplane and it never came close to recovering its costs.","use":"An estimate made when the political decision had already been taken. The figure was not the output of an engineering study; it was the number that would get the agreement signed, and everyone involved understood that raising it would kill the project. This is the standard mechanism behind large public overruns and it requires dishonesty from nobody. An optimistic estimate is selected because pessimistic ones do not get funded. So the projects that go ahead are systematically the ones that were most wrong about their costs.","ch":12},{"n":113,"quote":"The Olympics can no more have a deficit than a man can have a baby.","bare":false,"attribution":"Jean Drapeau, 1970","means":"Twelve times over. The 1976 Montreal games cost around one and a half billion dollars against an estimate of a hundred and twenty million. The stadium's tower was not finished until 1987. The debt was finally paid off in 2006, thirty years after the closing ceremony, by a tobacco tax. A cartoonist drew Drapeau pregnant and the drawing outlived the argument.","use":"A certainty expressed as a physical impossibility, which is worth flagging as a rhetorical form because it does specific damage. He did not say it was unlikely, or that he was confident. He chose an analogy from biology, and the effect of that construction is to make disagreement absurd instead of merely wrong. Language of that kind commits the speaker far past the evidence and closes the room, and the tell is that no number appears anywhere in the sentence.","ch":12},{"n":114,"quote":"Two point eight billion dollars, complete by 1998.","bare":true,"attribution":"The Massachusetts Highway Department, 1985","means":"Five times over. Boston's Central Artery and Tunnel project, the Big Dig, was substantially finished in 2007 at about fourteen and a half billion dollars. With interest on the borrowing the total is usually put nearer twenty-four billion. A ceiling panel in one of the tunnels fell and killed a motorist in 2006. The road it replaced was an elevated expressway through the middle of the city, and by most accounts the result was worth having, at a price nobody would have voted for.","use":"Pricing the known work of a project whose difficulty was all in the unknown. Digging a tunnel is a well-understood activity with reliable unit costs. Digging one under a functioning city, beneath an elevated road that must stay open, through fill of unknown composition, next to utilities nobody has a map of, is a different activity. The estimate was built by costing the first one. When the novel part of a job is the interaction with everything around it, your unit costs are describing a job you are not doing.","ch":12},{"n":115,"quote":"Four point seven billion pounds, opening in 1993, carrying thirty million passengers a year.","bare":true,"attribution":"Eurotunnel, 1987","means":"The Channel Tunnel opened in 1994 at around nine and a half billion pounds, roughly double the forecast. The traffic was the more serious error. The projections were missed by a wide margin for years. The ferry companies, which the model had treated as a fixed alternative, cut their prices and improved their service, and then low-cost airlines arrived. The original shareholders were nearly wiped out in a restructuring. The tunnel itself is an engineering triumph and now carries a great deal of traffic.","use":"A demand forecast that held the competition still. Every large infrastructure case study contains one. The model asked how many people would cross the Channel and how many would prefer a train, at the prices ferries then charged. A ferry operator facing an existential threat does not keep charging those prices. Any forecast that assumes your entry into a market will not change the behaviour of the people already in it is describing a world in which you did not build the thing.","ch":12},{"n":116,"quote":"The automated baggage system will open with the airport in October 1993.","bare":true,"attribution":"The City of Denver, 1993","means":"The bags were shredded. The airport opened sixteen months late, at a reported cost of around a million dollars a day in delay, because the baggage system did not work: bags were shredded, misrouted and dumped. A manual system was built alongside it. The automated system was used in reduced form by one airline and abandoned entirely in 2005, after which the airport went back to conveyor belts and people.","use":"A subsystem on the critical path that had never been built at that scale, adopted late, with no fallback. Each of those alone is survivable. The combination is not, and the combination is common, because the ambitious component is the one added last and the one nobody wants to hedge against. The practical rule is simple and widely ignored: if a single unproven element can stop the whole thing opening, either prove it first or build the boring version in parallel.","ch":12},{"n":117,"quote":"Between ten and forty million pounds.","bare":true,"attribution":"The Scotland Office, 1997","means":"The Scottish Parliament building at Holyrood was completed in 2004 at four hundred and fourteen million pounds, roughly ten times the top of the range and forty times the bottom. Lord Fraser's inquiry found that the figure had been for a different site, a different brief and a different building, and that it was never withdrawn as those things changed.","use":"A number that outlived every assumption it was built on. This is the most common version of the error in ordinary working life, and the least dramatic. Nobody lied and nobody was reckless. An early estimate for one thing became the public figure, and the project changed underneath it in a dozen legitimate ways. No moment ever arrived at which somebody was required to say that the old number no longer meant anything. Estimates need a stated basis, and when the basis changes the estimate is void, not adjustable.","ch":12},{"n":118,"quote":"Opening in October 2011.","bare":true,"attribution":"Berlin Brandenburg Airport, 2006","means":"It stood empty and lit. It opened in October 2020, nine years late, at around three times the budget. The delays ran through fire safety systems that did not work, cable installations that did not meet code, and a period in which the terminal's lights could not be switched off. Berlin ran two ageing airports for a decade while a finished-looking building stood empty, heated and staffed.","use":"An opening date defended by declaring the problems solved rather than solving them. The pattern in the public record is a sequence of announcements, each confident, each followed by the discovery that the underlying issue was still there. Once a date has been announced enough times, the cost of moving it exceeds the cost of asserting it again, and the organisation begins managing the announcement instead of the building. Notice which one is being worked on. It is usually visible from outside.","ch":12},{"n":119,"quote":"Thirty-three billion dollars, San Francisco to Los Angeles by 2020.","bare":true,"attribution":"The California High-Speed Rail Authority, 2008","means":"It is still not built. The estimate that voters approved in a referendum has risen several times over and no through service exists. The segment under construction runs through the Central Valley, between cities that were not the point of the project. Work continues. Whether it eventually gets built is still open, which is why it is the last of the projects here. It is the one you would have to judge without hindsight.","use":"A number produced for a ballot rather than for a builder. An estimate that has to win a vote is not the same document as one that has to guide procurement. Once a public has approved the first, revising towards the second looks like betrayal instead of arithmetic. If you want to know how good a forecast is, look at what it was for. A figure that had to persuade somebody is not a measurement, whatever it is dressed as.","ch":12},{"n":120,"quote":"Our considered forecasts about political and economic events are substantially better than chance.","bare":true,"attribution":"The experts, 1984 to 2003","means":"They were not. Philip Tetlock spent twenty years collecting some twenty-eight thousand specific, dated, checkable predictions from nearly three hundred professionals whose job was to know: academics, officials, journalists and analysts. Scored against the outcomes, the average expert performed a little better than random and worse than simple statistical rules. Two findings are worth more than the headline. Those with the strongest organising theories did worst, and did worse the more famous they were. And the experts who did best held loose, provisional, patched-together views, updated often, and were the ones nobody wanted on television.","use":"Not knowledge, which they had, but the conversion of knowledge into confidence. Expertise makes you better at explaining and no better at forecasting, and it makes you far more certain, which is the combination that produced every entry in this book. Tetlock's later work is the encouraging half. Forecasting is a skill and it can be measured, and people trained to break questions down, start from base rates and update in small increments get much better within months. Almost nobody does that, because it involves saying seventy per cent out loud and being seen to move. One last thing. You have now read a hundred and twenty examples of people being certain, and the feeling you have about your own next estimate has probably not changed at all. That feeling is the subject of the book.","ch":12}]}],"index":[{"name":"Aleksandrov, Anatoly","letter":"A","items":[{"n":56,"quote":"A reactor of this type could be installed on Red Square. It is no more dangerous than a samovar.","ch":6,"q":"attributed to"}]},{"name":"Amsterdam tulip trade, the","letter":"A","items":[{"n":81,"quote":"A single bulb is worth a house on the Herengracht, and the price will hold, because the supply cannot be increased.","ch":9,"q":""}]},{"name":"Angell, Norman","letter":"A","items":[{"n":101,"quote":"War between the industrial powers has become futile, and therefore will not happen.","ch":11,"q":""}]},{"name":"Bailey, William","letter":"B","items":[{"n":44,"quote":"Radithor is harmless in every respect. A dose of certified radioactive water taken daily restores energy and cures more than one hundred and fifty conditions.","ch":5,"q":""}]},{"name":"Ballmer, Steve","letter":"B","items":[{"n":20,"quote":"There's no chance that the iPhone is going to get any significant market share. No chance.","ch":2,"q":""}]},{"name":"Balsillie, Jim","letter":"B","items":[{"n":79,"quote":"It's kind of one more entrant into an already very busy space. But in terms of a sea change for BlackBerry, I would think that's overstating it.","ch":8,"q":""}]},{"name":"Berlin Brandenburg Airport","letter":"B","items":[{"n":118,"quote":"Opening in October 2011.","ch":12,"q":""}]},{"name":"Bernanke, Ben","letter":"B","items":[{"n":68,"quote":"We believe the effect of the troubles in the subprime sector on the broader housing market will likely be limited, and we do not expect significant spillovers to the rest of the economy or to the financial system.","ch":7,"q":""}]},{"name":"Blockbuster","letter":"B","items":[{"n":77,"quote":"Netflix is a very small niche business. Fifty million dollars is far too much.","ch":8,"q":""}]},{"name":"Blondlot, René","letter":"B","items":[{"n":36,"quote":"A new kind of radiation, N-rays, is emitted by most substances and can be detected as a change in the brightness of a spark.","ch":4,"q":""}]},{"name":"Borders","letter":"B","items":[{"n":78,"quote":"Running an online bookshop is not our competence. Amazon should run it for us.","ch":8,"q":""}]},{"name":"BP and Transocean","letter":"B","items":[{"n":59,"quote":"The negative pressure test result is anomalous but explainable. The well is secure.","ch":6,"q":""}]},{"name":"British and French governments, the","letter":"B","items":[{"n":112,"quote":"Development will cost around seventy million pounds, shared between the two countries.","ch":12,"q":""}]},{"name":"British polling industry, the","letter":"B","items":[{"n":108,"quote":"The election is too close to call, and a hung parliament is the likeliest outcome.","ch":11,"q":""}]},{"name":"Bush, Vannevar","letter":"B","items":[{"n":9,"quote":"I think we can leave that out of our thinking. I wish the American public would leave that out of their thinking.","ch":1,"q":""}]},{"name":"California High-Speed Rail Authority, the","letter":"C","items":[{"n":119,"quote":"Thirty-three billion dollars, San Francisco to Los Angeles by 2020.","ch":12,"q":""}]},{"name":"Chamberlain, Neville","letter":"C","items":[{"n":93,"quote":"One thing is certain: he missed the bus.","ch":10,"q":""},{"n":103,"quote":"I believe it is peace for our time.","ch":11,"q":""}]},{"name":"Chamberlin, Rollin","letter":"C","items":[{"n":37,"quote":"If we are to believe Wegener's hypothesis we must forget everything which has been learned in the last seventy years and start all over again.","ch":4,"q":""}]},{"name":"Cheney, Dick","letter":"C","items":[{"n":99,"quote":"I really do believe that we will be greeted as liberators.","ch":10,"q":""}]},{"name":"Chicago Tribune, The","letter":"C","items":[{"n":104,"quote":"DEWEY DEFEATS TRUMAN","ch":11,"q":""}]},{"name":"City of Denver, the","letter":"C","items":[{"n":116,"quote":"The automated baggage system will open with the airport in October 1993.","ch":12,"q":""}]},{"name":"Comte, Auguste","letter":"C","items":[{"n":32,"quote":"We shall never be able by any means to study the chemical composition of the stars, or their mineralogical structure.","ch":4,"q":""}]},{"name":"Cramer, Jim","letter":"C","items":[{"n":69,"quote":"Bear Stearns is fine. Do not take your money out.","ch":7,"q":""}]},{"name":"de Havilland","letter":"D","items":[{"n":54,"quote":"The pressurised cabin is amply strong. The airframe is good for tens of thousands of cycles.","ch":6,"q":""}]},{"name":"Decca Records","letter":"D","items":[{"n":72,"quote":"Guitar groups are on the way out. The Beatles have no future in show business.","ch":8,"q":"attributed to"}]},{"name":"Dell, Michael","letter":"D","items":[{"n":19,"quote":"What would I do? I'd shut it down and give the money back to the shareholders.","ch":2,"q":""}]},{"name":"Doerr, John","letter":"D","items":[{"n":30,"quote":"It will be to the car what the car was to the horse and buggy, and it may be more important than the internet.","ch":3,"q":""}]},{"name":"Drapeau, Jean","letter":"D","items":[{"n":113,"quote":"The Olympics can no more have a deficit than a man can have a baby.","ch":12,"q":""}]},{"name":"Ehrlich, Paul","letter":"E","items":[{"n":27,"quote":"In the 1970s hundreds of millions of people will starve to death in spite of any crash programs embarked upon now.","ch":3,"q":""}]},{"name":"Eurotunnel","letter":"E","items":[{"n":115,"quote":"Four point seven billion pounds, opening in 1993, carrying thirty million passengers a year.","ch":12,"q":""}]},{"name":"Excite","letter":"E","items":[{"n":76,"quote":"A search engine is a feature, not a business, and this one is not worth a million dollars.","ch":8,"q":""}]},{"name":"Experts, the","letter":"E","items":[{"n":120,"quote":"Our considered forecasts about political and economic events are substantially better than chance.","ch":12,"q":""}]},{"name":"Fisher, Irving","letter":"F","items":[{"n":61,"quote":"Stock prices have reached what looks like a permanently high plateau.","ch":7,"q":""}]},{"name":"Fleischmann, Martin, and Stanley Pons","letter":"F","items":[{"n" ap to meter.","ch":3,"q":""}]},{"name":"TEPCO","letter":"T","items":[{"n":58,"quote":"The design basis tsunami for the site is 5.7 metres. Higher estimates are not sufficiently established to require action.","ch":6,"q":""}]},{"name":"Time","letter":"T","items":[{"n":14,"quote":"Remote shopping, while entirely feasible, will flop, because women like to get out of the house, like to handle merchandise, like to be able to change their minds.","ch":2,"q":""}]},{"name":"Tobacco Industry Research Committee, the","letter":"T","items":[{"n":46,"quote":"We accept an interest in people's health as a basic responsibility, paramount to every other consideration in our business. There is no proof that cigarette smoking is one of the causes of lung cancer.","ch":5,"q":""}]},{"name":"Wang, Sam","letter":"W","items":[{"n":110,"quote":"The probability of a Clinton victory is over ninety-nine per cent.","ch":11,"q":""}]},{"name":"Wayne, Ron","letter":"W","items":[{"n":74,"quote":"A tenth of this company is not worth the liability that comes with it.","ch":8,"q":""}]},{"name":"Western intelligence assessments","letter":"W","items":[{"n":105,"quote":"The Soviet Union faces serious economic difficulties but remains stable, and will be a superpower rival for the foreseeable future.","ch":11,"q":""}]},{"name":"Western Union","letter":"W","items":[{"n":71,"quote":"The telephone is a scientific curiosity with no commercial application. Decline the offer.","ch":8,"q":"attributed to"}]},{"name":"Westmoreland, William","letter":"W","items":[{"n":97,"quote":"We have reached an important point when the end begins to come into view.","ch":10,"q":""}]},{"name":"Wilhelm II, Kaiser","letter":"W","items":[{"n":91,"quote":"You will be home before the leaves have fallen from the trees.","ch":10,"q":""}]},{"name":"Woolley, Richard","letter":"W","items":[{"n":8,"quote":"Space travel is utter bilge.","ch":1,"q":""}]},{"name":"Wright, Wilbur","letter":"W","items":[{"n":4,"quote":"Man will not fly for fifty years.","ch":1,"q":""}]},{"name":"Yahoo","letter":"Y","items":[{"n":80,"quote":"Thirty-one dollars a share undervalues the company. Reject it.","ch":8,"q":""}]},{"name":"Zanuck, Darryl","letter":"Z","items":[{"n":13,"quote":"Television won't be able to hold on to any market it captures after the first six months. People will soon get tired of staring at a plywood box every night.","ch":2,"q":""}]},{"name":"The Bible","letter":"¶","items":[{"n":87,"quote":"We believe the Dow should rise to 36,000 immediately, but to be conservative we expect it to take three to five years.","ch":9,"q":""}]}],"blurb":["Eight days before the crash of 1929, the leading economist in America announced that stock prices had reached a permanently high plateau. Eight years before Kitty Hawk, the most eminent physicist in Britain explained that heavier-than-air flight was impossible. Neither man was a fool. Both were reasoning carefully from what they knew.","A hundred and twenty predictions that were wrong, made by people who were in an unusually good position to be right. Each one comes with what actually happened, and with the part that transfers: what the mistake was made of.","The same shapes come round again. A cost that prices only the interesting part. A model fitted to a stretch of history that did not contain the event. An opponent treated as an object rather than as somebody who will respond. A number chosen to win a vote and then believed. And, over and over, the one person who said so in advance, in writing, and was overruled.","The last chapter is about ordinary estimates made by competent people, and about the four things that are known to help. It is the least entertaining chapter in the book and the reason for the other eleven."],"intro":"<p>This is a book of a hundred and twenty predictions that were wrong, made by people who were in an unusually good position to be right.</p><p>Each entry has four parts. The prediction, as it was made. Who made it, and when. What actually happened. And, in the last paragraph and most importantly, what the error was made of, which is the only part of any of this that is transferable.</p><p><strong>It is not a book about idiots.</strong> That is the first thing to establish, because the genre is full of collections that are, and they are worthless. The physicist who said flight was impossible was the most eminent physicist in Britain and was reasoning correctly from the engines that existed. The company that turned down the telephone was the largest communications business in the world. The economist who announced a permanently high plateau eight days before the crash of 1929 was the leading monetary theorist of his generation, and he lost his own house. If your reaction to any entry is that the person was a fool, the entry has failed, and the note underneath it is where the actual finding is.</p><p><strong>On hindsight.</strong> Everything here is unfair, and there is no way round it. You know the answer, which makes the reasoning look obvious. It was not obvious. There is good experimental evidence that once you know an outcome you cannot recover your genuine uncertainty about it. Read each prediction once before you read what happened, and try to notice whether you would have signed it.</p><p><strong>On survivorship.</strong> These are the errors that left evidence. A collection of predictions that were wrong will always look as though experts are unreliable, because a prediction that came true is not interesting enough to record. The honest summary of the research is in the last entry of the book, and it is duller and more useful. Forecasters with strong theories do a little better than chance and are extremely confident. The ones who do best hold their views loosely and are never invited on television.</p><p><strong>How it is arranged.</strong> Four parts. The Future, about things that could not be built and markets that would not exist, and its mirror, the promised futures that never arrived. The Settled Question, about science, medicine and engineering. Money. And People, about war, politics and the last chapter, which is about you.</p><p><strong>On the quotations.</strong> Where a line is in quotation marks it is as recorded. Where it is in bold without quotation marks it is a summary of a documented position, because the wording is not reliably established. Where the attribution itself is doubtful, and several of the most famous lines in this genre are, the entry says <em>attributed to</em>. The note at the back explains which and why. The fakes are worth knowing about on their own account; the good ones are too neat, and the neatness is the tell.</p><p><strong>Chapter twelve is the point.</strong> Everything before it is other people. The last chapter is about ordinary estimates made by competent professionals, and about the four things that are known to help. It is less entertaining than the eleven chapters in front of it. That is the correct order to read them in.</p>","note":"<p>A book about people being confidently wrong has an obligation. It is not to be confidently wrong itself. This note is about how the lines here were treated and which of the famous ones did not make it in. The short version is that a quotation which is short, clean, self-contained and ends on an ironic sting has usually been improved by somebody, and the improvement is nearly always made a few decades later by a person who was not there and had no reason to be careful.</p><p>## The three forms used</p><p>A line <strong>in quotation marks</strong> is as recorded. The source is contemporary or close to it, and the wording is the one accepted by people who have looked.</p><p>A line <strong>in bold, without quotation marks</strong>, is a summary of a documented position rather than a quotation. It is used where somebody&#x27;s view is beyond dispute but the exact words are not. It is also used where a position was set out over pages and not in a sentence. It is also used for institutional positions, which are almost never expressed in a quotable line by an individual.</p><p>A line marked <strong>attributed to</strong> is one where the sentiment is widely reported and the sourcing is thin. Doubt is on the record, not hidden. The entry says so and the note under it usually explains what is solid. Newton on the madness of people, Foch on aeroplanes and the Decca verdict on the Beatles are all in this category: the underlying events are documented and the famous wording is not.</p><p>## The famous ones that are not here</p><p>Several of the best-known quotations in this genre appear to be inventions. A collection like this is where they breed. They are left out. Since their absence may look like an oversight, here is why.</p><p><strong>&quot;I think there is a world market for maybe five computers.&quot;</strong> Attributed to Thomas Watson of IBM in 1943. No source has ever been found, in IBM&#x27;s own archives or anywhere else, and the earliest appearances are from the 1980s.</p><p><strong>&quot;Everything that can be invented has been invented.&quot;</strong> Attributed to Charles Duell, commissioner of the United States patent office, in 1899. It was traced to a magazine humour column. Duell said the opposite in his annual report, which forecast that the century to come would astonish those who lived in it.</p><p><strong>&quot;There is nothing new to be discovered in physics. All that remains is more and more precise measurement.&quot;</strong> Attributed to Lord Kelvin in 1900. There is no source. Kelvin&#x27;s real address of that period identifies two unexplained clouds over the theory. They turned out to be relativity and the quantum. The genuine remark is nearly the opposite of the fake one. Michelson said something close to the fake in 1894 and is quoted here instead, because he actually did.</p><p><strong>&quot;640K ought to be enough for anybody.&quot;</strong> Attributed to Bill Gates. He has denied it repeatedly and no contemporary record exists.</p><p><strong>&quot;This telephone has too many shortcomings to be seriously considered as a means of communication.&quot;</strong> Presented as a Western Union memo of 1876. The memo has never been produced. The decision to decline the patent is well documented and is in the book on that basis.</p><p><strong>&quot;Who the hell wants to hear actors talk?&quot;</strong> Attributed to Harry Warner, whose company then made the first talking picture. The sourcing is poor and the sentiment is contradicted by what his company did.</p><p>## Why the fakes cluster here</p><p>Two reasons, and both are useful to know about beyond this subject.</p><p>The first is that a fabricated quotation is better written than a real one. Real people hedge and qualify. They say things that need a paragraph of context. The fake is short, clean and self-contained, and it has an ironic sting that a genuine remark almost never has. If a quotation is perfect, be suspicious of it in proportion to how perfect it is.</p><p>The second is that famous people act as magnets. A line about computers drifts towards the most famous computer man, and a line about physics towards the most famous physicist. The drift happens a few decades after the fact, by which point nobody can trace it. This is a documented phenomenon in quotation research, and Mark Twain, Winston Churchill and Albert Einstein have absorbed most of the unclaimed epigrams of the English language between them.</p><p>## Dates and revisions</p><p>Dates are when the thing was said or published. Not when it became famous. Several people in this book changed their minds, publicly and to their credit, and where they did the entry says so. A collection that quotes a man&#x27;s worst sentence and omits his retraction is doing the thing this book is supposed to be against.</p><p>## Where the underlying facts came from</p><p>Ordinary ones. Contemporary newspapers and journals where they exist, official inquiries and accident reports for the engineering entries, published memoirs and the standard histories elsewhere. Nothing here required special access. Anyone could repeat it. The point of saying so is that the checking is available to anyone. If you find an error in this book, the machinery for correcting it is the machinery the book is about.</p>","introTitle":"Introduction","noteTitle":"A Note on Quotation","indexTitle":"Index of People"}</script>

    if(ch.part !== lastPart){
      lastPart = ch.part;
      h += '<div class="part-open" id="p-'+ch.partRoman+'"><div class="r">'+ch.partRoman+'</div>'+
           '<div class="n">Part '+ch.partRoman+' · '+esc(ch.partName)+'</div></div>';
    }
    h += '<div class="ch-head" id="c'+ch.n+'"><div class="ch-eyebrow">Part '+ch.partRoman+
         ' · '+esc(ch.partName)+' · <b>Chapter '+ch.n+'</b></div><h2>'+esc(ch.title)+'</h2></div>'+
         '<div class="ch-open">'+ch.opening+'</div>'+
         ch.entries.map(entryHTML).join("");
  });
  h += '<div class="ch-head plain" id="c-note"><h2>'+esc(BOOK.noteTitle)+'</h2></div>'+
       '<div class="plain">'+BOOK.note+'</div>';
  h += '<div class="ch-head plain" id="c-index"><h2>'+esc(BOOK.indexTitle)+'</h2></div><div class="idx">';
  var letter = null;
  BOOK.index.forEach(function(s){
    if(s.letter !== letter){
      letter = s.letter;
      h += '<div class="idx__letter">'+(letter === "\u00b6" ? "Proverbs &amp; anonymous" : letter)+'</div>';
    }
    h += '<div class="idx__src"><b>'+esc(s.name)+'</b>'+
      s.items.map(function(i){
        return '<span class="idx__i">'+pad(i.n)+' \u201C'+esc(i.quote)+'\u201D'+
          (i.q ? ' <i>('+esc(i.q)+')</i>' : '')+'</span>';
      }).join("")+'</div>';
  });
  h += '</div>';
  return h;
})();

/* ---------- geometry ---------- */
var G = {ph:0,pw:0,m:0,vm:0,T:30,fit:1,padX:0,padY:0};
var STACK = 18;
var S = {spread:0,pages:1,open:false,rx:-14,ry:0,zoom:1,panX:0,panY:0,
         mark:null,ribbonDrag:false,turning:null,focus:0};
var faces = {};
var starts = {};

function el(cls,parent,css){
  var d=document.createElement("div"); d.className=cls||"";
  if(css) d.style.cssText=css; (parent||book).appendChild(d); return d;
}
function makeFace(cls){
  var f = el("face "+cls, null,
    "width:"+G.pw+"px;height:"+G.ph+"px;top:"+(-G.ph/2)+"px;");
  f.innerHTML = '<div class="pgwrap"><div class="face__flow pg" style="width:'+G.pw+'px;padding:'+G.vm+'px '+G.m+'px;'+
    'height:'+G.ph+'px;column-width:'+(G.pw-2*G.m)+'px;column-gap:'+(2*G.m)+'px">'+FLOW_HTML+'</div>'+
    '<div class="face__rule"></div><div class="runhead"></div><div class="folio"></div></div>'+
    '<div class="face__gutter"></div>';
  return f;
}

// The page is a fixed object, like a printed one: the same words fall on page
// seven whatever you are reading it on. The screen only changes how big the
// book is drawn, never how the type is set.
var PAGE = {w:430, h:628};

/* A phone cannot show a whole spread at a size anyone would read. So on a
   narrow screen the book is framed a page at a time and drawn twice as large.
   The type is not re-set: page 41 holds the same words it holds on a laptop,
   the camera simply sits closer and a swipe steps across the spread. */
function fitView(){
  var vw = window.innerWidth, vh = window.innerHeight;
  // the controls sit above the book and the page number below it, so the
  // height the book may take is the window less those two strips
  var room = Math.max(vh - 72, vh*0.55);
  var spread = Math.min(1, (vw*0.94)/(2*G.pw + G.T*2), room/G.ph);
  var one    = Math.min(1, (vw*0.94)/(G.pw + G.T), room/G.ph);
  var was = G.single;
  // only when framing one page actually buys size: in landscape the height
  // is the constraint, and halving the view would gain nothing
  G.single = spread < 0.62 && one > spread * 1.15;
  G.fit = G.single ? one : spread;
  applyView();
  var hint = document.getElementById("hint");
  if(hint) hint.textContent = G.single
    ? "Swipe to turn the page \u00b7 drag the desk to turn the book \u00b7 pinch to zoom"
    : "Drag to turn the book \u00b7 drag a page corner to turn it \u00b7 scroll or pinch to zoom where you point";
  if(was !== G.single && faces.verso) paint();
}

function layout(){
  G.ph = PAGE.h;
  G.pw = PAGE.w;
  G.m  = Math.round(G.pw*0.105);
  G.vm = Math.round(G.ph*0.075);
  G.padX = Math.round(G.pw*0.10);
  G.padY = Math.round(G.ph*0.22);
  fitView();

  book.innerHTML = "";
  faces = {};

  // back board and the two half blocks of pages
  el("board board--back",null,"width:"+(G.pw+8)+"px;height:"+(G.ph+14)+"px;left:-4px;top:"+
     (-G.ph/2-7)+"px;transform:translateZ("+(-G.T-10)+"px)");
  var sp = el("spine",null,"width:"+(G.T+12)+"px;height:"+(G.ph+14)+"px;left:0;top:"+
     (-G.ph/2-7)+"px;transform-origin:left center;transform:translateZ("+(-G.T-6)+
     "px) rotateY(-90deg)");
  sp.innerHTML = "<span>Lines Worth Keeping</span>";
  faces.spine = sp;

  // the page block: opaque leaves stacked through the depth, so the book reads
  // as solid from any angle rather than hollow between the covers
  faces.stackL = el("stack",null,"width:"+G.pw+"px;height:"+G.ph+"px;left:"+(-G.pw)+
    "px;top:"+(-G.ph/2)+"px");
  faces.stackR = el("stack",null,"width:"+G.pw+"px;height:"+G.ph+"px;left:0;top:"+
    (-G.ph/2)+"px");
  for(var si=0; si<STACK; si++){
    faces.stackL.appendChild(document.createElement("i"));
    faces.stackR.appendChild(document.createElement("i"));
  }

  faces.verso = makeFace("face--verso"); faces.verso.style.left = (-G.pw)+"px";
  faces.recto = makeFace("face--recto"); faces.recto.style.left = "0px";
  faces.recto.insertAdjacentHTML("beforeend",'<div class="corner" id="corner"></div>');

  var leaf = el("leaf",null,"width:"+(2*G.pw+2*G.padX)+"px;height:"+(G.ph+2*G.padY)+
    "px;left:"+(-G.pw-G.padX)+"px;top:"+(-G.ph/2-G.padY)+"px;display:none");
  faces.leaf = leaf;
  faces.leafFront = makeFace("peel peel__base");
  faces.leafBack  = makeFace("peel peel__flap");
  leaf.appendChild(faces.leafFront);
  leaf.appendChild(faces.leafBack);
  faces.leafFront.style.display = "none";
  faces.leafBack.style.display  = "none";
  faces.leafFront.insertAdjacentHTML("beforeend",'<div class="peel__shade"></div>');
  faces.leafBack.insertAdjacentHTML("beforeend",'<div class="peel__shade"></div>');

  // the marker: a band that lies across the page it marks, and a tail that
  // hangs below the book whether or not you are on that page
  var rw = Math.max(9, Math.round(G.pw*0.034));
  var tail = Math.round(G.ph*0.15);
  G.rw = rw;
  var rb = el("ribbon",null,"left:0;top:"+(-G.ph/2-5)+"px;width:"+rw+"px;height:"+
    (G.ph+5+tail)+"px;transform:translateZ(2px) rotate(.5deg)");
  rb.innerHTML = '<div class="ribbon__band" style="height:'+(G.ph+5)+'px"></div>'+
                 '<div class="ribbon__tail" style="height:'+tail+'px"></div>';
  rb.title = "Drag the marker on to a page to keep your place";
  faces.ribbon = rb;

  var front = el("board board--front",null,"width:"+(G.pw+8)+"px;height:"+(G.ph+14)+"px;left:0;top:"+
     (-G.ph/2-7)+"px;transform:translateZ(6px)");
  front.id = "front";
  front.innerHTML =
    '<div class="board__face" style="font-size:'+Math.round(G.pw*0.052)+'px">'+
      '<div class="jacket">'+
        '<div class="jacket__rule"></div><div class="jacket__rule jacket__rule--in"></div>'+
        '<div class="jacket__prick"></div>'+
        '<div class="jacket__eyebrow">A commonplace book</div>'+
        '<div class="jacket__body"><div class="jacket__title">Lines Worth<br>Keeping</div>'+
        '<hr class="jacket__hr"><p class="jacket__sub">'+esc(BOOK.subtitle)+'</p>'+
        (BOOK.author ? '<p class="jacket__by">'+esc(BOOK.author)+'</p>' : '')+'</div>'+
        '<div class="jacket__foot">315 entries · 21 chapters</div>'+
      '</div></div>'+
    '<div class="board__face board__face--in"></div>';
  faces.front = front;

  // page count, measured from one of the flows
  var probe = faces.recto.querySelector(".face__flow");
  S.pages = Math.max(2, Math.round(probe.scrollWidth / G.pw));
  starts = {};
  ["c-intro","c-note","c-index"].concat(BOOK.chapters.map(function(c){return "c"+c.n;}))
    .forEach(function(id){
      var n = probe.querySelector("#"+CSS.escape(id));
      if(n) starts[id] = Math.floor((n.offsetLeft+1)/G.pw);
    });
  paint();
}

function pageOf(node){ return Math.floor((node.offsetLeft+1)/G.pw); }

function setFace(f, idx){
  var flow = f.querySelector(".face__flow");
  flow.style.transform = "translateX("+(-idx*G.pw)+"px)";
  var blank = idx < 0 || idx >= S.pages;
  flow.style.visibility = blank ? "hidden" : "visible";
  var rule = f.querySelector(".face__rule");
  var rh = f.querySelector(".runhead"), fo = f.querySelector(".folio");
  var verso = f.classList.contains("face--verso") || f.classList.contains("face--back");
  rule.style.cssText = "top:"+G.vm+"px;height:"+(G.ph-2*G.vm)+"px;"+
    (verso ? "right:"+(G.m-13)+"px" : "left:"+(G.m-13)+"px")+
    ";display:"+(blank?"none":"block");
  rh.style.cssText = "top:"+Math.round(G.vm/2-5)+"px;left:"+G.m+"px;width:"+(G.pw-2*G.m)+
    "px;text-align:"+(verso?"left":"right")+";display:"+(blank?"none":"block");
  fo.style.cssText = "bottom:"+Math.round(G.vm/2-5)+"px;left:0;width:"+G.pw+
    "px;text-align:center;display:"+(blank?"none":"block");
  rh.textContent = blank ? "" : runningHead(idx);
  fo.textContent = blank ? "" : String(idx+1);
}

function runningHead(idx){
  var best = "Lines Worth Keeping";
  BOOK.chapters.forEach(function(c){
    var s = starts["c"+c.n];
    if(s !== undefined && s <= idx) best = "Ch " + c.n + " · " + c.title;
  });
  if(starts["c-note"] !== undefined && starts["c-note"] <= idx) best = BOOK.noteTitle;
  return best;
}

function paint(){
  var L = S.spread*2, R = L+1;
  setFace(faces.verso, L);
  setFace(faces.recto, R);
  var t = S.pages ? S.spread/Math.max(1,Math.ceil(S.pages/2)) : 0;
  [["stackL", S.open ? t : 0], ["stackR", S.open ? 1-t : 1]].forEach(function(pair){
    var node = faces[pair[0]], frac = pair[1];
    node.style.display = frac > 0.02 ? "block" : "none";
    var d = Math.max(2, G.T*Math.max(0.05, frac));
    Array.prototype.forEach.call(node.children,function(sl,i){
      sl.style.transform = "translateZ("+(-1 - (i+1)*(d/STACK)).toFixed(2)+"px)";
    });
  });
  faces.verso.style.display = S.open ? "block" : "none";
  faces.recto.style.display = S.open ? "block" : "none";
  faces.spine.style.display = S.open ? "none" : "block";
  if(!S.coverAnim && !(S.turning && S.turning.cover)){
    faces.front.style.transform = coverTransform(S.open ? -178 : 0);
  }
  var marked = S.mark === null ? -1 : Math.floor(S.mark/2);
  var onMark = S.open && marked === S.spread;
  if(!S.ribbonDrag){
    var x;
    if(onMark) x = (S.mark % 2 === 1) ? Math.round(G.pw*0.17)
                                      : -Math.round(G.pw*0.17) - G.rw;
    else x = Math.round(G.pw*0.045);
    faces.ribbon.style.left = x + "px";
  }
  faces.ribbon.querySelector(".ribbon__band").style.display = onMark ? "block" : "none";

  if(S.open){
    var want = "#p" + (S.spread*2 + 1 + (G.single ? S.focus : 0));
    if(location.hash !== want){
      try{ history.replaceState(null, "", want); }catch(e){}
    }
  }
  document.getElementById("where").textContent = !S.open
    ? "Closed \u00b7 drag the cover to open"
    : G.single
      ? "Page " + Math.min(L+1+S.focus, S.pages) + " of " + S.pages
      : "Pages " + (L+1) + "\u2013" + Math.min(R+1,S.pages) + " of " + S.pages;
  applyView();
  store("lwk3:spread", String(S.spread));
  store("lwk3:focus", String(S.focus));
}

function applyView(){
  var lim = Math.max(window.innerWidth, window.innerHeight) * 0.9;
  S.panX = clamp(S.panX, -lim, lim);
  S.panY = clamp(S.panY, -lim, lim);
  camera.style.transform = "translate("+S.panX.toFixed(1)+"px,"+S.panY.toFixed(1)+
    "px) scale("+(G.fit*S.zoom).toFixed(3)+")";
  var shift = !S.open ? -G.pw/2
            : G.single ? (S.focus ? -G.pw/2 : G.pw/2)
            : 0;
  book.style.transform = "translateX("+shift+"px) rotateX("+S.rx.toFixed(2)+
    "deg) rotateY("+S.ry.toFixed(2)+"deg)";
}

/* ---------- turning: a fold across the perpendicular bisector ---------- */
/* Dragging the corner C to a point P folds the sheet along the line that is
   equidistant from both. Everything past that line is the reflection of the
   sheet in it, which is what paper actually does, and it mirrors the reverse
   side's printing exactly as a real folded corner does. */
function reflectAcross(M, n){
  var a = 1 - 2*n[0]*n[0], b = -2*n[0]*n[1];
  var c = b,               d = 1 - 2*n[1]*n[1];
  var k = 2*(M[0]*n[0] + M[1]*n[1]);
  return "matrix("+a.toFixed(5)+","+b.toFixed(5)+","+c.toFixed(5)+","+
         d.toFixed(5)+","+(k*n[0]).toFixed(2)+","+(k*n[1]).toFixed(2)+")";
}
/* Paper does not crease along a straight line, it bows. Both halves are cut
   with the SAME curve, so they still tile exactly and the reflection stays
   true, but the seam reads as a bend rather than a fold. */
function foldEdge(W, H, M, n, side, amp){
  var d = [-n[1], n[0]];
  var L = Math.hypot(W, H) * 1.7, BIG = L;
  var pts = [], N = 22, span = L * 0.46;
  for(var i = 0; i <= N; i++){
    var s = -L + 2*L*(i/N);
    var k = Math.max(0, 1 - (s/span)*(s/span));
    var b = -amp * k * k;                 // bows toward the corner being lifted
    pts.push([M[0] + s*d[0] + b*n[0], M[1] + s*d[1] + b*n[1]]);
  }
  pts.push([M[0] + L*d[0] + side*BIG*n[0], M[1] + L*d[1] + side*BIG*n[1]]);
  pts.push([M[0] - L*d[0] + side*BIG*n[0], M[1] - L*d[1] + side*BIG*n[1]]);
  return "polygon(" + pts.map(function(q){
    return q[0].toFixed(1)+"px "+q[1].toFixed(1)+"px"; }).join(",") + ")";
}

function beginTurn(dir){
  if(S.turning) return false;
  var L = S.spread*2;
  if(dir > 0 && (L+2) >= S.pages) return false;
  if(dir < 0 && S.spread === 0) return false;

  var base = faces.leafFront, flap = faces.leafBack;
  var x = G.padX + (dir > 0 ? G.pw : 0);
  [base, flap].forEach(function(f){
    f.style.left = x + "px";
    f.style.top = G.padY + "px";
    f.style.display = "block";
    f.style.transform = "none";
    f.style.clipPath = "none";
  });
  if(dir > 0){
    setFace(base, L+1); setFace(flap, L+2); setFace(faces.recto, L+3);
  }else{
    setFace(base, L);   setFace(flap, L-1); setFace(faces.verso, L-2);
  }
  faces.leaf.style.display = "block";
  // C is the free corner: the fore edge, at the foot of the page
  S.turning = {dir:dir, C:[dir > 0 ? G.pw : 0, G.ph], p:[dir > 0 ? G.pw : 0, G.ph], t:0};
  fold(0);
  return true;
}

function fold(prog){
  var T = S.turning; if(!T) return;
  T.t = clamp(prog, 0, 1);
  var W = G.pw, H = G.ph, dir = T.dir;
  // the corner travels across the spread and a little upward, as a hand does
  var cx = dir > 0 ? W - 2*W*T.t : 2*W*T.t;
  var cy = H - Math.sin(Math.PI*T.t) * H*0.13;
  T.p = [cx, cy];
  var C = T.C;
  var vx = cx - C[0], vy = cy - C[1], len = Math.hypot(vx, vy);
  var base = faces.leafFront, flap = faces.leafBack;
  var shB = base.querySelector(".peel__shade"), shF = flap.querySelector(".peel__shade");
  if(len < 1){
    base.style.clipPath = "none"; base.style.transform = "none";
    flap.style.display = "none"; shB.style.opacity = "0";
    return;
  }
  flap.style.display = "block";
  var n = [vx/len, vy/len];
  var M = [(C[0]+cx)/2, (C[1]+cy)/2];
  // the bow is deepest mid-turn and flattens out at either end
  var amp = 30 * Math.sin(Math.PI * clamp(T.t, 0, 1));
  base.style.clipPath = foldEdge(W,H,M,n,1,amp);
  flap.style.clipPath = foldEdge(W,H,M,n,-1,amp);
  flap.style.transform = reflectAcross(M, n);
  // shading reads as a cylinder: a soft core of shadow at the bend, falling
  // away on both sides, rather than one hard edge
  var deg = (Math.atan2(-n[0], n[1]) * 180/Math.PI).toFixed(1);
  shB.style.background = "linear-gradient("+deg+"deg,rgba(0,0,0,.34) 0%," +
    "rgba(0,0,0,.16) 6%,rgba(0,0,0,0) 20%)";
  shB.style.opacity = (0.55*Math.sin(Math.PI*Math.min(1,T.t*1.4))+0.12).toFixed(2);
  shF.style.background = "linear-gradient("+deg+"deg,rgba(255,255,255,.55) 0%," +
    "rgba(255,255,255,.16) 9%,rgba(0,0,0,.10) 34%,rgba(0,0,0,.20) 100%)";
  shF.style.opacity = "0.62";
}

function settleTurn(commit){
  var T = S.turning; if(!T || T.anim) return;
  var dir = T.dir, from = T.t, to = commit ? 1 : 0;
  var t0 = performance.now(), ms = reduce.matches ? 1 : 420;
  T.anim = true;
  T.done = function(){
    if(S.turning !== T) return;
    fold(to);
    faces.leafFront.style.display = "none";
    faces.leafBack.style.display = "none";
    faces.leaf.style.display = "none";
    S.turning = null;
    if(commit){
      S.spread += dir;
      if(G.single) S.focus = dir > 0 ? 0 : 1;
    }
    paint();
  };
  (function step(now){
    if(S.turning !== T) return;
    var u = clamp((now - t0)/ms, 0, 1);
    var e = u < 0.5 ? 2*u*u : 1 - Math.pow(-2*u+2,2)/2;
    fold(from + (to-from)*e);
    if(u < 1){ T.raf = requestAnimationFrame(step); return; }
    T.done();
  })(t0);
}
// Let a settling turn be cut short, so pages can be taken quickly one after
// another instead of each waiting on the last to finish.
function finishTurnNow(){
  var T = S.turning;
  if(T && T.anim && T.done){
    if(T.raf) cancelAnimationFrame(T.raf);
    T.done();
  }
}
function endTurn(commit){ settleTurn(commit); }
function turnBy(dir){
  if(!S.open) return;
  finishTurnNow();
  if(S.turning) return;
  if(!beginTurn(dir)) return;
  settleTurn(true);
}
// Frame the other page of the spread. A swipe slides across; a turn has
// already carried the eye, so that one lands without the slide.
function setFocus(f, slide){
  if(!G.single || S.focus === f) return;
  S.focus = f;
  if(slide){
    book.classList.add("is-shifting");
    setTimeout(function(){ book.classList.remove("is-shifting"); }, 360);
  }
  paint();
}
// One step forward or back: on a narrow screen that is one page, otherwise
// one spread.
function stepBy(dir){
  if(!S.open) return;
  if(!G.single){ turnBy(dir); return; }
  if(dir > 0 && S.focus === 0){ setFocus(1, true); return; }
  if(dir < 0 && S.focus === 1){ setFocus(0, true); return; }
  turnBy(dir);
}

/* ---------- opening and closing the covers ---------- */
function coverTransform(angle){
  var f = clamp(Math.abs(angle)/178, 0, 1);
  var z = 6 - f * (G.T + 12);
  return "translateZ(" + z.toFixed(1) + "px) rotateY(" + angle.toFixed(1) + "deg)";
}
function openBook(){
  if(S.open) return;
  S.coverAnim = true;
  var f = faces.front;
  f.style.transition = "transform .8s cubic-bezier(.32,.02,.2,1)";
  f.style.transform = coverTransform(-178);
  setTimeout(function(){ S.open = true; S.coverAnim = false; paint(); f.style.transition=""; }, 640);
  store("lwk3:open","1");
}
function closeBook(){
  if(!S.open) return;
  S.open = false; S.spread = 0; S.coverAnim = true;
  var f = faces.front;
  f.style.transition = "none";
  f.style.transform = coverTransform(-178);
  paint();
  requestAnimationFrame(function(){
    f.style.transition = "transform .8s cubic-bezier(.32,.02,.2,1)";
    f.style.transform = coverTransform(0);
    setTimeout(function(){ f.style.transition=""; S.coverAnim = false; }, 820);
  });
  store("lwk3:open","0");
}


/* Zoom towards a point rather than the middle of the screen. The camera sits
   at the centre and is transformed translate(pan) scale(s), so a point p on
   the book lands at centre + pan + s*p. Holding the point under the cursor
   still means pan' = d - (s'/s)(d - pan), where d is the cursor's offset from
   the centre. */
function stageCentre(){
  var r = stage.getBoundingClientRect();
  return [r.left + r.width/2, r.top + r.height/2];
}
function zoomAt(next, clientX, clientY){
  next = clamp(next, 0.4, 4);
  var c = stageCentre();
  var dx = clientX - c[0], dy = clientY - c[1];
  var k = next / S.zoom;
  S.panX = dx - k * (dx - S.panX);
  S.panY = dy - k * (dy - S.panY);
  S.zoom = next;
  applyView();
  store("lwk3:zoom", String(S.zoom));
}
function zoomCentre(next){
  var c = stageCentre();
  zoomAt(next, c[0] + S.panX, c[1] + S.panY);
}

/* ---------- pointer: orbit, corner drag, cover drag ---------- */
/* How far a finger has to travel to carry a page all the way over. It follows
   the spread as it appears on screen, but never asks for more than the screen
   can give: zoomed in, the book is wider than the window, and a turn that
   wanted half a spread of travel could not be finished at all. */
function dragSpan(){
  var onScreen = (2*G.pw*G.fit*S.zoom) || 600;
  var reach = Math.max(220, window.innerWidth * 0.45);
  return Math.max(90, Math.min(onScreen, reach));
}
/* Speed is measured over the last 90ms of the drag rather than the last
   event: browsers deliver moves in bursts, and two of them can carry the
   same timestamp. */
function trailSpeed(tr){
  var last = tr[tr.length-1], i = tr.length-1;
  while(i > 0 && last[1] - tr[i-1][1] < 90) i--;
  var dt = last[1] - tr[i][1];
  return dt > 0 ? (last[0] - tr[i][0])/dt : 0;
}
var drag = null;
stage.addEventListener("pointerdown", function(ev){
  if(ev.button && ev.button !== 1) return;
  if(ev.target.closest(".hud,.sheet,.edge,.edge-y")) return;
  stage.setPointerCapture(ev.pointerId);
  var onFront = !S.open && ev.target.closest(".board--front");
  if(S.turning && S.turning.anim) finishTurnNow();
  var onRibbon = ev.target.closest(".ribbon__band,.ribbon__tail");
  var onRecto = S.open && !onRibbon && ev.target.closest(".face--recto,.corner");
  var onVerso = S.open && ev.target.closest(".face--verso");
  var onPage = G.single && (onRecto || onVerso);
  var wantsPan = ev.shiftKey || ev.button === 1;
  drag = {x0:ev.clientX, y0:ev.clientY, rx:S.rx, ry:S.ry,
          trail:[[ev.clientX, performance.now()]], v:0,
          panX:S.panX, panY:S.panY,
          ribX: parseFloat(faces.ribbon.style.left) || 0,
          mode: wantsPan ? "pan" : onRibbon ? "ribbon"
              : onFront ? "cover" : onPage ? "page"
              : onRecto ? "fwd" : onVerso ? "back" : "orbit",
          started:false};
  stage.classList.add("is-grabbing");
  document.getElementById("hint").style.opacity = "0";
});
stage.addEventListener("pointermove", function(ev){
  if(!drag) return;
  var dx = ev.clientX - drag.x0, dy = ev.clientY - drag.y0;
  if(!drag.started && Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
  drag.started = true;
  // sideways speed at the moment of release, so a flick counts as a turn
  drag.trail.push([ev.clientX, performance.now()]);
  if(drag.trail.length > 12) drag.trail.shift();
  drag.v = trailSpeed(drag.trail);
  var span = dragSpan();
  if(drag.mode === "ribbon"){
    S.ribbonDrag = true;
    faces.ribbon.classList.add("is-dragging");
    var sc = (G.fit * S.zoom) || 1;
    var nx = clamp(drag.ribX + dx/sc, -G.pw + 4, G.pw - G.rw - 4);
    faces.ribbon.style.left = nx + "px";
  }else if(drag.mode === "pan"){
    S.panX = drag.panX + dx;
    S.panY = drag.panY + dy;
    applyView();
  }else if(drag.mode === "orbit"){
    S.ry = clamp(drag.ry + dx*0.32, -78, 78);
    S.rx = clamp(drag.rx - dy*0.26, -62, 62);
    applyView(); syncDials();
  }else if(drag.mode === "cover"){
    if(!S.turning && dx < -4){
      S.turning = {cover:true};
      S.coverAnim = true;
      faces.front.style.transition = "none";
    }
    if(S.turning && S.turning.cover){
      var a = -178*clamp(-dx/span,0,1);
      faces.front.style.transform = coverTransform(a);
      S.turning.angle = a;
    }
  }else if(drag.mode === "page"){
    // one page at a time: a swipe either slides across the spread or, when
    // there is nothing left to slide to, lifts the leaf
    drag.dx = dx;
    var want = dx < 0 ? 1 : -1;
    var lifts = want > 0 ? S.focus === 1 : S.focus === 0;
    if(lifts){
      if(!S.turning && Math.abs(dx) > 4) beginTurn(want);
      if(S.turning && !S.turning.cover && !S.turning.anim){
        fold(want > 0 ? (-dx/span) : (dx/span));
      }
    }
  }else{
    var dir = drag.mode === "fwd" ? 1 : -1;
    if(!S.turning){ if((dir>0 && dx<-4)||(dir<0 && dx>4)) beginTurn(dir); }
    if(S.turning && !S.turning.cover && !S.turning.anim){
      fold(dir > 0 ? (-dx/span) : (dx/span));
    }
  }
});
function releaseDrag(){
  if(!drag) return;
  stage.classList.remove("is-grabbing");
  if(S.turning && S.turning.cover){
    var a = S.turning.angle || 0;
    var threw = drag.v < -0.35;
    S.turning = null;
    faces.front.style.transition = "transform .55s cubic-bezier(.32,.02,.2,1)";
    if(Math.abs(a) > 55 || (threw && Math.abs(a) > 12)){
      faces.front.style.transform = coverTransform(-178);
      setTimeout(function(){ S.open = true; S.coverAnim = false; paint(); faces.front.style.transition=""; }, 470);
      store("lwk3:open","1");
    }else{
      faces.front.style.transform = coverTransform(0);
      setTimeout(function(){ S.coverAnim = false; }, 560);
    }
  }else if(S.turning){
    // a third of the way carries it, and so does a flick, however short
    var d = S.turning.dir;
    var flick = d > 0 ? drag.v < -0.35 : drag.v > 0.35;
    endTurn(S.turning.t > 0.34 || (flick && S.turning.t > 0.05));
  }else if(drag.mode === "page" && drag.started){
    var moved = drag.dx || 0;
    var quick = Math.abs(drag.v) > 0.35 && (drag.v < 0) === (moved < 0);
    if(Math.abs(moved) > dragSpan()*0.16 || quick) setFocus(moved < 0 ? 1 : 0, true);
  }else if(drag.mode === "ribbon"){
    faces.ribbon.classList.remove("is-dragging");
    if(drag.started && S.open){
      // it stays on whichever page you let go over
      var at = parseFloat(faces.ribbon.style.left) || 0;
      var side = (at + G.rw/2) < 0 ? 0 : 1;
      S.mark = S.spread*2 + side;
      store("lwk3:mark", String(S.mark));
    }else if(!drag.started){
      if(S.mark !== null && Math.floor(S.mark/2) !== S.spread) goToPage(S.mark);
      else if(S.mark === null && S.open){
        S.mark = S.spread*2 + 1;
        store("lwk3:mark", String(S.mark));
      }
    }
    S.ribbonDrag = false;
    paint();
  }else if(!drag.started && drag.mode === "cover"){
    openBook();
  }
  drag = null;
}
stage.addEventListener("pointerup", releaseDrag);
stage.addEventListener("pointercancel", releaseDrag);

stage.addEventListener("wheel", function(ev){
  ev.preventDefault();
  zoomAt(S.zoom * (ev.deltaY > 0 ? 0.9 : 1.1), ev.clientX, ev.clientY);
}, {passive:false});

// Pinch: scale about the midpoint of the two fingers, and let that midpoint
// carry the book with it, so two fingers both zoom and pan.
var pts = {}, pinch = null;
function midOf(a, b){ return [(a[0]+b[0])/2, (a[1]+b[1])/2]; }
stage.addEventListener("pointerdown", function(ev){
  pts[ev.pointerId] = [ev.clientX, ev.clientY];
});
stage.addEventListener("pointermove", function(ev){
  if(!(ev.pointerId in pts)) return;
  pts[ev.pointerId] = [ev.clientX, ev.clientY];
  var ids = Object.keys(pts);
  if(ids.length !== 2){ pinch = null; return; }
  drag = null;
  var a = pts[ids[0]], b = pts[ids[1]];
  var dist = Math.hypot(a[0]-b[0], a[1]-b[1]);
  var mid = midOf(a, b);
  if(!pinch){
    pinch = {dist:dist, zoom:S.zoom, mid:mid, pan:[S.panX, S.panY], c:stageCentre()};
    return;
  }
  var next = clamp(pinch.zoom * (dist / pinch.dist), 0.4, 4);
  var k = next / pinch.zoom;
  var d0x = pinch.mid[0] - pinch.c[0], d0y = pinch.mid[1] - pinch.c[1];
  S.panX = (mid[0] - pinch.c[0]) - k * (d0x - pinch.pan[0]);
  S.panY = (mid[1] - pinch.c[1]) - k * (d0y - pinch.pan[1]);
  S.zoom = next;
  applyView();
  store("lwk3:zoom", String(S.zoom));
});
function dropPt(ev){
  delete pts[ev.pointerId];
  if(Object.keys(pts).length < 2) pinch = null;
}
stage.addEventListener("pointerup", dropPt);
stage.addEventListener("pointercancel", dropPt);

/* ---------- controls ---------- */
var dialX = document.getElementById("dial-x");   // bottom edge: turns the book
var dialY = document.getElementById("dial-y");   // right edge: tilts the book
var edgeRead = document.getElementById("edge-read");
var readTimer;

function sizeEdges(){
  var wrap = document.querySelector(".edge-y");
  if(wrap) dialY.style.width = wrap.clientHeight + "px";
}
function syncDials(){
  dialX.value = Math.round(S.ry);
  // the vertical slider reads upward, and looking from higher up is a more
  // negative rotateX, so it carries the opposite sign
  dialY.value = Math.round(-S.rx);
}
function flashRead(text){
  edgeRead.textContent = text;
  edgeRead.classList.add("is-live");
  clearTimeout(readTimer);
  readTimer = setTimeout(function(){ edgeRead.classList.remove("is-live"); }, 900);
}
function liveEdge(el){
  el.classList.add("is-live");
  clearTimeout(el.__t);
  el.__t = setTimeout(function(){ el.classList.remove("is-live"); }, 900);
}
dialX.addEventListener("input", function(){
  S.ry = clamp(parseFloat(dialX.value), -78, 78);
  applyView(); liveEdge(dialX); flashRead("X " + Math.round(S.ry) + "\u00b0");
});
dialY.addEventListener("input", function(){
  S.rx = clamp(-parseFloat(dialY.value), -62, 62);
  applyView(); liveEdge(dialY); flashRead("Y " + Math.round(-S.rx) + "\u00b0");
});

document.getElementById("btn-in").onclick = function(){ zoomCentre(S.zoom*1.2); };
document.getElementById("btn-out").onclick = function(){ zoomCentre(S.zoom/1.2); };
document.getElementById("btn-reset").onclick = function(){
  S.rx=-14; S.ry=0; S.zoom=1; S.panX=0; S.panY=0;
  syncDials();
  book.classList.add("is-settling");
  camera.style.transition = "transform .5s cubic-bezier(.3,.02,.2,1)";
  applyView();
  setTimeout(function(){ camera.style.transition = ""; }, 520);
  setTimeout(function(){ book.classList.remove("is-settling"); }, 520);
};
document.getElementById("btn-close").onclick = closeBook;

function sheet(id,on){ document.getElementById(id).dataset.open = on ? "true" : "false"; }
document.getElementById("btn-contents").onclick = function(){ sheet("sheet-contents",true); };
document.getElementById("btn-search").onclick = function(){
  sheet("sheet-search",true); setTimeout(function(){ document.getElementById("q").focus(); },60);
};
document.querySelectorAll("[data-close]").forEach(function(b){
  b.onclick = function(){ sheet("sheet-contents",false); sheet("sheet-search",false); };
});

function goToPage(idx){
  S.spread = clamp(Math.floor(idx/2), 0, Math.max(0,Math.ceil(S.pages/2)-1));
  S.focus = idx % 2;
  if(!S.open){ S.open = true; faces.front.style.transform = coverTransform(-178); }
  paint();
  sheet("sheet-contents",false); sheet("sheet-search",false);
}

(function buildToc(){
  var byPart=[], seen={};
  BOOK.chapters.forEach(function(ch){
    if(!seen[ch.part]){ seen[ch.part]={roman:ch.partRoman,name:ch.partName,chs:[]}; byPart.push(seen[ch.part]); }
    seen[ch.part].chs.push(ch);
  });
  document.getElementById("toc").innerHTML =
    '<button class="toc-row" data-page-id="c-intro"><span class="n">·</span>'+
    '<span class="t">'+esc(BOOK.introTitle)+'</span></button>' +
    byPart.map(function(p){
      return '<div class="toc-part"><h4><b>Part '+p.roman+'</b> · '+esc(p.name)+'</h4>'+
        p.chs.map(function(c){
          return '<button class="toc-row" data-page-id="c'+c.n+'"><span class="n">'+c.n+
            '</span><span class="t">'+esc(c.title)+'</span><span class="p" data-p="c'+c.n+'"></span></button>';
        }).join("")+"</div>";
    }).join("") +
    '<button class="toc-row" data-page-id="c-note"><span class="n">·</span>'+
    '<span class="t">'+esc(BOOK.noteTitle)+'</span></button>'+
    '<button class="toc-row" data-page-id="c-index"><span class="n">·</span>'+
    '<span class="t">'+esc(BOOK.indexTitle)+'</span></button>';
})();

document.addEventListener("click", function(ev){
  var row = ev.target.closest("[data-page-id]");
  if(row && starts[row.dataset.pageId] !== undefined) goToPage(starts[row.dataset.pageId]);
  var hit = ev.target.closest("[data-entry]");
  if(hit){
    var probe = faces.recto.querySelector(".face__flow");
    var node = probe.querySelector("#e"+hit.dataset.entry);
    if(node) goToPage(pageOf(node));
  }
});

var qt;
document.getElementById("q").addEventListener("input", function(e){
  clearTimeout(qt);
  var v = e.target.value.trim();
  qt = setTimeout(function(){
    var box = document.getElementById("results");
    if(v.length < 2){ box.innerHTML=""; return; }
    var t = v.toLowerCase();
    var hits = ALL.filter(function(x){
      return (x.quote+" "+x.attribution+" "+x.means+" "+x.use+" "+x.chTitle).toLowerCase().indexOf(t) !== -1;
    });
    box.innerHTML = hits.length ? hits.map(function(x){
      var q = esc(x.quote);
      if(!/[&<>"]/.test(v)) q = q.replace(new RegExp("("+v.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>");
      return '<button class="res" data-entry="'+x.n+'"><div class="q">\u201C'+q+'\u201D</div>'+
        '<div class="m">'+pad(x.n)+' · '+esc(x.attribution)+' · ch '+x.ch+'</div></button>';
    }).join("") : '<p class="empty">Nothing here. Try a plainer word.</p>';
  }, 160);
});

document.addEventListener("keydown", function(ev){
  if(ev.target.tagName === "INPUT") { if(ev.key==="Escape") ev.target.blur(); return; }
  if(ev.key === "ArrowRight") stepBy(1);
  else if(ev.key === "ArrowLeft") stepBy(-1);
  else if(ev.key === "Escape"){ sheet("sheet-contents",false); sheet("sheet-search",false); }
  else if(ev.key === "+" || ev.key === "="){ zoomCentre(S.zoom*1.2); }
  else if(ev.key === "-"){ zoomCentre(S.zoom/1.2); }
});

var rt;
window.addEventListener("resize", function(){
  clearTimeout(rt); rt = setTimeout(function(){ fitView(); sizeEdges(); syncDials(); }, 120);
});

S.zoom = clamp(parseFloat(recall("lwk3:zoom")||"1") || 1, 0.4, 4);
S.spread = parseInt(recall("lwk3:spread")||"0",10) || 0;
S.focus  = parseInt(recall("lwk3:focus")||"0",10) ? 1 : 0;
var savedMark = recall("lwk3:mark");
S.mark = (savedMark === null || savedMark === "null") ? null : (parseInt(savedMark,10) || 0);
layout();
sizeEdges();
syncDials();
var deep = (location.hash.match(/^#p(\d+)$/) || [])[1];
if(deep){
  S.open = true;
  S.spread = clamp(Math.floor((parseInt(deep,10)-1)/2), 0, Math.max(0,Math.ceil(S.pages/2)-1));
  S.focus = (parseInt(deep,10)-1) % 2;
  faces.front.style.transform = coverTransform(-178);
  paint();
}else if(recall("lwk3:open") === "1"){
  S.open = true;
  faces.front.style.transform = coverTransform(-178);
  paint();
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ layout(); });
})();
</script>
