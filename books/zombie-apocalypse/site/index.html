ty, poacher, day 88","means":"It is the most unpleasant rule in this book and it is sound. A street with bodies in it reads, at a hundred yards, as a street that has already been done. The thing you most want in the second year is to be uninteresting to people. It does more than that. The smell covers yours, which matters, because smell is how they sort each other out. Doherty lived a whole winter on a terrace that four separate groups walked past, and one of them stopped at the end of it, and looked, and went the other way.","use":"Rats came, and then everything rats bring, and by the second August the flies were a serious medical problem and two of his household had something they could not shake. There is also what it does to people to live in it, which he does not write about and which the people who were there do. And once, on his own doorstep in the second March, one of them was not a body. It had been lying in the same position for eleven days in the cold, doing nothing, because in the cold that is what they do, and it stood up when the thaw came. Cold ones are not dead ones. If you are going to use this rule, you put a spike through every head on your street. You do it in the frost, when it is safe to. And you write down how many there are.","ch":4},{"n":42,"quote":"The smoke, not the flame.","bare":false,"attribution":"Duncan Ferrier, gamekeeper, day 60","means":"Everybody worries about the fire being seen and hardly anybody does the arithmetic on the smoke. At night a flame in a window is visible for two or three miles and you can cover a window. By day a column of smoke off a wet fire is visible for eight or nine, and you can cover nothing. In the first winter you could stand on the ridge above here at ten in the morning. And count the households. Ferrier's method is the one the estates used for a century. Burn dry hardwood. Burn it hot and small. Burn in the middle of the day, when the sky is already grey and the air is turbulent. Put it under a long cold flue that breaks the column up.","use":"It gives you one hot meal a day, at a time chosen by the weather. It is very hard to run a household of children on a fire that is only lit under cloud. The second failure is the one that got him. His flue trick works because moving air pulls the plume apart. On the still bright morning of the fourth of December there was no moving air at all. The smoke went up out of that chimney in a rope you could see from Otley. He had used the same fire for a hundred days. Weather is not a background condition. It is a member of the household, and it gets a vote every morning.","ch":4},{"n":43,"quote":"The best wall is a bad approach.","bare":false,"attribution":"Maggie Lunt, hill farmer, day 120","means":"You cannot build a wall. Be honest about the labour. A family, in a fortnight, with hand tools, cannot build anything that will hold against a serious push. Every hour spent on it is an hour not spent on the store and the crop. What you can do is choose ground where the approach does the work for free. A single track with a drop on one side. A spur with water on two. A slope steep enough that anything coming up it is slow and in the open and visible for four minutes. Lunt's place has one way in, uphill, in view of the house for three hundred yards, and she has never had to defend it because nothing has ever got near it unseen.","use":"A bad approach is bad in both directions. Everything she owns has come up that track on her back or on a pony. In the second winter the snow filled the cut, and nothing came up or down it for five weeks. There was a woman in that house who needed a doctor. And good ground is legible to anybody who reads ground. Twice in these notebooks a settlement has been found by people with rifles, because the terrain around it was the terrain anybody would choose. That is a strange and specific way to be caught. It has happened more than once.","ch":4},{"n":44,"quote":"It is a house. Leave it.","bare":false,"attribution":"Bea Winslow, retired postmistress, day 31","means":"She spent thirty days making a house in Norfolk safe, and it was good work. On the thirty-first she put four things in a bag, walked out of it and never went back. The water had gone bad and she could count. That is the whole content of the rule and it is the hardest sentence in this chapter to actually perform. A shelter you have worked on becomes a thing you are unwilling to lose, and the unwillingness arrives quietly and dressed as sense. By the time it is obvious, you are a person arguing that the water is probably fine. Everything you built was to keep you alive. When it stops doing that, it is timber.","use":"Leaving is a real cost and not a free move. There is a kind of person who reads this rule and becomes unable to commit to anything, and drifts for three years accumulating nothing, and is thin. Winslow left one house in four years and settled the second time. The rule is not walk away easily. It is that the walking away must remain possible. The bag stays packed. The two exits stay clear. And the decision gets made on the evidence rather than on the labour already spent. She keeps the key to the Norfolk house on a string. She has never suggested going back for it.","ch":4}]},{"n":5,"title":"Noise","part":"Two","partRoman":"II","partName":"The Body and the Building","opening":"<p>Everybody learns in the first week that noise brings them, and then spends three years being wrong about which noise.</p><p>The wrongness is specific and it is worth an entire chapter, because the mistake runs the same way every time: people are frightened of the sounds that are loud where they are standing, and the sounds that travel are not those. A dropped spanner on a stone floor is startling and it is a sharp, high, short sound, and high sounds are eaten by air, hedges, walls and the ground itself, and forty yards away it is not there at all. A small generator is boring and you stop hearing it in ten minutes. It is low, and low sounds bend round buildings instead of stopping at them. It goes on for six hours. It is audible across a mile of this valley to anything with ears. One of those two sounds has emptied a village. It is not the spanner.</p><p>Three facts will do most of your thinking for you. Sound loses six decibels every time the distance doubles, which sounds severe and is much less severe than people expect over the first few hundred yards. High frequencies die faster than low ones, so what reaches a listener at a distance is never the sound you made. It is the bottom half of it. Not the words but the shape of a voice. Not the chop but the thud. And on a clear still night the air a few feet up is warmer than the air at the ground. That bends sound back down instead of letting it escape. The same noise made at two in the morning goes two or three times as far as it did at noon. That last one killed people for a year before anybody wrote it down.</p><p>The rest of the chapter is technique. But I want the argument of it stated here, because eight of these eleven entries pull towards silence and the last two pull hard the other way, and the last two are right. Absolute quiet is not a survival strategy. It is a thing a group can hold for about five months. After that it has produced nothing, built nothing, warned nobody and stopped speaking to itself. I have opened up two houses where everybody inside was thin, mute and still following the rule.</p>","entries":[{"n":45,"quote":"Low and long carries. Sharp and short does not.","bare":false,"attribution":"Femi Adeyemi, live sound engineer, day 35","means":"He had spent eleven years putting sound into rooms and knew, without having to reason about it, which parts of a noise survive a journey. Air absorbs the top end. Foliage absorbs the top end. A brick wall stops the top end and lets the bottom walk round the corner. So the practical ranking is not by how loud a thing is in your hand. It is a generator, a diesel engine, a pump, a big steady voice, a hammer on wood, an axe. And then a very long way down, everything sharp and small that people are afraid of. Adeyemi ranked the household's noises on a sheet of paper in the second month, and the sheet is still pinned up in three settlements I know of.","use":"Distance is one axis and novelty is the other, and he built his method on the first and forgot the second. What turns a head near you is not the loudest thing, it is the thing that was not there a second ago. A steady hum becomes background inside a minute, to them as much as to you, and a single tap in a silent street at four in the morning is the most attention-getting sound a human being can make. He was killed by neither, as it happens. He was killed on the ridge above Bramley by a piece of corrugated sheet that he stood on, which is short, sharp, and was the only sound in a quarter of a mile.","ch":5},{"n":46,"quote":"Shoes at the door, felt on everything, cloth in the cutlery drawer.","bare":false,"attribution":"Bea Winslow, retired postmistress, day 90","means":"A house makes a sound whether anybody is being careful or not, and it is made of about thirty things: two hinges, a latch, four floorboards, a stair tread, a bucket handle, a kettle lid, the drawer. Winslow's method was to find all thirty in one afternoon and fix them, because a fault you have fixed costs nothing thereafter and a fault you are being careful about costs attention every hour of every day for four years. Grease on the hinges, felt under the bucket, a strip of blanket over the drawer runners, and a nail through the loose tread. After that the household can move normally, which is the entire point and the part people miss.","use":"A silent house is a house you cannot hear anybody moving in, including somebody who is not supposed to be there. Winslow's second household had a man walk the length of the ground floor and out again with most of a week's food. Four people were awake upstairs. She now leaves one board loose on purpose, at the bottom of the stairs, and everybody knows which. The other cost is speed. People who have been trained out of noise move slowly at exactly the moments when they should be moving fast. There is at least one death in these notebooks that comes down to a woman closing a door quietly instead of running through it.","ch":5},{"n":47,"quote":"Loud work in the rain.","bare":false,"attribution":"Erin Mackay, fisherwoman, day 50","means":"Rain on leaves and roofs is broadband noise across the whole range, which is the only thing that masks properly, and hard rain will take twenty feet of chopping and reduce it to something you cannot pick out at a hundred. Wind in trees does the same job less reliably. A river does it all the time in one place, which is why the mills were always the noisiest buildings in England. Mackay ran a rule that any job involving an axe, a hammer, a saw or a scream waited for weather, and she got her boat repaired, her shed built and two winters of firewood done in the rain.","use":"Masking works both ways and there is no version where it does not. You cannot hear them either, and you cannot hear a person, and hard rain takes your eyes down to about sixty yards as well. She lost a man off the staithe at Paull in the second October to something that walked up behind him in weather that was doing exactly what she had planned for it to do. Rain is also when everything is slippery and cold and your hands are bad. Do the loud work in the rain. Put somebody on the corner who is doing nothing but looking, and rotate them, because looking at nothing in the rain for an hour is harder than the work.","ch":5},{"n":48,"quote":"Two taps come here. Three taps run. There is nothing else.","bare":false,"attribution":"Rosa Kaminski, schoolteacher, day 100","means":"Whatever signalling system you design, the version that gets used is the version people can perform while frightened, and that is a very short list. Two signals is a list people can perform. Kaminski had watched twenty-two years of children under drill conditions and she knew that the vocabulary shrinks to nothing under stress, so she built for the worst state rather than the calm one. Tapping also has the right acoustics, which she did not know and got right by accident: a knuckle on wood is mid-range and directional and it does not carry past the building.","use":"A vocabulary of two cannot say the thing that most needs saying. There is no signal in that system for I am hurt and I am not in danger. On the eleventh of March in the second year a boy called Aaron Petch tapped three, which means run, because it was the only thing he had. The household ran. He had a broken leg under a fallen gate two hundred yards away, and they were a mile off before anybody worked it out. He was alive when they came back the next morning and he was not there. Add a third signal. Add only one, and make it mean come slowly and bring the bag.","ch":5},{"n":49,"quote":"Never shout a name.","bare":false,"attribution":"Priya Raghunathan, A&E nurse, day 120","means":"A human voice calling a name is the most effective recruiting sound there is and it beats a gunshot, which surprises people. A shot is one event, over in a fifth of a second, and half a mile away it is a thing that might have been a door. A name is a voice, pitched where voices are pitched, repeated, getting louder each time because you are getting more frightened, going on for a minute or more. It says a person is here, it says where, and it says that person is distressed and stationary. Raghunathan had watched it happen twice in a hospital car park and never shouted again.","use":"A rule against calling out is a rule against calling for help, and it does not distinguish. Her own group carried it too far and got quiet about everything. A woman named Ruth Colley went into a flooded cellar on Barkerend Road after a dropped box and was in there for two days. There were four people in the house above her. They had all heard something, and had all decided on their own not to shout. Nobody in these notebooks ever mentions this. It is the failure of the good pupils. Take the rule as written for open ground, and hang the opposite of it on the inside of the door: in this building we call out, and we call out early, and we do not wait to be sure.","ch":5},{"n":50,"quote":"The generator runs one hour a week.","bare":false,"attribution":"Jonah Kite, radio operator, day 130","means":"A small petrol set is around sixty-five decibels of low-frequency noise at a couple of yards, which is not much, and it is unbroken, and unbroken is what does the damage. Everything within a mile that can hear it has all afternoon to walk towards it, and unlike a bang, it does not stop and let them lose interest. Kite worked out in the first autumn that his set was not attracting things from a distance, it was accumulating them over days, and the crowd at the bottom of the lane was the sum of a fortnight of Wednesdays. One hour a week, in daylight, in wind, with the set in a pit under a straw bale.","use":"Rationing the power rationed the listening, and the listening was the entire point of the machine. He was off the air for the six days that mattered most in the second year and heard the news about the Bradford road eleven days after everybody else. The bigger failure was the schedule. One hour a week is one hour a week at the same time, because that is what a schedule is. By the third summer there was a man who knew when Kite's set ran, and he had told other people. They came on a Wednesday. A ration is right. Roll the day and the hour every week, and take the small cost of being unpredictable to your friends as well.","ch":5},{"n":51,"quote":"If you want a street quiet, make a noise in the next one.","bare":false,"attribution":"Idris Pyle, day 100","means":"They follow sound and they keep following it while it lasts, and they do not check whether the sound is a person. A wind-up alarm clock in the footwell of a car with the window down will run for twenty minutes and hold a drift's attention for an afternoon. Once the front of a crowd is moving, the back of it follows the front. No clock is needed after that. It is the cheapest tactic in this book. Pyle used it to empty the whole of a shopping parade at Hunslet, twice, and walked in behind them with a wheelbarrow, and there is no arguing with the results.","use":"You have not removed a crowd. You have aimed it. Whatever comes to the clock is now two streets from where it was, in a place you chose and did not look at first. On the second occasion the parade Pyle emptied was three hundred yards from the almshouses on Church Street. There were eleven people in there who had been getting away with it since the first spring. Six of them. He is the only person in this book who has written down a thing of that kind about himself, which is a point in his favour and is not very many points. Look at where the noise is going. It is going to somebody.","ch":5},{"n":52,"quote":"Muffle the dog. Do not get rid of the dog.","bare":false,"attribution":"Duncan Ferrier, gamekeeper, day 140","means":"A dog is the best perimeter anybody has and nothing built out of wire and tins comes close. It smells them at two hundred yards, upwind and in the dark, and it knows the difference between a fox and a man, which no bell has ever managed. The problem is only the barking, and barking is trainable, and Ferrier had trained working dogs for twenty years. What he taught was a silent alert: the dog comes to you, presses its head against your leg, and holds. Two of the settlements up the valley run his dogs' grandchildren and neither has been surprised in two years.","use":"That training takes a calm handler, a hundred repetitions and about four months, and almost nobody in the first year had any of the three. What most people had was an ordinary frightened family dog, which barks, and a rule from a gamekeeper saying keep the dog. There are at least four households in these notebooks that were found because of a dog they had been told not to get rid of. A dog costs about the food of a small adult, every day, all year. Keep the dog if you can train it or it is already trained. Otherwise you are keeping an alarm that goes off at the wrong things and eats.","ch":5},{"n":53,"quote":"Nothing is answered after dark.","bare":false,"attribution":"Fen Doherty, poacher, day 160","means":"At night the air above the ground is warmer than the ground, and that bends sound downward and keeps it travelling, so a voice at two in the morning reaches two or three times as far as the same voice at noon. That is the physics, and the human consequence is that anybody calling in the dark has chosen the ground, knows you cannot see, and has the whole night to work with. Doherty's household answered nothing between dusk and light for three years, on any pretext, and were never once robbed, and he is a man who had a great deal worth taking.","use":"Real people call at night, because night is when things go wrong. A boy walked up the Elland Road side of the estate in the second February calling for anybody, for about forty minutes, in a hard frost. Eleven households heard him and every single one of them had this rule. He was found in the morning between two cars. There is no version of this where everybody follows the rule and that boy lives. The revision people have arrived at up here has three parts. You do not answer with your voice. You do not open your door. You put a light in a window that means come to the light at dawn, and somebody watches the light all night. It is not much. It would have been enough for him.","ch":5},{"n":54,"quote":"Silence is a season. It is not a rule.","bare":false,"attribution":"Femi Adeyemi, live sound engineer, day 300","means":"This is the correction to his own first entry and to most of this chapter. A household needs to chop, build, hammer, dig, argue and sing. If all of that is forbidden then none of it happens. A group that does none of it for a year has no fuel, no repairs and no way of being a group. So you budget noise instead of banning it, and you spend the budget when it is cheapest, and in this country that means the frost. Below freezing they are standing still. Wind and rain mask. Winter is when you take the roof off and put a new one on, and there is a rhythm to the year up here now that comes directly out of this sentence.","use":"A budget with permission in it gets spent, and then gets spent again, and the drift is invisible from inside. Adeyemi's own settlement went from an axe in a January frost to a forge running in October in about eighteen months, one reasonable decision at a time, with nobody at any point doing anything indefensible. That is how it always goes. Somebody has to hold the number, out loud, and be unpopular. Adeyemi's note is that the person holding it should not be the person who decides what the work is. Those two jobs in one head is how the number moves.","ch":5},{"n":55,"quote":"Make some noise.","bare":false,"attribution":"Solomon Quaye, barber, day 1,100","means":"Quaye cut hair on Peckham High Street for nineteen years and his position is that a settlement of people who have whispered for four years is not a settlement, it is forty individuals standing near each other. Sound is most of how people are together. Singing, arguing across a yard, a child shouting, the noise of a room where something is being made. He started a Sunday in the frost where the rule is suspended for three hours between the wall and the barn: instruments, talking at a normal volume, and a haircut. Attendance is total. Two of the four settlements up this valley have copied it and both of them report the same thing, which is that people stopped leaving.","use":"It was quiet for a reason and the reason has not gone anywhere. A settlement at Guiseley took up a version of this in the second year, without the frost condition and without the walls. They were found in the autumn by people, not by them. There are nine of them left out of thirty-one. Quaye's rule has three conditions on it and they are all load-bearing: hard ground, hard frost, and a wall you have walked yourself that week. He has never once suspended it for a wedding in June, and he has been asked, and the asking is the hardest part of the job.","ch":5}]},{"n":6,"title":"Water, Food, and Teeth","part":"Two","partRoman":"II","partName":"The Body and the Building","opening":"<p>Nobody wants this chapter. It is the one people skip and it is the one that would have saved the most of them.</p><p>Go through eleven hundred notebooks and count what is written on the last page that anybody wrote, and a picture comes out that nobody in the first year would have believed. After the first winter, the things killing people in this county are these, in order. Cold, dirty water, teeth and jaws, wounds that were not cleaned, other people. And then, a long way down, them. That order has held for three years. There is a whole literature in these papers about how to put a spike through a skull. There are four pages in total about how to keep your mouth from killing you. The skulls are not what is in the graves.</p><p>The reason is simple enough. Every one of us came out of a world where water arrived clean, food arrived safe, waste went away and a bad tooth was an appointment. None of those were skills. They were services. They went in a fortnight. What replaced them was a set of jobs that are dull, daily, unforgiving and completely unglamorous. Nobody has ever once been thanked for doing them properly. They will not tolerate being done four days out of five. A well dug in the wrong place does not fail dramatically. It fails in August, to everybody, at once.</p><p>The last four entries in this chapter are about wounds and about bites, and I have put them here rather than in a chapter of their own for a reason. A bite is a medical event. It is not a moral one, it is not a supernatural one, and it is not the beginning of a story. It is a wound with a known course, a known timescale and a known outcome. Treating it as anything else is how families end up doing things in barns that they cannot afterwards live with. Read those four cold. They were written cold, by people who had done it more than once, and two of them are the most careful writing in this book.</p>","entries":[{"n":56,"quote":"Boil it. If you did not watch it boil, boil it.","bare":false,"attribution":"Gwen Prydderch, water engineer, day 70","means":"A minute at a rolling boil finishes everything biological that this country has to offer, and biological is what kills you. All the dysentery in these notebooks. The thing that went through the Kirkstall camp in the second July and took nineteen people in nine days. Prydderch's second sentence is the one that matters. Water that somebody says is boiled is not boiled. The failures are all social rather than technical. The person who let it off at a simmer was tired and it was late and it looked like it was going. She ran one pot, one fire, one named person a day, and that household has not had a case in three years.","use":"Boiling is expensive and it fixes only one of the two problems. It costs wood, which costs cutting, which is noise and exposure, and a household of six needs eighteen litres a day and that is a real fire every day forever. It does nothing to what came out of the works at Knostrop, or off the fields, or out of a tank with a dead pigeon and four years of lead in it. And boiled water in a warm store is fine for two days and is not sterile after that. It goes back to being ordinary water the moment it is standing in a bucket in a kitchen. Boil it, cover it, and use it inside two days.","ch":6},{"n":57,"quote":"The latrine goes downhill of the water and further away than you want it.","bare":false,"attribution":"Ivy Okonjo, midwife, day 45","means":"Thirty yards and downhill of anything you drink, and that number is not a superstition, it is roughly how far it takes ordinary ground to do the filtering. Everything Prydderch's entry is about gets into the water at this one point. The camps that failed in the first two years failed here more than anywhere else. They failed within about six weeks of setting up, every time, in the same way. Okonjo had delivered babies in places with no plumbing. She knew that the whole of public health, when you take the pipes away, is one hole in the right place and a rule about hands.","use":"A latrine thirty yards away is not used at three in the morning in February by a woman with dysentery. That is not a failure of character. It is arithmetic about a person who is ill in the dark and cold. What happens instead is behind the shed, ten feet from the door, which is worse than having no rule at all because nobody is admitting to it. Okonjo's own correction took her a year to write down. The rule has two halves and everybody publishes the first. The hole goes thirty yards downhill, and a covered bucket goes by the door. The bucket is emptied into the hole by whoever is up first, and nobody is ever asked about it.","ch":6},{"n":58,"quote":"Perishables first. The tins are for February.","bare":false,"attribution":"Rob Hatherleigh, logistics corporal, day 20","means":"It is the order every quartermaster has used and it is right for the reason that is easy to miss. You are not choosing what to eat. You are choosing what to throw away. Anything with a short life is either eaten now or lost entirely, and a tin loses nothing by waiting a year. So the fresh goes first, then the dry, then the tinned, and the shape of the store you end up with in January is the shape you would have designed. Hatherleigh's depot came out of the first winter with four months in hand when three groups within five miles were eating candles.","use":"It assumes there is a February and that you are in it. Two households in these papers ate to a plan for a spring they did not reach, and left stores behind them that other people are eating now. That is not the worst outcome in the book. It is not what they were planning. The subtler failure is what it does to the autumn. Heavy work happens in September and October. The plan has you eating the thin end of the perishables then, and the good tinned fat in February when you are sitting still. That is backwards for the body doing the work. Feed the season you are in. Move about a fortnight of the good food forwards into the digging.","ch":6},{"n":59,"quote":"Salt, fat, and something green.","bare":false,"attribution":"Ade Lawal, chef, day 60","means":"These are the three things a scavenged diet lacks and each one kills differently. Without fat you can eat rabbit until your jaw aches and starve doing it, which happened to at least two people in these notebooks and which reads like nonsense until you understand it. Without salt you cannot work in July and cannot keep anything through October. Without something green you have about three months before your gums go and your old wounds open. There were people in the second March who thought they had been bitten and had scurvy. Lawal knew every one of these from the trade and he wrote the rule so that a person who could not cook could still eat correctly.","use":"Something green in February costs more than it returns. Going out for four hours in the cold for a handful of nettles that are not there yet is a bad trade in calories and a worse one in exposure. The answer is not the winter forage. It is the autumn one, dried and hung. His own household's failure was different and it is a professional's failure. He had them cooking, beautifully, every day, and not preserving. They came out of the second autumn with the best food anybody had eaten in a year, and eleven weeks of store where they should have had twenty.","ch":6},{"n":60,"quote":"Plant more than you can eat and less than you can weed.","bare":false,"attribution":"Maggie Lunt, hill farmer, day 200","means":"Everybody who has never grown anything believes the constraint is seed and it is not, it is labour in June. A plot that is twice what you can keep on top of does not give you twice the food. It gives you a field of weeds with some potatoes in it, and it takes the same ground and the same water. Lunt's rule sets the size by the bottleneck rather than by the ambition. The households up this valley that took it seriously are the ones with a store. The ones that dug up half a hillside in the first optimistic April fed the rabbits.","use":"A crop is a fixed asset and a beacon. It is visible from a distance, it cannot be moved, it announces the number of people it is meant to feed, and it ripens on a date that anybody watching can also read. Two settlements in these notebooks were robbed at exactly the right week by people who had done nothing all year but wait. Then there is the ordinary agricultural disaster. She went into the second year on potatoes, because potatoes are the calories, and the blight came through in August. She has planted four things every year since and expects to lose one of them.","ch":6},{"n":61,"quote":"Learn one animal properly.","bare":false,"attribution":"Isaac Bramall, beekeeper, day 40","means":"A person who half knows chickens, rabbits, goats and bees has four things that will die on him and no idea which. A person who knows one, in detail, through a full year, has a thing that produces food without being hunted for. It turns grass or scraps or flowers into calories while he is asleep. Bramall had kept bees for thirty years and got honey, wax for light, and a swarm to trade, out of hives he did not have to feed at all. The knowledge is the asset. Everybody can acquire the animal.","use":"One animal is one bad winter away from nothing, and his was the second one. He lost every colony he had between December and February, to cold and to a mite he had no treatment for. A man who has spent two years being the person with the bees turns out to have no second thing. And no time to learn one at fifty-eight. He is alive because his neighbours fed him through a spring. Know one animal properly. Then spend one afternoon a month being an amateur at a second, and be content to be bad at it. Bad at two is the position Bramall would have wanted in that February.","ch":6},{"n":62,"quote":"A tooth will kill you sooner than a bite.","bare":false,"attribution":"Marta Kowal, hairdresser, day 240","means":"Count them in the notebooks. After the cold and the water, the next thing on the list is jaws, and it is a long way ahead of anything with teeth of its own. An abscess in a lower molar has a short road into the floor of the mouth and the neck. From there it is days. There is no surgeon and no antibiotic worth the name in this county. The diet does not help: nothing sweet any more, which people think saves them, but everything is gritty and acid and hard, and enamel goes. Kowal's regime is a rag, salt and two minutes, every night, for everybody, forever, and she checks mouths on the first Sunday of the month like a schoolteacher.","use":"She began pulling teeth in the second summer because there was nobody else, and she is a hairdresser, and she says so on the page in a way I have not softened. Eleven extractions. Three went badly, one of those very badly, and a woman who had a treatable abscess in March had a broken root and a worse infection in April. The rule also drives people towards the pliers too early, because a rule that says teeth kill makes every ache an emergency. Clean the mouth every day and you will not need the pliers. That is the entry. The pulling is not the technique, it is the confession of the technique having failed.","ch":6},{"n":63,"quote":"Six days, in a room with a door that opens from the outside.","bare":false,"attribution":"Yusuf Errai, veterinary surgeon, day 75","means":"Turning takes between four hours and nine days and the spread is not random. It goes with body mass and with how much got in. A small child bitten badly is hours. A heavy man with a graze is most of a week. That is the whole of the science and it is enough to act on. Errai's protocol is the one that has held up. The bitten person goes in a room alone, with water, with light, with the door bolted on the outside and a hatch. Somebody sits with them and talks to them through it. Nobody is tied up. The last part is not sentiment. Restraint has killed people in these papers who were never infected at all, of thirst, of cold, and once of a fire.","use":"Six is not nine. He chose six because six covers most cases and because a household cannot hold a room and a watcher for nine days. He has written, twice, that this was a compromise with the labour available and not a finding. Two people in these notebooks came out of that room on the sixth day and turned on the seventh, and one of those took three others with him. And the protocol is unbearable in a way that no writing conveys. It is a rule for a stranger. Almost nobody has ever managed to perform it on their own child, and I am not going to pretend the failure rate there is anything other than total.","ch":6},{"n":64,"quote":"Cut it off.","bare":false,"attribution":"Priya Raghunathan, A&E nurse, day 88","means":"It is in the book because it works sometimes and because a rumour that it never works has cost lives. There are eleven amputations in these notebooks, all of them below a knee or an elbow, all within a few minutes of the bite. Three of those people are alive and none of the three turned. The reasoning is that it does not travel instantly and a limb removed above the wound at speed can take the whole of it. That is the entire basis. It is thinner than anybody would like. Raghunathan wrote it out as a procedure, with a tourniquet, a time and an order of operations. If it is going to be done at all, it will be done by somebody who is not a nurse.","use":"Eight of the eleven died. They died of blood loss and of shock and, two of them, of the wound going bad a fortnight later in a house with no way of stopping it. Worse than that number is what sits behind it. At least two of the eight were bitten through a coat and a shirt, and there is a real chance neither of them was ever infected. They had a leg taken off in a kitchen on a maybe. Nobody can tell in the first two minutes whether skin was broken, and the first two minutes is the entire window. Raghunathan's own note is the honest one and I will not improve on it. This is a procedure with three survivors and eight graves, and the survivors are the ones who tell you about it.","ch":6},{"n":65,"quote":"Take the boring shelf.","bare":false,"attribution":"Nadia Rahman, pharmacist, day 300","means":"By the second year every obvious thing had gone from every shop in this county and the boring shelf was untouched, and it still is. Salt, bicarbonate, vinegar, plain flour, dried pulses, sugar in ten kilo bags, TCP, sanitary goods, needles, reading glasses, boot laces, matches, and every tin of anything nobody has heard of. Rahman's insight is about the psychology of a hurried person. People scavenge for a meal, not for a year. What survives four years of stripping is exactly the material that does not look like dinner. Half the useful stock in the Long Room came off boring shelves in the third summer.","use":"She spent three days on a chemist at Guiseley in the second November. It was a serious piece of work with a real risk in it. She came out with almost nothing that mattered. Most of what is in a pharmacy needs a diagnosis you cannot make, a cold chain you do not have, or a course you cannot complete. The shelf that would have paid for those three days had the salt and the plasters on it. It was in the shop next door. She walked past it twice. The boring shelf rule is right and it is much broader than she wrote it. It is not only the dull items in the interesting shop. It is the dull shop.","ch":6},{"n":66,"quote":"Eat it now.","bare":false,"attribution":"Bea Winslow, retired postmistress, day 700","means":"A store that is never drawn on is not a store, it is a museum, and Winslow has watched three households guard one into the spring while the people guarding it got thin. Her rule has two halves and both are permission. The first is that food kept past its usefulness is a loss, so the jar that is turning gets opened on a Tuesday for no reason. The second is harder. A meal that is better than it needs to be, on a bad day, for no occasion, is not an indulgence and it is not weakness. It is maintenance on the only machine you have got. She keeps a shelf of unreasonable things and spends off it about once a month.","use":"Somewhere past the end of this rule is the seed corn. It has been eaten, twice that I know of, by settlements that panicked in a February that turned out to be over in eleven days. Both of them are gone. The line between drawing on the store and eating next year is not obvious from inside a hungry winter, and there is no formula for it. So Winslow does the thing that works instead. The seed and one month's food live in a different building, counted, by two people, and are not part of the decision at all. Eat what is on the shelf, freely, and put the future somewhere your hungry self cannot reach it.","ch":6}]},{"n":7,"title":"Other People","part":"Three","partRoman":"III","partName":"Everyone Else","opening":"<p>I have put off writing this chapter for two winters and I want to say why, because the reason is the argument.</p><p>Every set of rules anybody has ever pinned to a wall about strangers is a rule for getting the answer wrong in a chosen direction. That is all a rule of this kind can be. You are being asked to decide, in about four seconds, on almost no evidence, whether the person at the end of the lane is a danger. There is no method that gets that right. Anybody who tells you there is has either been lucky or has stopped counting the people they turned away. So what you are choosing is not accuracy. You are choosing which mistake you would rather make, over and over, for the rest of your life. Make that choice in daylight. The alternative is having it made for you at nine at night by whoever is most frightened.</p><p>Here is the count, for what it is worth, and it is worth something. In these eleven hundred notebooks I can identify four hundred and six encounters with strangers described in enough detail to classify. Eleven of them ended in somebody being robbed or killed by the stranger. Twenty-nine ended in the stranger being killed or driven off by people who turned out to have been in no danger at all. The rest were nothing: a wave, a trade, a night in a barn, a piece of information, a person who walked on. If you are going to be wrong, and you are, the numbers say which way. You are far more likely to harm somebody who came to you for help than to be harmed by them.</p><p>That is not an argument for opening the door. Eleven is not nothing, and two of the eleven took whole households. It is an argument for knowing what you are trading, and for not letting the fear do the arithmetic. The fear has been wrong about the size of the risk for four years running, and in this county the wrongness has been fatal.</p><p>The entries here disagree more sharply than anywhere else in the book. Rule 70 says the door does not open, and the man who wrote it has buried people who opened theirs. Rule 77 was written by a woman who has opened hers every time she has been asked, for four years, and who is alive, and who is not naive, and whose settlement is the largest in this valley. Both of them are here in full and I am not going to arbitrate between them.</p>","entries":[{"n":67,"quote":"They have decided about you before either of you has spoken.","bare":false,"attribution":"Idris Pyle, day 200","means":"Pyle spent his working life on the first four seconds and he is right about what is in them. Before a word, the person opposite has read five things. Your condition, which is how well you have been eating and sleeping. Your posture, which is whether you expect trouble. What is in your hands. Whether you are looking at theirs. Whether you are alone. All of that is legible at forty yards and none of it can be talked away afterwards. His practical point is that you may as well choose what it says. Stand square, hands visible and empty, look at the face and not the hands, and stop walking before you are asked to.","use":"He is describing a performance, and a performance costs something to run and can be read as a performance by anybody who has met one. There is a particular flatness that very careful people acquire, and in the third year it has become its own signal in this county, and it is not a reassuring one. Pyle also had four years of this and ended up unable to meet anybody without working, which is a way of being profoundly alone in a crowd. Do the hands and the stopping, which are courtesies and cost nothing. Leave the rest of it. Most people are not reading you nearly as closely as he was.","ch":7},{"n":68,"quote":"Meet them at a distance you can both walk away from.","bare":false,"attribution":"Marcus Okon, police sergeant, day 210","means":"Forty yards of open ground with a clear line out behind each of you is a geometry that lets a meeting end in nothing, and most meetings should end in nothing. Close the distance and you have taken that option off the table for both of you: now something has to be resolved, and it has to be resolved by two frightened parties standing within reach of each other. Okon ran gate meetings on this principle for two years without an incident. Space is not coldness. Space is what makes it possible for the other person to change their mind and leave without losing face, and losing face is what most of the eleven bad outcomes in these notebooks are actually made of.","use":"Forty yards of open ground reads as hostility to a family that has walked eleven miles with a child, and it reads that way because it is, a little. There is a woman in Farsley who will tell you about being held at that distance in the rain for twenty minutes while a good, careful man decided about her. It ended her willingness to ask anybody for anything, and it has not come back. And the distance that is safe from a person is the distance a rifle prefers. Okon's own amendment is that the geometry is for the first minute and not the twentieth, and that somebody has to be willing to close it, and that it should be you.","ch":7},{"n":69,"quote":"Trade first. Talk after.","bare":false,"attribution":"Tomas Vrba, lorry driver, day 150","means":"An exchange of two small things establishes more in ninety seconds than an hour of conversation, and it does it in a way nobody can fake, because a trade is a claim that gets tested immediately. It says: I have a surplus, I would rather have a relationship than your possessions, and I expect to see you again. Vrba traded salt in half-ounces up and down this valley for two years, and built out of it a network of eleven households that fed information to each other. He did it without once having a conversation about trust. It is a word that does no work at all.","use":"A trade shows your hand. Salt in half-ounces says you have a lot of salt, and by the second summer everybody between here and Otley knew which man to rob if you wanted salt, and two of them tried. It also sets a price on your household, and a household with a known surplus is a fixed asset in the sense of chapter six. Vrba's fix is the one the old markets used: trade at a third place, on a day, in small quantities, and never at either party's home. He has not been robbed since he started doing that, and he says the network works better because everybody has to walk.","ch":7},{"n":70,"quote":"The door does not open. There is no version where the door opens.","bare":false,"attribution":"Rob Hatherleigh, logistics corporal, day 240","means":"He has the eleven cases and he is the only person who has written them all up. The pattern in them is consistent and it is worth having in front of you. In nine of the eleven, the door was opened on purpose, to somebody who was asking for help, by somebody who had decided this one was different. In seven of those nine the person asking was in real distress, was alone, and had walked a long way. They were also being followed by four people who had sent them. Hatherleigh's argument is that a rule with an exception in it is not a rule, because the exception is the only door anybody has ever come through. Food goes out. People do not come in. He has run it for three years and lost nobody.","use":"Twenty-nine against eleven. That is the number from the top of this chapter and it is the whole case against him. He has read it and does not dispute the arithmetic. He says the twenty-nine are not his responsibility and the eleven are. What his household has become in three years is the part he does not write about and other people do. They are fed. They are safe. They are eight people who have not admitted anybody since the second spring. Three have left. The ones who left all left for the same reason and said so. There is a cost to being the household that everybody in the valley knows will not open. It does not show up as a death. It shows up as nobody coming when it is your turn.","ch":7},{"n":71,"quote":"The dangerous ones are not hungry.","bare":false,"attribution":"Callum Reith, day 1,100","means":"Read the condition and not the manner. A desperate person is frightened, unpredictable and mostly harmless. Desperation is loud and slow, and it wants food rather than a fight. Almost every person who has frightened a household in these notebooks by shouting at a gate turned out to be exactly what they looked like. The ones who took whole settlements were fed, rested, unhurried and polite, and they were fed and rested because they had been doing it for a while. Reith's rule inverts the instinct, which is to fear the wild-looking man, and the instinct has been wrong nearly every time.","use":"It is a heuristic and he used it as a licence. A group that is well fed and organised is, more often than not, a working settlement that has planted something. Reith spent his seventeenth year in a crew that used exactly this reasoning to choose who to take from. He has written about it. I have printed the entry with the rule that came out of it. That is the failure of this rule: it identifies the strong, and there are two things you can do with that identification, and one of them is what he did. He is twenty now and he grows things. He asked me to leave this in.","ch":7},{"n":72,"quote":"Children are not a trick.","bare":false,"attribution":"Ivy Okonjo, midwife, day 190","means":"The rumour that children were being used as bait went through three counties in the first autumn, and it did more harm than almost anything else on the air. Okonjo went looking for the cases. She found two, in eleven hundred notebooks, in four years. Set that against what the rumour cost. Households that would not answer a child at a gate. A boy at Elland Road who is in chapter five. And a lasting willingness to treat the most vulnerable person in front of you as the most likely threat. The base rate is the argument. It is not sentiment, it is counting, and she did the counting.","use":"It happened twice. Both cases are documented, both were in the first eighteen months, and in one of them a household of six was finished by it. Okonjo does not hide either case and her position is that a rule which is right ninety-nine times in a hundred is still a rule that gets somebody killed, and that anybody adopting it should know they are accepting that. What she does in practice is the thing to copy. The child comes in. The child is fed. One person stands where they can see the road for the next two hours. Nobody makes the child answer questions about who is with them.","ch":7},{"n":73,"quote":"Lie about the number. Never lie about the food.","bare":false,"attribution":"Idris Pyle, day 260","means":"His argument is that a household's apparent size is the main thing deterring anybody, and that it cannot be verified from outside in a short observation. The food can be. So you inflate the one, tell the truth about the other, and keep your credibility where it matters. He ran it for a year. It sounds right and it is beautifully put. It is one of the two rules of his that I have marked in the note at the back. The evidence runs the other way, and I want it in the book with the correction attached rather than left out.","use":"Anybody serious watches for two days, and two days of watching gives them your real number, your rota and your water run, and now they know you lie. Worse is the thing Pyle did not model. A large household implies a large store, and in the second winter the two households in these papers that had most successfully inflated their numbers were both attacked, and both were attacked because they looked big enough to be worth it. The rule optimises for deterring one man walking past and it advertises to the four men who are planning. Tell the truth about the number and let it be small. Small and known to be defended is a much better position than large and interesting.","ch":7},{"n":74,"quote":"Ask them for something small.","bare":false,"attribution":"Ruth Vellacott, day 220","means":"Vellacott's people have been doing versions of this for three hundred years, and it works on something old in us. A person who has done you a small favour is better disposed towards you afterwards. The effect is larger than the favour. So you do not open with an offer, which puts them in debt and makes them wary, and you do not open with a large request, which is a demand. You ask for water, or the road, or the time of the tide. It is nearly free for them, it gives them the position of the person with something to give, and it turns a confrontation into a transaction that has already gone well once.","use":"It marks you as somebody who asks, and in a bad winter that is a category people are watching for. There is also a real cost hidden by the word small. A household that has nothing is being asked to demonstrate that it has nothing, in front of a stranger. Vellacott has been on the receiving end of that and describes it as one of the worse things that has happened to her. Ask for something they obviously have. Directions, water in a place with water, a light. Never ask a thin household for food and call it small.","ch":7},{"n":75,"quote":"Never show them the way home.","bare":false,"attribution":"Fen Doherty, poacher, day 175","means":"Everything about your household that matters is its location, and location is the one thing that cannot be undone once it is given. Doherty meets people on a lane half a mile from where he lives, walks doglegs, comes back after dark by a different way, and has never in four years let anybody follow him in. It costs him an hour a week. In exchange, the eleven encounters in this chapter that ended badly all had one thing in common. Somebody knew where the house was. No defence, no wall and no rota competes with not being findable.","use":"He is alive and his household is four people and it was nine. Nobody has ever come for them and nobody has ever come to them either. When the roof went in the second February there was no one to ask. When his sister was ill there was no one to ask. The settlements that grew in this valley grew because people knew where they were. Doherty's method is the correct method for a household that intends to stay four people forever. It is not a method for building anything, and he is the first to say so, and he has said it to me twice in a way that I have thought about since.","ch":7},{"n":76,"quote":"Give the first stranger of the winter something.","bare":false,"attribution":"Maggie Lunt, hill farmer, day 300","means":"Reputation travels faster than anybody expects and it is the cheapest defence there is. What Lunt wants said about her place, up and down this valley, is two sentences: they will give you a meal at the gate, and it is not worth trying anything. Both halves are necessary and the first is the one people neglect. A place known to give a little is a place nobody needs to raid, because raiding is dangerous and asking is not. In four years she has fed perhaps sixty people at that gate. She has been approached with any other intention exactly once.","use":"It produces a queue, and a queue is a fixed asset with a number on it. In the second winter she had forty people at that gate over eleven weeks, and she could not feed forty people. The ones she turned away went off with a much worse story than if she had never fed anybody at all. Generosity that runs out is remembered as a refusal. Her fix is to set the amount for the season in advance, publish it, and hold it. A meal at the gate and a night in the byre. That is what it is and what it has always been. Nobody who arrives in February is told something different from the man who arrived in October.","ch":7},{"n":77,"quote":"Open the door.","bare":false,"attribution":"Sister Agnes Moray, day 400","means":"She has opened it every time she has been asked, for four years, and her settlement is the largest in this valley and it is not an accident. The reasoning is not what people assume. It is not that everybody is good. It is that a settlement is made of people who arrived. Every single person now feeding her, mending her roof and standing her watches was at some point a stranger at the gate. A place which does not open cannot grow. A place that cannot grow is on a slow clock, and it runs out somewhere around the fifth or sixth winter, when the people in it get old. The twenty-nine against eleven is her arithmetic. She got there before I did.","use":"It has cost her. Twice. The second time, in the third autumn, it cost her four people and most of a store. She opened the door again eleven days later. There are people in that settlement who have never forgiven her and are still there. What makes it work is not the opening, which is the part that gets quoted. It is the four things underneath it, and she lists them every time and nobody ever writes them down. The door opens into a yard and not into the house. Somebody is always standing where they can see the yard. Nobody sleeps inside the walls on their first night. And the decision to open is hers alone, so that it can never become a thing the household argues about at the gate with a person listening. Open the door. Build the yard first.","ch":7}]},{"n":8,"title":"The Group","part":"Three","partRoman":"III","partName":"Everyone Else","opening":"<p>Nearly every settlement that has failed in this valley failed from the inside, in the autumn, over something small.</p><p>I did not expect that when I started sorting the notebooks and I have had to change my mind about it twice. The picture from outside is always the same: a place was overrun, a place was raided, a place had bad luck. Read the papers from inside and the overrunning turns out to be the last event in a sequence that started nine months earlier, with two people who stopped speaking, and a rota that everybody knew was unfair and nobody would say so. A decision that got made three times because it never got made properly once. By the time anything with teeth arrived there were four people doing the work of eleven and nobody on the north wall. The thing that finished them would not have got within half a mile of the place it had been in March.</p><p>So this chapter is about governance, which is a heavy word for what it is. It is a set of answers to about six questions. Every group of more than four people has to answer them, whether it notices or not. Who decides. How the unpleasant work is shared. What happens to somebody who cannot work. What happens when somebody wants to leave. Who counts the food. What is done when a person dies. Groups that answered those out loud, early, in writing, while nothing was wrong, are with one exception still here. Groups that left them to be settled by whoever was loudest in the moment are, without exception in these papers, not.</p><p>One thing before the entries. Every rule here was written by somebody who had watched a group come apart. None of them was written by somebody who had built a good one from nothing, because the people who did that were busy. There is a bias in this material towards the diagnosis and away from the cure, and I have no way of correcting for it. What I can tell you is that Moray&#x27;s settlement is the largest and healthiest thing anybody in this county has made. It does eight of these eleven things. It has never written any of them down and could not tell you which eight.</p>","entries":[{"n":78,"quote":"Decide how you will decide, before there is anything to decide.","bare":false,"attribution":"Rosa Kaminski, schoolteacher, day 150","means":"A group in a crisis can do one thing at a time. It will either resolve the crisis or resolve the question of who is allowed to resolve it. It cannot do both. Kaminski's group spent one wet afternoon in the second June on a single sheet of paper. These four things are decided by whoever is on watch. These three by the whole household in the evening. This one by two named people together. And here is what happens if those two disagree. It took ninety minutes. It has been used perhaps four hundred times since and it has never once been argued about, because the argument happened in June when nothing was at stake.","use":"Rules written in the calm are written by the people who are comfortable in the calm, and they are almost always the articulate ones. What a wet afternoon with a sheet of paper produces is a system that suits people who like wet afternoons with sheets of paper. Kaminski's own document gave three decisions to whoever was on watch and did not notice that the watch rota put two particular men on watch for most of the winter nights. The paper needs revising once a year, by somebody who was not in the room the first time. It needs to be revised while nothing is wrong, which is the exact condition under which nobody wants to.","ch":8},{"n":79,"quote":"Every rule has a name on it.","bare":false,"attribution":"Nell Okafor, librarian, day 200","means":"An anonymous rule cannot be argued with, because there is nobody to argue with, and so it becomes furniture and then becomes doctrine. Okafor made everything in the Long Room carry the name of whoever proposed it and the date, and the effect was immediate and not what she expected: bad rules got repealed. It turns out that people will not challenge the way things are done, which is impersonal and enormous. They will happily say that they think Nell's rule about the lamps is wrong. That is small and specific and it has an obvious remedy.","use":"A name on a rule turns repealing it into a defeat for a person, and people defend rules to defend themselves long after they have stopped believing in them. Okafor's rule about the lamps was wrong within a fortnight and stayed for eleven months. She is the one who wrote it and she is the one who kept it. She knew. The correction is a small piece of theatre and it works. The person who proposed a rule is the person who is asked, once a season, whether it should stay. Answering no in that particular chair is the most respected thing anybody in this building can do.","ch":8},{"n":80,"quote":"The rota is the government.","bare":false,"attribution":"Rob Hatherleigh, logistics corporal, day 180","means":"Whoever chairs the evening meeting has the visible power and it is not where the power is. The power is in who empties the latrine bucket, who takes the four-in-the-morning watch in January, who goes on the water run when it is raining. And whether those are the same three people every week. Hatherleigh's argument is that a group's real constitution is its rota, and that everybody in the group already knows this. A settlement where the unpleasant work is visibly shared can survive almost any amount of disagreement about anything else. He built rotas for a living. His are fair to a degree that nobody has ever faulted.","use":"They are also joyless, and a rota that is perfectly fair and never varies turns eleven people into eleven functions, and does it slowly enough that nobody can name the week it happened. Hatherleigh's household in the second year was the best run and least happy thing in this book. The three people who left it left for a place that was worse organised and warmer. Fairness is necessary and it is not sufficient. The fix costs nothing. Let people swap. Let people volunteer for the bad shift and be thanked out loud. And put one thing on the rota that is not work.","ch":8},{"n":81,"quote":"Do not make the strongest person the leader.","bare":false,"attribution":"Priya Raghunathan, A&E nurse, day 210","means":"The first year selected hard for one skill and it was the wrong one. Being good at the dangerous part is a specific and valuable competence. It has almost nothing to do with allocating food across a winter, judging a stranger, or holding a group of frightened people together in February. Putting the same person in charge of all four is how you get a settlement that is superb in a crisis and cannot organise a harvest. There is a second reason and it is practical. The strong one is needed at the wall, and a leader who is at the wall is not available for the eleven decisions that get made while they are out.","use":"There are weeks when the group needs the strong one to lead and everybody knows it. A rule that forbids it produces a fiction, where the nominal leader relays what the strong one has said. Raghunathan has watched that and calls it the worst of both. The other cost lands on the person doing the dangerous work. They take the risk and they are excluded from the decisions. By the second winter that is a specific and legitimate grievance, and in one settlement in these papers it turned into something much worse. Separate the roles, name both out loud, and give the dangerous one an absolute veto over anything that sends people outside.","ch":8},{"n":82,"quote":"Let people go.","bare":false,"attribution":"Solomon Quaye, barber, day 500","means":"A group that cannot be left is not a group, it is a situation, and everybody inside it can feel the difference even when nobody says so. Quaye's position is that the right to walk out is what makes everything else voluntary. A person who stays when they could go is a different and better colleague than a person who stays because the alternative has been made impossible. His settlement gives anybody leaving three days of food, the loan of a coat and no argument. Four people have used it in three years. Two of them came back, and both say the going was what let them come back.","use":"An open door bleeds in the good months. People leave in May, when everything is easy and somewhere else looks better. They are missed in November, when the roof needs doing and there are four fewer pairs of hands than the place was built around. And what leaves with them is the map: where the store is, how many are on the wall, which night the watch is thin. Quaye's household accepts all of that and has decided it is the price. The one thing he does insist on is that nobody leaves in the fortnight after a death, or in a hard frost. Both of those have been argued about. He has held both.","ch":8},{"n":83,"quote":"Two people count the store, and they are not friends.","bare":false,"attribution":"Bea Winslow, retired postmistress, day 260","means":"Winslow spent forty years in a job where the money was counted twice by two people every single day, and she understood exactly what that practice is for, which is not catching thieves. It is making theft unnecessary to worry about. A store counted in the open, by two people who do not socialise, on a known day, removes an entire category of suspicion from a group's life. Suspicion about food is the thing that ends settlements. She has never found a discrepancy she could attribute to a person. That is the system working, not the system being unnecessary.","use":"It says out loud that the group expects to be stolen from. In a small household that is a hard thing to have said. Two settlements in these notebooks abandoned the practice within a month for exactly that reason, and both regretted it. The other failure is Winslow's own and she tells it against herself. The count found nothing for two years and then found a shortfall of eleven pounds of oats. There was a fortnight of quiet horror. It turned out to be her own arithmetic in a cold room in December. Count twice. Then have a rule, written down in advance, about what happens on the first discrepancy, because the first discrepancy will be a mistake and everybody will behave as though it is not.","ch":8},{"n":84,"quote":"Bury them properly, and everybody stops work.","bare":false,"attribution":"Wes Ordish, undertaker, day 130","means":"Ordish buried people for thirty-one years and his claim is one that the notebooks support without much doubt. The settlements that stopped holding funerals came apart within about six months, every time. The ones that kept them did not. A funeral does nothing for the dead. It is a machine for telling the living three things. That a person who was here mattered. That a death will be marked when it is theirs. And that the group is a thing that owes its members something. Stopping work is the load-bearing part. A burial that people attend in shifts, around the rota, says the opposite of what it is meant to say.","use":"A burial party is the most exposed a settlement ever is. Everybody in one place, outside the walls, occupied, upset, not watching, at a time and place that has been known about for a day. A settlement at Rawdon lost three people at a graveside in the second August, which is one of the worst things in these papers. Ordish's own practice by the third year was to bury at first light in the frost, with two people at distance who do not attend, and to hold the service afterwards and inside. He has said that separating the two was the hardest professional decision of his life and that he would do it again.","ch":8},{"n":85,"quote":"Nobody alone. Nobody in more than three.","bare":false,"attribution":"Ewan Tait, mountain rescue, day 130","means":"One is no rescue. A person alone who breaks an ankle two miles out is a death, and Tait had spent nineteen years walking towards the consequences of that. Four or more is loud, slow, hard to hide, and produces the thing where everybody assumes somebody else is watching. Three is the number that works: one doing the task, one watching the ground, one spare pair of hands who can go for help or carry. It is also small enough to lie down in a ditch. Every mountain rescue team in this country arrived at some version of three by about 1960 and none of us should have had to rediscover it.","use":"In a household of eight, three out is more than a third of your strength gone for a day, and if that day goes wrong you have lost nearly half of everything. There is a subtler problem that finished a settlement at Yeadon. Three people out for eleven hours make decisions together, on the ground, with information the household does not have, and they come back having committed to something. Do it four or five times and you have a group inside the group, with a shared history the others do not share, and the household is now two things. Rotate who goes. Never send the same three twice running.","ch":8},{"n":86,"quote":"Teach somebody else your job.","bare":false,"attribution":"Yusuf Errai, veterinary surgeon, day 320","means":"Every settlement is a list of single points of failure and nobody writes the list down. Bramall's bees. Cattermole's canal. Kowal's teeth, and Errai's own, which is the whole of the medicine for four settlements and is one man of sixty-one. The rule is not about generosity. It is about arithmetic. A household whose only water engineer is one person has a fifty percent chance, over a few years, of losing water engineering altogether. The cost of preventing that is an hour a week for a year. Errai has taught his second three times over and has stopped being irreplaceable, which he describes as the best fortnight's work he ever did.","use":"Teaching costs the expert their time and, if they let it, their standing. There is a real and unattractive way in which being the only person who can do a thing has been keeping some of these people fed. Worse is the half-taught apprentice, which is Kowal's chapter six entry in another form. Somebody with four months of instruction and complete confidence is more dangerous than somebody with none. They will attempt the thing rather than wait. Teach the second. Then write down, and make them say out loud, the three procedures they are not to attempt without you, and expect that list to be the thing they resent.","ch":8},{"n":87,"quote":"Somebody has to be allowed to be useless for a week.","bare":false,"attribution":"Sister Agnes Moray, day 330","means":"People break. Not dramatically and not for good. The pattern is the same one Moray saw for twenty years before any of this. A person who is given a week to be no use at all comes back and works for another three years. A person who is not given it stops working properly some time in the following autumn, and never starts again. Her settlement holds about a fortnight of slack in the year for this and treats it as a stock, like food, that is laid in and drawn down. It is the single most unusual thing about that place and I think it is why it is the largest.","use":"Slack is bought with somebody's labour, and the somebody is always the same three people. If the week is not rationed it gets drawn by whoever is loudest about needing it, rather than whoever is closest to breaking. Moray's own difficulty is that she has never once refused it and has been taken advantage of twice by the same man. And a household of five cannot do this at all. The arithmetic does not close. Everybody knows it does not close. Pretending otherwise produces a rule that exists on paper and is never used, which is worse than not having it. Below about eight people, this entry is not available to you, and that is a real argument for being more than eight.","ch":8},{"n":88,"quote":"Go, if it is that kind of group.","bare":false,"attribution":"Callum Reith, day 1,180","means":"He was in a crew for most of two years that took food off settlements, using the reasoning in his chapter seven entry. He left at nineteen with nothing, in September, and walked forty miles. His rule is the counterweight to everything else in this chapter, and it needs saying because loyalty has been doing a great deal of unexamined work in these papers. A group is a tool for keeping people alive. When it stops being that and becomes a thing that keeps other people from being alive, staying in it is not loyalty and leaving it is not betrayal. Every argument you will hear to the contrary will be made by somebody who benefits from you staying.","use":"Almost every solitary death in these eleven hundred notebooks begins with somebody walking out of a group. That is the flat fact and Reith knows it better than I do. The ones who left in a temper, in the wrong season, without a destination, are a category. It is a large category. He got across those forty miles in September in good weather, and has said plainly that in January he would not have. So: go, if it is that kind of group. Go in spring or early autumn. Go towards a named place. Take three days of food and tell one person you trust which way. And if none of those four conditions can be met this month, plan it for the month when they can. In the meantime, do not let anybody persuade you that the deciding is settled.","ch":8}]},{"n":9,"title":"The Long Middle","part":"Three","partRoman":"III","partName":"Everyone Else","opening":"<p>Nobody wrote a rule for this part, because nobody expected to be in it.</p><p>Everything in the first eight chapters was written by people in an emergency, for people in an emergency. An emergency has a shape everybody understands without being told. It is short. It is survived rather than lived in, and the whole of your behaviour inside it is permitted by the fact that it is going to end. What none of us had any preparation for is the discovery that it was not going to end. The notebooks fall silent at almost exactly the eighteen month mark. This was not a period of difficulty between the world and the world coming back. It was simply the world now. And the habits that had kept us alive through a bad winter were, carried into a fourth year, going to hollow us out and leave a county full of thin capable people who could do everything except want anything.</p><p>I have read four hundred notebooks that stop for that reason. They do not stop at a death. They get shorter, the entries get further apart, the handwriting stays perfectly steady, and then there is a run of blank pages and then nothing, and the person is alive, and I have met eleven of them. That is what the long middle does. It is the only chapter in this book where the failure mode is not a body.</p><p>So these eleven rules are different from the rest and I want to be honest that some of them will look like luxuries. Planting a tree, teaching a child to read, holding a wedding, walking three weeks to look at the sea. None of that keeps anybody alive this Tuesday. Every one of them costs labour that could go into the wall or the store. The argument for them is that they are the only things anybody has found that keep a person interested in being alive next Tuesday. Interest in that is not a decoration on survival. It is the load-bearing part. The four hundred silent notebooks are the evidence.</p><p>This is the chapter people ask me for. When somebody comes to the Long Room and wants the book, they have almost always heard about one of these eleven and not about any of the other eighty-eight. I have thought about why. I think it is this. The rest of the manual tells you how not to die. This part is the only part that says anything at all about what the not dying was supposed to be for.</p>","entries":[{"n":89,"quote":"Count the ones still walking. Then count them again next year.","bare":false,"attribution":"Yusuf Errai, veterinary surgeon, day 1,250","means":"This is the first piece of good news in the book and it has taken four years to be able to write it. They rot. Slowly, and much more slowly than anything else does, and not at all in the way a body rots. But they do. The fourth year is when it began to show. Hips going, tendons at the ankle failing, the ones that come down the lane now doing so with a gait that would not have got them across a field in the first summer. Errai has counted the same three miles of road every March for four years and the number has fallen each time, and the fall between the third year and the fourth was the largest. This is measurable, it is repeatable, and anybody can do it.","use":"The number is falling and the danger is not. What is being removed from the population is the weak. What is left is a selected remainder: the ones that turned in the cold, that have spent four years in shade and damp, that are intact. Errai is careful about this and everybody who repeats him is not. Then the second thing, which he thinks is the more important and which nobody wants to hear. Any unburied cluster of a few hundred is still a few hundred. A hard winter preserves them. The arithmetic of a second wave has never once required anything new to happen. Count them. Publish the count. Do not build anything on the trend that you could not defend if the trend stopped.","ch":9},{"n":90,"quote":"Teach them to read.","bare":false,"attribution":"Rosa Kaminski, schoolteacher, day 1,090","means":"It goes in one generation. That is the fact that ought to frighten people more than it does. A skill that took this country four hundred years to establish is gone in about fifteen if nobody teaches it. The children who were four when it started are eight now. There is a window and it closes. Everything in this book is a written thing. The whole method of the Long Room, and of Skipton, and of every settlement that has learned anything from another settlement's dead, runs on paper, and paper without readers is insulation. Kaminski runs two hours a day, six days, for nine children, and she has been doing it since the second winter and she has never missed a day for weather.","use":"Two hours a day for nine children is two hours a day for one adult and nine sets of hands. In a settlement of thirty that is a real subtraction from the harvest. It is paid by everybody and it benefits the parents. There are settlements that have had this argument badly. The other cost is quieter and Kaminski raises it herself. Whoever teaches chooses what is taught, and there is nobody to check her. She has been the only source of what nine children think happened to the world. She has started having Quaye take one hour a week for exactly this reason, and she says he tells it differently, and that this was the point.","ch":9},{"n":91,"quote":"Plant a tree.","bare":false,"attribution":"Maggie Lunt, hill farmer, day 800","means":"An apple takes seven years to be worth anything and that is the entire argument. Everything else a settlement does is inside one season. You plant in April to eat in September. You cut wood in January to burn in February. A life made only of those has a twelve month horizon, which is a survivable way to live and not a way to build anything. A tree is a wager on being here in seven years, made in public, with your hands. Lunt put in eleven in the second spring and says the change in the household was immediate and had nothing to
