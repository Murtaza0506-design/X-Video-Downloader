 do with fruit.","use":"It is a commitment to a place and it is the strongest one available. This is the chapter four problem in its most seductive form. The household with the orchard is the household that will argue for staying when it should be arguing about the water. Her own first eleven went into the flat ground by the beck because it was the easiest digging. It is ground that floods. She lost nine of them in the second winter and did it again on the slope, where the work is four times as hard. Plant the tree. Plant it where you would build, not where it is easy, and plant it in the third year rather than the first, when you know what the ground does in February.","ch":9},{"n":92,"quote":"Marry people.","bare":false,"attribution":"Sister Agnes Moray, day 1,000","means":"Her position is that a public promise, witnessed, is a piece of machinery and not a sentiment. A settlement is built out of them. They turn private arrangements into things the group has a stake in. They give everybody a role at somebody else's important day. And they are the only mechanism anybody has found for making a commitment that is harder to walk away from than the walking away is easy. She has done eleven. She will tell you, and the notebooks bear her out, that the settlements with weddings in them are the settlements with children in them, and that this is not the obvious causation but the other way round.","use":"It builds households inside the settlement. Households have interests, and interests become factions. By the third year there was an argument at Moray's place about whose child got the schooling hours, and it had nothing to do with schooling. There is also the question of what happens when one of the eleven ends, which two of them have, and there is no machinery for that at all and she is making it up. She has refused two weddings in four years, both times because she judged one of the pair was asking for shelter rather than for a marriage. Both times she was told she had no right. She thinks now that she was correct once.","ch":9},{"n":93,"quote":"Learn a trade that is not survival.","bare":false,"attribution":"Marta Kowal, day 900","means":"For three years everybody in this county did the same nine jobs and the nine jobs were all versions of not dying. What has changed in the fourth year is that there are now a handful of people who make one thing well. A man at Horsforth who does boots. A woman at Bramhope who is a potter. Kowal herself, who started as a hairdresser, pulled teeth, and has spent two years learning to do it properly from a book and from Errai. A settlement that contains a cobbler is a different kind of place from one that contains eleven interchangeable survivors, and the difference shows up in what people will walk twelve miles for, which is the beginning of everything else.","use":"A specialist is a person who cannot be sent to the harvest, and in a settlement of twenty that is felt. There was a bad fortnight at Bramhope in the third September over precisely this and the potter went back on the rota and has done less good work since. The deeper fragility is that a trade takes years and the person carrying it is one person, which is Errai's chapter eight entry again, and Kowal has one apprentice and needs three. Her own note is worth quoting. She says the hardest part was not learning the teeth. It was being allowed to spend the time, and she was allowed it because the alternative was watching people die of it.","ch":9},{"n":94,"quote":"Go and look at the sea.","bare":false,"attribution":"Hana Sørensen, marine engineer, day 1,200","means":"Sørensen's argument is that four years of errands is not a life, and that a journey with no cargo in it does something no amount of rest does. She is talking about a specific thing she watched happen to people. The horizon shrinks to the length of the water run and then does not come back. There is a practical half as well. Nobody in this valley knew anything about the coast until people started walking to it. What came back was worth the walking. There are working boats out of the Humber. The fishing is extraordinary. A whole different apocalypse happened out there and it has produced a whole different set of rules. Three weeks. Two people. Nothing carried but food.","use":"It is three weeks of exposure for nothing material, in a world where three weeks of exposure is how most of the names in this index ended, and the honest version of the rule has to say that. And Sørensen went, in the fourth May, with a man called Bell who came back alone in June with a letter. She is not dead. She is on a boat out of Paull with eleven other people and she is not coming back. The letter says why. It is the best thing in the Long Room and I have read it more often than I should. Go and look at the sea. Understand before you go that some people who look at it do not return. That this is not always a tragedy. And that whoever is waiting for you will not be able to tell the difference for a long time.","ch":9},{"n":95,"quote":"Keep a bad map of the whole county.","bare":false,"attribution":"Tomas Vrba, lorry driver, day 1,150","means":"What matters in the fourth year is not terrain, it is who is where. Vrba keeps a sheet with about forty marks on it: this settlement, that many people, they have salt, they need seed, this one has a smith, this one had a bad winter and will not answer. It is wrong in a dozen places at any moment and it does not need to be right, it needs to exist, because it turns forty isolated households into something that can move a surplus to a shortage. Three settlements got through the third February on grain that Vrba knew was sitting in a barn eleven miles from people who had none.","use":"It is precisely the document you would want if you were planning to take things from people, and Vrba carries it on his person and has thought hard about what happens if he is stopped. He has been, once, and talked his way out of it. The second failure is subtler and it is the one Doherty warned about from the other direction. A map like this makes its keeper important. There is now one man who knows the shape of this county and nobody else does. If he goes into a ditch in February, forty households go back to knowing nothing. He is teaching it to two people. He has been teaching it to two people for a year and he is not very good at letting go of it.","ch":9},{"n":96,"quote":"Let the children be bored.","bare":false,"attribution":"Ivy Okonjo, midwife, day 1,300","means":"The generation that is growing up in this is frighteningly competent. Reith is the obvious case and he is not unusual. They are quiet, they read ground, they are calm about things that reduce adults to uselessness. Every one of them has been useful since they were six, because there was no version of the last four years in which a child could be spared. Okonjo's finding, and she has had more of these children through her hands than anybody, is that the competence has come out of something, and what it has come out of is play. She has written a rule that says a child gets a portion of the day in which nothing is required of them and nothing is taught to them, and she defends it against everybody, including the children.","use":"It is bought with adult labour and everybody can see the price, and in a settlement of fifteen with a wall to finish there is a version of this argument that Okonjo loses and should lose. And there is a harder objection which comes from the children themselves. Reith's generation is competent because nobody was ever bored. Several of them have said, in various ways, that they would not trade it. Being needed at eight was the thing that made the first winter survivable for them, rather than the thing that damaged them. Okonjo's answer is that she is not arguing about the first winter. She is arguing about the eighth, and about what happens to people who have never once been permitted to be no use.","ch":9},{"n":97,"quote":"Say their names on the day.","bare":false,"attribution":"Wes Ordish, undertaker, day 1,000","means":"Grief that has nowhere scheduled to go turns up on its own account, in February, in the middle of a task, and it takes people out for a fortnight at a time and they cannot say why. Ordish's whole trade was built on the observation that the marking has to happen and that the only question is whether it happens on a day you chose. So the fourth of April, every year, everything stops. Every name this settlement has lost is read out, in order, by somebody different each time. There are a hundred and six of them. It takes most of an hour. Nobody has ever suggested shortening it.","use":"It is a bad day. It is the worst day of the year in every settlement that does it. It costs a working day at exactly the point in April when there is work. Two people at Moray's place leave for the week every year and have done since the second one. Ordish does not pretend otherwise and does not think the cost is avoidable. He has made one refinement in three years. The reading happens in the morning and the afternoon is given over to a meal. He found that a day which ends in the list ends badly, and a day that begins with it does not.","ch":9},{"n":98,"quote":"Stop calling it the apocalypse.","bare":false,"attribution":"Solomon Quaye, barber, day 1,320","means":"Language of emergency licenses behaviour of emergency, for as long as you let it. Quaye's point is that a settlement which still describes its situation as a catastrophe in progress will keep making catastrophe decisions. No long work. No repairs beyond the winter. No trees. Nothing that assumes a year after next. He started calling it the fourth year rather than the fourth year of anything, and made a small stubborn point of it in every conversation. He says it took about eight months to spread. The visible effect was people mending things properly instead of patching them.","use":"It normalises what should not be normal. There is a real objection here that Moray makes and that I have not been able to dismiss. A hundred and six people are dead on that list. The thing that killed them is still walking about outside the wall. A language in which all of that is the weather is a language that has given up on something. There is also the chapter two problem. Some people are running on the belief that this is temporary, and it is load-bearing for them, and Quaye's sentence takes it out from under them in public. He now says it only to people who have been here four years. He has never once said it to anybody who arrived in the last twelve months, and that is the rule underneath the rule.","ch":9},{"n":99,"quote":"Put the book down.","bare":false,"attribution":"the Long Room, the fourth winter","means":"I have spent two years on this and it is the last entry and it ought to be honest about what the other ninety-eight are worth. Nobody who survived the first year had this book. They had judgement, and luck, and mostly luck. What I have assembled here is ninety-eight rules written by people who were making it up, and the index will tell you how many of them are still here. I have no way of knowing whether the rules are why the others are alive, or whether the alive ones had more time to write. A manual is a substitute for judgement and it is a poor one. The purpose of reading this is to stop needing to. If you have got to the end of it and you are still looking things up, then I have made you worse rather than better. Shut it. Go and look at the ground in front of you.","use":"The people who most need to put it down are the people who will not. I know this because they come to the Long Room and I can see it. What they want is not the rule. It is somebody else to have made the decision. I cannot make it. Every entry in here has a failure printed underneath it for that reason. I put them there so that nobody could read this book as a set of instructions. A great many people are going to read it as a set of instructions anyway. So the last thing, and then I will stop. Everything above is what worked in one valley, for one set of people, against one winter after another, and the sample is made entirely of survivors. Take what is useful. Argue with the rest of it. Write down what you learn, put a name and a date on it, and bring it here. If it is better than what is in this book, then this book will be shorter next year. That is the only outcome I have ever wanted from it.","ch":9}]}],"index":[{"name":"Adeyemi, Femi","letter":"A","items":[{"n":45,"quote":"Low and long carries. Sharp and short does not.","ch":5,"q":""},{"n":54,"quote":"Silence is a season. It is not a rule.","ch":5,"q":""}]},{"name":"Adjei, Pearl","letter":"A","items":[{"n":31,"quote":"Nothing in the bag that you have not carried up a hill.","ch":3,"q":""}]},{"name":"Anand, Kit","letter":"A","items":[{"n":28,"quote":"Move at four in the morning.","ch":3,"q":""}]},{"name":"Beeston wall, the","letter":"B","items":[{"n":10,"quote":"Nobody is coming.","ch":1,"q":""}]},{"name":"Bello, Terrance","letter":"B","items":[{"n":34,"quote":"Count the doors before you count the exits.","ch":4,"q":""}]},{"name":"Bramall, Isaac","letter":"B","items":[{"n":40,"quote":"Bells.","ch":4,"q":""},{"n":61,"quote":"Learn one animal properly.","ch":6,"q":""}]},{"name":"Cattermole, Bill","letter":"C","items":[{"n":26,"quote":"Follow the cut.","ch":3,"q":""}]},{"name":"Doherty, Fen","letter":"D","items":[{"n":25,"quote":"Never the road. The thing beside the road.","ch":3,"q":""},{"n":41,"quote":"Leave the bodies in the street.","ch":4,"q":""},{"n":53,"quote":"Nothing is answered after dark.","ch":5,"q":""},{"n":75,"quote":"Never show them the way home.","ch":7,"q":""}]},{"name":"Errai, Yusuf","letter":"E","items":[{"n":8,"quote":"Their blood will not kill you. Their spit will.","ch":1,"q":""},{"n":15,"quote":"Nothing you hear about them is true unless you can name the person who watched it happen.","ch":2,"q":""},{"n":63,"quo n":43,"quote":"The best wall is a bad approach.","ch":4,"q":""},{"n":60,"quote":"Plant more than you can eat and less than you can weed.","ch":6,"q":""},{"n":76,"quote":"Give the first stranger of the winter something.","ch":7,"q":""},{"n":91,"quote":"Plant a tree.","ch":9,"q":""}]},{"name":"Mackay, Erin","letter":"M","items":[{"n":47,"quote":"Loud work in the rain.","ch":5,"q":""}]},{"name":"Moray, Sister Agnes","letter":"M","items":[{"n":22,"quote":"You are allowed to believe something because you need to.","ch":2,"q":""},{"n":77,"quote":"Open the door.","ch":7,"q":""},{"n":87,"quote":"Somebody has to be allowed to be useless for a week.","ch":8,"q":""},{"n":92,"quote":"Marry people.","ch":9,"q":""}]},{"name":"Okafor, Nell","letter":"O","items":[{"n":12,"quote":"Write the date before you write anything else.","ch":2,"q":""},{"n":79,"quote":"Every rule has a name on it.","ch":8,"q":""}]},{"name":"Okon, Marcus","letter":"O","items":[{"n":2,"quote":"Whatever you are locking out is in the building with you.","ch":1,"q":""},{"n":17,"quote":"Ask them what they were doing when they saw it.","ch":2,"q":""},{"n":35,"quote":"Wedge. Do not lock.","ch":4,"q":""},{"n":68,"quote":"Meet them at a distance you can both walk away from.","ch":7,"q":""}]},{"name":"Okonjo, Ivy","letter":"O","items":[{"n":57,"quote":"The latrine goes downhill of the water and further away than you want it.","ch":6,"q":""},{"n":72,"quote":"Children are not a trick.","ch":7,"q":""},{"n":96,"quote":"Let the children be bored.","ch":9,"q":""}]},{"name":"Ordish, Wes","letter":"O","items":[{"n":84,"quote":"Bury them properly, and everybody stops work.","ch":8,"q":""},{"n":97,"quote":"Say their names on the day.","ch":9,"q":""}]},{"name":"Prentice, Oz","letter":"P","items":[{"n":6,"quote":"Down. Always down.","ch":1,"q":""},{"n":36,"quote":"Glass is not a wall. Glass is a curtain.","ch":4,"q":""}]},{"name":"Prydderch, Gwen","letter":"P","items":[{"n":29,"quote":"Carry the means to drink, not the drink.","ch":3,"q":""},{"n":56,"quote":"Boil it. If you did not watch it boil, boil it.","ch":6,"q":""}]},{"name":"Pyle, Idris","letter":"P","items":[{"n":13,"quote":"A rumour that tells you where to go is a rumour somebody wants you to be.","ch":2,"q":""},{"n":51,"quote":"If you want a street quiet, make a noise in the next one.","ch":5,"q":""},{"n":67,"quote":"They have decided about you before either of you has spoken.","ch":7,"q":""},{"n":73,"quote":"Lie about the number. Never lie about the food.","ch":7,"q":""}]},{"name":"Quaye, Solomon","letter":"Q","items":[{"n":39,"quote":"The smallest room you can stand.","ch":4,"q":""},{"n":55,"quote":"Make some noise.","ch":5,"q":""},{"n":82,"quote":"Let people go.","ch":8,"q":""},{"n":98,"quote":"Stop calling it the apocalypse.","ch":9,"q":""}]},{"name":"Raghunathan, Priya","letter":"R","items":[{"n":1,"quote":"Leave in the first hour, or make a plan to leave in the third week.","ch":1,"q":""},{"n":19,"quote":"Say that you do not know.","ch":2,"q":""},{"n":27,"quote":"Boots off at every stop. Every stop.","ch":3,"q":""},{"n":49,"quote":"Never shout a name.","ch":5,"q":""},{"n":64,"quote":"Cut it off.","ch":6,"q":""},{"n":81,"quote":"Do not make the strongest person the leader.","ch":8,"q":""}]},{"name":"Rahman, Nadia","letter":"R","items":[{"n":20,"quote":"Anybody certain about the biology has never watched one turn.","ch":2,"q":""},{"n":65,"quote":"Take the boring shelf.","ch":6,"q":""}]},{"name":"Reith, Callum","letter":"R","items":[{"n":18,"quote":"The map is four years old. So are you.","ch":2,"q":""},{"n":32,"quote":"Run for the corner. Then walk.","ch":3,"q":""},{"n":71,"quote":"The dangerous ones are not hungry.","ch":7,"q":""},{"n":88,"quote":"Go, if it is that kind of group.","ch":8,"q":""}]},{"name":"Semenova, Lila","letter":"S","items":[{"n":30,"quote":"Walk to somewhere. Never away from something.","ch":3,"q":""},{"n":37,"quote":"Sleep where you have to be lifted to.","ch":4,"q":""}]},{"name":"Skipton radio log, the","letter":"S","items":[{"n":21,"quote":"Keep a book of what you were wrong about.","ch":2,"q":""}]},{"name":"Sørensen, Hana","letter":"S","items":[{"n":94,"quote":"Go and look at the sea.","ch":9,"q":""}]},{"name":"Tait, Ewan","letter":"T","items":[{"n":4,"quote":"What is on your feet when it starts is what you have got.","ch":1,"q":""},{"n":23,"quote":"You cannot outwalk them. You can only stop being worth following.","ch":3,"q":""},{"n":85,"quote":"Nobody alone. Nobody in more than three.","ch":8,"q":""}]},{"name":"Threlfall, Sam","letter":"T","items":[{"n":9,"quote":"Off at the meter, and do the neighbours while you are out.","ch":1,"q":""}]},{"name":"Trent, Joyce","letter":"T","items":[{"n":11,"quote":"Some people are staying. Let them, and stay with them if that is yours to do.","ch":1,"q":""}]},{"name":"Vellacott, Ruth","letter":"V","items":[{"n":74,"quote":"Ask them for something small.","ch":7,"q":""}]},{"name":"Vrba, Tomas","letter":"V","items":[{"n":5,"quote":"Fifteen minutes of packing, then out, whatever is still on the table.","ch":1,"q":""},{"n":69,"quote":"Trade first. Talk after.","ch":7,"q":""},{"n":95,"quote":"Keep a bad map of the whole county.","ch":9,"q":""}]},{"name":"Winslow, Bea","letter":"W","items":[{"n":3,"quote":"Fill the bath. Then fill everything else. Then sit down and think.","ch":1,"q":""},{"n":44,"quote":"It is a house. Leave it.","ch":4,"q":""},{"n":46,"quote":"Shoes at the door, felt on everything, cloth in the cutlery drawer.","ch":5,"q":""},{"n":66,"quote":"Eat it now.","ch":6,"q":""},{"n":83,"quote":"Two people count the store, and they are not friends.","ch":8,"q":""}]}],"blurb":["They do not eat. They bite once and walk on, which is why almost everybody bitten lived long enough to turn, and why there are so many of them and so few of us. They are slower than you. They never stop. In a hard frost they stand still in the road like furniture, and in August they are quick and they are falling apart, and the difference between those two facts is the difference between a working season and a season you survive.","Ninety-nine rules for staying alive, collected out of eleven hundred notebooks by the woman who runs the Long Room, and set down with what each rule is worth and the exact place where it fails. How far you can walk before your feet decide the matter. Why the fire doors were the wrong fight. What a bite looks like on day one and what it looks like on day six. Which of the sounds you make can be heard at two miles and which cannot be heard at forty feet. When to open the door.","Every rule is signed, and the signature carries the day the writer was on. Fifty-one are verbatim, in the hand of the person named. The rules argue with each other, and they have been left arguing, because a manual that agrees with itself has been simplified into something you could get killed following.","The last chapter is about the fourth year, when it stops being an emergency and becomes the place you live. It has the fewest deaths in it. It is the chapter people ask for."],"intro":"<p>This is a manual of ninety-nine rules for staying alive, assembled from the papers of people who for the most part did not.</p><p>Each entry has four parts. The rule, in the words somebody wrote it down in. Who kept it, what they did before, and what day they were on when they wrote it. Then two paragraphs that are mine: why the rule works, which is the reasoning, and how it goes wrong, which is the body.</p><p><strong>The last paragraph is the point of the book.</strong> Anybody can tell you to keep quiet and stay off the roads. You know that. What nobody tells you is the precise circumstance in which keeping quiet gets your whole group killed, and there is one, and it is in chapter five. A rule with no stated failure is not a rule. It is a slogan. Slogans are most of why the first winter went the way it did.</p><p><strong>The rules disagree with each other, and I have left them disagreeing.</strong> Rule 70 says the door does not open, ever, and the man who wrote it has buried people who opened theirs. Rule 77 was written by a woman who has opened hers every time she has been asked, for four years, and who is alive, and whose settlement is the largest in this valley. Both are in here because both are true, in different weeks, to different people, and a manual that never contradicts itself has been tidied into uselessness. When two entries pull against each other I say so and I name the conditions. Deciding between them is yours. That is not me avoiding the question. It is the question.</p><p><strong>Almost nobody in this book was a fool.</strong> The genre before all this was full of collections that assumed otherwise, and they were worthless then and they would get you killed now. The man who welded the fire doors was a locksmith of thirty years and he was reasoning correctly about intrusion. The group that shot first had buried four people who had not. If your reaction to an entry is that the person was an idiot, the entry has failed and you should read the second paragraph again.</p><p><strong>What you need to know about them, in seven lines.</strong> It passes in saliva, into blood, by a bite. Not by air, not by water, not on your hands. They do not eat, which is the fact everything else hangs from: they bite once and walk on, so almost everyone bitten lives long enough to turn, which is why there are so many of them and so few of us. Turning takes between four hours and nine days. They are slow, about four miles an hour, and they never stop, and the difference between those two facts is the whole of chapter three. They hunt by sound, then by movement, then by smell, and they use smell to tell each other apart. They run on the air temperature: below four degrees they are slow, in a hard frost they stand still, and in August they are quick and they rot. The brain stops them, or the spine above the shoulders, or enough broken frame that the legs will not carry them.</p><p><strong>Learn the seasons before you learn the weapons.</strong> Everyone wants the chapter on killing them. There is no chapter on killing them, because killing them is a thing you do when the rest of the manual has already failed. Winter is the working season. Summer is the season you get through. The single most useful sentence I can give you is that a plan made in February will kill you in July, and half the graves I have dug were dug for people who made one good plan and kept it.</p><p><strong>How it is arranged.</strong> Three parts, by the problem in front of you. The First Week covers the first hour, what to believe, and moving. The Body and the Building covers doors, noise, and the unglamorous business of water, food and teeth. Everyone Else covers other people, your own group, and the long middle, which is what we are in now and what nobody wrote a rule for, because nobody expected to get here.</p><p><strong>Chapter nine is the reason for the other eight.</strong> It is about the fourth year. It has the fewest deaths in it and it is the chapter people ask me for. Read it last, or read it first if this week has been bad.</p><p><strong>On me.</strong> I run the Long Room, which was a subscription library in Beeston and is now a store of paper, seed and about eleven hundred notebooks. I did not write these rules. I collected them, checked them where checking was possible, and wrote the two paragraphs underneath. Where an entry is my own I have signed it. Where I have reconstructed a rule from somebody who could not write it down themselves, the note at the back says so.</p><p>The Long Room, Beeston. The fourth winter.</p>","note":"<p>Eleven hundred notebooks came into the Long Room between the second autumn and this one. Most arrived in bin bags, brought by people who had cleared a house and could not bring themselves to burn the paper in it. Ninety-nine rules came out. It is worth saying plainly what that number is made of, because a manual that will not show its working is asking you to bet your life on a stranger&#x27;s memory.</p><p><strong>Fifty-one are verbatim.</strong> The rule is on the page in the hand of the person named, and I have the page. Where the wording is odd I have left it odd. Bea Winslow wrote in the imperative because she had spent forty years writing Post Office notices, and her rules read like Post Office notices, and I am not going to improve them.</p><p><strong>Twenty-two are verbatim but undated.</strong> The rule is in the notebook and the day count is my estimate, taken from what is around it: a weather note, a death, a mention of the frost. Where I have guessed I have guessed low, because people write rules down after the thing that taught them, not before.</p><p><strong>Twenty-five are reconstructed.</strong> Somebody told me a rule that somebody else had kept, and the second person was dead, and there is no page. I have written those in the words I was given and named the person they belong to. Two of them I have from three separate mouths that never met, which is the strongest evidence in the collection and also, I am aware, exactly what a well travelled invention looks like.</p><p><strong>One is mine.</strong> It is the last entry in the book and it is signed with this building, because leaving a gap in a manual is worse than filling it in your own name. Fifty-one and twenty-two and twenty-five and one is ninety-nine, and if that arithmetic ever stops working then somebody has edited this without telling me.</p><p><strong>On Idris Pyle.</strong> Four rules in this book are attributed to a man who by his own account was a confidence trickster in Sheffield before all this, and who by the account of four other people was a driving instructor. His rules are the best writing in the collection. They are also, two of them, wrong in ways I can demonstrate, and one of those is a rule for taking food off a group of strangers dressed up as a rule for joining one. I have kept all four and marked the two. If you want a single reason to distrust every attribution in this book, it is that the most quotable man in it is the one I am least sure existed. Two of the notebooks in his hand are in different hands.</p><p><strong>On the neat ones.</strong> Four rules arrived already famous, passed mouth to mouth across three counties, attached to no notebook and no body. They are the four best sentences in the manual. That is the tell. A rule that has been polished by three hundred retellings is a rule that has been optimised for being repeated, which is not the same property as being true, and the entries say so where I could establish it and admit it where I could not.</p><p><strong>On the dead.</strong> Thirty-six people have rules in this book, and the index gives each of them with the entries they contributed. Two hundred and six are named somewhere in these pages once you count the ones who appear inside an entry rather than at the head of one, and of those, a hundred and seventy-one are dead, twenty-nine are alive as of the first frost, and six I have no word of either way. I have been asked more than once to take the day counts out, on the grounds that they make the book frightening to read. They stay in. A rule is worth what it cost, and the day count is the price on the tag.</p><p><strong>On what is missing.</strong> There is nothing in here about children under four, because the two people who knew most about that both died in the second summer and I will not reconstruct what I do not understand. There is nothing about the coast, which is a different apocalypse with different rules, and Hana Sørensen has a notebook of her own and is welcome to it. There is nothing about London.</p><p>If you have a notebook, the Long Room is on the corner where the bank was. Bring it. If the rule in it is better than the rule in here, the rule in here comes out.</p>","introTitle":"How to Use This Book","noteTitle":"A Note on the Sources","indexTitle":"Index of Names"}</script>

}
var FLOW_HTML = (function(){
  var h = '<div class="ch-head ch-head--first plain" id="c-intro"><h2>'+esc(BOOK.introTitle)+'</h2></div>'+
          '<div class="plain">'+BOOK.intro+'</div>';

// The page is a fixed object, like a printed one: the same words fall on page
// seven whatever you are reading it on. The screen only changes how big the
// book is drawn, never how the type is set.
var PAGE = {w:430, h:628};

/* A phone cannot show a whole spread at a size anyone would read. So on a

function fitView(){
  var vw = window.innerWidth, vh = window.innerHeight;
  // the controls sit above the book and the page number below it, so the

  var room = Math.max(vh - 72, vh*0.55);
  var spread = Math.min(1, (vw*0.94)/(2*G.pw + G.T*2), room/G.ph);
  var one    = Math.min(1, (vw*0.94)/(G.pw + G.T), room/G.ph);
  var was = G.single;
  // only when framing one page actually buys size: in landscape the height
  // is the constraint, and halving the view would gain nothing
  G.single = spread < 0.62 && one > spread * 1.15;
  G.fit = G.single ? one : spread;
  applyView();
  var hint = document.getElementById("hint");
  if(hint) hint.textContent = G.single
    ? "Swipe to turn the page \u00b7 drag the desk to turn the book \u00b7 pinch to zoom"
    : "Drag to turn the book \u00b7 drag a page corner to turn it \u00b7 scroll or pinch to zoom where you point";
  if(was !== G.single && faces.verso) paint();
}

function layout(){
  G.ph = PAGE.h;
  G.pw = PAGE.w;
  G.m  = Math.round(G.pw*0.105);
  G.vm = Math.round(G.ph*0.075);
  G.padX = Math.round(G.pw*0.10);
  G.padY = Math.round(G.ph*0.22);
  fitView();

  book.innerHTML = "";
  faces = {};

  // back board and the two half blocks of pages
  el("board board--back",null,"width:"+(G.pw+8)+"px;height:"+(G.ph+14)+"px;left:-4px;top:"+
     (-G.ph/2-7)+"px;transform:translateZ("+(-G.T-10)+"px)");
  var sp = el("spine",null,"width:"+(G.T+12)+"px;height:"+(G.ph+14)+"px;left:0;top:"+
     (-G.ph/2-7)+"px;transform-origin:left center;transform:translateZ("+(-G.T-6)+
     "px) rotateY(-90deg)");
  sp.innerHTML = "<span>Lines Worth Keeping</span>";
  faces.spine = sp;

  // the page block: opaque leaves stacked through the depth, so the book reads
  // as solid from any angle rather than hollow between the covers
  faces.stackL = el("stack",null,"width:"+G.pw+"px;height:"+G.ph+"px;left:"+(-G.pw)+
    "px;top:"+(-G.ph/2)+"px");
  faces.stackR = el("stack",null,"width:"+G.pw+"px;height:"+G.ph+"px;left:0;top:"+
    (-G.ph/2)+"px");
  for(var si=0; si<STACK; si++){
    faces.stackL.appendChild(document.createElement("i"));
    faces.stackR.appendChild(document.createElement("i"));
  }

  faces.verso = makeFace("face--verso"); faces.verso.style.left = (-G.pw)+"px";
  faces.recto = makeFace("face--recto"); faces.recto.style.left = "0px";
  faces.recto.insertAdjacentHTML("beforeend",'<div class="corner" id="corner"></div>');

  var leaf = el("leaf",null,"width:"+(2*G.pw+2*G.padX)+"px;height:"+(G.ph+2*G.padY)+
    "px;left:"+(-G.pw-G.padX)+"px;top:"+(-G.ph/2-G.padY)+"px;display:none");
  faces.leaf = leaf;
  faces.leafFront = makeFace("peel peel__base");
  faces.leafBack  = makeFace("peel peel__flap");
  leaf.appendChild(faces.leafFront);
  leaf.appendChild(faces.leafBack);
  faces.leafFront.style.display = "none";
  faces.leafBack.style.display  = "none";
  faces.leafFront.insertAdjacentHTML("beforeend",'<div class="peel__shade"></div>');
  faces.leafBack.insertAdjacentHTML("beforeend",'<div class="peel__shade"></div>');

  // the marker: a band that lies across the page it marks, and a tail that
  // hangs below the book whether or not you are on that page
  var rw = Math.max(9, Math.round(G.pw*0.034));
  var tail = Math.round(G.ph*0.15);
  G.rw = rw;
  var rb = el("ribbon",null,"left:0;top:"+(-G.ph/2-5)+"px;width:"+rw+"px;height:"+
    (G.ph+5+tail)+"px;transform:translateZ(2px) rotate(.5deg)");
  rb.innerHTML = '<div class="ribbon__band" style="height:'+(G.ph+5)+'px"></div>'+
                 '<div class="ribbon__tail" style="height:'+tail+'px"></div>';
  rb.title = "Drag the marker on to a page to keep your place";
  faces.ribbon = rb;

  var front = el("board board--front",null,"width:"+(G.pw+8)+"px;height:"+(G.ph+14)+"px;left:0;top:"+
     (-G.ph/2-7)+"px;transform:translateZ(6px)");
  front.id = "front";
  front.innerHTML =
    '<div class="board__face" style="font-size:'+Math.round(G.pw*0.052)+'px">'+
      '<div class="jacket">'+
        '<div class="jacket__rule"></div><div class="jacket__rule jacket__rule--in"></div>'+
        '<div class="jacket__prick"></div>'+
        '<div class="jacket__eyebrow">A commonplace book</div>'+
        '<div class="jacket__body"><div class="jacket__title">Lines Worth<br>Keeping</div>'+
        '<hr class="jacket__hr"><p class="jacket__sub">'+esc(BOOK.subtitle)+'</p>'+
        (BOOK.author ? '<p class="jacket__by">'+esc(BOOK.author)+'</p>' : '')+'</div>'+
        '<div class="jacket__foot">315 entries · 21 chapters</div>'+
      '</div></div>'+
    '<div class="board__face board__face--in"></div>';
  faces.front = front;

  // page count, measured from one of the flows
  var probe = faces.recto.querySelector(".face__flow");
  S.pages = Math.max(2, Math.round(probe.scrollWidth / G.pw));
  starts = {};
  ["c-intro","c-note","c-index"].concat(BOOK.chapters.map(function(c){return "c"+c.n;}))
    .forEach(function(id){
      var n = probe.querySelector("#"+CSS.escape(id));
      if(n) starts[id] = Math.floor((n.offsetLeft+1)/G.pw);
    });
  paint();
}

function pageOf(node){ return Math.floor((node.offsetLeft+1)/G.pw); }

function setFace(f, idx){
  var flow = f.querySelector(".face__flow");
  flow.style.transform = "translateX("+(-idx*G.pw)+"px)";
  var blank = idx < 0 || idx >= S.pages;
  flow.style.visibility = blank ? "hidden" : "visible";
  var rule = f.querySelector(".face__rule");
  var rh = f.querySelector(".runhead"), fo = f.querySelector(".folio");
  var verso = f.classList.contains("face--verso") || f.classList.contains("face--back");
  rule.style.cssText = "top:"+G.vm+"px;height:"+(G.ph-2*G.vm)+"px;"+
    (verso ? "right:"+(G.m-13)+"px" : "left:"+(G.m-13)+"px")+
    ";display:"+(blank?"none":"block");
  rh.style.cssText = "top:"+Math.round(G.vm/2-5)+"px;left:"+G.m+"px;width:"+(G.pw-2*G.m)+
    "px;text-align:"+(verso?"left":"right")+";display:"+(blank?"none":"block");
  fo.style.cssText = "bottom:"+Math.round(G.vm/2-5)+"px;left:0;width:"+G.pw+
    "px;text-align:center;display:"+(blank?"none":"block");
  rh.textContent = blank ? "" : runningHead(idx);
  fo.textContent = blank ? "" : String(idx+1);
}

function runningHead(idx){
  var best = "Lines Worth Keeping";
  BOOK.chapters.forEach(function(c){
    var s = starts["c"+c.n];
    if(s !== undefined && s <= idx) best = "Ch " + c.n + " · " + c.title;
  });
  if(starts["c-note"] !== undefined && starts["c-note"] <= idx) best = BOOK.noteTitle;
  return best;
}

function paint(){
  var L = S.spread*2, R = L+1;
  setFace(faces.verso, L);
  setFace(faces.recto, R);
  var t = S.pages ? S.spread/Math.max(1,Math.ceil(S.pages/2)) : 0;
  [["stackL", S.open ? t : 0], ["stackR", S.open ? 1-t : 1]].forEach(function(pair){
    var node = faces[pair[0]], frac = pair[1];
    node.style.display = frac > 0.02 ? "block" : "none";
    var d = Math.max(2, G.T*Math.max(0.05, frac));
    Array.prototype.forEach.call(node.children,function(sl,i){
      sl.style.transform = "translateZ("+(-1 - (i+1)*(d/STACK)).toFixed(2)+"px)";
    });
  });
  faces.verso.style.display = S.open ? "block" : "none";
  faces.recto.style.display = S.open ? "block" : "none";
  faces.spine.style.display = S.open ? "none" : "block";
  if(!S.coverAnim && !(S.turning && S.turning.cover)){
    faces.front.style.transform = coverTransform(S.open ? -178 : 0);
  }
  var marked = S.mark === null ? -1 : Math.floor(S.mark/2);
  var onMark = S.open && marked === S.spread;
  if(!S.ribbonDrag){
    var x;
    if(onMark) x = (S.mark % 2 === 1) ? Math.round(G.pw*0.17)
                                      : -Math.round(G.pw*0.17) - G.rw;
    else x = Math.round(G.pw*0.045);
    faces.ribbon.style.left = x + "px";
  }
  faces.ribbon.querySelector(".ribbon__band").style.display = onMark ? "block" : "none";

  if(S.open){
    var want = "#p" + (S.spread*2 + 1 + (G.single ? S.focus : 0));
    if(location.hash !== want){
      try{ history.replaceState(null, "", want); }catch(e){}
    }
  }
  document.getElementById("where").textContent = !S.open
    ? "Closed \u00b7 drag the cover to open"
    : G.single
      ? "Page " + Math.min(L+1+S.focus, S.pages) + " of " + S.pages
      : "Pages " + (L+1) + "\u2013" + Math.min(R+1,S.pages) + " of " + S.pages;
  applyView();
  store("lwk3:spread", String(S.spread));
  store("lwk3:focus", String(S.focus));
}

function applyView(){
  var lim = Math.max(window.innerWidth, window.innerHeight) * 0.9;
  S.panX = clamp(S.panX, -lim, lim);
  S.panY = clamp(S.panY, -lim, lim);
  camera.style.transform = "translate("+S.panX.toFixed(1)+"px,"+S.panY.toFixed(1)+
    "px) scale("+(G.fit*S.zoom).toFixed(3)+")";
  var shift = !S.open ? -G.pw/2
            : G.single ? (S.focus ? -G.pw/2 : G.pw/2)
            : 0;
  book.style.transform = "translateX("+shift+"px) rotateX("+S.rx.toFixed(2)+
    "deg) rotateY("+S.ry.toFixed(2)+"deg)";
}

/* ---------- turning: a fold across the perpendicular bisector ---------- */
/* Dragging the corner C to a point P folds the sheet along the line that is
   equidistant from both. Everything past that line is the reflection of the
   sheet in it, which is what paper actually does, and it mirrors the reverse
   side's printing exactly as a real folded corner does. */
function reflectAcross(M, n){
  var a = 1 - 2*n[0]*n[0], b = -2*n[0]*n[1];
  var c = b,               d = 1 - 2*n[1]*n[1];
  var k = 2*(M[0]*n[0] + M[1]*n[1]);
  return "matrix("+a.toFixed(5)+","+b.toFixed(5)+","+c.toFixed(5)+","+
         d.toFixed(5)+","+(k*n[0]).toFixed(2)+","+(k*n[1]).toFixed(2)+")";
}
/* Paper does not crease along a straight line, it bows. Both halves are cut
   with the SAME curve, so they still tile exactly and the reflection stays
   true, but the seam reads as a bend rather than a fold. */
function foldEdge(W, H, M, n, side, amp){
  var d = [-n[1], n[0]];
  var L = Math.hypot(W, H) * 1.7, BIG = L;
  var pts = [], N = 22, span = L * 0.46;
  for(var i = 0; i <= N; i++){
    var s = -L + 2*L*(i/N);
    var k = Math.max(0, 1 - (s/span)*(s/span));
    var b = -amp * k * k;                 // bows toward the corner being lifted
    pts.push([M[0] + s*d[0] + b*n[0], M[1] + s*d[1] + b*n[1]]);
  }
  pts.push([M[0] + L*d[0] + side*BIG*n[0], M[1] + L*d[1] + side*BIG*n[1]]);
  pts.push([M[0] - L*d[0] + side*BIG*n[0], M[1] - L*d[1] + side*BIG*n[1]]);
  return "polygon(" + pts.map(function(q){
    return q[0].toFixed(1)+"px "+q[1].toFixed(1)+"px"; }).join(",") + ")";
}

function beginTurn(dir){
  if(S.turning) return false;
  var L = S.spread*2;
  if(dir > 0 && (L+2) >= S.pages) return false;
  if(dir < 0 && S.spread === 0) return false;

  var base = faces.leafFront, flap = faces.leafBack;
  var x = G.padX + (dir > 0 ? G.pw : 0);
  [base, flap].forEach(function(f){
    f.style.left = x + "px";
    f.style.top = G.padY + "px";
    f.style.display = "block";
    f.style.transform = "none";
    f.style.clipPath = "none";
  });
  if(dir > 0){
    setFace(base, L+1); setFace(flap, L+2); setFace(faces.recto, L+3);
  }else{
    setFace(base, L);   setFace(flap, L-1); setFace(faces.verso, L-2);
  }
  faces.leaf.style.display = "block";
  // C is the free corner: the fore edge, at the foot of the page
  S.turning = {dir:dir, C:[dir > 0 ? G.pw : 0, G.ph], p:[dir > 0 ? G.pw : 0, G.ph], t:0};
  fold(0);
  return true;
}

function fold(prog){
  var T = S.turning; if(!T) return;
  T.t = clamp(prog, 0, 1);
  var W = G.pw, H = G.ph, dir = T.dir;
  // the corner travels across the spread and a little upward, as a hand does
  var cx = dir > 0 ? W - 2*W*T.t : 2*W*T.t;
  var cy = H - Math.sin(Math.PI*T.t) * H*0.13;
  T.p = [cx, cy];
  var C = T.C;
  var vx = cx - C[0], vy = cy - C[1], len = Math.hypot(vx, vy);
  var base = faces.leafFront, flap = faces.leafBack;
  var shB = base.querySelector(".peel__shade"), shF = flap.querySelector(".peel__shade");
  if(len < 1){
    base.style.clipPath = "none"; base.style.transform = "none";
    flap.style.display = "none"; shB.style.opacity = "0";
    return;
  }
  flap.style.display = "block";
  var n = [vx/len, vy/len];
  var M = [(C[0]+cx)/2, (C[1]+cy)/2];
  // the bow is deepest mid-turn and flattens out at either end
  var amp = 30 * Math.sin(Math.PI * clamp(T.t, 0, 1));
  base.style.clipPath = foldEdge(W,H,M,n,1,amp);
  flap.style.clipPath = foldEdge(W,H,M,n,-1,amp);
  flap.style.transform = reflectAcross(M, n);
  // shading reads as a cylinder: a soft core of shadow at the bend, falling
  // away on both sides, rather than one hard edge
  var deg = (Math.atan2(-n[0], n[1]) * 180/Math.PI).toFixed(1);
  shB.style.background = "linear-gradient("+deg+"deg,rgba(0,0,0,.34) 0%," +
    "rgba(0,0,0,.16) 6%,rgba(0,0,0,0) 20%)";
  shB.style.opacity = (0.55*Math.sin(Math.PI*Math.min(1,T.t*1.4))+0.12).toFixed(2);
  shF.style.background = "linear-gradient("+deg+"deg,rgba(255,255,255,.55) 0%," +
    "rgba(255,255,255,.16) 9%,rgba(0,0,0,.10) 34%,rgba(0,0,0,.20) 100%)";
  shF.style.opacity = "0.62";
}

function settleTurn(commit){
  var T = S.turning; if(!T || T.anim) return;
  var dir = T.dir, from = T.t, to = commit ? 1 : 0;
  var t0 = performance.now(), ms = reduce.matches ? 1 : 420;
  T.anim = true;
  T.done = function(){
    if(S.turning !== T) return;
    fold(to);
    faces.leafFront.style.display = "none";
    faces.leafBack.style.display = "none";
    faces.leaf.style.display = "none";
    S.turning = null;
    if(commit){
      S.spread += dir;
      if(G.single) S.focus = dir > 0 ? 0 : 1;
    }
    paint();
  };
  (function step(now){
    if(S.turning !== T) return;
    var u = clamp((now - t0)/ms, 0, 1);
    var e = u < 0.5 ? 2*u*u : 1 - Math.pow(-2*u+2,2)/2;
    fold(from + (to-from)*e);
    if(u < 1){ T.raf = requestAnimationFrame(step); return; }
    T.done();
  })(t0);
}
// Let a settling turn be cut short, so pages can be taken quickly one after
// another instead of each waiting on the last to finish.
function finishTurnNow(){
  var T = S.turning;
  if(T && T.anim && T.done){
    if(T.raf) cancelAnimationFrame(T.raf);
    T.done();
  }
}
function endTurn(commit){ settleTurn(commit); }
function turnBy(dir){
  if(!S.open) return;
  finishTurnNow();
  if(S.turning) return;
  if(!beginTurn(dir)) return;
  settleTurn(true);
}
// Frame the other page of the spread. A swipe slides across; a turn has
// already carried the eye, so that one lands without the slide.
function setFocus(f, slide){
  if(!G.single || S.focus === f) return;
  S.focus = f;
  if(slide){
    book.classList.add("is-shifting");
    setTimeout(function(){ book.classList.remove("is-shifting"); }, 360);
  }
  paint();
}
// One step forward or back: on a narrow screen that is one page, otherwise
// one spread.
function stepBy(dir){
  if(!S.open) return;
  if(!G.single){ turnBy(dir); return; }
  if(dir > 0 && S.focus === 0){ setFocus(1, true); return; }
  if(dir < 0 && S.focus === 1){ setFocus(0, true); return; }
  turnBy(dir);
}

/* ---------- opening and closing the covers ---------- */
function coverTransform(angle){
  var f = clamp(Math.abs(angle)/178, 0, 1);
  var z = 6 - f * (G.T + 12);
  return "translateZ(" + z.toFixed(1) + "px) rotateY(" + angle.toFixed(1) + "deg)";
}
function openBook(){
  if(S.open) return;
  S.coverAnim = true;
  var f = faces.front;
  f.style.transition = "transform .8s cubic-bezier(.32,.02,.2,1)";
  f.style.transform = coverTransform(-178);
  setTimeout(function(){ S.open = true; S.coverAnim = false; paint(); f.style.transition=""; }, 640);
  store("lwk3:open","1");
}
function closeBook(){
  if(!S.open) return;
  S.open = false; S.spread = 0; S.coverAnim = true;
  var f = faces.front;
  f.style.transition = "none";
  f.style.transform = coverTransform(-178);
  paint();
  requestAnimationFrame(function(){
    f.style.transition = "transform .8s cubic-bezier(.32,.02,.2,1)";
    f.style.transform = coverTransform(0);
    setTimeout(function(){ f.style.transition=""; S.coverAnim = false; }, 820);
  });
  store("lwk3:open","0");
}


/* Zoom towards a point rather than the middle of the screen. The camera sits
   at the centre and is transformed translate(pan) scale(s), so a point p on
   the book lands at centre + pan + s*p. Holding the point under the cursor
   still means pan' = d - (s'/s)(d - pan), where d is the cursor's offset from
   the centre. */
function stageCentre(){
  var r = stage.getBoundingClientRect();
  return [r.left + r.width/2, r.top + r.height/2];
}
function zoomAt(next, clientX, clientY){
  next = clamp(next, 0.4, 4);
  var c = stageCentre();
  var dx = clientX - c[0], dy = clientY - c[1];
  var k = next / S.zoom;
  S.panX = dx - k * (dx - S.panX);
  S.panY = dy - k * (dy - S.panY);
  S.zoom = next;
  applyView();
  store("lwk3:zoom", String(S.zoom));
}
function zoomCentre(next){
  var c = stageCentre();
  zoomAt(next, c[0] + S.panX, c[1] + S.panY);
}

/* ---------- pointer: orbit, corner drag, cover drag ---------- */
/* How far a finger has to travel to carry a page all the way over. It follows
   the spread as it appears on screen, but never asks for more than the screen
   can give: zoomed in, the book is wider than the window, and a turn that
   wanted half a spread of travel could not be finished at all. */
function dragSpan(){
  var onScreen = (2*G.pw*G.fit*S.zoom) || 600;
  var reach = Math.max(220, window.innerWidth * 0.45);
  return Math.max(90, Math.min(onScreen, reach));
}
/* Speed is measured over the last 90ms of the drag rather than the last
   event: browsers deliver moves in bursts, and two of them can carry the
   same timestamp. */
function trailSpeed(tr){
  var last = tr[tr.length-1], i = tr.length-1;
  while(i > 0 && last[1] - tr[i-1][1] < 90) i--;
  var dt = last[1] - tr[i][1];
  return dt > 0 ? (last[0] - tr[i][0])/dt : 0;
}
var drag = null;
stage.addEventListener("pointerdown", function(ev){
  if(ev.button && ev.button !== 1) return;
  if(ev.target.closest(".hud,.sheet,.edge,.edge-y")) return;
  stage.setPointerCapture(ev.pointerId);
  var onFront = !S.open && ev.target.closest(".board--front");
  if(S.turning && S.turning.anim) finishTurnNow();
  var onRibbon = ev.target.closest(".ribbon__band,.ribbon__tail");
  var onRecto = S.open && !onRibbon && ev.target.closest(".face--recto,.corner");
  var onVerso = S.open && ev.target.closest(".face--verso");
  var onPage = G.single && (onRecto || onVerso);
  var wantsPan = ev.shiftKey || ev.button === 1;
  drag = {x0:ev.clientX, y0:ev.clientY, rx:S.rx, ry:S.ry,
          trail:[[ev.clientX, performance.now()]], v:0,
          panX:S.panX, panY:S.panY,
          ribX: parseFloat(faces.ribbon.style.left) || 0,
          mode: wantsPan ? "pan" : onRibbon ? "ribbon"
              : onFront ? "cover" : onPage ? "page"
              : onRecto ? "fwd" : onVerso ? "back" : "orbit",
          started:false};
  stage.classList.add("is-grabbing");
  document.getElementById("hint").style.opacity = "0";
});
stage.addEventListener("pointermove", function(ev){
  if(!drag) return;
  var dx = ev.clientX - drag.x0, dy = ev.clientY - drag.y0;
  if(!drag.started && Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
  drag.started = true;
  // sideways speed at the moment of release, so a flick counts as a turn
  drag.trail.push([ev.clientX, performance.now()]);
  if(drag.trail.length > 12) drag.trail.shift();
  drag.v = trailSpeed(drag.trail);
  var span = dragSpan();
  if(drag.mode === "ribbon"){
    S.ribbonDrag = true;
    faces.ribbon.classList.add("is-dragging");
    var sc = (G.fit * S.zoom) || 1;
    var nx = clamp(drag.ribX + dx/sc, -G.pw + 4, G.pw - G.rw - 4);
    faces.ribbon.style.left = nx + "px";
  }else if(drag.mode === "pan"){
    S.panX = drag.panX + dx;
    S.panY = drag.panY + dy;
    applyView();
  }else if(drag.mode === "orbit"){
    S.ry = clamp(drag.ry + dx*0.32, -78, 78);
    S.rx = clamp(drag.rx - dy*0.26, -62, 62);
    applyView(); syncDials();
  }else if(drag.mode === "cover"){
    if(!S.turning && dx < -4){
      S.turning = {cover:true};
      S.coverAnim = true;
      faces.front.style.transition = "none";
    }
    if(S.turning && S.turning.cover){
      var a = -178*clamp(-dx/span,0,1);
      faces.front.style.transform = coverTransform(a);
      S.turning.angle = a;
    }
  }else if(drag.mode === "page"){
    // one page at a time: a swipe either slides across the spread or, when
    // there is nothing left to slide to, lifts the leaf
    drag.dx = dx;
    var want = dx < 0 ? 1 : -1;
    var lifts = want > 0 ? S.focus === 1 : S.focus === 0;
    if(lifts){
      if(!S.turning && Math.abs(dx) > 4) beginTurn(want);
      if(S.turning && !S.turning.cover && !S.turning.anim){
        fold(want > 0 ? (-dx/span) : (dx/span));
      }
    }
  }else{
    var dir = drag.mode === "fwd" ? 1 : -1;
    if(!S.turning){ if((dir>0 && dx<-4)||(dir<0 && dx>4)) beginTurn(dir); }
    if(S.turning && !S.turning.cover && !S.turning.anim){
      fold(dir > 0 ? (-dx/span) : (dx/span));
    }
  }
});
function releaseDrag(){
  if(!drag) return;
  stage.classList.remove("is-grabbing");
  if(S.turning && S.turning.cover){
    var a = S.turning.angle || 0;
    var threw = drag.v < -0.35;
    S.turning = null;
    faces.front.style.transition = "transform .55s cubic-bezier(.32,.02,.2,1)";
    if(Math.abs(a) > 55 || (threw && Math.abs(a) > 12)){
      faces.front.style.transform = coverTransform(-178);
      setTimeout(function(){ S.open = true; S.coverAnim = false; paint(); faces.front.style.transition=""; }, 470);
      store("lwk3:open","1");
    }else{
      faces.front.style.transform = coverTransform(0);
      setTimeout(function(){ S.coverAnim = false; }, 560);
    }
  }else if(S.turning){
    // a third of the way carries it, and so does a flick, however short
    var d = S.turning.dir;
    var flick = d > 0 ? drag.v < -0.35 : drag.v > 0.35;
    endTurn(S.turning.t > 0.34 || (flick && S.turning.t > 0.05));
  }else if(drag.mode === "page" && drag.started){
    var moved = drag.dx || 0;
    var quick = Math.abs(drag.v) > 0.35 && (drag.v < 0) === (moved < 0);
    if(Math.abs(moved) > dragSpan()*0.16 || quick) setFocus(moved < 0 ? 1 : 0, true);
  }else if(drag.mode === "ribbon"){
    faces.ribbon.classList.remove("is-dragging");
    if(drag.started && S.open){
      // it stays on whichever page you let go over
      var at = parseFloat(faces.ribbon.style.left) || 0;
      var side = (at + G.rw/2) < 0 ? 0 : 1;
      S.mark = S.spread*2 + side;
      store("lwk3:mark", String(S.mark));
    }else if(!drag.started){
      if(S.mark !== null && Math.floor(S.mark/2) !== S.spread) goToPage(S.mark);
      else if(S.mark === null && S.open){
        S.mark = S.spread*2 + 1;
        store("lwk3:mark", String(S.mark));
      }
    }
    S.ribbonDrag = false;
    paint();
  }else if(!drag.started && drag.mode === "cover"){
    openBook();
  }
  drag = null;
}
stage.addEventListener("pointerup", releaseDrag);
stage.addEventListener("pointercancel", releaseDrag);

stage.addEventListener("wheel", function(ev){
  ev.preventDefault();
  zoomAt(S.zoom * (ev.deltaY > 0 ? 0.9 : 1.1), ev.clientX, ev.clientY);
}, {passive:false});

// Pinch: scale about the midpoint of the two fingers, and let that midpoint
// carry the book with it, so two fingers both zoom and pan.
var pts = {}, pinch = null;
function midOf(a, b){ return [(a[0]+b[0])/2, (a[1]+b[1])/2]; }
stage.addEventListener("pointerdown", function(ev){
  pts[ev.pointerId] = [ev.clientX, ev.clientY];
});
stage.addEventListener("pointermove", function(ev){
  if(!(ev.pointerId in pts)) return;
  pts[ev.pointerId] = [ev.clientX, ev.clientY];
  var ids = Object.keys(pts);
  if(ids.length !== 2){ pinch = null; return; }
  drag = null;
  var a = pts[ids[0]], b = pts[ids[1]];
  var dist = Math.hypot(a[0]-b[0], a[1]-b[1]);
  var mid = midOf(a, b);
  if(!pinch){
    pinch = {dist:dist, zoom:S.zoom, mid:mid, pan:[S.panX, S.panY], c:stageCentre()};
    return;
  }
  var next = clamp(pinch.zoom * (dist / pinch.dist), 0.4, 4);
  var k = next / pinch.zoom;
  var d0x = pinch.mid[0] - pinch.c[0], d0y = pinch.mid[1] - pinch.c[1];
  S.panX = (mid[0] - pinch.c[0]) - k * (d0x - pinch.pan[0]);
  S.panY = (mid[1] - pinch.c[1]) - k * (d0y - pinch.pan[1]);
  S.zoom = next;
  applyView();
  store("lwk3:zoom", String(S.zoom));
});
function dropPt(ev){
  delete pts[ev.pointerId];
  if(Object.keys(pts).length < 2) pinch = null;
}
stage.addEventListener("pointerup", dropPt);
stage.addEventListener("pointercancel", dropPt);

/* ---------- controls ---------- */
var dialX = document.getElementById("dial-x");   // bottom edge: turns the book
var dialY = document.getElementById("dial-y");   // right edge: tilts the book
var edgeRead = document.getElementById("edge-read");
var readTimer;

function sizeEdges(){
  var wrap = document.querySelector(".edge-y");
  if(wrap) dialY.style.width = wrap.clientHeight + "px";
}
function syncDials(){
  dialX.value = Math.round(S.ry);
  // the vertical slider reads upward, and looking from higher up is a more
  // negative rotateX, so it carries the opposite sign
  dialY.value = Math.round(-S.rx);
}
function flashRead(text){
  edgeRead.textContent = text;
  edgeRead.classList.add("is-live");
  clearTimeout(readTimer);
  readTimer = setTimeout(function(){ edgeRead.classList.remove("is-live"); }, 900);
}
function liveEdge(el){
  el.classList.add("is-live");
  clearTimeout(el.__t);
  el.__t = setTimeout(function(){ el.classList.remove("is-live"); }, 900);
}
dialX.addEventListener("input", function(){
  S.ry = clamp(parseFloat(dialX.value), -78, 78);
  applyView(); liveEdge(dialX); flashRead("X " + Math.round(S.ry) + "\u00b0");
});
dialY.addEventListener("input", function(){
  S.rx = clamp(-parseFloat(dialY.value), -62, 62);
  applyView(); liveEdge(dialY); flashRead("Y " + Math.round(-S.rx) + "\u00b0");
});

document.getElementById("btn-in").onclick = function(){ zoomCentre(S.zoom*1.2); };
document.getElementById("btn-out").onclick = function(){ zoomCentre(S.zoom/1.2); };
document.getElementById("btn-reset").onclick = function(){
  S.rx=-14; S.ry=0; S.zoom=1; S.panX=0; S.panY=0;
  syncDials();
  book.classList.add("is-settling");
  camera.style.transition = "transform .5s cubic-bezier(.3,.02,.2,1)";
  applyView();
  setTimeout(function(){ camera.style.transition = ""; }, 520);
  setTimeout(function(){ book.classList.remove("is-settling"); }, 520);
};
document.getElementById("btn-close").onclick = closeBook;

function sheet(id,on){ document.getElementById(id).dataset.open = on ? "true" : "false"; }
document.getElementById("btn-contents").onclick = function(){ sheet("sheet-contents",true); };
document.getElementById("btn-search").onclick = function(){
  sheet("sheet-search",true); setTimeout(function(){ document.getElementById("q").focus(); },60);
};
document.querySelectorAll("[data-close]").forEach(function(b){
  b.onclick = function(){ sheet("sheet-contents",false); sheet("sheet-search",false); };
});

function goToPage(idx){
  S.spread = clamp(Math.floor(idx/2), 0, Math.max(0,Math.ceil(S.pages/2)-1));
  S.focus = idx % 2;
  if(!S.open){ S.open = true; faces.front.style.transform = coverTransform(-178); }
  paint();
  sheet("sheet-contents",false); sheet("sheet-search",false);
}

(function buildToc(){
  var byPart=[], seen={};
  BOOK.chapters.forEach(function(ch){
    if(!seen[ch.part]){ seen[ch.part]={roman:ch.partRoman,name:ch.partName,chs:[]}; byPart.push(seen[ch.part]); }
    seen[ch.part].chs.push(ch);
  });
  document.getElementById("toc").innerHTML =
    '<button class="toc-row" data-page-id="c-intro"><span class="n">·</span>'+
    '<span class="t">'+esc(BOOK.introTitle)+'</span></button>' +
    byPart.map(function(p){
      return '<div class="toc-part"><h4><b>Part '+p.roman+'</b> · '+esc(p.name)+'</h4>'+
        p.chs.map(function(c){
          return '<button class="toc-row" data-page-id="c'+c.n+'"><span class="n">'+c.n+
            '</span><span class="t">'+esc(c.title)+'</span><span class="p" data-p="c'+c.n+'"></span></button>';
        }).join("")+"</div>";
    }).join("") +
    '<button class="toc-row" data-page-id="c-note"><span class="n">·</span>'+
    '<span class="t">'+esc(BOOK.noteTitle)+'</span></button>'+
    '<button class="toc-row" data-page-id="c-index"><span class="n">·</span>'+
    '<span class="t">'+esc(BOOK.indexTitle)+'</span></button>';
})();

document.addEventListener("click", function(ev){
  var row = ev.target.closest("[data-page-id]");
  if(row && starts[row.dataset.pageId] !== undefined) goToPage(starts[row.dataset.pageId]);
  var hit = ev.target.closest("[data-entry]");
  if(hit){
    var probe = faces.recto.querySelector(".face__flow");
    var node = probe.querySelector("#e"+hit.dataset.entry);
    if(node) goToPage(pageOf(node));
  }
});

var qt;
document.getElementById("q").addEventListener("input", function(e){
  clearTimeout(qt);
  var v = e.target.value.trim();
  qt = setTimeout(function(){
    var box = document.getElementById("results");
    if(v.length < 2){ box.innerHTML=""; return; }
    var t = v.toLowerCase();
    var hits = ALL.filter(function(x){
      return (x.quote+" "+x.attribution+" "+x.means+" "+x.use+" "+x.chTitle).toLowerCase().indexOf(t) !== -1;
    });
    box.innerHTML = hits.length ? hits.map(function(x){
      var q = esc(x.quote);
      if(!/[&<>"]/.test(v)) q = q.replace(new RegExp("("+v.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>");
      return '<button class="res" data-entry="'+x.n+'"><div class="q">\u201C'+q+'\u201D</div>'+
        '<div class="m">'+pad(x.n)+' · '+esc(x.attribution)+' · ch '+x.ch+'</div></button>';
    }).join("") : '<p class="empty">Nothing here. Try a plainer word.</p>';
  }, 160);
});

document.addEventListener("keydown", function(ev){
  if(ev.target.tagName === "INPUT") { if(ev.key==="Escape") ev.target.blur(); return; }
  if(ev.key === "ArrowRight") stepBy(1);
  else if(ev.key === "ArrowLeft") stepBy(-1);
  else if(ev.key === "Escape"){ sheet("sheet-contents",false); sheet("sheet-search",false); }
  else if(ev.key === "+" || ev.key === "="){ zoomCentre(S.zoom*1.2); }
  else if(ev.key === "-"){ zoomCentre(S.zoom/1.2); }
});

var rt;
window.addEventListener("resize", function(){
  clearTimeout(rt); rt = setTimeout(function(){ fitView(); sizeEdges(); syncDials(); }, 120);
});

S.zoom = clamp(parseFloat(recall("lwk3:zoom")||"1") || 1, 0.4, 4);
S.spread = parseInt(recall("lwk3:spread")||"0",10) || 0;
S.focus  = parseInt(recall("lwk3:focus")||"0",10) ? 1 : 0;
var savedMark = recall("lwk3:mark");
S.mark = (savedMark === null || savedMark === "null") ? null : (parseInt(savedMark,10) || 0);
layout();
sizeEdges();
syncDials();
var deep = (location.hash.match(/^#p(\d+)$/) || [])[1];
if(deep){
  S.open = true;
  S.spread = clamp(Math.floor((parseInt(deep,10)-1)/2), 0, Math.max(0,Math.ceil(S.pages/2)-1));
  S.focus = (parseInt(deep,10)-1) % 2;
  faces.front.style.transform = coverTransform(-178);
  paint();
}else if(recall("lwk3:open") === "1"){
  S.open = true;
  faces.front.style.transform = coverTransform(-178);
  paint();
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ layout(); });
})();
</script>
