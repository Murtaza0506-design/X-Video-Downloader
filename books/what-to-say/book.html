way you imagine. Your letter goes to somebody with a queue, a script and no great authority, and the outcome depends on making their job easy rather than on making them care.</p><p>That reframing changes almost everything. Emotion is the strongest tool in every other chapter of this book. Here it is close to useless, and it works against you. The person reading has been shouted at four times today and has the defences to prove it. What works instead is being the easiest correspondent in the queue.</p><p>Which means: dates, reference numbers, amounts, and one specific request. Say what happened, when, with the reference. Say what you want, as a number or an action. Say what you will do next if it is not resolved, without threatening. Keep it to one screen. What you are aiming at is a message that somebody with eleven minutes, four other cases and a screen full of mandatory fields can act on without having to ask you a single question, because every question they have to ask costs you a week.</p><p>The other thing worth knowing is that persistence beats force. Most complaints are abandoned at the second reply, and organisations are structured around that fact, by design or not. The person who sends a courteous fourth message with a reference number attached is in a small minority, and is treated as one.</p>","entries":[{"n":46,"quote":"An invoice is six weeks overdue.","bare":false,"attribution":"The freelancer's chase","means":"Dear Accounts,||Invoice 2041, dated 3 January, for £2,400, is now 42 days overdue. Payment terms were 14 days.||Could you confirm the payment date? If there is a problem with the invoice, tell me what it is and I will correct it today.||For reference: the work was signed off by Sarah Miles on 20 December and the purchase order number is PO-88213.||If I have not had a payment date by Friday the 21st, I will invoke the Late Payment of Commercial Debts Act, which entitles me to statutory interest and a fixed recovery charge. I would much rather not and I do not expect it to be necessary.||With thanks,||Murtaza Raza","use":"Every fact the accounts department needs to act, in one place: invoice number, date, amount, days overdue, sign-off, purchase order. Most chasers omit at least two of these and the reply is a request for them, which costs another week. The statutory reference is stated as a step you will take rather than as a threat, and *I would much rather not* is what keeps it from souring.","ch":10},{"n":47,"quote":"Something you bought is faulty and you want your money back.","bare":false,"attribution":"The complaint that works","means":"Dear Sir or Madam,||Order 55-2093, placed 14 February. The dishwasher was delivered on the 22nd and has not completed a cycle without stopping.||Under the Consumer Rights Act 2015 I am within the thirty days for a full refund of £429, which is what I am requesting.||An engineer attended on 3 March, reference ENG-4471, and confirmed the fault is with the pump. I have the report.||Please confirm the refund and arrange collection. If it is easier for you to replace rather than refund, I am open to that provided it is delivered within seven days.||I look forward to hearing from you.||Murtaza Raza","use":"Naming the legislation and the specific right, which moves the letter out of the discretionary pile and into the compliance pile. Offering the replacement as an alternative is the part people leave out. Give the organisation a cheaper way to satisfy you and the odds of a fast answer go up. You lose nothing by allowing it.","ch":10},{"n":48,"quote":"You cannot pay a bill and it is going to get worse.","bare":false,"attribution":"Telling a creditor before they chase","means":"Dear Sir or Madam,||Account 40028811. I am writing before the next payment is due rather than after it, because I am not going to be able to make it.||My circumstances changed in January when I was made redundant. I have applied for benefits and I have a start date for new work in April.||What I am proposing: £40 a month for the next three months instead of £210, and a return to the full amount from May, with the arrears added at £30 a month from June.||I would rather agree something now than default. I can provide evidence of the redundancy and the new contract.||I am contactable on the number on the account any weekday.||Murtaza Raza","use":"Arriving first. Creditors treat a proactive proposal as a different kind of file from a missed payment, because it moves the file out of collections and into arrangements. The proposal is specific, includes a return to normal, and deals with the arrears. That last part is the one people omit, and it decides whether the offer is accepted.","ch":10},{"n":49,"quote":"There is a charge on your bill you did not agree to.","bare":false,"attribution":"Disputing a charge","means":"Dear Sir or Madam,||Account 7712-0043. The March bill includes a charge of £89.99 described as \"Service Activation\". I did not request this service and I have no record of agreeing to it.||I am disputing the charge and asking for it to be removed and refunded.||I have checked my correspondence back to December and there is no confirmation email of the kind you send when a service is added. If you hold a recording or a record of my consent, please send it to me.||I have paid the remainder of the bill in full so that the account is not in arrears while this is resolved.||Please confirm within fourteen days.||Murtaza Raza","use":"Paying the undisputed part. It removes their strongest lever, which is treating you as a defaulter. It also shows good faith, and that makes the dispute easier to concede. Asking them to produce the evidence of consent puts the burden where it belongs, and it is the sentence that ends it.","ch":10},{"n":50,"quote":"You have complained twice and been fobbed off twice.","bare":false,"attribution":"Escalating properly","means":"Dear Sir or Madam,||Complaint reference CMP-90211, first raised 4 February, now seven weeks old.||I am asking for a deadlock letter or a final response so that I can refer this to the Ombudsman.||The history: I reported the fault on 4 February. I was told on the 19th that an engineer would attend within five working days; none did. On 12 March I was told the case had been closed, which nobody had informed me of. It was reopened on my call the same day.||I am not asking for anything beyond the original request, which was the repair and a refund of the two months of service charges, £58.||If a final response is not issued within eight weeks of the original complaint I will refer the matter regardless, as I am entitled to do.||Murtaza Raza","use":"Asking for the deadlock letter. It signals that you know the regulatory process, and organisations behave differently towards a complainant who knows what it is. The dated chronology is the other half. The ombudsman will want it, and the company knows somebody outside the building will read it.","ch":10}]},{"n":11,"title":"Praise and Thanks","part":"Six","partRoman":"VI","partName":"When Nothing Is Wrong","opening":"<p>Almost all praise is wasted, and it is wasted the same way every time. It is general. It is delivered to the person alone. And it arrives in a form that asks for a modest deflection, after which both parties forget it within the hour.</p><p>Three changes make it stick. None of them costs anything.</p><p>Be specific about the thing. <em>You were great in that meeting</em> is pleasant and evaporates. <em>The way you rephrased Sarah&#x27;s objection so she could back down from it without losing face</em> is a sentence somebody remembers for a decade. It tells them that a thing they did on purpose, and thought nobody saw, was seen.</p><p>Say what it did. Praise describes the performance; gratitude describes the effect. The second is rarer and it lands harder. It establishes that you were changed, and that is not something the recipient can shrug off.</p><p>And where it is safe to do so, say it to somebody else. Praise delivered to a person&#x27;s manager, or to the room, does something private praise cannot: it changes their standing, not just their mood.</p><p>The last thing worth saying is about timing. These letters are almost never urgent, which is why they do not get written. There is no deadline on a thank you. So it waits. Then it is late, then it is awkward, then it does not happen at all. The letters in this chapter are therefore all a little late, which is realistic, and not one of them apologises for it, which is deliberate, because an apology for lateness invites the reader to think about the delay instead of about the thing you are thanking them for.</p>","entries":[{"n":51,"quote":"Somebody did something significant for you and you said thanks in passing.","bare":false,"attribution":"The real thank you","means":"Dear Ruth,||I said thank you at the time and it was not adequate, so this is the proper version.||When I was falling apart in the autumn you did three things that I have thought about since. You moved the deadline without making me ask for it. You told me, in the corridor, that the work was still good, at a point when I had stopped believing that. And you never once mentioned it afterwards, which mattered more than either of the others.||I do not think you will remember any of this as anything much. It kept me in the job.||Thank you.||Murtaza","use":"Three named actions, one of which the recipient may not have thought of as a decision at all. Naming the omission, the not mentioning it afterwards, is the strongest move available in a thank you. Restraint is invisible by design. Nobody is ever thanked for it. The last line does the other job: it says what it caused.","ch":11},{"n":52,"quote":"A colleague did excellent work and their manager does not know.","bare":false,"attribution":"Praise where it counts","means":"Dear Adam,||I wanted to tell you about something Priya did last week, which I suspect she will not mention herself.||The Fenwick handover was in real trouble. She rebuilt the reconciliation from scratch over two days, found an error in our figures that had been there since November, and told the client about it before they found it themselves. That last part cost her a difficult conversation she could have avoided entirely.||I have worked with a lot of people who would have quietly fixed it and said nothing. She did the harder and better thing.||I thought you should know, from someone outside her team.||Murtaza","use":"Writing to the manager instead of to her, and saying why: *from someone outside her team* is what gives it evidential weight. It also singles out the choice that involved a cost, which is the thing managers most struggle to see and most value hearing about. This letter changes somebody's career and takes six minutes.","ch":11},{"n":53,"quote":"A stranger's work changed something for you.","bare":false,"attribution":"The unsolicited letter","means":"Dear Ms Adeyemi,||You will not know me. I read your book on the Windrush cases in 2023, when I was about to give up on a case of my own.||There is a passage near the end about how the evidence was reconstructed after the records were destroyed. I read it four times. It gave me an approach I had not thought of, and eighteen months later the case was decided in my client's favour.||I am not asking for anything. I have wanted to write this for two years and kept not doing it, and it seemed foolish to carry on not doing it.||Thank you for the book.||With respect,||Murtaza Raza","use":"Asking for nothing, and saying so. Writers, artists and academics get a great deal of post that turns out to be a request in the fourth paragraph. A letter that closes off that possibility can be enjoyed instead of assessed. The specific passage is what proves the reading was real, and the outcome is what makes the letter worth having received.","ch":11},{"n":54,"quote":"Somebody you are quietly jealous of has had good news.","bare":false,"attribution":"Congratulating properly anyway","means":"Sam,||Congratulations on the book. Genuinely, and I will admit that it took me a couple of days to be able to write this without it being through gritted teeth, which says everything about me and nothing about you.||You have wanted this since we were twenty-three and you did the work in a way I did not. I have watched you get up at five for four years and I have not, and the outcome is exactly correct.||Very well done. I mean it.||Ade","use":"Admitting the envy, with a light hand, and without making it the recipient's problem. The alternative, which is a warm letter with a detectable coolness underneath, is worse, because everybody can feel it and nobody can name it. Owning it disarms it and produces something more affectionate than an unmixed congratulation would have been.","ch":11},{"n":55,"quote":"You are writing a reference for somebody you rate.","bare":false,"attribution":"The recommendation that helps","means":"Dear Ms Chen,||I am glad to be asked about Priya Nair and I will be more useful if I am specific rather than general.||She led the Fenwick migration for eighteen months. Two things are worth knowing. She is the only person I have managed who consistently brought me problems while they were still cheap to fix, including problems she had caused, which is rarer than it sounds and is the single quality I would most look for.||And she is a good manager of people who are struggling. Two members of her team were in difficulty during that period and both are still with us and doing well, which was her work.||Her weakness, since you will want one: she is slow to delegate and takes on more than she should. She knows this and has been working on it.||I would hire her again without hesitation.||Murtaza Raza","use":"The named weakness. A reference with no weakness in it reads as a formality and gets discounted. One honest, minor, self-known limitation makes everything else credible. The two strengths are behavioural and specific instead of adjectival, which is the difference between a reference that is read and one that is skimmed.","ch":11}]},{"n":12,"title":"Letters With No Purpose","part":"Six","partRoman":"VI","partName":"When Nothing Is Wrong","opening":"<p>Every other chapter in this book is about a letter with a job. Something has gone wrong, or something is needed, or something has to be refused, and the writing is the instrument that handles it. This chapter is about the letters that have no job at all, which are the ones almost nobody writes and the ones people keep.</p><p>If you doubt that, look at what survives in other people&#x27;s houses. Nobody keeps a delivery confirmation. The shoebox on top of the wardrobe holds the letter somebody wrote for no reason, and it has been read more times than its author would believe.</p><p>The reason these go unwritten is not laziness. It is that the ordinary rules of correspondence assume an occasion, and without one there is a faint embarrassment about writing at all. What am I doing, exactly. Why now. That hesitation is answered by the letters in this chapter, all of which are written on the same principle: the occasion is that you thought of them, and you are allowed to say so.</p><p>The commonest form of this failure is the letter that is delayed until the person can no longer read it. Nearly every funeral in the world contains somebody standing at the front saying true and loving things to a room, having never once said them to the person concerned. It is not that they did not mean it. It is that there was never a Tuesday that seemed like the right Tuesday.</p><p>There is one letter here that is never sent. It belongs in a book about what to say because a great deal of what needs saying is not addressed to anybody who should have to read it, and writing it down anyway does most of the work. The unsent letter is not a trick or an exercise. It is the correct form for a certain kind of thing.</p><p>Two practical notes. Write these by hand if you can, because a letter with no purpose that arrives by email reads as a message, and the physical version is the one that gets kept. And do not apologise for writing. An opening line that excuses the letter tells the reader it was an odd thing to do, which is exactly the belief this chapter is trying to break.</p>","entries":[{"n":56,"quote":"Nothing has happened. You simply thought about somebody on a Tuesday.","bare":false,"attribution":"The letter with no occasion","means":"Dear Nan,||No news, no reason. I was making tea in a mug you gave me about nine years ago, which is now chipped at the handle and is still the one I reach for first, and I thought I would write and tell you that.||Work is fine. The flat is cold. I have started running, badly, on Sunday mornings, and I keep thinking about you saying that the first mile is rent and the rest is yours.||That is genuinely all. You do not have to write back, though I would love it if you did, and I am not building up to asking you for anything.||I think about you a lot. I hope you are warm.||Love, Ruth","use":"The chipped mug. Anyone can write *thinking of you*, and it evaporates on contact, because it is a sentiment with no evidence attached. An object, a chip on the handle, a habit you have kept for nine years: these prove the thought was real and located somewhere in an actual afternoon. The second move is the disclaimer near the end, which sounds throwaway and is not. Older relatives in particular have learned that an unexpected letter can precede a request, and saying outright that nothing is coming lets the letter be what it is.","ch":12},{"n":57,"quote":"A teacher, a boss, an aunt. Somebody who changed the direction of your life and has never been told.","bare":false,"attribution":"The letter you owe a living person","means":"Dear Mr Okonjo,||You taught me GCSE physics between 2003 and 2005, in the lab at the end of the science corridor, and I doubt you remember me. I sat at the back and I was not a good student.||I am writing because I want to tell you something while it is still possible to tell you.||In the spring of the second year you kept me back after a lesson and said that I was lazy rather than stupid, and that the difference was entirely in my hands and nobody else's. You were not kind about it. It was the first time an adult had told me the truth about myself in a way I could not argue with.||I am an engineer. I have been one for fourteen years. I do not think that happens without that conversation, and I have never told you, which seemed increasingly ridiculous the longer it went on.||Thank you. I hope the corridor is still standing.||With real gratitude, Daniel Achebe","use":"The precision. Naming the years, the room, the season and the actual sentence spoken converts a vague tribute into a piece of evidence the reader can check against their own memory, and that is what makes it land rather than embarrass. Note also that the letter does not soften what was said. Reporting the moment as it was, including the fact that it was not kind, is what makes the gratitude credible. And the reason for writing is stated in one line without decoration: while it is still possible.","ch":12},{"n":58,"quote":"A friendship ended in nothing. No row, no falling out, just years.","bare":false,"attribution":"The letter after a long drift","means":"Dear Priya,||It has been about six years, I think, which is absurd.||Nothing happened, is the thing. We did not fall out. You moved, I had the twins, we each let three or four messages go unanswered at a busy time, and then enough time passed that writing started to feel like an event, and I kept not doing it.||I am writing now because I heard a song in the car that we both liked in a year I would rather not name out loud, and I sat in the car park until it finished.||I do not know what you want from this, and there may be nothing. If you would rather leave it where it is, that is genuinely all right and I will not chase.||But I miss you, and I did not want another six years to go by with nobody having said so.||Priya, I hope life has been good. Meera","use":"Naming the absence of a cause. A long silence between friends acquires, in both heads, an imagined reason, and the fear that a letter will excavate it is what keeps people quiet for decades. Saying outright that nothing happened dissolves the thing that was never there. The other necessary move is the exit offered near the end. A letter that reopens a friendship by force is a demand, and it is much easier to answer one that has already told you it will accept a no.","ch":12},{"n":59,"quote":"You want to leave something for your children to read when you are no longer here.","bare":false,"attribution":"The letter for afterwards","means":"To Sam and Isabel, to be read afterwards,||If you are reading this then the thing we all knew would happen eventually has happened, and I am sorry, and I am also fine about it, and both of those are true at once.||I want you to know three things.||The first is that I was happy. Not always, and not evenly, but on the whole and by a wide margin, and most of that was the two of you and your mother. If you find yourself worrying that I did not know that at the time, I did. I knew it constantly.||The second is that you are not obliged to grieve in any particular way, or for any particular length of time, or to agree with each other about how it is done. Look after each other through it and forgive whatever gets said in the first fortnight.||The third is about the house and the boat and all of it, and it is this: it is only money and objects, and I would rather you had a bad year and stayed close than divided everything correctly and did not speak again. If it comes to a choice, choose each other. That is an instruction.||Go and have a good life. It goes quickly and it is worth it.||All my love, always, Dad","use":"The permission. Almost everything a letter like this can do is release the reader from an obligation they will otherwise carry: to have made you happy enough, to grieve properly, to honour your memory by falling out over an estate. Listing three things and numbering them is not a stylistic tic either. A letter read in the worst week of somebody's life needs to be navigable, and structure survives distress in a way that flowing prose does not.","ch":12},{"n":60,"quote":"You are furious with somebody who cannot hear it, or who is dead, or with whom the conversation would cost more than it is worth.","bare":false,"attribution":"The letter with no recipient","means":"Dad,||I am not going to send this and you are not going to read it, and I have decided that does not make it pointless.||You were not there. Not in the large way people mean when they say it about fathers, but in a hundred small verifiable ways: the Tuesday nights, the two years of Saturdays, the concert with the empty seat that I could see from the stage. I have carried a version of you in my head that I have been arguing with for twenty years, and the arguing has been going about as well as it went in life.||Here is what I actually wanted. I wanted you to be interested. Not proud, particularly. Interested.||I am forty-one. You have been dead for three. I am not going to get it, and I have spent a considerable amount of my one life waiting to be given a thing by somebody who did not have it to give.||So this is me putting it down. Not forgiving you, because I am not sure I do, and I am tired of being told that is the required destination. Just putting it down.||Goodbye.||Nathan","use":"The absence of a reader. Every other letter in this book is shaped by what it will do to the person who opens it, and that constraint, useful everywhere else, is what prevents this from being said at all. Removing the recipient removes the negotiation. Notice too that it refuses the expected ending. An unsent letter that arrives on cue at forgiveness is performing, and the honest version stops at the true place, which here is setting the thing down. That is a real outcome and it is enough.","ch":12}]}],"index":[{"name":"After a redundancy","letter":"A","items":[{"n":8,"quote":"A colleague has been made redundant.","ch":2,"q":""}]},{"name":"Apologising for your reaction","letter":"A","items":[{"n":19,"quote":"You reacted badly to being passed over and people saw.","ch":4,"q":""}]},{"name":"The apology for something you meant","letter":"A","items":[{"n":11,"quote":"You said something cruel during an argument and you meant it at the time.","ch":3,"q":""}]},{"name":"Asking a stranger","letter":"A","items":[{"n":22,"quote":"You want a favour from somebody senior you barely know.","ch":5,"q":""}]},{"name":"Asking family for money","letter":"A","items":[{"n":44,"quote":"You need to ask your parents for help.","ch":9,"q":""}]},{"name":"Asking for a name","letter":"A","items":[{"n":25,"quote":"You want someone to be a reference.","ch":5,"q":""}]},{"name":"Asking for a straight answer","letter":"A","items":[{"n":30,"quote":"Somebody owes you an answer about something that matters and keeps deflecting.","ch":6,"q":""}]},{"name":"Asking for it back","letter":"A","items":[{"n":41,"quote":"A friend borrowed money and has not mentioned it in four months.","ch":9,"q":""}]},{"name":"Asking for money from your employer","letter":"A","items":[{"n":21,"quote":"You want a pay rise.","ch":5,"q":""}]},{"name":"Asking for something you find humiliating to need","letter":"A","items":[{"n":24,"quote":"You are struggling and need to ask for help.","ch":5,"q":""}]},{"name":"Asking for space, without a rupture","letter":"A","items":[{"n":39,"quote":"You need distance from a family member.","ch":8,"q":""}]},{"name":"Asking someone to spend their credibility","letter":"A","items":[{"n":23,"quote":"You want an introduction.","ch":5,"q":""}]},{"name":"Asking to be taken off it","letter":"A","items":[{"n":20,"quote":"You have taken on something you cannot do.","ch":4,"q":""}]},{"name":"Bad news, early","letter":"B","items":[{"n":16,"quote":"You are going to miss a deadline and it is still three weeks away.","ch":4,"q":""}]},{"name":"The client apology","letter":"C","items":[{"n":18,"quote":"A client's project is late and it is your fault.","ch":4,"q":""}]},{"name":"The complaint that works","letter":"C","items":[{"n":47,"quote":"Something you bought is faulty and you want your money back.","ch":10,"q":""}]},{"name":"Condolence, after a long silence","letter":"C","items":[{"n":4,"quote":"An old friend you have not seen in years has lost their partner.","ch":1,"q":""}]},{"name":"Condolence, at a distance","letter":"C","items":[{"n":2,"quote":"A colleague's father has died. You have met them twice and never met him.","ch":1,"q":""}]},{"name":"Condolence, for a loss others may not name","letter":"C","items":[{"n":3,"quote":"Someone's baby died before it was born.","ch":1,"q":""}]},{"name":"Condolence, late","letter":"C","items":[{"n":5,"quote":"You have missed it. The funeral was six weeks ago.","ch":1,"q":""}]},{"name":"Condolence, where you knew them","letter":"C","items":[{"n":1,"quote":"Your close friend's mother has died. You knew her a little.","ch":1,"q":""}]},{"name":"Congratulating properly anyway","letter":"C","items":[{"n":54,"quote":"Somebody you are quietly jealous of has had good news.","ch":11,"q":""}]},{"name":"The correction","letter":"C","items":[{"n":14,"quote":"You said something confidently in public and it was wrong.","ch":3,"q":""}]},{"name":"The declined invitation","letter":"D","items":[{"n":32,"quote":"You have been invited to a wedding you do not want to attend.","ch":7,"q":""}]},{"name":"Declining upwards","letter":"D","items":[{"n":31,"quote":"Your manager has asked you to take on something and you have no capacity.","ch":7,"q":""}]},{"name":"Declining without explaining","letter":"D","items":[{"n":35,"quote":"You do not want to, and you do not have a reason you want to give.","ch":7,"q":""}]},{"name":"The disappearance","letter":"D","items":[{"n":27,"quote":"Somebody has gone silent in the middle of a piece of work.","ch":6,"q":""}]},{"name":"Disputing a charge","letter":"D","items":[{"n":49,"quote":"There is a charge on your bill you did not agree to.","ch":10,"q":""}]},{"name":"Escalating properly","letter":"E","items":[{"n":50,"quote":"You have complained twice and been fobbed off twice.","ch":10,"q":""}]},{"name":"Escalating without escalating","letter":"E","items":[{"n":28,"quote":"A decision you need keeps slipping and you are getting impatient.","ch":6,"q":""}]},{"name":"Escalating your own error","letter":"E","items":[{"n":17,"quote":"You have made an expensive mistake and nobody has noticed yet.","ch":4,"q":""}]},{"name":"The first chase","letter":"F","items":[{"n":26,"quote":"You have sent one email and heard nothing for a week.","ch":6,"q":""}]},{"name":"The forgotten occasion","letter":"F","items":[{"n":12,"quote":"You forgot something that mattered enormously to somebody.","ch":3,"q":""}]},{"name":"The free work request","letter":"F","items":[{"n":34,"quote":"You have been asked to do professional work for free.","ch":7,"q":""}]},{"name":"The freelancer's chase","letter":"F","items":[{"n":46,"quote":"An invoice is six weeks overdue.","ch":10,"q":""}]},{"name":"The illness with no end date","letter":"I","items":[{"n":10,"quote":"Somebody's parent has dementia and it is going to go on for years.","ch":2,"q":""}]},{"name":"The late apology","letter":"L","items":[{"n":15,"quote":"It has been years and you have never apologised.","ch":3,"q":""}]},{"name":"The letter after a long drift","letter":"L","items":[{"n":58,"quote":"A friendship ended in nothing. No row, no falling out, just years.","ch":12,"q":""}]},{"name":"The letter for afterwards","letter":"L","items":[{"n":59,"quote":"You want to leave something for your children to read when you are no longer here.","ch":12,"q":""}]},{"name":"The letter with no occasion","letter":"L","items":[{"n":56,"quote":"Nothing has happened. You simply thought about somebody on a Tuesday.","ch":12,"q":""}]},{"name":"The letter with no recipient","letter":"L","items":[{"n":60,"quote":"You are furious with somebody who cannot hear it, or who is dead, or with whom the conversation would cost more than it is worth.","ch":12,"q":""}]},{"name":"The letter you owe a living person","letter":"L","items":[{"n":57,"quote":"A teacher, a boss, an aunt. Somebody who changed the direction of your life and has never been told.","ch":12,"q":""}]},{"name":"The letter you should probably not send","letter":"L","items":[{"n":40,"quote":"You are ending a relationship.","ch":8,"q":""}]},{"name":"Letting a friendship go","letter":"L","items":[{"n":38,"quote":"A friendship has become one-sided and you want to stop.","ch":8,"q":""}]},{"name":"The personal chase","letter":"P","items":[{"n":29,"quote":"A friend has stopped replying and you do not know why.","ch":6,"q":""}]},{"name":"Praise where it counts","letter":"P","items":[{"n":52,"quote":"A colleague did excellent work and their manager does not know.","ch":11,"q":""}]},{"name":"Professional apology, where there are consequences","letter":"P","items":[{"n":13,"quote":"You let a colleague down and it cost them.","ch":3,"q":""}]},{"name":"The real thank you","letter":"R","items":[{"n":51,"quote":"Somebody did something significant for you and you said thanks in passing.","ch":11,"q":""}]},{"name":"The recommendation that helps","letter":"R","items":[{"n":55,"quote":"You are writing a reference for somebody you rate.","ch":11,"q":""}]},{"name":"Refusing to lend","letter":"R","items":[{"n":42,"quote":"A friend has asked to borrow money and you do not want to lend it.","ch":9,"q":""}]},{"name":"The repeat asker","letter":"R","items":[{"n":33,"quote":"Somebody keeps asking you to help and you keep saying yes.","ch":7,"q":""}]},{"name":"The resignation","letter":"R","items":[{"n":36,"quote":"You are resigning.","ch":8,"q":""}]},{"name":"Resigning the account","letter":"R","items":[{"n":37,"quote":"You are ending a business relationship with a client.","ch":8,"q":""}]},{"name":"Saying you cannot afford it","letter":"S","items":[{"n":43,"quote":"Your friends are planning something you cannot afford.","ch":9,"q":""}]},{"name":"Telling a creditor before they chase","letter":"T","items":[{"n":48,"quote":"You cannot pay a bill and it is going to get worse.","ch":10,"q":""}]},{"name":"To a parent, mid-crisis","letter":"T","items":[{"n":9,"quote":"A friend's child is in hospital.","ch":2,"q":""}]},{"name":"The unequal arrangement","letter":"U","items":[{"n":45,"quote":"Somebody always pays less than their share and nobody says anything.","ch":9,"q":""}]},{"name":"The unsolicited letter","letter":"U","items":[{"n":53,"quote":"A stranger's work changed something for you.","ch":11,"q":""}]},{"name":"When you do not know whose side to take","letter":"W","items":[{"n":7,"quote":"Somebody's marriage has ended and you are friends with both.","ch":2,"q":""}]},{"name":"Writing to someone who is ill","letter":"W","items":[{"n":6,"quote":"A friend has been diagnosed with something serious.","ch":2,"q":""}]}],"blurb":["Somebody at work has lost their father and you have been staring at an empty message box for two days. A friend has been diagnosed with something serious. You owe an apology you have been avoiding for a month, you need to ask for money, or you have to say no to somebody who will take it badly.","These are the letters nobody teaches you to write, and the reason they go unwritten is almost never that people do not care. It is the fear of getting it wrong, which reliably produces the one outcome that is definitely wrong.","Sixty letters, written out in full, for the occasions that arrive without warning. Each one comes with the situation it answers and a short note on what is actually doing the work: which sentence carries the weight, what has deliberately been left out, and why the paragraph you would have added is the one to cut.","The last chapter is about the letters that have no purpose at all. Those are the ones people keep."],"intro":"<p>This is a book of sixty letters for the moments nobody teaches you how to write. A colleague&#x27;s father has died. You owe somebody an apology you have been avoiding for a month. A friend has cancer. You have to ask for money, or refuse to lend it, or tell a landlord that the boiler has been broken since October. You want to end something without being cruel about it.</p><p>Each entry has four parts. The situation, in one line. The form of letter it needs. The letter itself, written out in full. And a short note on what is actually doing the work, because a letter you copy without understanding will fail the moment your circumstances differ from the example by an inch.</p><p><strong>These are not templates.</strong> Or rather, they are, and using them as templates is the one way to get less out of the book than it contains. The names are invented and so are the details. Send one unaltered and it will read like a form letter, which is worse than a clumsy letter in your own words. What is transferable is the shape: what goes first, what is left out, where the offer belongs, and which sentence is carrying the weight. That is what the note after each letter is for.</p><p><strong>On the notes.</strong> They are the argument of the book. Nearly all of them come back to the same handful of principles, and you will start to notice them: be specific instead of warm, because specificity is how warmth is proved. Remove the recipient&#x27;s obligation to reply, above all when they are suffering. Do not explain yourself at length, because explanation is a request for absolution wearing a disguise. Say the thing in the first three lines. Offer something concrete rather than something general.</p><p><strong>On length.</strong> Most of these are shorter than the letter you would have written unaided, and that is deliberate. The instinct under pressure is to add: more sympathy, more context, more mitigation. Almost every letter in this book got better when a paragraph came out of it, and the paragraph that came out was nearly always the one about the writer.</p><p><strong>On apologies in particular.</strong> Chapters three and four take a harder line than is fashionable. An apology containing an explanation is not an apology, it is a defence with an apology attached, and the recipient can always tell. If you take one thing from this book, take that.</p><p><strong>What a letter cannot do.</strong> It cannot make a bereavement smaller, get you forgiven by somebody who has decided not to forgive you, or make a decision land softly when the decision itself is hard. Several letters here are written in full knowledge that they will not be well received, and their job is only to be honest, clear and unpaddable. A letter that succeeds is not always a letter that gets you what you want.</p><p><strong>Send it.</strong> The common failure is not the badly written letter. It is the letter that was never written, because the moment passed, or the right words did not come, or it seemed too late. It is rarely too late. Somebody who is grieving in the third month, or who has not been thanked in twenty years, is not waiting for the perfect version.</p><p>Open it at whichever chapter matches the thing you are avoiding.</p>","note":"<p>A few things that did not fit in the chapters, and one warning.</p><p>## Every name in this book is invented</p><p>There are no real people here. Not one. The situations are composites of the ordinary kinds of trouble that arrive in an average life, and the names, dates, places, employers and account numbers were made up to fill them out. Any resemblance to a specific person&#x27;s circumstances is a consequence of those circumstances being common, which is the point of the book.</p><p>## How to adapt one</p><p>Read the letter. Read the note underneath it. Then put the book down and write your own, from memory, in the voice you would use on the telephone to somebody you had not spoken to for a month. That sounds like extra work. It is the fastest route to something that sounds like you.</p><p>If you would sooner work straight from the text, change these things at minimum. The opening line, because it is the most recognisable part of any letter. Every concrete detail, since borrowed specifics are worse than none at all. A memory that is not yours will read as false to the one person who knows it did not happen. And the register, which in this book is British, a shade formal and a little dry. If you do not talk like that, do not write like that.</p><p>What you should keep is the order of the moves and the things that are absent. The absences are the hardest part to reproduce from instinct, because under pressure everybody adds.</p><p>## The letters that are meant to be difficult</p><p>Chapters seven, eight and ten contain letters that will not make the recipient happy, and they are not written to. A refusal that has been softened until it can be misread as a maybe has failed at the only thing it was for. If you find yourself adding a sentence to make one of those letters kinder, stop and check what it is doing. Kinder, or vaguer? The two are easy to confuse and only one of them is a mercy.</p><p>## On sending things by email</p><p>Most of these work by email, and several are better that way: anything involving a company, a deadline or a record. Four kinds are not, and are worth a stamp. Condolence. Thanks that matter. Anything intended to be kept. And any letter whose whole purpose is to show that you took some trouble, since an email costs nothing and shows it.</p><p>## The one warning</p><p>A letter is not a substitute for a conversation with somebody who is present and available. It is tempting to write instead of speaking, because writing can be edited and a person cannot, and there are relationships that have been emptied out, without a word, by one party handling everything difficult in prose. If the person is in the next room, go and talk to them. This book is for the moments when that is not possible, has already failed, or would put more on somebody than they can carry in real time.</p>","noteTitle":"A Note on Using These","indexTitle":"Index of Situations"}</script>
<script>
(function(){
"use strict";
var BOOK = JSON.parse(document.getElementById("book-data").textContent);
var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
var stage = document.getElementById("stage");
var camera = document.getElementById("camera");
var book = document.getElementById("book");

function emph(s){return esc(s).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/(^|[^\w*])\*(?!\s)(.+?)(?<!\s)\*(?!\w)/g,'$1<em>$2</em>');}
// Several paragraphs in one gloss means quoted material, a letter say, so
// it is set ranged left and spaced instead of as a block of commentary.
function paras(t){var ps=String(t).split('||').map(function(p){return p.trim();}).filter(Boolean);var c=ps.length>1?' class="v"':'';return ps.map(function(p){return '<p'+c+'>'+emph(p)+'</p>';}).join('');}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function pad(n){return n<10?"00"+n:n<100?"0"+n:""+n;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function store(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function recall(k){try{return localStorage.getItem(k);}catch(e){return null;}}

var ALL=[];
BOOK.chapters.forEach(function(ch){ch.entries.forEach(function(e){
  ALL.push(Object.assign({chTitle:ch.title},e));});});

/* ---------- the whole book as one flowed document ---------- */
function entryHTML(e){
  var q = e.bare ? "<em>"+esc(e.quote)+"</em>"
    : '<span class="mk">\u201C</span>'+esc(e.quote)+'<span class="mk">\u201D</span>';
  return '<article class="entry" id="e'+e.n+'"><div class="entry__head">'+
    '<div class="entry__n">'+pad(e.n)+'</div>'+
    '<blockquote class="entry__quote">'+q+'</blockquote>'+
    '<div class="entry__attr">'+esc(e.attribution)+'</div></div>'+
    '<div class="gloss gloss--means"><div class="gloss__label">'+esc(BOOK.gloss[0])+'</div>'+paras(e.means)+'</div>'+
    '<div class="gloss gloss--use"><div class="gloss__label">'+esc(BOOK.gloss[1])+'</div>'+paras(e.use)+'</div>'+
    '</article>';
}
var FLOW_HTML = (function(){
  var h = '<div class="ch-head ch-head--first plain" id="c-intro"><h2>Introduction</h2></div>'+
          '<div class="plain">'+BOOK.intro+'</div>';
  var lastPart = null;
  BOOK.chapters.forEach(function(ch){
    if(ch.part !== lastPart){
      lastPart = ch.part;
      h += '<div class="part-open" id="p-'+ch.partRoman+'"><div class="r">'+ch.partRoman+'</div>'+
           '<div class="n">Part '+ch.partRoman+' · '+esc(ch.partName)+'</div></div>';
    }
    h += '<div class="ch-head" id="c'+ch.n+'"><div class="ch-eyebrow">Part '+ch.partRoman+
         ' · '+esc(ch.partName)+' · <b>Chapter '+ch.n+'</b></div><h2>'+esc(ch.title)+'</h2></div>'+
         '<div class="ch-open">'+ch.opening+'</div>'+
         ch.entries.map(entryHTML).join("");
  });
  h += '<div class="ch-head plain" id="c-note"><h2>'+esc(BOOK.noteTitle)+'</h2></div>'+
       '<div class="plain">'+BOOK.note+'</div>';
  h += '<div class="ch-head plain" id="c-index"><h2>'+esc(BOOK.indexTitle)+'</h2></div><div class="idx">';
  var letter = null;
  BOOK.index.forEach(function(s){
    if(s.letter !== letter){
      letter = s.letter;
      h += '<div class="idx__letter">'+(letter === "\u00b6" ? "Proverbs &amp; anonymous" : letter)+'</div>';
    }
    h += '<div class="idx__src"><b>'+esc(s.name)+'</b>'+
      s.items.map(function(i){
        return '<span class="idx__i">'+pad(i.n)+' \u201C'+esc(i.quote)+'\u201D'+
          (i.q ? ' <i>('+esc(i.q)+')</i>' : '')+'</span>';
      }).join("")+'</div>';
  });
  h += '</div>';
  return h;
})();

/* ---------- geometry ---------- */
var G = {ph:0,pw:0,m:0,vm:0,T:30,fit:1,padX:0,padY:0};
var STACK = 18;
var S = {spread:0,pages:1,open:false,rx:-14,ry:0,zoom:1,panX:0,panY:0,
         mark:null,ribbonDrag:false,turning:null,focus:0};
var faces = {};
var starts = {};

function el(cls,parent,css){
  var d=document.createElement("div"); d.className=cls||"";
  if(css) d.style.cssText=css; (parent||book).appendChild(d); return d;
}
function makeFace(cls){
  var f = el("face "+cls, null,
    "width:"+G.pw+"px;height:"+G.ph+"px;top:"+(-G.ph/2)+"px;");
  f.innerHTML = '<div class="pgwrap"><div class="face__flow pg" style="width:'+G.pw+'px;padding:'+G.vm+'px '+G.m+'px;'+
    'height:'+G.ph+'px;column-width:'+(G.pw-2*G.m)+'px;column-gap:'+(2*G.m)+'px">'+FLOW_HTML+'</div>'+
    '<div class="face__rule"></div><div class="runhead"></div><div class="folio"></div></div>'+
    '<div class="face__gutter"></div>';
  return f;
}

// The page is a fixed object, like a printed one: the same words fall on page
// seven whatever you are reading it on. The screen only changes how big the
// book is drawn, never how the type is set.
var PAGE = {w:430, h:628};

/* A phone cannot show a whole spread at a size anyone would read. So on a
   narrow screen the book is framed a page at a time and drawn twice as large.
   The type is not re-set: page 41 holds the same words it holds on a laptop,
   the camera simply sits closer and a swipe steps across the spread. */
function fitView(){
  var vw = window.innerWidth, vh = window.innerHeight;
  // the controls sit above the book and the page number below it, so the
  // height the book may take is the window less those two strips
  var room = Math.max(vh - 72, vh*0.55);
  var spread = Math.min(1, (vw*0.94)/(2*G.pw + G.T*2), room/G.ph);
  var one    = Math.min(1, (vw*0.94)/(G.pw + G.T), room/G.ph);
  var was = G.single;
  // only when framing one page actually buys size: in landscape the height
  // is the constraint, and halving the view would gain nothing
  G.single = spread < 0.62 && one > spread * 1.15;
  G.fit = G.single ? one : spread;
  applyView();
  var hint = document.getElementById("hint");
  if(hint) hint.textContent = G.single
    ? "Swipe to turn the page \u00b7 drag the desk to turn the book \u00b7 pinch to zoom"
    : "Drag to turn the book \u00b7 drag a page corner to turn it \u00b7 scroll or pinch to zoom where you point";
  if(was !== G.single && faces.verso) paint();
}

function layout(){
  G.ph = PAGE.h;
  G.pw = PAGE.w;
  G.m  = Math.round(G.pw*0.105);
  G.vm = Math.round(G.ph*0.075);
  G.padX = Math.round(G.pw*0.10);
  G.padY = Math.round(G.ph*0.22);
  fitView();

  book.innerHTML = "";
  faces = {};

  // back board and the two half blocks of pages
  el("board board--back",null,"width:"+(G.pw+8)+"px;height:"+(G.ph+14)+"px;left:-4px;top:"+
     (-G.ph/2-7)+"px;transform:translateZ("+(-G.T-10)+"px)");
  var sp = el("spine",null,"width:"+(G.T+12)+"px;height:"+(G.ph+14)+"px;left:0;top:"+
     (-G.ph/2-7)+"px;transform-origin:left center;transform:translateZ("+(-G.T-6)+
     "px) rotateY(-90deg)");
  sp.innerHTML = "<span>Lines Worth Keeping</span>";
  faces.spine = sp;

  // the page block: opaque leaves stacked through the depth, so the book reads
  // as solid from any angle rather than hollow between the covers
  faces.stackL = el("stack",null,"width:"+G.pw+"px;height:"+G.ph+"px;left:"+(-G.pw)+
    "px;top:"+(-G.ph/2)+"px");
  faces.stackR = el("stack",null,"width:"+G.pw+"px;height:"+G.ph+"px;left:0;top:"+
    (-G.ph/2)+"px");
  for(var si=0; si<STACK; si++){
    faces.stackL.appendChild(document.createElement("i"));
    faces.stackR.appendChild(document.createElement("i"));
  }

  faces.verso = makeFace("face--verso"); faces.verso.style.left = (-G.pw)+"px";
  faces.recto = makeFace("face--recto"); faces.recto.style.left = "0px";
  faces.recto.insertAdjacentHTML("beforeend",'<div class="corner" id="corner"></div>');

  var leaf = el("leaf",null,"width:"+(2*G.pw+2*G.padX)+"px;height:"+(G.ph+2*G.padY)+
    "px;left:"+(-G.pw-G.padX)+"px;top:"+(-G.ph/2-G.padY)+"px;display:none");
  faces.leaf = leaf;
  faces.leafFront = makeFace("peel peel__base");
  faces.leafBack  = makeFace("peel peel__flap");
  leaf.appendChild(faces.leafFront);
  leaf.appendChild(faces.leafBack);
  faces.leafFront.style.display = "none";
  faces.leafBack.style.display  = "none";
  faces.leafFront.insertAdjacentHTML("beforeend",'<div class="peel__shade"></div>');
  faces.leafBack.insertAdjacentHTML("beforeend",'<div class="peel__shade"></div>');

  // the marker: a band that lies across the page it marks, and a tail that
  // hangs below the book whether or not you are on that page
  var rw = Math.max(9, Math.round(G.pw*0.034));
  var tail = Math.round(G.ph*0.15);
  G.rw = rw;
  var rb = el("ribbon",null,"left:0;top:"+(-G.ph/2-5)+"px;width:"+rw+"px;height:"+
    (G.ph+5+tail)+"px;transform:translateZ(2px) rotate(.5deg)");
  rb.innerHTML = '<div class="ribbon__band" style="height:'+(G.ph+5)+'px"></div>'+
                 '<div class="ribbon__tail" style="height:'+tail+'px"></div>';
  rb.title = "Drag the marker on to a page to keep your place";
  faces.ribbon = rb;

  var front = el("board board--front",null,"width:"+(G.pw+8)+"px;height:"+(G.ph+14)+"px;left:0;top:"+
     (-G.ph/2-7)+"px;transform:translateZ(6px)");
  front.id = "front";
  front.innerHTML =
    '<div class="board__face" style="font-size:'+Math.round(G.pw*0.052)+'px">'+
      '<div class="jacket">'+
        '<div class="jacket__rule"></div><div class="jacket__rule jacket__rule--in"></div>'+
        '<div class="jacket__prick"></div>'+
        '<div class="jacket__eyebrow">A commonplace book</div>'+
        '<div class="jacket__body"><div class="jacket__title">Lines Worth<br>Keeping</div>'+
        '<hr class="jacket__hr"><p class="jacket__sub">'+esc(BOOK.subtitle)+'</p>'+
        (BOOK.author ? '<p class="jacket__by">'+esc(BOOK.author)+'</p>' : '')+'</div>'+
        '<div class="jacket__foot">315 entries · 21 chapters</div>'+
      '</div></div>'+
    '<div class="board__face board__face--in"></div>';
  faces.front = front;

  // page count, measured from one of the flows
  var probe = faces.recto.querySelector(".face__flow");
  S.pages = Math.max(2, Math.round(probe.scrollWidth / G.pw));
  starts = {};
  ["c-intro","c-note","c-index"].concat(BOOK.chapters.map(function(c){return "c"+c.n;}))
    .forEach(function(id){
      var n = probe.querySelector("#"+CSS.escape(id));
      if(n) starts[id] = Math.floor((n.offsetLeft+1)/G.pw);
    });
  paint();
}

function pageOf(node){ return Math.floor((node.offsetLeft+1)/G.pw); }

function setFace(f, idx){
  var flow = f.querySelector(".face__flow");
  flow.style.transform = "translateX("+(-idx*G.pw)+"px)";
  var blank = idx < 0 || idx >= S.pages;
  flow.style.visibility = blank ? "hidden" : "visible";
  var rule = f.querySelector(".face__rule");
  var rh = f.querySelector(".runhead"), fo = f.querySelector(".folio");
  var verso = f.classList.contains("face--verso") || f.classList.contains("face--back");
  rule.style.cssText = "top:"+G.vm+"px;height:"+(G.ph-2*G.vm)+"px;"+
    (verso ? "right:"+(G.m-13)+"px" : "left:"+(G.m-13)+"px")+
    ";display:"+(blank?"none":"block");
  rh.style.cssText = "top:"+Math.round(G.vm/2-5)+"px;left:"+G.m+"px;width:"+(G.pw-2*G.m)+
    "px;text-align:"+(verso?"left":"right")+";display:"+(blank?"none":"block");
  fo.style.cssText = "bottom:"+Math.round(G.vm/2-5)+"px;left:0;width:"+G.pw+
    "px;text-align:center;display:"+(blank?"none":"block");
  rh.textContent = blank ? "" : runningHead(idx);
  fo.textContent = blank ? "" : String(idx+1);
}

function runningHead(idx){
  var best = "Lines Worth Keeping";
  BOOK.chapters.forEach(function(c){
    var s = starts["c"+c.n];
    if(s !== undefined && s <= idx) best = "Ch " + c.n + " · " + c.title;
  });
  if(starts["c-note"] !== undefined && starts["c-note"] <= idx) best = BOOK.noteTitle;
  return best;
}

function paint(){
  var L = S.spread*2, R = L+1;
  setFace(faces.verso, L);
  setFace(faces.recto, R);
  var t = S.pages ? S.spread/Math.max(1,Math.ceil(S.pages/2)) : 0;
  [["stackL", S.open ? t : 0], ["stackR", S.open ? 1-t : 1]].forEach(function(pair){
    var node = faces[pair[0]], frac = pair[1];
    node.style.display = frac > 0.02 ? "block" : "none";
    var d = Math.max(2, G.T*Math.max(0.05, frac));
    Array.prototype.forEach.call(node.children,function(sl,i){
      sl.style.transform = "translateZ("+(-1 - (i+1)*(d/STACK)).toFixed(2)+"px)";
    });
  });
  faces.verso.style.display = S.open ? "block" : "none";
  faces.recto.style.display = S.open ? "block" : "none";
  faces.spine.style.display = S.open ? "none" : "block";
  if(!S.coverAnim && !(S.turning && S.turning.cover)){
    faces.front.style.transform = coverTransform(S.open ? -178 : 0);
  }
  var marked = S.mark === null ? -1 : Math.floor(S.mark/2);
  var onMark = S.open && marked === S.spread;
  if(!S.ribbonDrag){
    var x;
    if(onMark) x = (S.mark % 2 === 1) ? Math.round(G.pw*0.17)
                                      : -Math.round(G.pw*0.17) - G.rw;
    else x = Math.round(G.pw*0.045);
    faces.ribbon.style.left = x + "px";
  }
  faces.ribbon.querySelector(".ribbon__band").style.display = onMark ? "block" : "none";

  if(S.open){
    var want = "#p" + (S.spread*2 + 1 + (G.single ? S.focus : 0));
    if(location.hash !== want){
      try{ history.replaceState(null, "", want); }catch(e){}
    }
  }
  document.getElementById("where").textContent = !S.open
    ? "Closed \u00b7 drag the cover to open"
    : G.single
      ? "Page " + Math.min(L+1+S.focus, S.pages) + " of " + S.pages
      : "Pages " + (L+1) + "\u2013" + Math.min(R+1,S.pages) + " of " + S.pages;
  applyView();
  store("lwk3:spread", String(S.spread));
  store("lwk3:focus", String(S.focus));
}

function applyView(){
  var lim = Math.max(window.innerWidth, window.innerHeight) * 0.9;
  S.panX = clamp(S.panX, -lim, lim);
  S.panY = clamp(S.panY, -lim, lim);
  camera.style.transform = "translate("+S.panX.toFixed(1)+"px,"+S.panY.toFixed(1)+
    "px) scale("+(G.fit*S.zoom).toFixed(3)+")";
  var shift = !S.open ? -G.pw/2
            : G.single ? (S.focus ? -G.pw/2 : G.pw/2)
            : 0;
  book.style.transform = "translateX("+shift+"px) rotateX("+S.rx.toFixed(2)+
    "deg) rotateY("+S.ry.toFixed(2)+"deg)";
}

/* ---------- turning: a fold across the perpendicular bisector ---------- */
/* Dragging the corner C to a point P folds the sheet along the line that is
   equidistant from both. Everything past that line is the reflection of the
   sheet in it, which is what paper actually does, and it mirrors the reverse
   side's printing exactly as a real folded corner does. */
function reflectAcross(M, n){
  var a = 1 - 2*n[0]*n[0], b = -2*n[0]*n[1];
  var c = b,               d = 1 - 2*n[1]*n[1];
  var k = 2*(M[0]*n[0] + M[1]*n[1]);
  return "matrix("+a.toFixed(5)+","+b.toFixed(5)+","+c.toFixed(5)+","+
         d.toFixed(5)+","+(k*n[0]).toFixed(2)+","+(k*n[1]).toFixed(2)+")";
}
/* Paper does not crease along a straight line, it bows. Both halves are cut
   with the SAME curve, so they still tile exactly and the reflection stays
   true, but the seam reads as a bend rather than a fold. */
function foldEdge(W, H, M, n, side, amp){
  var d = [-n[1], n[0]];
  var L = Math.hypot(W, H) * 1.7, BIG = L;
  var pts = [], N = 22, span = L * 0.46;
  for(var i = 0; i <= N; i++){
    var s = -L + 2*L*(i/N);
    var k = Math.max(0, 1 - (s/span)*(s/span));
    var b = -amp * k * k;                 // bows toward the corner being lifted
    pts.push([M[0] + s*d[0] + b*n[0], M[1] + s*d[1] + b*n[1]]);
  }
  pts.push([M[0] + L*d[0] + side*BIG*n[0], M[1] + L*d[1] + side*BIG*n[1]]);
  pts.push([M[0] - L*d[0] + side*BIG*n[0], M[1] - L*d[1] + side*BIG*n[1]]);
  return "polygon(" + pts.map(function(q){
    return q[0].toFixed(1)+"px "+q[1].toFixed(1)+"px"; }).join(",") + ")";
}

function beginTurn(dir){
  if(S.turning) return false;
  var L = S.spread*2;
  if(dir > 0 && (L+2) >= S.pages) return false;
  if(dir < 0 && S.spread === 0) return false;

  var base = faces.leafFront, flap = faces.leafBack;
  var x = G.padX + (dir > 0 ? G.pw : 0);
  [base, flap].forEach(function(f){
    f.style.left = x + "px";
    f.style.top = G.padY + "px";
    f.style.display = "block";
    f.style.transform = "none";
    f.style.clipPath = "none";
  });
  if(dir > 0){
    setFace(base, L+1); setFace(flap, L+2); setFace(faces.recto, L+3);
  }else{
    setFace(base, L);   setFace(flap, L-1); setFace(faces.verso, L-2);
  }
  faces.leaf.style.display = "block";
  // C is the free corner: the fore edge, at the foot of the page
  S.turning = {dir:dir, C:[dir > 0 ? G.pw : 0, G.ph], p:[dir > 0 ? G.pw : 0, G.ph], t:0};
  fold(0);
  return true;
}

function fold(prog){
  var T = S.turning; if(!T) return;
  T.t = clamp(prog, 0, 1);
  var W = G.pw, H = G.ph, dir = T.dir;
  // the corner travels across the spread and a little upward, as a hand does
  var cx = dir > 0 ? W - 2*W*T.t : 2*W*T.t;
  var cy = H - Math.sin(Math.PI*T.t) * H*0.13;
  T.p = [cx, cy];
  var C = T.C;
  var vx = cx - C[0], vy = cy - C[1], len = Math.hypot(vx, vy);
  var base = faces.leafFront, flap = faces.leafBack;
  var shB = base.querySelector(".peel__shade"), shF = flap.querySelector(".peel__shade");
  if(len < 1){
    base.style.clipPath = "none"; base.style.transform = "none";
    flap.style.display = "none"; shB.style.opacity = "0";
    return;
  }
  flap.style.display = "block";
  var n = [vx/len, vy/len];
  var M = [(C[0]+cx)/2, (C[1]+cy)/2];
  // the bow is deepest mid-turn and flattens out at either end
  var amp = 30 * Math.sin(Math.PI * clamp(T.t, 0, 1));
  base.style.clipPath = foldEdge(W,H,M,n,1,amp);
  flap.style.clipPath = foldEdge(W,H,M,n,-1,amp);
  flap.style.transform = reflectAcross(M, n);
  // shading reads as a cylinder: a soft core of shadow at the bend, falling
  // away on both sides, rather than one hard edge
  var deg = (Math.atan2(-n[0], n[1]) * 180/Math.PI).toFixed(1);
  shB.style.background = "linear-gradient("+deg+"deg,rgba(0,0,0,.34) 0%," +
    "rgba(0,0,0,.16) 6%,rgba(0,0,0,0) 20%)";
  shB.style.opacity = (0.55*Math.sin(Math.PI*Math.min(1,T.t*1.4))+0.12).toFixed(2);
  shF.style.background = "linear-gradient("+deg+"deg,rgba(255,255,255,.55) 0%," +
    "rgba(255,255,255,.16) 9%,rgba(0,0,0,.10) 34%,rgba(0,0,0,.20) 100%)";
  shF.style.opacity = "0.62";
}

function settleTurn(commit){
  var T = S.turning; if(!T || T.anim) return;
  var dir = T.dir, from = T.t, to = commit ? 1 : 0;
  var t0 = performance.now(), ms = reduce.matches ? 1 : 420;
  T.anim = true;
  T.done = function(){
    if(S.turning !== T) return;
    fold(to);
    faces.leafFront.style.display = "none";
    faces.leafBack.style.display = "none";
    faces.leaf.style.display = "none";
    S.turning = null;
    if(commit){
      S.spread += dir;
      if(G.single) S.focus = dir > 0 ? 0 : 1;
    }
    paint();
  };
  (function step(now){
    if(S.turning !== T) return;
    var u = clamp((now - t0)/ms, 0, 1);
    var e = u < 0.5 ? 2*u*u : 1 - Math.pow(-2*u+2,2)/2;
    fold(from + (to-from)*e);
    if(u < 1){ T.raf = requestAnimationFrame(step); return; }
    T.done();
  })(t0);
}
// Let a settling turn be cut short, so pages can be taken quickly one after
// another instead of each waiting on the last to finish.
function finishTurnNow(){
  var T = S.turning;
  if(T && T.anim && T.done){
    if(T.raf) cancelAnimationFrame(T.raf);
    T.done();
  }
}
function endTurn(commit){ settleTurn(commit); }
function turnBy(dir){
  if(!S.open) return;
  finishTurnNow();
  if(S.turning) return;
  if(!beginTurn(dir)) return;
  settleTurn(true);
}
// Frame the other page of the spread. A swipe slides across; a turn has
// already carried the eye, so that one lands without the slide.
function setFocus(f, slide){
  if(!G.single || S.focus === f) return;
  S.focus = f;
  if(slide){
    book.classList.add("is-shifting");
    setTimeout(function(){ book.classList.remove("is-shifting"); }, 360);
  }
  paint();
}
// One step forward or back: on a narrow screen that is one page, otherwise
// one spread.
function stepBy(dir){
  if(!S.open) return;
  if(!G.single){ turnBy(dir); return; }
  if(dir > 0 && S.focus === 0){ setFocus(1, true); return; }
  if(dir < 0 && S.focus === 1){ setFocus(0, true); return; }
  turnBy(dir);
}

/* ---------- opening and closing the covers ---------- */
function coverTransform(angle){
  var f = clamp(Math.abs(angle)/178, 0, 1);
  var z = 6 - f * (G.T + 12);
  return "translateZ(" + z.toFixed(1) + "px) rotateY(" + angle.toFixed(1) + "deg)";
}
function openBook(){
  if(S.open) return;
  S.coverAnim = true;
  var f = faces.front;
  f.style.transition = "transform .8s cubic-bezier(.32,.02,.2,1)";
  f.style.transform = coverTransform(-178);
  setTimeout(function(){ S.open = true; S.coverAnim = false; paint(); f.style.transition=""; }, 640);
  store("lwk3:open","1");
}
function closeBook(){
  if(!S.open) return;
  S.open = false; S.spread = 0; S.coverAnim = true;
  var f = faces.front;
  f.style.transition = "none";
  f.style.transform = coverTransform(-178);
  paint();
  requestAnimationFrame(function(){
    f.style.transition = "transform .8s cubic-bezier(.32,.02,.2,1)";
    f.style.transform = coverTransform(0);
    setTimeout(function(){ f.style.transition=""; S.coverAnim = false; }, 820);
  });
  store("lwk3:open","0");
}


/* Zoom towards a point rather than the middle of the screen. The camera sits
   at the centre and is transformed translate(pan) scale(s), so a point p on
   the book lands at centre + pan + s*p. Holding the point under the cursor
   still means pan' = d - (s'/s)(d - pan), where d is the cursor's offset from
   the centre. */
function stageCentre(){
  var r = stage.getBoundingClientRect();
  return [r.left + r.width/2, r.top + r.height/2];
}
function zoomAt(next, clientX, clientY){
  next = clamp(next, 0.4, 4);
  var c = stageCentre();
  var dx = clientX - c[0], dy = clientY - c[1];
  var k = next / S.zoom;
  S.panX = dx - k * (dx - S.panX);
  S.panY = dy - k * (dy - S.panY);
  S.zoom = next;
  applyView();
  store("lwk3:zoom", String(S.zoom));
}
function zoomCentre(next){
  var c = stageCentre();
  zoomAt(next, c[0] + S.panX, c[1] + S.panY);
}

/* ---------- pointer: orbit, corner drag, cover drag ---------- */
/* How far a finger has to travel to carry a page all the way over. It follows
   the spread as it appears on screen, but never asks for more than the screen
   can give: zoomed in, the book is wider than the window, and a turn that
   wanted half a spread of travel could not be finished at all. */
function dragSpan(){
  var onScreen = (2*G.pw*G.fit*S.zoom) || 600;
  var reach = Math.max(220, window.innerWidth * 0.45);
  return Math.max(90, Math.min(onScreen, reach));
}
/* Speed is measured over the last 90ms of the drag rather than the last
   event: browsers deliver moves in bursts, and two of them can carry the
   same timestamp. */
function trailSpeed(tr){
  var last = tr[tr.length-1], i = tr.length-1;
  while(i > 0 && last[1] - tr[i-1][1] < 90) i--;
  var dt = last[1] - tr[i][1];
  return dt > 0 ? (last[0] - tr[i][0])/dt : 0;
}
var drag = null;
stage.addEventListener("pointerdown", function(ev){
  if(ev.button && ev.button !== 1) return;
  if(ev.target.closest(".hud,.sheet,.edge,.edge-y")) return;
  stage.setPointerCapture(ev.pointerId);
  var onFront = !S.open && ev.target.closest(".board--front");
  if(S.turning && S.turning.anim) finishTurnNow();
  var onRibbon = ev.target.closest(".ribbon__band,.ribbon__tail");
  var onRecto = S.open && !onRibbon && ev.target.closest(".face--recto,.corner");
  var onVerso = S.open && ev.target.closest(".face--verso");
  var onPage = G.single && (onRecto || onVerso);
  var wantsPan = ev.shiftKey || ev.button === 1;
  drag = {x0:ev.clientX, y0:ev.clientY, rx:S.rx, ry:S.ry,
          trail:[[ev.clientX, performance.now()]], v:0,
          panX:S.panX, panY:S.panY,
          ribX: parseFloat(faces.ribbon.style.left) || 0,
          mode: wantsPan ? "pan" : onRibbon ? "ribbon"
              : onFront ? "cover" : onPage ? "page"
              : onRecto ? "fwd" : onVerso ? "back" : "orbit",
          started:false};
  stage.classList.add("is-grabbing");
  document.getElementById("hint").style.opacity = "0";
});
stage.addEventListener("pointermove", function(ev){
  if(!drag) return;
  var dx = ev.clientX - drag.x0, dy = ev.clientY - drag.y0;
  if(!drag.started && Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
  drag.started = true;
  // sideways speed at the moment of release, so a flick counts as a turn
  drag.trail.push([ev.clientX, performance.now()]);
  if(drag.trail.length > 12) drag.trail.shift();
  drag.v = trailSpeed(drag.trail);
  var span = dragSpan();
  if(drag.mode === "ribbon"){
    S.ribbonDrag = true;
    faces.ribbon.classList.add("is-dragging");
    var sc = (G.fit * S.zoom) || 1;
    var nx = clamp(drag.ribX + dx/sc, -G.pw + 4, G.pw - G.rw - 4);
    faces.ribbon.style.left = nx + "px";
  }else if(drag.mode === "pan"){
    S.panX = drag.panX + dx;
    S.panY = drag.panY + dy;
    applyView();
  }else if(drag.mode === "orbit"){
    S.ry = clamp(drag.ry + dx*0.32, -78, 78);
    S.rx = clamp(drag.rx - dy*0.26, -62, 62);
    applyView(); syncDials();
  }else if(drag.mode === "cover"){
    if(!S.turning && dx < -4){
      S.turning = {cover:true};
      S.coverAnim = true;
      faces.front.style.transition = "none";
    }
    if(S.turning && S.turning.cover){
      var a = -178*clamp(-dx/span,0,1);
      faces.front.style.transform = coverTransform(a);
      S.turning.angle = a;
    }
  }else if(drag.mode === "page"){
    // one page at a time: a swipe either slides across the spread or, when
    // there is nothing left to slide to, lifts the leaf
    drag.dx = dx;
    var want = dx < 0 ? 1 : -1;
    var lifts = want > 0 ? S.focus === 1 : S.focus === 0;
    if(lifts){
      if(!S.turning && Math.abs(dx) > 4) beginTurn(want);
      if(S.turning && !S.turning.cover && !S.turning.anim){
        fold(want > 0 ? (-dx/span) : (dx/span));
      }
    }
  }else{
    var dir = drag.mode === "fwd" ? 1 : -1;
    if(!S.turning){ if((dir>0 && dx<-4)||(dir<0 && dx>4)) beginTurn(dir); }
    if(S.turning && !S.turning.cover && !S.turning.anim){
      fold(dir > 0 ? (-dx/span) : (dx/span));
    }
  }
});
function releaseDrag(){
  if(!drag) return;
  stage.classList.remove("is-grabbing");
  if(S.turning && S.turning.cover){
    var a = S.turning.angle || 0;
    var threw = drag.v < -0.35;
    S.turning = null;
    faces.front.style.transition = "transform .55s cubic-bezier(.32,.02,.2,1)";
    if(Math.abs(a) > 55 || (threw && Math.abs(a) > 12)){
      faces.front.style.transform = coverTransform(-178);
      setTimeout(function(){ S.open = true; S.coverAnim = false; paint(); faces.front.style.transition=""; }, 470);
      store("lwk3:open","1");
    }else{
      faces.front.style.transform = coverTransform(0);
      setTimeout(function(){ S.coverAnim = false; }, 560);
    }
  }else if(S.turning){
    // a third of the way carries it, and so does a flick, however short
    var d = S.turning.dir;
    var flick = d > 0 ? drag.v < -0.35 : drag.v > 0.35;
    endTurn(S.turning.t > 0.34 || (flick && S.turning.t > 0.05));
  }else if(drag.mode === "page" && drag.started){
    var moved = drag.dx || 0;
    var quick = Math.abs(drag.v) > 0.35 && (drag.v < 0) === (moved < 0);
    if(Math.abs(moved) > dragSpan()*0.16 || quick) setFocus(moved < 0 ? 1 : 0, true);
  }else if(drag.mode === "ribbon"){
    faces.ribbon.classList.remove("is-dragging");
    if(drag.started && S.open){
      // it stays on whichever page you let go over
      var at = parseFloat(faces.ribbon.style.left) || 0;
      var side = (at + G.rw/2) < 0 ? 0 : 1;
      S.mark = S.spread*2 + side;
      store("lwk3:mark", String(S.mark));
    }else if(!drag.started){
      if(S.mark !== null && Math.floor(S.mark/2) !== S.spread) goToPage(S.mark);
      else if(S.mark === null && S.open){
        S.mark = S.spread*2 + 1;
        store("lwk3:mark", String(S.mark));
      }
    }
    S.ribbonDrag = false;
    paint();
  }else if(!drag.started && drag.mode === "cover"){
    openBook();
  }
  drag = null;
}
stage.addEventListener("pointerup", releaseDrag);
stage.addEventListener("pointercancel", releaseDrag);

stage.addEventListener("wheel", function(ev){
  ev.preventDefault();
  zoomAt(S.zoom * (ev.deltaY > 0 ? 0.9 : 1.1), ev.clientX, ev.clientY);
}, {passive:false});

// Pinch: scale about the midpoint of the two fingers, and let that midpoint
// carry the book with it, so two fingers both zoom and pan.
var pts = {}, pinch = null;
function midOf(a, b){ return [(a[0]+b[0])/2, (a[1]+b[1])/2]; }
stage.addEventListener("pointerdown", function(ev){
  pts[ev.pointerId] = [ev.clientX, ev.clientY];
});
stage.addEventListener("pointermove", function(ev){
  if(!(ev.pointerId in pts)) return;
  pts[ev.pointerId] = [ev.clientX, ev.clientY];
  var ids = Object.keys(pts);
  if(ids.length !== 2){ pinch = null; return; }
  drag = null;
  var a = pts[ids[0]], b = pts[ids[1]];
  var dist = Math.hypot(a[0]-b[0], a[1]-b[1]);
  var mid = midOf(a, b);
  if(!pinch){
    pinch = {dist:dist, zoom:S.zoom, mid:mid, pan:[S.panX, S.panY], c:stageCentre()};
    return;
  }
  var next = clamp(pinch.zoom * (dist / pinch.dist), 0.4, 4);
  var k = next / pinch.zoom;
  var d0x = pinch.mid[0] - pinch.c[0], d0y = pinch.mid[1] - pinch.c[1];
  S.panX = (mid[0] - pinch.c[0]) - k * (d0x - pinch.pan[0]);
  S.panY = (mid[1] - pinch.c[1]) - k * (d0y - pinch.pan[1]);
  S.zoom = next;
  applyView();
  store("lwk3:zoom", String(S.zoom));
});
function dropPt(ev){
  delete pts[ev.pointerId];
  if(Object.keys(pts).length < 2) pinch = null;
}
stage.addEventListener("pointerup", dropPt);
stage.addEventListener("pointercancel", dropPt);

/* ---------- controls ---------- */
var dialX = document.getElementById("dial-x");   // bottom edge: turns the book
var dialY = document.getElementById("dial-y");   // right edge: tilts the book
var edgeRead = document.getElementById("edge-read");
var readTimer;

function sizeEdges(){
  var wrap = document.querySelector(".edge-y");
  if(wrap) dialY.style.width = wrap.clientHeight + "px";
}
function syncDials(){
  dialX.value = Math.round(S.ry);
  // the vertical slider reads upward, and looking from higher up is a more
  // negative rotateX, so it carries the opposite sign
  dialY.value = Math.round(-S.rx);
}
function flashRead(text){
  edgeRead.textContent = text;
  edgeRead.classList.add("is-live");
  clearTimeout(readTimer);
  readTimer = setTimeout(function(){ edgeRead.classList.remove("is-live"); }, 900);
}
function liveEdge(el){
  el.classList.add("is-live");
  clearTimeout(el.__t);
  el.__t = setTimeout(function(){ el.classList.remove("is-live"); }, 900);
}
dialX.addEventListener("input", function(){
  S.ry = clamp(parseFloat(dialX.value), -78, 78);
  applyView(); liveEdge(dialX); flashRead("X " + Math.round(S.ry) + "\u00b0");
});
dialY.addEventListener("input", function(){
  S.rx = clamp(-parseFloat(dialY.value), -62, 62);
  applyView(); liveEdge(dialY); flashRead("Y " + Math.round(-S.rx) + "\u00b0");
});

document.getElementById("btn-in").onclick = function(){ zoomCentre(S.zoom*1.2); };
document.getElementById("btn-out").onclick = function(){ zoomCentre(S.zoom/1.2); };
document.getElementById("btn-reset").onclick = function(){
  S.rx=-14; S.ry=0; S.zoom=1; S.panX=0; S.panY=0;
  syncDials();
  book.classList.add("is-settling");
  camera.style.transition = "transform .5s cubic-bezier(.3,.02,.2,1)";
  applyView();
  setTimeout(function(){ camera.style.transition = ""; }, 520);
  setTimeout(function(){ book.classList.remove("is-settling"); }, 520);
};
document.getElementById("btn-close").onclick = closeBook;

function sheet(id,on){ document.getElementById(id).dataset.open = on ? "true" : "false"; }
document.getElementById("btn-contents").onclick = function(){ sheet("sheet-contents",true); };
document.getElementById("btn-search").onclick = function(){
  sheet("sheet-search",true); setTimeout(function(){ document.getElementById("q").focus(); },60);
};
document.querySelectorAll("[data-close]").forEach(function(b){
  b.onclick = function(){ sheet("sheet-contents",false); sheet("sheet-search",false); };
});

function goToPage(idx){
  S.spread = clamp(Math.floor(idx/2), 0, Math.max(0,Math.ceil(S.pages/2)-1));
  S.focus = idx % 2;
  if(!S.open){ S.open = true; faces.front.style.transform = coverTransform(-178); }
  paint();
  sheet("sheet-contents",false); sheet("sheet-search",false);
}

(function buildToc(){
  var byPart=[], seen={};
  BOOK.chapters.forEach(function(ch){
    if(!seen[ch.part]){ seen[ch.part]={roman:ch.partRoman,name:ch.partName,chs:[]}; byPart.push(seen[ch.part]); }
    seen[ch.part].chs.push(ch);
  });
  document.getElementById("toc").innerHTML =
    '<button class="toc-row" data-page-id="c-intro"><span class="n">·</span>'+
    '<span class="t">Introduction</span></button>' +
    byPart.map(function(p){
      return '<div class="toc-part"><h4><b>Part '+p.roman+'</b> · '+esc(p.name)+'</h4>'+
        p.chs.map(function(c){
          return '<button class="toc-row" data-page-id="c'+c.n+'"><span class="n">'+c.n+
            '</span><span class="t">'+esc(c.title)+'</span><span class="p" data-p="c'+c.n+'"></span></button>';
        }).join("")+"</div>";
    }).join("") +
    '<button class="toc-row" data-page-id="c-note"><span class="n">·</span>'+
    '<span class="t">'+esc(BOOK.noteTitle)+'</span></button>'+
    '<button class="toc-row" data-page-id="c-index"><span class="n">·</span>'+
    '<span class="t">'+esc(BOOK.indexTitle)+'</span></button>';
})();

document.addEventListener("click", function(ev){
  var row = ev.target.closest("[data-page-id]");
  if(row && starts[row.dataset.pageId] !== undefined) goToPage(starts[row.dataset.pageId]);
  var hit = ev.target.closest("[data-entry]");
  if(hit){
    var probe = faces.recto.querySelector(".face__flow");
    var node = probe.querySelector("#e"+hit.dataset.entry);
    if(node) goToPage(pageOf(node));
  }
});

var qt;
document.getElementById("q").addEventListener("input", function(e){
  clearTimeout(qt);
  var v = e.target.value.trim();
  qt = setTimeout(function(){
    var box = document.getElementById("results");
    if(v.length < 2){ box.innerHTML=""; return; }
    var t = v.toLowerCase();
    var hits = ALL.filter(function(x){
      return (x.quote+" "+x.attribution+" "+x.means+" "+x.use+" "+x.chTitle).toLowerCase().indexOf(t) !== -1;
    });
    box.innerHTML = hits.length ? hits.map(function(x){
      var q = esc(x.quote);
      if(!/[&<>"]/.test(v)) q = q.replace(new RegExp("("+v.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>");
      return '<button class="res" data-entry="'+x.n+'"><div class="q">\u201C'+q+'\u201D</div>'+
        '<div class="m">'+pad(x.n)+' · '+esc(x.attribution)+' · ch '+x.ch+'</div></button>';
    }).join("") : '<p class="empty">Nothing here. Try a plainer word.</p>';
  }, 160);
});

document.addEventListener("keydown", function(ev){
  if(ev.target.tagName === "INPUT") { if(ev.key==="Escape") ev.target.blur(); return; }
  if(ev.key === "ArrowRight") stepBy(1);
  else if(ev.key === "ArrowLeft") stepBy(-1);
  else if(ev.key === "Escape"){ sheet("sheet-contents",false); sheet("sheet-search",false); }
  else if(ev.key === "+" || ev.key === "="){ zoomCentre(S.zoom*1.2); }
  else if(ev.key === "-"){ zoomCentre(S.zoom/1.2); }
});

var rt;
window.addEventListener("resize", function(){
  clearTimeout(rt); rt = setTimeout(function(){ fitView(); sizeEdges(); syncDials(); }, 120);
});

S.zoom = clamp(parseFloat(recall("lwk3:zoom")||"1") || 1, 0.4, 4);
S.spread = parseInt(recall("lwk3:spread")||"0",10) || 0;
S.focus  = parseInt(recall("lwk3:focus")||"0",10) ? 1 : 0;
var savedMark = recall("lwk3:mark");
S.mark = (savedMark === null || savedMark === "null") ? null : (parseInt(savedMark,10) || 0);
layout();
sizeEdges();
syncDials();
var deep = (location.hash.match(/^#p(\d+)$/) || [])[1];
if(deep){
  S.open = true;
  S.spread = clamp(Math.floor((parseInt(deep,10)-1)/2), 0, Math.max(0,Math.ceil(S.pages/2)-1));
  S.focus = (parseInt(deep,10)-1) % 2;
  faces.front.style.transform = coverTransform(-178);
  paint();
}else if(recall("lwk3:open") === "1"){
  S.open = true;
  faces.front.style.transform = coverTransform(-178);
  paint();
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ layout(); });
})();
</script>
