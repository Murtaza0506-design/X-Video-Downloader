 so. No study at all is not, and the same sentence covers both.","ch":7},{"n":84,"quote":"I'll let the data speak for itself.","bare":false,"attribution":"Pretending Numbers Are Not Interpreted","means":"It presents a selection and a framing as though it were raw reality, and it positions any disagreement as an argument with arithmetic rather than with the person who chose what to show.","use":"\"Data doesn't speak. What did you leave out?\" Not hostile, just accurate. Every chart is a set of decisions about inclusion, axis and comparison, and naming that returns the argument to the person who made them.","ch":7}]},{"n":8,"title":"Weaponising Doubt","part":"Three","partRoman":"III","partName":"Abusing the Evidence","opening":"<p>Doubt is the correct response to most claims, which is what makes it such good cover. Everything in this chapter is a virtue turned into a tool: scepticism, the demand for evidence, the awareness that experts have been wrong before, the recognition that correlation is not causation. Each of those is a genuine intellectual instrument. Each of them can be pointed at any claim whatsoever, indefinitely, without ever proposing anything.</p><p>That is the tell, and it is worth stating early because it is the only reliable one. Honest doubt is specific and it can be satisfied. It names what would change its mind. Weaponised doubt is general and permanent: whatever evidence arrives, there is a reason it does not count, and no evidence is ever described in advance that would settle the matter.</p><p>So the counter for the whole chapter is a single question, asked once and asked genuinely: <strong>what would change your mind?</strong> A serious sceptic has an answer, often a good one, and the conversation becomes worth having. Somebody using doubt as a shield will not answer it, and their refusal is more informative to everybody listening than any evidence you could produce.</p><p>Ask it without triumph. It is a real question, and about a third of the time you will get a real answer that improves your own position. The other two thirds it ends the move without a fight.</p>","entries":[{"n":85,"quote":"The science on this isn't settled.","bare":false,"attribution":"Manufactured Uncertainty","means":"No science is ever fully settled, so the sentence is always true and always available. It converts a strong finding into an open question by describing the small remaining uncertainty as though it were the whole picture.","use":"Ask about the shape of the disagreement. \"What's still open, and what's agreed?\" Real live controversies have a location. When the answer is that everything is open, that is not a description of the field, it is a description of the strategy.","ch":8},{"n":86,"quote":"That study was funded by the industry, of course.","bare":false,"attribution":"The Funding Smear","means":"Funding is a genuine source of bias, so the observation is legitimate and the inference is not. Noting who paid feels like doing due diligence while functioning as a complete substitute for reading the paper.","use":"Grant it and go to the method. \"That's worth knowing. Does it change what they measured?\" Bias operates through design and reporting, which are visible. If the funding did distort it, you can point at where. If you cannot, the objection has not yet done any work.","ch":8},{"n":87,"quote":"Correlation isn't causation.","bare":false,"attribution":"A True Sentence Used as a Stop Sign","means":"It is correct and it sounds like the end of the discussion. Deployed as a full response rather than an opening one, it exempts the speaker from engaging with whatever the study did to address exactly that problem.","use":"Agree and continue. \"No, so what would you want to see? They controlled for income and did a five-year follow-up.\" Causation is established by accumulation, not by a single result, and describing the accumulation is the answer this sentence pretends does not exist.","ch":8},{"n":88,"quote":"You can prove anything with statistics.","bare":false,"attribution":"Blanket Discrediting","means":"It discredits an entire category of evidence in six words, and it costs nothing, and it feels worldly. Once accepted, no number can be introduced by anybody, which reliably suits whoever has fewer of them.","use":"\"You can't, actually. What's wrong with these ones?\" Said lightly. The general claim collapses the moment it has to become a specific criticism, and it turns out there is no specific criticism available.","ch":8},{"n":89,"quote":"We need more research before we do anything.","bare":false,"attribution":"Perpetual Insufficiency","means":"More research is always possible, so the condition can never be met, and the delay it produces looks like prudence rather than opposition. It also puts the burden of certainty entirely on one side.","use":"Ask for the threshold. \"How much would be enough, and by when?\" A number and a date turn an indefinite delay into a plan. The absence of both is the answer, and it is a much clearer answer than any argument about the existing evidence.","ch":8},{"n":90,"quote":"There are good people on both sides of this.","bare":false,"attribution":"False Balance","means":"Even-handedness is a virtue and this borrows its appearance. Where the evidence is lopsided, presenting two sides as equally weighted is itself a distortion, delivered in the voice of fairness.","use":"Accept the civility and restore the weights. \"Both sides deserve a hearing. They don't have the same amount of evidence, and that's worth saying too.\" You have conceded nothing about tone while declining to concede the substance, which is the only version of this that does not sound partisan.","ch":8},{"n":91,"quote":"They told us eggs were bad for us, and now they're fine.","bare":false,"attribution":"The Past Reversal Gambit","means":"It is true, it is memorable, and it generalises from a handful of famous reversals to everything. The implied conclusion is that current advice is as likely to flip as past advice, regardless of how well established it is.","use":"Point at the strength rather than the fact of the finding. \"Some things reversed. The ones that reversed were thin to begin with. How strong is this one?\" That distinction is the whole answer, and it also happens to be a useful way to read health news.","ch":8},{"n":92,"quote":"Show me one study that proves it definitively.","bare":false,"attribution":"The Impossible Standard","means":"Proof is a word from mathematics and does not apply to empirical questions, so the demand can never be met. It sounds rigorous while asking for something that does not exist in any field.","use":"Name the achievable standard. \"Nothing outside maths gets proved. What we've got is nine studies, three designs, same direction. What would you accept?\" Refusing the word without refusing the scrutiny is the move here.","ch":8},{"n":93,"quote":"There are still a lot of unanswered questions.","bare":false,"attribution":"Unspecified Doubt","means":"It gestures at problems without naming any, so there is nothing to answer and the impression of a shaky case lingers. It is also unfalsifiable: there are always unanswered questions.","use":"\"Which ones? I'll go and look.\" The request is friendly and it is fatal. Either you get a list, which is useful and answerable, or the questions turn out not to exist in any specific form.","ch":8},{"n":94,"quote":"I'm just a sceptic by nature, that's all.","bare":false,"attribution":"Scepticism as Identity","means":"It converts a position into a personality, which puts it beyond argument. You cannot rebut somebody's temperament, and framing doubt as a permanent trait excuses it from ever being satisfied by anything.","use":"Take the identity seriously and test it. \"So am I. What would convince you?\" Real scepticism is a method with an exit; it can say what would change its mind. Identity scepticism has no exit, and the question makes the difference plain.","ch":8},{"n":95,"quote":"Ask yourself who benefits from you believing that.","bare":false,"attribution":"The Motive Inversion","means":"It replaces the question of whether a claim is true with the question of who gains, which is unanswerable and endless. It also flatters the listener as somebody who sees behind things.","use":"Answer it and move past it. \"Plenty of people, probably. It's still either true or false, and here's how we'd check.\" Following the money is a legitimate investigative technique and a terrible epistemology, and the difference is whether it ever returns to the evidence.","ch":8},{"n":96,"quote":"I'm not saying it's wrong, I'm just raising the possibility.","bare":false,"attribution":"The Costless Suggestion","means":"Raising a possibility puts it in the room while disclaiming responsibility for it. It requires no support, cannot be rebutted, and leaves a residue of doubt that outlasts any correction.","use":"Ask what the possibility rests on. \"Is there anything behind it, or is it just possible?\" Everything is possible. The distinction between a possibility with evidence and a possibility without one is the entire question, and drawing it politely ends the move.","ch":8}]},{"n":9,"title":"False Choices","part":"Three","partRoman":"III","partName":"Abusing the Evidence","opening":"<p>Most decisions have more than two options, and almost every persuasive account of a decision presents exactly two. This is not usually dishonesty. It is compression, and compression is necessary, because nobody can hold nine possibilities in mind while being asked to choose. The abuse begins when the compression is done by somebody with a preference, and the option they dislike is the one that vanishes.</p><p>What makes the family hard to counter is that objecting sounds like refusing to decide. The person offering two options is being practical. The person saying <em>there might be a third</em> is being difficult, and they usually cannot describe the third one on the spot, because they have just been handed the framing thirty seconds ago.</p><p>That asymmetry is worth naming to yourself before you walk into a meeting where a decision is being framed. You will be at a disadvantage that has nothing to do with being wrong. It comes from the fact that the person who chose the options has been thinking about them for a week.</p><p>The counters below are about buying the time to find the missing option, and about declining to accept a choice as complete simply because it has been presented as complete. The most useful sentence in the chapter is the least impressive one: <em>those are two of the options.</em></p>","entries":[{"n":97,"quote":"We either act now or we accept it will never happen.","bare":false,"attribution":"The False Dilemma","means":"Two options presented as exhaustive, with the speaker's preference made to look like the only responsible one. The audience evaluates which of the two is better rather than whether there are only two.","use":"\"Those are two of the options.\" Then pause. The sentence is unremarkable and it reopens the field, and the pause is what gives you and everybody else the moment needed to think of a third that nobody has mentioned.","ch":9},{"n":98,"quote":"You're either with us on this or you're against us.","bare":false,"attribution":"The Loyalty Binary","means":"It converts a question about a proposal into a question about allegiance, and allegiance is answered instantly and emotionally. Anybody with a specific reservation is sorted into the opposition before they can state it.","use":"Refuse the sorting and be concrete. \"I'm for the goal and against clause four, which I think will backfire.\" Specificity is the only escape. A general answer to a binary is a binary answer.","ch":9},{"n":99,"quote":"Would you rather we did what the last lot did?","bare":false,"attribution":"The Worse Option Defence","means":"A bad thing is measured against a worse thing and comes out looking like a success. The comparison is real and the standard is wrong, since the alternative on offer is not the only alternative that existed.","use":"Move the comparison. \"Better than the worst option available isn't the test. Compared with what we said we'd do, how did it go?\" Choosing the benchmark is most of the argument, and asking for a different one is not a dodge.","ch":9},{"n":100,"quote":"It's not perfect, but what's the alternative?","bare":false,"attribution":"Argument from No Alternative","means":"It grants the criticism, which disarms you, and then makes the absence of a ready replacement into a positive case. It is effective because it is often sincerely meant and sometimes correct.","use":"\"Let's find out. Nobody's looked yet.\" Then propose the search rather than the substitute. The claim that no alternative exists is a claim about the world, and it is nearly always made without anybody having checked.","ch":9},{"n":101,"quote":"We've already put eighteen months into this.","bare":false,"attribution":"The Sunk Cost Appeal","means":"The effort spent is real and it feels like an asset. It is not: the eighteen months are gone whatever you decide next, and they carry emotional weight precisely because abandoning them means admitting they were wasted.","use":"Frame the decision forward. \"If we were starting today, knowing what we know, would we choose this?\" It is the same question stripped of the past, and it often produces a different answer from the same people in the same room.","ch":9},{"n":102,"quote":"Fine, so what would you do instead?","bare":false,"attribution":"Demanding a Full Alternative","means":"It makes the right to criticise conditional on having a finished plan, which almost nobody has. Pointing out that a bridge will fall down does not require you to be able to design a bridge.","use":"Separate the two jobs. \"I don't have a plan and this one has a hole in it. Both things can be true.\" Say it without apology. Once accepted, the criticism can be examined on its own, which is the only way it can be either fixed or dismissed properly.","ch":9},{"n":103,"quote":"It's a trade-off. You can't have both.","bare":false,"attribution":"The Invented Trade-off","means":"Real trade-offs exist everywhere, so an invented one is camouflaged among them. Presenting two goods as necessarily opposed forecloses the possibility that some arrangement gets more of each.","use":"Ask for the mechanism. \"What makes them exclusive?\" Genuine trade-offs have a reason: a fixed budget, a physical constraint, a finite hour. Invented ones have only an assertion, and the question distinguishes them immediately.","ch":9},{"n":104,"quote":"Look, something is better than nothing.","bare":false,"attribution":"Ignoring That Something Can Be Worse","means":"It sounds like pragmatism and it feels generous towards action. It quietly assumes the floor is zero, when a badly designed intervention can leave things worse than leaving them alone.","use":"\"Sometimes. What happens if this one doesn't work?\" Asking for the downside case is not obstruction; it is the missing half of the comparison, and a proposal that has not considered it is not finished.","ch":9},{"n":105,"quote":"We have to start somewhere.","bare":false,"attribution":"The Unexamined First Step","means":"It grants that the step is imperfect while making any objection sound like a demand for perfection. It also implies that the direction has been agreed, when the direction is the thing in dispute.","use":"\"Agreed. Does this step get us closer, or does it just get us moving?\" The distinction is the point. Motion and progress feel identical from inside a meeting and are different a year later.","ch":9},{"n":106,"quote":"That's just the price of doing business.","bare":false,"attribution":"Naturalising the Cost","means":"It reclassifies a choice as a law of nature. Once a cost is described as inherent, arguing about it looks naive, and the fact that somebody decided to accept it disappears from the conversation.","use":"\"Who set that price?\" Costs presented as inevitable are usually the outcome of a decision that could be revisited, and often the decision was made years ago by people who are no longer here.","ch":9},{"n":107,"quote":"There isn't time to explore other options.","bare":false,"attribution":"Urgency as an Argument","means":"Time pressure is the most reliable way to close a decision, because it converts thinking into delay. Sometimes it is genuine, which is what makes the manufactured version so hard to challenge.","use":"Test the deadline. \"What happens if we decide on Thursday instead of today?\" A real deadline has consequences that can be named. A manufactured one has a mood, and the question separates them without accusing anybody.","ch":9},{"n":108,"quote":"So you'd rather do nothing at all.","bare":false,"attribution":"The Inaction Smear","means":"It assigns you the one position nobody wants to hold. Inaction is the default and the default is always available to be blamed, so the person defending scrutiny is made to own everything that happens while scrutiny takes place.","use":"Name the third option out loud, even if it is small. \"I'd rather do the pilot first, and then decide.\" A concrete, modest alternative is the only reliable answer to this, because it makes the choice visibly wider than two.","ch":9}]},{"n":10,"title":"Emotional Leverage","part":"Four","partRoman":"IV","partName":"Playing the Room","opening":"<p>Feeling is not the enemy of argument. A person who felt nothing about anything would have no reason to argue and no way to judge which conclusions mattered. Every move in this chapter takes something legitimate, sympathy, worry, loyalty, guilt, and uses it to close a question that has not been answered.</p><p>The distinguishing feature is direction. Emotion that is part of an argument points at the world: this policy will hurt these people, and here is how. Emotion used as leverage points at you: agreeing is how you demonstrate that you are not cruel, and disagreeing will cost you something socially. Notice which way it is aimed and most of the chapter becomes visible.</p><p>These are the hardest moves to counter, for a reason that has nothing to do with logic. Countering them well requires being briefly, visibly unmoved by somebody&#x27;s distress, in front of people who are watching. That feels bad, and it looks bad, and sometimes the distress is entirely real, which means you can be right about the argument and still be the one who behaved badly.</p><p>So the counters here are gentler than elsewhere and slower. Nearly all of them separate two things that have been deliberately fused: acknowledging the feeling, which costs nothing and is usually deserved, and answering the question, which is a different act. Do the first properly and unhurriedly, and the second becomes possible.</p><p>Where the distress is genuine and the stakes are personal, consider that winning may not be the thing to do. That is not in the counters below because it is not a counter. It is the alternative to using them.</p>","entries":[{"n":109,"quote":"Think about what this will do to the children.","bare":false,"attribution":"The Appeal to Sympathy","means":"It is vivid, immediate and usually true of somebody. A specific imagined child overwhelms an abstract argument about aggregate outcomes, because that is how human attention is built.","use":"Take the child seriously and widen the frame. \"That's exactly who I'm thinking about, which is why I want to know what happens to the other four hundred.\" You have accepted the emotional premise entirely, which removes the accusation of coldness, and reintroduced the arithmetic that was being crowded out.","ch":10},{"n":110,"quote":"I'd be really hurt if you went ahead with that.","bare":false,"attribution":"Pre-emptive Guilt","means":"It attaches a personal cost to a decision before the decision is made, so any assessment of the merits now has a thumb on the scale. It is also honest, which makes it hard to name as a tactic.","use":"Acknowledge it, then separate it. \"I don't want to hurt you, and I want to decide this on what it does. Can we do the merits first, and then talk about you and me?\" Both things get their turn, which is the only fair version.","ch":10},{"n":111,"quote":"After everything I've done for you.","bare":false,"attribution":"The Debt Claim","means":"It converts a disagreement into an act of ingratitude. The debt is usually real, which is why it lands, and the implication is that the debt is payable in agreement.","use":"Honour the debt and decline the currency. \"You have, and I'm grateful, and I don't think I can repay it by agreeing with something I think is wrong.\" Said warmly, it is hard to argue with, because it concedes every fact and refuses only the inference.","ch":10},{"n":112,"quote":"Could you live with that on your conscience?","bare":false,"attribution":"Responsibility Transfer","means":"It makes you the author of an outcome you are merely declining to prevent, which is a much heavier position. It also skips the question of whether the proposed action would prevent it.","use":"Put the causation back. \"I could if it wouldn't have helped. Would it?\" That returns the discussion to whether the intervention works, which is where it belongs, and it does so without disclaiming responsibility in general.","ch":10},{"n":113,"quote":"I'm only saying this because I'm worried about you.","bare":false,"attribution":"Concern as Control","means":"Concern cannot be refused without appearing to reject care, and it licenses statements that would otherwise be unacceptable. It is also frequently sincere, which is what makes it so difficult.","use":"Accept the concern, decline the conclusion. \"I know you are, and I've thought about it, and I'm going to do it anyway.\" No argument about whether the worry is legitimate. That argument has no end, and it is not the one you need to win.","ch":10},{"n":114,"quote":"Everyone's been really upset about it, actually.","bare":false,"attribution":"The Reported Distress","means":"It brings absent people into the room as evidence, and their feelings cannot be examined or contradicted. It also implies a consensus you were not present for and cannot check.","use":"Ask for the substance behind the feeling. \"That's worth knowing. What is it they think went wrong?\" Distress reported second hand is an invitation to guess. Converting it into a specific complaint is the only way to do anything useful with it.","ch":10},{"n":115,"quote":"You're the only one who can sort this out.","bare":false,"attribution":"Flattery as Obligation","means":"It combines a compliment with a job. Declining now means both refusing the task and rejecting the flattering picture of yourself, and most people will take on more than they should rather than do that.","use":"Keep the compliment, examine the job. \"That's kind. Let's look at whether I should, separately from whether I can.\" Splitting capability from obligation is what makes it possible to say no without appearing to deny the compliment.","ch":10},{"n":116,"quote":"I don't want to fight. I just want us to be all right.","bare":false,"attribution":"Peace as a Weapon","means":"It frames the continuation of the discussion as aggression. Whoever wants to keep talking about the problem is now the one disturbing the peace, and the unresolved thing is preserved by the very desire for calm.","use":"Agree about the goal and name the route. \"So do I, and I don't think we get there by leaving this. Ten minutes, then we stop.\" The time limit is what makes it acceptable. Open-ended is what people are refusing, more often than the subject itself.","ch":10},{"n":117,"quote":"Fine. Do whatever you want.","bare":false,"attribution":"The Withdrawal","means":"It ends the exchange while transferring all responsibility to you, and it leaves the disagreement intact and unspoken. Nothing has been resolved, and pursuing it now means chasing somebody who has left.","use":"Decline the transfer without pursuing. \"I don't want to do whatever I want, I want us to agree. Come back to it when you're ready.\" Then genuinely leave it. Chasing a withdrawal confirms that it works.","ch":10},{"n":118,"quote":"You know how this is going to make me look.","bare":false,"attribution":"Reputational Hostage","means":"It introduces a cost to somebody you care about, and the cost is social, which means it cannot be argued away with facts. The right answer to the question becomes secondary to the standing of a person in the room.","use":"Take it seriously and put it in its place. \"I don't want that either. Is there a way to do the right thing and manage how it looks?\" Very often there is, and it goes unexplored because the two questions were presented as one.","ch":10},{"n":119,"quote":"Imagine it was your own mother in that ward.","bare":false,"attribution":"Forced Identification","means":"It replaces judgement with imagination, and imagination is partial by design. You are asked to reason from the position of maximum personal stake, which is the position from which policy is judged worst.","use":"Accept the exercise and note its limits. \"I'd want everything, immediately, and I'd be a terrible person to ask about the allocation.\" That is honest, sympathetic, and makes the point that the strength of feeling is exactly why the decision is not made that way.","ch":10},{"n":120,"quote":"I'm sorry you feel that way.","bare":false,"attribution":"The Apology That Is Not One","means":"It has the shape of an apology and the content of a diagnosis. Nothing is admitted, the grievance is relocated into your feelings, and the speaker has been publicly gracious.","use":"Name what an apology would be about. \"I'm not after an apology for my feelings. I'd like to know whether you think the thing itself was wrong.\" That is the question the form was designed to skip, and asking it plainly is the only way to get it back.","ch":10}]},{"n":11,"title":"Running Out the Clock","part":"Four","partRoman":"IV","partName":"Playing the Room","opening":"<p>Some arguments are not won. They are outlasted. The point is never refuted, it is deferred, referred, widened, minuted and scheduled until the moment for acting on it has passed, and then it stops being relevant on its own. Nobody has to say no. The calendar says it for them.</p><p>This is the characteristic move of institutions rather than individuals, and it is worth a chapter because it is nearly invisible from inside. Every step is procedurally correct. Taking something offline is sensible. Getting the right people in the room is sensible. Checking with legal is sensible. It is only when you stand back and notice that eleven sensible steps have produced no decision in five months that the shape becomes clear.</p><p>The person doing it often does not experience themselves as doing anything. They are being careful, and being careful is indistinguishable from stalling except in one respect: stalling never has a date attached.</p><p>That is the whole counter, and it is the same for every entry below. <strong>Attach a date and a name to everything.</strong> Who is doing it, by when, and what happens if it does not happen. Say it out loud in the meeting and put it in the note afterwards. Do that consistently and most of this chapter becomes unusable against you, without you ever having accused anybody of anything.</p><p>Write things down. It is unglamorous and it is the single most effective habit in this book.</p>","entries":[{"n":121,"quote":"Let's take this offline.","bare":false,"attribution":"The Offline Burial","means":"It removes the item from the room where a decision could be witnessed and moves it somewhere with no minutes and no attendees. Perfectly reasonable for detail, and reliably fatal to anything raised inconveniently.","use":"\"Happy to. You and me, Thursday morning?\" Naming two people and a day converts the offline into an actual appointment. Without that, offline means nowhere.","ch":11},{"n":122,"quote":"Let me come back to you on that.","bare":false,"attribution":"The Indefinite Deferral","means":"It is a promise with no due date, which means it is not a promise. It also feels like progress in the moment, so nobody objects, and the absence of a deadline is only noticed weeks later.","use":"\"By when? I'll put it in the note.\" The second half is what matters. A deferral that appears in writing with a date has to be either honoured or explicitly broken, and most people would rather honour it.","ch":11},{"n":123,"quote":"We should get the right people in the room before we decide.","bare":false,"attribution":"Widening to Stall","means":"It is unanswerable, because the right people should be in the room, and every additional person makes scheduling harder. Widening is the most respectable way to slow anything down.","use":"\"Who's missing, and can we get them this week?\" Naming the gap makes it fillable. Left unnamed, the missing people multiply each time the question comes up.","ch":11},{"n":124,"quote":"Could you put that in writing for me?","bare":false,"attribution":"Process as Friction","means":"It converts a two-minute conversation into an hour of work, and it is legitimate, which is the beauty of it. Repeated a few times, it makes raising things expensive enough that people stop.","use":"Do it, and make it short. Three sentences and a question, not a document. Then send it with a date on the reply. The friction only works if you produce something long enough to be worth avoiding.","ch":11},{"n":125,"quote":"Let's park that for now.","bare":false,"attribution":"Parking Forever","means":"It sounds like ordinary agenda management, and it is, until you notice that nothing ever comes out of the car park. There is no mechanism by which a parked item returns unless somebody builds one.","use":"\"Parked until when?\" Then write it in the list of parked items with the date. The list is the mechanism. Without it, parking is a euphemism for discarding.","ch":11},{"n":126,"quote":"We're nearly out of time, so let's move on.","bare":false,"attribution":"Clock Management","means":"The person controlling the agenda controls which items get the minutes, and the item that gets the last four minutes cannot be decided properly. Nothing needs to be refused; it simply does not fit.","use":"Move it, don't drop it. \"Then let's start with it next time.\" Say it before the meeting closes, so it is in the record. An item that has been squeezed twice and named twice is much harder to squeeze a third time.","ch":11},{"n":127,"quote":"Just to give a bit of background before I answer.","bare":false,"attribution":"The Preamble","means":"It consumes the available minutes with material nobody can object to, and by the time the background is finished the question has lost its urgency, or the meeting has.","use":"Ask for the order to be reversed. \"Can I get the short answer first, and then the background?\" Almost nobody refuses this, and it turns out the short answer is often thirty seconds long.","ch":11},{"n":128,"quote":"I'd need to run that past legal.","bare":false,"attribution":"Borrowed Delay","means":"It transfers the decision to somebody not present, who has their own queue, and it is impossible to argue against without appearing reckless. The delay is real and the responsibility for it has been outsourced.","use":"\"Of course. Shall I send them the question today?\" Offering to do the sending is what separates a real check from a shelf. It is helpful, it is hard to refuse, and it puts a clock on it.","ch":11},{"n":129,"quote":"I think this needs a proper working group.","bare":false,"attribution":"Referral to Committee","means":"It is the most respectable form of burial available. A working group takes weeks to form, months to report, and its report arrives after the decision has been made by events.","use":"\"Good. Who chairs it, who's on it, and when does it report?\" Three questions. A serious proposal answers them; a burial cannot, and asking makes that visible without any accusation.","ch":11},{"n":130,"quote":"Sorry, remind me of the question again?","bare":false,"attribution":"Forced Repetition","means":"Each repetition costs you time and credibility, since restating the same point three times makes you look fixated rather than persistent, while the person asking appears merely attentive.","use":"Read it, do not re-explain it. \"It's the second line of the note I sent: were the figures signed off?\" Reading from a document takes eight seconds and cannot be made to look obsessive.","ch":11},{"n":131,"quote":"We've been through all this before.","bare":false,"attribution":"Claiming It Is Settled","means":"It asserts that the discussion has already happened and reached a conclusion, which makes reopening it a waste of everybody's time. Whether it actually concluded is not examined.","use":"\"We discussed it. What did we decide?\" If there is a decision, you have your answer and should accept it. If nobody can state it, then it was discussed and not settled, and that difference is the entire point.","ch":11},{"n":132,"quote":"Sorry, I'm going to have to jump.","bare":false,"attribution":"The Hard Stop","means":"It ends the conversation unilaterally at a moment of the speaker's choosing, usually just after a difficult question, and it is unchallengeable because everybody has other meetings.","use":"Get one line in before they go. \"No problem. I'll send the question by email so we can pick it up.\" Said quickly, it survives the departure. The item leaves the room in writing rather than evaporating with the call.","ch":11}]},{"n":12,"title":"When You Are the One Doing It","part":"Four","partRoman":"IV","partName":"Playing the Room","opening":"<p>Everything so far has been written from one side of the table. That was a convenience, and it was also a lie, because the honest version of this subject is that you use these moves. Not the crude ones. The respectable ones: the zoom out when the detail was against you, the request for a source you had no intention of reading, the sarcastic restatement that got a laugh, the offline that you never followed up.</p><p>You will have recognised some of them while reading and felt the small hot flush of it. That reaction is the most useful thing this book produces, and it is worth more than any of the counters, because the counters only protect you from other people.</p><p>There is a reason it happens to everyone. Once you believe a thing, the mind stops looking for reasons and starts looking for arguments, and those are different activities that feel identical from the inside. Reasons are what you use to decide. Arguments are what you use to win. The moment the conclusion is fixed, every rhetorical move becomes available and none of them feels dishonest, because you are not trying to deceive anybody. You are trying to bring them to something you already know is true.</p><p>That is the condition this chapter is about, and it has no clean solution. What it has are symptoms, and the entries below are the ones worth learning to notice in yourself, in the middle of the argument, while there is still time to stop.</p><p>The last one is the point of the chapter, and possibly the point of the book.</p>","entries":[{"n":133,"quote":"I'm just being honest.","bare":false,"attribution":"Honesty as Licence","means":"It converts an unkindness into a virtue, and it does so sincerely. Being honest and being unkind are independent, and the phrase is almost always deployed for something that was true and did not need saying.","use":"Ask yourself the second question. Would you have said it if it were kind rather than cutting? Honesty that only surfaces when it wounds is not a commitment to truth, it is a permission slip, and you can hear yourself reaching for it.","ch":12},{"n":134,"quote":"They started it.","bare":false,"attribution":"The Retaliation Excuse","means":"It feels like justice and it is a decision to lower your own standard. It is also structurally unavailable to check, since both sides remember starting second.","use":"Notice that you now have their standard rather than yours. If the move was bad when it was done to you, it did not improve on the way back. The only person whose conduct you were ever going to control has just stopped controlling it.","ch":12},{"n":135,"quote":"Well, it worked, didn't it.","bare":false,"attribution":"Effectiveness as Justification","means":"Winning is real and visible, and the cost is neither. It is true that the move succeeded, and irrelevant to whether the position it defended was correct.","use":"Ask what you won. If you got agreement without changing anybody's understanding, you have a compliance that will not survive the first time somebody checks. That is not a win with a long shelf life.","ch":12},{"n":136,"quote":"I knew I was right, I just couldn't explain why at the time.","bare":false,"attribution":"Conclusion First","means":"Sometimes it is true; intuition runs ahead of articulation and is often correct. It is also the exact sensation of motivated reasoning, and the two are indistinguishable from inside.","use":"Write the reason down afterwards, when nobody is watching. If it comes easily, the intuition was doing real work. If you find yourself constructing rather than recalling, you have learned something uncomfortable and useful about that particular certainty.","ch":12},{"n":137,"quote":"I'd stopped listening about halfway through.","bare":false,"attribution":"Deciding Before They Finished","means":"Attention is expensive and prediction is cheap, so the mind fills in the rest of somebody's argument from the first few sentences and spends the remainder preparing a reply. It feels like efficiency.","use":"Try summarising their position back to them before you answer it. If you cannot, you were not listening, you were queueing. This one habit removes about half of the straw men you would otherwise commit.","ch":12},{"n":138,"quote":"There was no point explaining the real reason to them.","bare":false,"attribution":"Condescension as Kindness","means":"It presents a decision to be less than honest as consideration for somebody's limits, and it is occasionally correct. Mostly it is a way of avoiding a reason you would rather not defend.","use":"Ask whether you could say the real reason out loud to them. If the answer is that they would disagree, that is not a reason to withhold it. If the answer is that they would be right to, you have found the actual problem.","ch":12},{"n":139,"quote":"I had them on the ropes, so I kept going.","bare":false,"attribution":"Not Stopping at Enough","means":"Momentum is pleasurable, and there is no natural signal to stop once the point is made. Continuing past the point converts a persuaded person into a humiliated one, and humiliated people do not concede.","use":"Watch for the moment they stop defending and start absorbing. That is the end. Anything after it is not argument, it is collection, and it costs you the agreement you had just earned.","ch":12},{"n":140,"quote":"I never actually said it was false.","bare":false,"attribution":"Technically True","means":"It preserves deniability by leaving the claim implied rather than stated, which means you can believe yourself to have been accurate while knowing exactly what impression you left.","use":"Ask what they walked away believing, and whether you intended that. Communication is measured at the receiver. A sentence that is defensible in a transcript and misleading in a room was chosen for that property.","ch":12},{"n":141,"quote":"I was fairly sure, so I said it.","bare":false,"attribution":"Confidence Without Checking","means":"Checking is slow and confidence is free, and in most conversations nobody verifies anything. You will be right often enough that the times you are not will not correct the habit.","use":"Calibrate out loud. \"I think it's about forty percent, but I'd want to check.\" It costs one clause and it makes you more credible rather than less, because the times you do state something flatly then mean something.","ch":12},{"n":142,"quote":"I wanted them to feel it.","bare":false,"attribution":"Wanting to Win More Than to Be Right","means":"There is genuine pleasure in landing a line, and it is a different appetite from wanting to be understood. It usually appears when something else has made you feel small earlier in the day.","use":"Notice the appetite and treat it as information about you rather than about them. It is a reliable sign that this argument has stopped being about the subject, and the best available move is to stop talking for a minute.","ch":12},{"n":143,"quote":"I'm not going to apologise for caring about this.","bare":false,"attribution":"Refusing to Concede Anything","means":"Caring is real and it makes any retreat feel like a betrayal of the thing you care about. So you defend every part of your position equally, including the weak parts, which is how a good case gets discredited by its worst component.","use":"Concede the weakest part first, deliberately, out loud. It is the single most persuasive thing available to anybody in an argument, and it costs you the part you could not defend anyway.","ch":12},{"n":144,"quote":"You know what, you're right. I hadn't thought of that.","bare":false,"attribution":"Losing on Purpose","means":"Nothing in this book is more effective and almost nobody uses it. Conceding immediately and without conditions ends the contest, and what is left is two people looking at the same problem, which was supposed to be the point.","use":"This is the exit, and it is the last thing in the book for a reason. You are allowed to lose. You are allowed to say you have changed your mind, in public, without a face-saving clause attached. And you are allowed to walk away from an argument you could win, with somebody who is never going to change their mind, about something that will not matter by Friday. Recognising the moves is useful. Not needing to win is better, and it is available at any point, including right now, in the argument you are already having.","ch":12}]}],"index":[{"name":"Absence of Evidence","letter":"A","items":[{"n":83,"quote":"There's no evidence of any harm.","ch":7,"q":""}]},{"name":"After, Therefore Because","letter":"A","items":[{"n":76,"quote":"Since the policy came in, waiting times have fallen.","ch":7,"q":""}]},{"name":"The Anecdotal Insider","letter":"A","items":[{"n":59,"quote":"My cousin works in the hospital and she says it's nothing like that.","ch":5,"q":""}]},{"name":"The Anonymous Ally","letter":"A","items":[{"n":33,"quote":"A lot of people are saying the figures were manipulated.","ch":3,"q":""}]},{"name":"The Apology That Is Not One","letter":"A","items":[{"n":120,"quote":"I'm sorry you feel that way.","ch":10,"q":""}]},{"name":"The Appeal to Sympathy","letter":"A","items":[{"n":109,"quote":"Think about what this will do to the children.","ch":10,"q":""}]},{"name":"Argument from No Alternative","letter":"A","items":[{"n":100,"quote":"It's not perfect, but what's the alternative?","ch":9,"q":""}]},{"name":"Assumed Ignorance","letter":"A","items":[{"n":46,"quote":"You clearly haven't read the report.","ch":4,"q":""}]},{"name":"The Attendance Record","letter":"A","items":[{"n":63,"quote":"Where were you when we needed people?","ch":6,"q":""}]},{"name":"Blanket Discrediting","letter":"B","items":[{"n":88,"quote":"You can prove anything with statistics.","ch":8,"q":""}]},{"name":"Borrowed Delay","letter":"B","items":[{"n":128,"quote":"I'd need to run that past legal.","ch":11,"q":""}]},{"name":"The Calm-Down","letter":"C","items":[{"n":43,"quote":"Calm down.","ch":4,"q":""}]},{"name":"Category Assignment","letter":"C","items":[{"n":45,"quote":"That's such a typical response from someone in your position.","ch":4,"q":""}]},{"name":"Character Reference as Evidence","letter":"C","items":[{
