name: Build and publish the book

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishing by pushing the built site to gh-pages, rather than through the
# Pages deployment API: creating a Pages site through the API needs a
# permission the workflow token does not have here.
permissions:
  contents: write

concurrency:
  group: publish-book
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # The site is generated from content/*.md, so the published book can
      # never drift from the manuscript.
      - name: Build the book
        run: python3 scripts/build_site.py

      - name: Check the manuscript is intact
        run: python3 scripts/check_book.py

      - name: Publish to gh-pages
        run: |
          set -euo pipefail
          rm -rf /tmp/out && mkdir -p /tmp/out
          cp -r site/. /tmp/out/
          touch /tmp/out/.nojekyll
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin gh-pages --depth=1 || true
          git checkout -B gh-pages
          git rm -rqf . --ignore-unmatch
          cp -r /tmp/out/. .
          git add -A
          if git diff --cached --quiet; then
            echo "The published book is already up to date."
          else
            git commit -m "Publish the book from ${GITHUB_SHA::7}"
            git push --force origin gh-pages
          fi
