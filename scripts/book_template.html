<title>Lines Worth Keeping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&display=swap">
<style>
:root{
  --paper:#E3E5E0;
  --desk:#CDD0CA;
  --desk-2:#B9BDB6;
  --surface:#EDEEEA;
  --ink:#191C1B;
  --ink-soft:#43474A;
  --muted:#6E736D;
  --rule:#C6C9C2;
  --rule-soft:#D3D6CF;
  --madder:#8E2E22;
  --madder-deep:#6E211A;
  --madder-ghost:#C9A49E;
  --indigo:#2C4257;
  --board:#7C2A22;
  --board-2:#5E1E17;
  --edge:#DAD8CE;
  --edge-2:#C2BFB2;
  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --display:"Bodoni Moda","Didot","Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131619; --desk:#0E1113; --desk-2:#080A0B;
    --surface:#1D2124; --ink:#E7E8E2; --ink-soft:#BBBFB9; --muted:#8B918A;
    --rule:#2B3035; --rule-soft:#23282C;
    --madder:#D06B59; --madder-deep:#8E3A2C; --madder-ghost:#6E3A32;
    --indigo:#93B4D2; --board:#5A211A; --board-2:#3D1611;
    --edge:#262A2D; --edge-2:#181B1E;
  }
}
:root[data-theme="dark"]{
  --paper:#131619; --desk:#0E1113; --desk-2:#080A0B;
  --surface:#1D2124; --ink:#E7E8E2; --ink-soft:#BBBFB9; --muted:#8B918A;
  --rule:#2B3035; --rule-soft:#23282C;
  --madder:#D06B59; --madder-deep:#8E3A2C; --madder-ghost:#6E3A32;
  --indigo:#93B4D2; --board:#5A211A; --board-2:#3D1611;
  --edge:#262A2D; --edge-2:#181B1E;
}

*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;overflow:hidden;
  background:radial-gradient(120% 90% at 50% 12%,var(--desk) 0%,var(--desk-2) 100%);
  color:var(--ink);font-family:var(--serif);
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
:focus-visible{outline:2px solid var(--madder);outline-offset:3px}
p{margin:0 0 1em}
p:last-child{margin-bottom:0}

/* ---------------- the scene ---------------- */
.stage{
  position:fixed;inset:0;display:grid;place-items:center;
  perspective:2400px;perspective-origin:50% 46%;
  touch-action:none;cursor:grab;
  user-select:none;-webkit-user-select:none;
}
.stage.is-grabbing{cursor:grabbing}
.camera{transform-style:preserve-3d;will-change:transform}
.book{position:relative;width:0;height:0;transform-style:preserve-3d;will-change:transform}
.book.is-settling{transition:transform .5s cubic-bezier(.3,.02,.2,1)}

.slab{position:absolute;transform-style:preserve-3d;backface-visibility:hidden}

/* boards */
.board{
  position:absolute;border-radius:2px 5px 5px 2px;
  background:linear-gradient(135deg,var(--board),var(--board-2));
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);
  backface-visibility:hidden;
}
.board--back{border-radius:5px 2px 2px 5px}
.board--front{transform-origin:left center;transform-style:preserve-3d;cursor:grab}
.board__face{position:absolute;inset:0;border-radius:inherit;backface-visibility:hidden;overflow:hidden}
.board__face--in{
  transform:rotateY(180deg);
  background:linear-gradient(120deg,#efece4,#ded9cc);
  box-shadow:inset 12px 0 22px -12px rgba(0,0,0,.4);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]) .board__face--in{background:linear-gradient(120deg,#2a2723,#201e1b)}
}
:root[data-theme="dark"] .board__face--in{background:linear-gradient(120deg,#2a2723,#201e1b)}

/* the printed front board */
.jacket{position:absolute;inset:0;padding:11% 9% 8%;display:flex;flex-direction:column;color:#F2EDE3}
.jacket__rule{position:absolute;top:5.5%;bottom:5.5%;left:6.5%;width:1px;background:rgba(242,237,227,.42)}
.jacket__rule--in{left:8.4%;opacity:.55}
.jacket__prick{position:absolute;top:9%;bottom:9%;right:5.5%;width:2px;
  background:repeating-linear-gradient(to bottom,rgba(242,237,227,.5) 0 2px,transparent 2px 26px)}
.jacket__eyebrow{font-family:var(--mono);font-size:.58em;letter-spacing:.2em;text-transform:uppercase;opacity:.72}
.jacket__body{margin-top:auto;margin-bottom:auto}
.jacket__title{font-family:var(--display);font-weight:500;font-size:2.55em;line-height:.95;margin:0 0 .4em;letter-spacing:-.015em}
.jacket__hr{border:0;border-top:1px solid rgba(242,237,227,.55);width:46%;margin:0 0 .5em}
.jacket__sub{font-size:.82em;line-height:1.45;font-style:italic;opacity:.86;margin:0;max-width:15em}
.jacket__foot{font-family:var(--mono);font-size:.55em;letter-spacing:.14em;text-transform:uppercase;opacity:.7}

/* spine */
.spine{
  position:absolute;transform-style:preserve-3d;
  background:linear-gradient(90deg,var(--board-2),var(--board) 40%,var(--board-2));
  display:flex;align-items:center;justify-content:center;
}
.spine span{
  font-family:var(--display);font-size:.7em;color:#F2EDE3;opacity:.9;
  writing-mode:vertical-rl;letter-spacing:.06em;white-space:nowrap;
}

/* page block thickness, faked with stacked slabs */
.stack{position:absolute;transform-style:preserve-3d;pointer-events:none}
.stack i{
  position:absolute;inset:0;display:block;border-radius:1px;
  background:var(--edge);box-shadow:inset -1px 0 0 var(--edge-2);
}
.edge{
  position:absolute;transform-style:preserve-3d;backface-visibility:hidden;
  background:repeating-linear-gradient(to right,var(--edge) 0 1px,var(--edge-2) 1px 2px);
}
.edge--h{background:repeating-linear-gradient(to bottom,var(--edge) 0 1px,var(--edge-2) 1px 2px)}

/* page faces */
.face{
  position:absolute;overflow:hidden;background:var(--surface);
  backface-visibility:hidden;
}
.face__flow{position:absolute;top:0;left:0;column-fill:auto;column-rule:0}
.face__gutter{position:absolute;top:0;bottom:0;width:34px;pointer-events:none}
.face--verso .face__gutter{right:0;background:linear-gradient(90deg,transparent,rgba(0,0,0,.14))}
.face--recto .face__gutter{left:0;background:linear-gradient(270deg,transparent,rgba(0,0,0,.14))}
.face__rule{position:absolute;width:1px;background:var(--madder-ghost);opacity:.8}
.runhead,.folio{
  position:absolute;font-family:var(--mono);font-size:9px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);pointer-events:none;
}
.folio{letter-spacing:.08em;font-variant-numeric:tabular-nums}

.leaf{position:absolute;transform-style:preserve-3d;transform-origin:left center;will-change:transform}
.leaf.is-settling{transition:transform .45s cubic-bezier(.32,.02,.22,1)}
.leaf__shade{position:absolute;inset:0;pointer-events:none;opacity:0}
.leaf .face--front .leaf__shade{background:linear-gradient(90deg,rgba(0,0,0,.34),transparent 45%)}
.leaf .face--back{transform:rotateY(180deg)}
.leaf .face--back .leaf__shade{background:linear-gradient(270deg,rgba(0,0,0,.30),transparent 45%)}

/* the corner you grab */
.corner{
  position:absolute;width:74px;height:74px;right:0;bottom:0;cursor:grab;
  background:linear-gradient(315deg,rgba(0,0,0,.16),rgba(0,0,0,0) 62%);
  opacity:0;transition:opacity .2s ease;
}
.corner::after{
  content:"";position:absolute;right:0;bottom:0;width:30px;height:30px;
  background:linear-gradient(315deg,var(--paper) 50%,transparent 50%);
  box-shadow:-2px -2px 7px rgba(0,0,0,.22);
}
.face--recto:hover .corner,.corner.is-hot{opacity:1}

/* ---------------- text inside a page ---------------- */
.pg{font-size:15px;line-height:1.6;color:var(--ink)}
.pg .ch-open{margin-bottom:1.4em}
.pg .ch-open p:first-child::first-letter{
  font-family:var(--display);float:left;font-size:3.1em;line-height:.82;
  padding:.06em .1em 0 0;color:var(--madder);
}
.pg .ch-head{break-before:column;break-after:avoid;margin-bottom:1.3em}
.pg .ch-head--first{break-before:auto}
.pg .ch-eyebrow{font-family:var(--mono);font-size:.62em;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);margin-bottom:.5em}
.pg .ch-eyebrow b{color:var(--madder);font-weight:500}
.pg .ch-head h2{font-family:var(--display);font-weight:500;font-size:1.85em;
  line-height:1.04;margin:0;letter-spacing:-.01em;text-wrap:balance}
.pg .entry{padding-bottom:1.5em;margin-bottom:1.5em;border-bottom:1px solid var(--rule-soft)}
.pg .entry__head{break-inside:avoid}
.pg .entry__n{font-family:var(--mono);font-size:.66em;color:var(--madder);
  letter-spacing:.03em;margin-bottom:.3em}
.pg .entry__quote{font-family:var(--display);font-weight:400;font-size:1.22em;
  line-height:1.3;margin:0 0 .35em;text-wrap:pretty}
.pg .entry__quote .mk{color:var(--madder-ghost)}
.pg .entry__attr{font-family:var(--mono);font-size:.68em;letter-spacing:.03em;
  color:var(--muted);margin-bottom:.9em}
.pg .gloss{margin-bottom:.8em;break-inside:avoid}
.pg .gloss:last-child{margin-bottom:0}
.pg .gloss__label{font-family:var(--mono);font-size:.6em;letter-spacing:.13em;
  text-transform:uppercase;margin-bottom:.22em}
.pg .gloss--means .gloss__label{color:var(--madder)}
.pg .gloss--use .gloss__label{color:var(--indigo)}
.pg .gloss p{font-size:.93em;line-height:1.56;color:var(--ink-soft)}
.pg .part-open{break-before:column;text-align:center;padding-top:34%}
.pg .part-open .r{font-family:var(--display);font-size:3em;color:var(--madder);line-height:1}
.pg .part-open .n{font-family:var(--mono);font-size:.68em;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted);margin-top:.9em}
.pg .plain h2{font-family:var(--display);font-weight:500;font-size:1.7em;margin:0 0 .8em}
.pg .plain ul{padding-left:1.05em;margin:0 0 1em}
.pg .plain li{margin-bottom:.45em}
.pg .plain a{color:var(--indigo)}
.pg .idx__letter{font-family:var(--display);font-size:1.25em;color:var(--madder);
  margin:1em 0 .45em;padding-bottom:.12em;border-bottom:1px solid var(--rule);break-after:avoid}
.pg .idx__src{margin-bottom:.6em;break-inside:avoid;font-size:.9em;line-height:1.45}
.pg .idx__src b{display:block;font-weight:600}
.pg .idx__i{display:block;color:var(--ink-soft);font-size:.94em}
.pg .idx__i i{font-family:var(--mono);font-size:.85em;color:var(--madder);font-style:normal}

/* ---------------- controls ---------------- */
.hud{
  position:fixed;top:0;left:0;right:0;z-index:40;
  display:flex;align-items:center;gap:.55rem;padding:.7rem .9rem;
  pointer-events:none;
}
.hud > *{pointer-events:auto}
.hud__title{
  font-family:var(--display);font-size:1rem;line-height:1;margin-right:auto;
  color:var(--ink);opacity:.75;
}
.btn{
  font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;text-transform:uppercase;
  color:var(--ink);background:color-mix(in srgb,var(--surface) 82%,transparent);
  border:1px solid var(--rule);border-radius:3px;padding:.4rem .6rem;
  backdrop-filter:blur(6px);
}
.btn:hover{border-color:var(--madder-ghost);color:var(--madder)}
.btn--icon{padding:.4rem .55rem}
.hud__where{
  position:fixed;left:50%;bottom:.85rem;transform:translateX(-50%);z-index:40;
  font-family:var(--mono);font-size:.63rem;letter-spacing:.1em;color:var(--ink);
  opacity:.6;pointer-events:none;text-align:center;
}
.hint{
  position:fixed;left:50%;bottom:2.3rem;transform:translateX(-50%);z-index:40;
  font-family:var(--mono);font-size:.6rem;letter-spacing:.11em;text-transform:uppercase;
  color:var(--ink);opacity:.42;pointer-events:none;white-space:nowrap;
}

.sheet{
  position:fixed;inset:0;z-index:60;display:none;
  background:color-mix(in srgb,var(--desk) 88%,transparent);
  backdrop-filter:blur(9px);overflow-y:auto;padding:3.6rem 1.2rem 3rem;
}
.sheet[data-open="true"]{display:block}
.sheet__inner{max-width:46rem;margin:0 auto}
.sheet__close{position:fixed;top:.7rem;right:.9rem;z-index:61}
.sheet h3{font-family:var(--display);font-weight:500;font-size:1.6rem;margin:0 0 1.2rem}
.sheet input{
  width:100%;font-family:var(--mono);font-size:.9rem;color:var(--ink);
  background:var(--surface);border:1px solid var(--rule);border-radius:3px;
  padding:.6rem .7rem;margin-bottom:1.4rem;
}
.toc-part{margin-bottom:1.5rem}
.toc-part h4{font-family:var(--mono);font-size:.62rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);font-weight:400;margin:0 0 .5rem;
  padding-bottom:.35rem;border-bottom:1px solid var(--rule)}
.toc-part h4 b{color:var(--madder);font-weight:500}
.toc-row{display:flex;gap:.7rem;width:100%;text-align:left;padding:.32rem 0;align-items:baseline}
.toc-row:hover .t{color:var(--madder)}
.toc-row .n{font-family:var(--mono);font-size:.72rem;color:var(--madder);min-width:1.4rem}
.toc-row .t{font-size:1rem;line-height:1.3}
.toc-row .p{margin-left:auto;font-family:var(--mono);font-size:.68rem;color:var(--muted)}
.res{display:block;width:100%;text-align:left;padding:.75rem 0;border-bottom:1px solid var(--rule-soft)}
.res .q{font-family:var(--display);font-size:1.05rem;line-height:1.32;margin-bottom:.2rem}
.res .m{font-family:var(--mono);font-size:.64rem;color:var(--muted)}
.res:hover .q{color:var(--madder)}
mark{background:#E6D08A;color:#191C1B;padding:0 .1em;border-radius:1px}
.empty{color:var(--muted);font-style:italic}

@media (max-width:640px){
  .hud__title{display:none}
  .hint{font-size:.55rem}
}
@media (prefers-reduced-motion:reduce){
  .book.is-settling,.leaf.is-settling{transition-duration:.001ms}
}
</style>

<div class="stage" id="stage">
  <div class="camera" id="camera">
    <div class="book" id="book"></div>
  </div>
</div>

<div class="hud">
  <div class="hud__title">Lines Worth Keeping</div>
  <button class="btn" id="btn-contents">Contents</button>
  <button class="btn" id="btn-search">Search</button>
  <button class="btn btn--icon" id="btn-out" aria-label="Zoom out">−</button>
  <button class="btn btn--icon" id="btn-in" aria-label="Zoom in">+</button>
  <button class="btn" id="btn-reset">Reset view</button>
  <button class="btn" id="btn-close">Close book</button>
</div>
<div class="hud__where" id="where"></div>
<div class="hint" id="hint">Drag the book to turn it · drag a page corner to turn the page</div>

<div class="sheet" id="sheet-contents">
  <button class="btn sheet__close" data-close>Close</button>
  <div class="sheet__inner"><h3>Contents</h3><div id="toc"></div></div>
</div>
<div class="sheet" id="sheet-search">
  <button class="btn sheet__close" data-close>Close</button>
  <div class="sheet__inner"><h3>Search</h3>
    <input id="q" type="search" placeholder="anger, money, sleep, apology…" aria-label="Search the book">
    <div id="results"></div>
  </div>
</div>

<script id="book-data" type="application/json">__BOOK_DATA__</script>
<script>
(function(){
"use strict";
var BOOK = JSON.parse(document.getElementById("book-data").textContent);
var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");
var stage = document.getElementById("stage");
var camera = document.getElementById("camera");
var book = document.getElementById("book");

function esc(s){return String(s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];});}
function pad(n){return n<10?"00"+n:n<100?"0"+n:""+n;}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function store(k,v){try{localStorage.setItem(k,v);}catch(e){}}
function recall(k){try{return localStorage.getItem(k);}catch(e){return null;}}

var ALL=[];
BOOK.chapters.forEach(function(ch){ch.entries.forEach(function(e){
  ALL.push(Object.assign({chTitle:ch.title},e));});});

/* ---------- the whole book as one flowed document ---------- */
function entryHTML(e){
  var q = e.bare ? "<em>"+esc(e.quote)+"</em>"
    : '<span class="mk">\u201C</span>'+esc(e.quote)+'<span class="mk">\u201D</span>';
  return '<article class="entry" id="e'+e.n+'"><div class="entry__head">'+
    '<div class="entry__n">'+pad(e.n)+'</div>'+
    '<blockquote class="entry__quote">'+q+'</blockquote>'+
    '<div class="entry__attr">'+esc(e.attribution)+'</div></div>'+
    '<div class="gloss gloss--means"><div class="gloss__label">What it means</div><p>'+esc(e.means)+'</p></div>'+
    '<div class="gloss gloss--use"><div class="gloss__label">How to use it</div><p>'+esc(e.use)+'</p></div>'+
    '</article>';
}
var FLOW_HTML = (function(){
  var h = '<div class="ch-head ch-head--first plain" id="c-intro"><h2>Introduction</h2></div>'+
          '<div class="plain">'+BOOK.intro+'</div>';
  var lastPart = null;
  BOOK.chapters.forEach(function(ch){
    if(ch.part !== lastPart){
      lastPart = ch.part;
      h += '<div class="part-open" id="p-'+ch.partRoman+'"><div class="r">'+ch.partRoman+'</div>'+
           '<div class="n">Part '+ch.partRoman+' · '+esc(ch.partName)+'</div></div>';
    }
    h += '<div class="ch-head" id="c'+ch.n+'"><div class="ch-eyebrow">Part '+ch.partRoman+
         ' · '+esc(ch.partName)+' · <b>Chapter '+ch.n+'</b></div><h2>'+esc(ch.title)+'</h2></div>'+
         '<div class="ch-open">'+ch.opening+'</div>'+
         ch.entries.map(entryHTML).join("");
  });
  h += '<div class="ch-head plain" id="c-note"><h2>A Note on Attribution</h2></div>'+
       '<div class="plain">'+BOOK.note+'</div>';
  h += '<div class="ch-head plain" id="c-index"><h2>Index of Sources</h2></div><div class="idx">';
  var letter = null;
  BOOK.index.forEach(function(s){
    if(s.letter !== letter){
      letter = s.letter;
      h += '<div class="idx__letter">'+(letter === "\u00b6" ? "Proverbs &amp; anonymous" : letter)+'</div>';
    }
    h += '<div class="idx__src"><b>'+esc(s.name)+'</b>'+
      s.items.map(function(i){
        return '<span class="idx__i">'+pad(i.n)+' \u201C'+esc(i.quote)+'\u201D'+
          (i.q ? ' <i>('+esc(i.q)+')</i>' : '')+'</span>';
      }).join("")+'</div>';
  });
  h += '</div>';
  return h;
})();

/* ---------- geometry ---------- */
var G = {ph:0,pw:0,m:0,vm:0,T:26,fit:1};
var S = {spread:0,pages:1,open:false,rx:-14,ry:0,zoom:1,turning:null};
var faces = {};
var starts = {};

function el(cls,parent,css){
  var d=document.createElement("div"); d.className=cls||"";
  if(css) d.style.cssText=css; (parent||book).appendChild(d); return d;
}
function makeFace(cls){
  var f = el("face "+cls, null,
    "width:"+G.pw+"px;height:"+G.ph+"px;top:"+(-G.ph/2)+"px;");
  f.innerHTML = '<div class="face__flow pg" style="width:'+G.pw+'px;padding:'+G.vm+'px '+G.m+'px;'+
    'height:'+G.ph+'px;column-width:'+(G.pw-2*G.m)+'px;column-gap:'+(2*G.m)+'px">'+FLOW_HTML+'</div>'+
    '<div class="face__rule"></div><div class="runhead"></div><div class="folio"></div>'+
    '<div class="face__gutter"></div>';
  return f;
}

function layout(){
  var vw = window.innerWidth, vh = window.innerHeight;
  G.ph = clamp(Math.round(vh*0.74),300,780);
  G.pw = Math.round(G.ph/1.46);
  G.m  = Math.round(G.pw*0.105);
  G.vm = Math.round(G.ph*0.075);
  G.fit = Math.min(1,(vw*0.94)/(2*G.pw+G.T*2),(vh*0.9)/G.ph);

  book.innerHTML = "";
  faces = {};

  // back board and the two half blocks of pages
  el("board board--back",null,"width:"+(G.pw+8)+"px;height:"+(G.ph+14)+"px;left:-4px;top:"+
     (-G.ph/2-7)+"px;transform:translateZ("+(-G.T-10)+"px)");
  var sp = el("spine",null,"width:"+(G.T+12)+"px;height:"+(G.ph+14)+"px;left:0;top:"+
     (-G.ph/2-7)+"px;transform-origin:left center;transform:translateZ("+(-G.T-6)+
     "px) rotateY(-90deg)");
  sp.innerHTML = "<span>Lines Worth Keeping</span>";
  faces.spine = sp;

  // the visible edges of each half block
  function edgeSet(side){
    var x = side < 0 ? -G.pw : G.pw;
    var fore = el("edge",null,"width:"+G.T+"px;height:"+G.ph+"px;left:"+(side<0?-G.pw:G.pw)+
      "px;top:"+(-G.ph/2)+"px;transform-origin:left center;transform:rotateY(90deg)");
    var top = el("edge edge--h",null,"width:"+G.pw+"px;height:"+G.T+"px;left:"+(side<0?-G.pw:0)+
      "px;top:"+(-G.ph/2)+"px;transform-origin:center top;transform:rotateX(-90deg)");
    var bot = el("edge edge--h",null,"width:"+G.pw+"px;height:"+G.T+"px;left:"+(side<0?-G.pw:0)+
      "px;top:"+(G.ph/2-G.T)+"px;transform-origin:center bottom;transform:rotateX(90deg)");
    return [fore, top, bot];
  }
  faces.edgeL = edgeSet(-1);
  faces.edgeR = edgeSet(1);

  faces.stackL = el("stack",null,"width:"+G.pw+"px;height:"+G.ph+"px;left:"+(-G.pw)+"px;top:"+(-G.ph/2)+"px");
  faces.stackR = el("stack",null,"width:"+G.pw+"px;height:"+G.ph+"px;left:0;top:"+(-G.ph/2)+"px");
  for(var i=0;i<9;i++){
    faces.stackL.appendChild(document.createElement("i"));
    faces.stackR.appendChild(document.createElement("i"));
  }

  faces.verso = makeFace("face--verso"); faces.verso.style.left = (-G.pw)+"px";
  faces.recto = makeFace("face--recto"); faces.recto.style.left = "0px";
  faces.recto.insertAdjacentHTML("beforeend",'<div class="corner" id="corner"></div>');

  var leaf = el("leaf",null,"width:"+G.pw+"px;height:"+G.ph+"px;left:0;top:"+(-G.ph/2)+"px;display:none");
  faces.leaf = leaf;
  faces.leafFront = makeFace("face--front"); leaf.appendChild(faces.leafFront);
  faces.leafBack  = makeFace("face--back");  leaf.appendChild(faces.leafBack);
  faces.leafFront.style.left="0px"; faces.leafBack.style.left="0px";
  faces.leafFront.insertAdjacentHTML("beforeend",'<div class="leaf__shade"></div>');
  faces.leafBack.insertAdjacentHTML("beforeend",'<div class="leaf__shade"></div>');

  var front = el("board board--front",null,"width:"+(G.pw+8)+"px;height:"+(G.ph+14)+"px;left:0;top:"+
     (-G.ph/2-7)+"px;transform:translateZ(6px)");
  front.id = "front";
  front.innerHTML =
    '<div class="board__face" style="font-size:'+Math.round(G.pw*0.052)+'px">'+
      '<div class="jacket">'+
        '<div class="jacket__rule"></div><div class="jacket__rule jacket__rule--in"></div>'+
        '<div class="jacket__prick"></div>'+
        '<div class="jacket__eyebrow">A commonplace book</div>'+
        '<div class="jacket__body"><div class="jacket__title">Lines Worth<br>Keeping</div>'+
        '<hr class="jacket__hr"><p class="jacket__sub">'+esc(BOOK.subtitle)+'</p></div>'+
        '<div class="jacket__foot">240 entries · 16 chapters</div>'+
      '</div></div>'+
    '<div class="board__face board__face--in"></div>';
  faces.front = front;

  // page count, measured from one of the flows
  var probe = faces.recto.querySelector(".face__flow");
  S.pages = Math.max(2, Math.round(probe.scrollWidth / G.pw));
  starts = {};
  ["c-intro","c-note","c-index"].concat(BOOK.chapters.map(function(c){return "c"+c.n;}))
    .forEach(function(id){
      var n = probe.querySelector("#"+CSS.escape(id));
      if(n) starts[id] = Math.floor((n.offsetLeft+1)/G.pw);
    });
  paint();
}

function pageOf(node){ return Math.floor((node.offsetLeft+1)/G.pw); }

function setFace(f, idx){
  var flow = f.querySelector(".face__flow");
  flow.style.transform = "translateX("+(-idx*G.pw)+"px)";
  var blank = idx < 0 || idx >= S.pages;
  flow.style.visibility = blank ? "hidden" : "visible";
  var rule = f.querySelector(".face__rule");
  var rh = f.querySelector(".runhead"), fo = f.querySelector(".folio");
  var verso = f.classList.contains("face--verso") || f.classList.contains("face--back");
  rule.style.cssText = "top:"+G.vm+"px;height:"+(G.ph-2*G.vm)+"px;"+
    (verso ? "right:"+(G.m-13)+"px" : "left:"+(G.m-13)+"px")+
    ";display:"+(blank?"none":"block");
  rh.style.cssText = "top:"+Math.round(G.vm/2-5)+"px;left:"+G.m+"px;width:"+(G.pw-2*G.m)+
    "px;text-align:"+(verso?"left":"right")+";display:"+(blank?"none":"block");
  fo.style.cssText = "bottom:"+Math.round(G.vm/2-5)+"px;left:0;width:"+G.pw+
    "px;text-align:center;display:"+(blank?"none":"block");
  rh.textContent = blank ? "" : runningHead(idx);
  fo.textContent = blank ? "" : String(idx+1);
}

function runningHead(idx){
  var best = "Lines Worth Keeping";
  BOOK.chapters.forEach(function(c){
    var s = starts["c"+c.n];
    if(s !== undefined && s <= idx) best = "Ch " + c.n + " · " + c.title;
  });
  if(starts["c-note"] !== undefined && starts["c-note"] <= idx) best = "A Note on Attribution";
  return best;
}

function paint(){
  var L = S.spread*2, R = L+1;
  setFace(faces.verso, L);
  setFace(faces.recto, R);
  var t = S.pages ? S.spread/Math.max(1,Math.ceil(S.pages/2)) : 0;
  [["stackL",t],["stackR",1-t]].forEach(function(pair){
    var node = faces[pair[0]], frac = pair[1];
    Array.prototype.forEach.call(node.children,function(sl,i){
      var d = Math.max(1, Math.round(G.T*frac));
      sl.style.transform = "translateZ("+(-(i+1)*(d/9))+"px)";
      sl.style.opacity = frac > 0.02 ? "1" : "0";
    });
  });
  faces.verso.style.display = S.open ? "block" : "none";
  faces.recto.style.display = S.open ? "block" : "none";
  faces.spine.style.display = S.open ? "none" : "block";
  faces.stackL.style.display = faces.stackR.style.display = S.open ? "block" : "none";
  [faces.edgeL, faces.edgeR].forEach(function(set, i){
    var frac = i === 0 ? t : 1 - t;
    var depth = Math.max(1, Math.round(G.T * frac));
    set.forEach(function(node, k){
      node.style.display = (S.open && frac > 0.02) ? "block" : "none";
      if(k === 0) node.style.width = depth + "px";
      else node.style.height = depth + "px";
      if(k === 2) node.style.top = (G.ph/2 - depth) + "px";
    });
  });
  document.getElementById("where").textContent = S.open
    ? "Pages " + (L+1) + "\u2013" + Math.min(R+1,S.pages) + " of " + S.pages
    : "Closed \u00b7 drag the cover to open";
  applyView();
  store("lwk3:spread", String(S.spread));
}

function applyView(){
  camera.style.transform = "scale("+(G.fit*S.zoom).toFixed(3)+")";
  var shift = S.open ? 0 : -G.pw/2;
  book.style.transform = "translateX("+shift+"px) rotateX("+S.rx.toFixed(2)+
    "deg) rotateY("+S.ry.toFixed(2)+"deg)";
}

/* ---------- turning ---------- */
function beginTurn(dir){
  if(S.turning) return false;
  var L = S.spread*2;
  if(dir > 0 && (L+2) >= S.pages) return false;
  if(dir < 0 && S.spread === 0) return false;
  var leaf = faces.leaf;
  leaf.style.display = "block";
  leaf.classList.remove("is-settling");
  if(dir > 0){
    setFace(faces.leafFront, L+1);
    setFace(faces.leafBack,  L+2);
    setFace(faces.recto,     L+3);
    leaf.style.transform = "rotateY(0deg)";
  }else{
    setFace(faces.leafFront, L-1);
    setFace(faces.leafBack,  L);
    setFace(faces.verso,     L-2);
    leaf.style.transform = "rotateY(-180deg)";
  }
  S.turning = {dir:dir, angle: dir>0 ? 0 : -180};
  return true;
}
function dragTurn(frac){
  if(!S.turning) return;
  var a = S.turning.dir > 0 ? -180*clamp(frac,0,1) : -180*(1-clamp(frac,0,1));
  S.turning.angle = a;
  faces.leaf.style.transform = "rotateY("+a+"deg)";
  var p = Math.abs(a)/180;
  faces.leafFront.querySelector(".leaf__shade").style.opacity = (p*0.5).toFixed(2);
  faces.leafBack.querySelector(".leaf__shade").style.opacity = ((1-p)*0.4).toFixed(2);
}
function endTurn(commit){
  if(!S.turning) return;
  var dir = S.turning.dir;
  var leaf = faces.leaf;
  leaf.classList.add("is-settling");
  leaf.style.transform = "rotateY("+(commit ? (dir>0?-180:0) : (dir>0?0:-180))+"deg)";
  var fs = faces.leafFront.querySelector(".leaf__shade");
  var bs = faces.leafBack.querySelector(".leaf__shade");
  fs.style.opacity = "0"; bs.style.opacity = "0";
  var done = false;
  function finish(){
    if(done) return; done = true;
    leaf.style.display = "none";
    leaf.classList.remove("is-settling");
    S.turning = null;
    if(commit) S.spread += dir;
    paint();
  }
  leaf.addEventListener("transitionend", function h(ev){
    if(ev.propertyName === "transform"){ leaf.removeEventListener("transitionend",h); finish(); }
  });
  setTimeout(finish, 620);
}
function turnBy(dir){
  if(!S.open || S.turning) return;
  if(!beginTurn(dir)) return;
  requestAnimationFrame(function(){ requestAnimationFrame(function(){ endTurn(true); }); });
}

/* ---------- opening and closing the covers ---------- */
function coverTransform(angle){
  var f = clamp(Math.abs(angle)/178, 0, 1);
  var z = 6 - f * (G.T + 12);
  return "translateZ(" + z.toFixed(1) + "px) rotateY(" + angle.toFixed(1) + "deg)";
}
function openBook(){
  if(S.open) return;
  var f = faces.front;
  f.style.transition = "transform .8s cubic-bezier(.32,.02,.2,1)";
  f.style.transform = coverTransform(-178);
  setTimeout(function(){ S.open = true; paint(); f.style.transition=""; }, 640);
  store("lwk3:open","1");
}
function closeBook(){
  if(!S.open) return;
  S.open = false; S.spread = 0;
  var f = faces.front;
  f.style.transition = "none";
  f.style.transform = coverTransform(-178);
  paint();
  requestAnimationFrame(function(){
    f.style.transition = "transform .8s cubic-bezier(.32,.02,.2,1)";
    f.style.transform = coverTransform(0);
    setTimeout(function(){ f.style.transition=""; }, 820);
  });
  store("lwk3:open","0");
}

/* ---------- pointer: orbit, corner drag, cover drag ---------- */
var drag = null;
stage.addEventListener("pointerdown", function(ev){
  if(ev.button) return;
  if(ev.target.closest(".hud,.sheet")) return;
  stage.setPointerCapture(ev.pointerId);
  var onFront = !S.open && ev.target.closest(".board--front");
  var onRecto = S.open && ev.target.closest(".face--recto,.corner");
  var onVerso = S.open && ev.target.closest(".face--verso");
  drag = {x0:ev.clientX, y0:ev.clientY, rx:S.rx, ry:S.ry,
          mode: onFront ? "cover" : onRecto ? "fwd" : onVerso ? "back" : "orbit",
          started:false};
  stage.classList.add("is-grabbing");
  document.getElementById("hint").style.opacity = "0";
});
stage.addEventListener("pointermove", function(ev){
  if(!drag) return;
  var dx = ev.clientX - drag.x0, dy = ev.clientY - drag.y0;
  if(!drag.started && Math.abs(dx) < 5 && Math.abs(dy) < 5) return;
  drag.started = true;
  var span = (2*G.pw*G.fit*S.zoom) || 600;
  if(drag.mode === "orbit"){
    S.ry = clamp(drag.ry + dx*0.32, -78, 78);
    S.rx = clamp(drag.rx - dy*0.26, -62, 62);
    applyView();
  }else if(drag.mode === "cover"){
    if(!S.turning && dx < -4){
      S.turning = {cover:true};
      faces.front.style.transition = "none";
    }
    if(S.turning && S.turning.cover){
      var a = -178*clamp(-dx/span,0,1);
      faces.front.style.transform = coverTransform(a);
      S.turning.angle = a;
    }
  }else{
    var dir = drag.mode === "fwd" ? 1 : -1;
    if(!S.turning){ if((dir>0 && dx<-4)||(dir<0 && dx>4)) beginTurn(dir); }
    if(S.turning && !S.turning.cover){
      dragTurn(dir > 0 ? (-dx/span) : (dx/span));
    }
  }
});
function releaseDrag(){
  if(!drag) return;
  stage.classList.remove("is-grabbing");
  if(S.turning && S.turning.cover){
    var a = S.turning.angle || 0;
    S.turning = null;
    faces.front.style.transition = "transform .55s cubic-bezier(.32,.02,.2,1)";
    if(Math.abs(a) > 55){
      faces.front.style.transform = coverTransform(-178);
      setTimeout(function(){ S.open = true; paint(); faces.front.style.transition=""; }, 470);
      store("lwk3:open","1");
    }else{
      faces.front.style.transform = coverTransform(0);
    }
  }else if(S.turning){
    endTurn(Math.abs(S.turning.angle) > 90);
  }else if(!drag.started && drag.mode === "cover"){
    openBook();
  }
  drag = null;
}
stage.addEventListener("pointerup", releaseDrag);
stage.addEventListener("pointercancel", releaseDrag);

stage.addEventListener("wheel", function(ev){
  ev.preventDefault();
  S.zoom = clamp(S.zoom * (ev.deltaY > 0 ? 0.92 : 1.08), 0.45, 3);
  applyView(); store("lwk3:zoom", String(S.zoom));
}, {passive:false});

// pinch
var pts = {}, pinch0 = 0, zoom0 = 1;
stage.addEventListener("pointerdown", function(ev){ pts[ev.pointerId] = ev; });
stage.addEventListener("pointermove", function(ev){
  if(!(ev.pointerId in pts)) return;
  pts[ev.pointerId] = ev;
  var ids = Object.keys(pts);
  if(ids.length === 2){
    drag = null;
    var a = pts[ids[0]], b = pts[ids[1]];
    var d = Math.hypot(a.clientX-b.clientX, a.clientY-b.clientY);
    if(!pinch0){ pinch0 = d; zoom0 = S.zoom; }
    else { S.zoom = clamp(zoom0 * (d/pinch0), 0.45, 3); applyView(); }
  }
});
function dropPt(ev){ delete pts[ev.pointerId]; if(Object.keys(pts).length < 2) pinch0 = 0; }
stage.addEventListener("pointerup", dropPt);
stage.addEventListener("pointercancel", dropPt);

/* ---------- controls ---------- */
document.getElementById("btn-in").onclick = function(){ S.zoom = clamp(S.zoom*1.18,0.45,3); applyView(); };
document.getElementById("btn-out").onclick = function(){ S.zoom = clamp(S.zoom/1.18,0.45,3); applyView(); };
document.getElementById("btn-reset").onclick = function(){
  S.rx=-14; S.ry=0; S.zoom=1;
  book.classList.add("is-settling"); applyView();
  setTimeout(function(){ book.classList.remove("is-settling"); }, 520);
};
document.getElementById("btn-close").onclick = closeBook;

function sheet(id,on){ document.getElementById(id).dataset.open = on ? "true" : "false"; }
document.getElementById("btn-contents").onclick = function(){ sheet("sheet-contents",true); };
document.getElementById("btn-search").onclick = function(){
  sheet("sheet-search",true); setTimeout(function(){ document.getElementById("q").focus(); },60);
};
document.querySelectorAll("[data-close]").forEach(function(b){
  b.onclick = function(){ sheet("sheet-contents",false); sheet("sheet-search",false); };
});

function goToPage(idx){
  S.spread = clamp(Math.floor(idx/2), 0, Math.max(0,Math.ceil(S.pages/2)-1));
  if(!S.open){ S.open = true; faces.front.style.transform = coverTransform(-178); }
  paint();
  sheet("sheet-contents",false); sheet("sheet-search",false);
}

(function buildToc(){
  var byPart=[], seen={};
  BOOK.chapters.forEach(function(ch){
    if(!seen[ch.part]){ seen[ch.part]={roman:ch.partRoman,name:ch.partName,chs:[]}; byPart.push(seen[ch.part]); }
    seen[ch.part].chs.push(ch);
  });
  document.getElementById("toc").innerHTML =
    '<button class="toc-row" data-page-id="c-intro"><span class="n">·</span>'+
    '<span class="t">Introduction</span></button>' +
    byPart.map(function(p){
      return '<div class="toc-part"><h4><b>Part '+p.roman+'</b> · '+esc(p.name)+'</h4>'+
        p.chs.map(function(c){
          return '<button class="toc-row" data-page-id="c'+c.n+'"><span class="n">'+c.n+
            '</span><span class="t">'+esc(c.title)+'</span><span class="p" data-p="c'+c.n+'"></span></button>';
        }).join("")+"</div>";
    }).join("") +
    '<button class="toc-row" data-page-id="c-note"><span class="n">·</span>'+
    '<span class="t">A Note on Attribution</span></button>'+
    '<button class="toc-row" data-page-id="c-index"><span class="n">·</span>'+
    '<span class="t">Index of Sources</span></button>';
})();

document.addEventListener("click", function(ev){
  var row = ev.target.closest("[data-page-id]");
  if(row && starts[row.dataset.pageId] !== undefined) goToPage(starts[row.dataset.pageId]);
  var hit = ev.target.closest("[data-entry]");
  if(hit){
    var probe = faces.recto.querySelector(".face__flow");
    var node = probe.querySelector("#e"+hit.dataset.entry);
    if(node) goToPage(pageOf(node));
  }
});

var qt;
document.getElementById("q").addEventListener("input", function(e){
  clearTimeout(qt);
  var v = e.target.value.trim();
  qt = setTimeout(function(){
    var box = document.getElementById("results");
    if(v.length < 2){ box.innerHTML=""; return; }
    var t = v.toLowerCase();
    var hits = ALL.filter(function(x){
      return (x.quote+" "+x.attribution+" "+x.means+" "+x.use+" "+x.chTitle).toLowerCase().indexOf(t) !== -1;
    });
    box.innerHTML = hits.length ? hits.map(function(x){
      var q = esc(x.quote);
      if(!/[&<>"]/.test(v)) q = q.replace(new RegExp("("+v.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","ig"),"<mark>$1</mark>");
      return '<button class="res" data-entry="'+x.n+'"><div class="q">\u201C'+q+'\u201D</div>'+
        '<div class="m">'+pad(x.n)+' · '+esc(x.attribution)+' · ch '+x.ch+'</div></button>';
    }).join("") : '<p class="empty">Nothing here. Try a plainer word.</p>';
  }, 160);
});

document.addEventListener("keydown", function(ev){
  if(ev.target.tagName === "INPUT") { if(ev.key==="Escape") ev.target.blur(); return; }
  if(ev.key === "ArrowRight") turnBy(1);
  else if(ev.key === "ArrowLeft") turnBy(-1);
  else if(ev.key === "Escape"){ sheet("sheet-contents",false); sheet("sheet-search",false); }
  else if(ev.key === "+" || ev.key === "="){ S.zoom=clamp(S.zoom*1.15,.45,3); applyView(); }
  else if(ev.key === "-"){ S.zoom=clamp(S.zoom/1.15,.45,3); applyView(); }
});

var rt;
window.addEventListener("resize", function(){
  clearTimeout(rt); rt = setTimeout(function(){ layout(); }, 200);
});

S.zoom = parseFloat(recall("lwk3:zoom")||"1") || 1;
S.spread = parseInt(recall("lwk3:spread")||"0",10) || 0;
layout();
if(recall("lwk3:open") === "1"){
  S.open = true;
  faces.front.style.transform = coverTransform(-178);
  paint();
}
if(document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ layout(); });
})();
</script>
