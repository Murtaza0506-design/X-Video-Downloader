<title>Lines Worth Keeping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&family=IBM+Plex+Mono:wght@400;500&family=Spectral:ital,wght@0,300;0,400;0,600;1,400&display=swap">
<style>
:root{
  --paper:#E3E5E0;
  --surface:#EDEEEA;
  --sunk:#D8DBD5;
  --ink:#191C1B;
  --ink-soft:#43474A;
  --muted:#6E736D;
  --rule:#C6C9C2;
  --rule-soft:#D3D6CF;
  --madder:#8E2E22;
  --madder-ghost:#C9A49E;
  --indigo:#2C4257;
  --mark:#E6D08A;

  --serif:"Spectral",Georgia,"Times New Roman",serif;
  --display:"Bodoni Moda","Didot","Times New Roman",serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --measure:35rem;
  --rail:16.5rem;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#131619;
    --surface:#1A1E21;
    --sunk:#0E1113;
    --ink:#E7E8E2;
    --ink-soft:#BBBFB9;
    --muted:#8B918A;
    --rule:#2B3035;
    --rule-soft:#23282C;
    --madder:#D06B59;
    --madder-ghost:#6E3A32;
    --indigo:#93B4D2;
    --mark:#5C4A1E;
  }
}
:root[data-theme="dark"]{
  --paper:#131619;
  --surface:#1A1E21;
  --sunk:#0E1113;
  --ink:#E7E8E2;
  --ink-soft:#BBBFB9;
  --muted:#8B918A;
  --rule:#2B3035;
  --rule-soft:#23282C;
  --madder:#D06B59;
  --madder-ghost:#6E3A32;
  --indigo:#93B4D2;
  --mark:#5C4A1E;
}

*{box-sizing:border-box}
body{
  margin:0;background:var(--paper);color:var(--ink);
  font-family:var(--serif);font-size:18px;line-height:1.62;
  -webkit-font-smoothing:antialiased;
}
a{color:inherit}
:focus-visible{outline:2px solid var(--madder);outline-offset:3px;border-radius:2px}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
p{margin:0 0 1.05em}
p:last-child{margin-bottom:0}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}

.rail{
  border-right:1px solid var(--rule);background:var(--surface);
  position:sticky;top:0;height:100vh;overflow-y:auto;
  padding:1.7rem 1.25rem 3rem;
}
.rail__brand{
  display:block;width:100%;text-align:left;
  font-family:var(--display);font-size:1.32rem;line-height:1.15;
  letter-spacing:.005em;margin-bottom:.3rem;
}
.rail__colophon{
  font-family:var(--mono);font-size:.63rem;letter-spacing:.1em;
  text-transform:uppercase;color:var(--muted);
  padding-bottom:1.2rem;border-bottom:1px solid var(--rule);
}
.rail__search{margin:1.15rem 0 1.4rem;position:relative}
.rail__search input{
  width:100%;font-family:var(--mono);font-size:.76rem;color:var(--ink);
  background:var(--paper);border:1px solid var(--rule);border-radius:2px;
  padding:.5rem .6rem .5rem 1.75rem;
}
.rail__search input::placeholder{color:var(--muted)}
.rail__search svg{
  position:absolute;left:.55rem;top:50%;transform:translateY(-50%);
  width:.8rem;height:.8rem;stroke:var(--muted);fill:none;stroke-width:1.6;
}
.part{margin-bottom:1.4rem}
.part__head{
  display:flex;align-items:baseline;gap:.5rem;
  font-family:var(--mono);font-size:.63rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);margin-bottom:.45rem;
}
.part__num{color:var(--madder);font-weight:500}
.toc{list-style:none;margin:0;padding:0}
.toc button{
  display:flex;gap:.6rem;width:100%;text-align:left;padding:.24rem 0;
  font-size:.9rem;line-height:1.35;color:var(--ink-soft);
}
.toc button:hover{color:var(--madder)}
.toc button[aria-current="true"]{color:var(--madder);font-weight:600}
.toc__n{
  font-family:var(--mono);font-size:.7rem;color:var(--muted);
  min-width:1.1rem;padding-top:.16rem;font-variant-numeric:tabular-nums;
}
.toc button[aria-current="true"] .toc__n{color:var(--madder)}
.rail__end{border-top:1px solid var(--rule);padding-top:.9rem;margin-top:.4rem}
.rail__end button{
  display:block;width:100%;text-align:left;padding:.24rem 0;
  font-family:var(--mono);font-size:.72rem;letter-spacing:.05em;color:var(--ink-soft);
}
.rail__end button:hover{color:var(--madder)}

/* ---------- main ---------- */
.main{padding:3.4rem 3rem 6rem;min-width:0}
.page{max-width:var(--measure);margin-inline:auto}

.masthead{margin-bottom:3rem}
.masthead h1{
  font-family:var(--display);font-weight:500;
  font-size:clamp(2.6rem,6vw,4.1rem);line-height:.98;margin:0 0 .5rem;
  letter-spacing:-.01em;text-wrap:balance;
}
.masthead p{
  font-size:1.06rem;line-height:1.5;color:var(--ink-soft);
  font-style:italic;max-width:28rem;margin:0;
}
.rule-red{border:0;border-top:1px solid var(--madder);opacity:.5;margin:1.5rem 0}

.opener__label{
  display:flex;align-items:center;gap:.7rem;
  font-family:var(--mono);font-size:.66rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);margin-bottom:1.4rem;
}
.opener__label::after{content:"";flex:1;height:1px;background:var(--rule)}

.reading{
  border-left:1px solid var(--madder-ghost);
  padding-left:2.6rem;position:relative;
}
.entry{position:relative;padding-bottom:2.6rem;margin-bottom:2.6rem;border-bottom:1px solid var(--rule-soft)}
.entry:last-child{border-bottom:0;margin-bottom:0;padding-bottom:.5rem}
.entry__n{
  position:absolute;left:-2.6rem;top:.42rem;width:2.6rem;
  font-family:var(--mono);font-size:.68rem;color:var(--madder);
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
  background:var(--paper);padding-right:.7rem;
}
.entry__quote{
  font-family:var(--display);font-weight:400;
  font-size:1.44rem;line-height:1.33;margin:0 0 .55rem;
  letter-spacing:-.005em;text-wrap:pretty;
}
.entry__quote .mk{color:var(--madder-ghost)}
.entry__attr{
  font-family:var(--mono);font-size:.72rem;letter-spacing:.04em;
  color:var(--muted);margin-bottom:1.15rem;
}
.gloss{margin-bottom:.95rem}
.gloss:last-child{margin-bottom:0}
.gloss__label{
  font-family:var(--mono);font-size:.6rem;letter-spacing:.13em;
  text-transform:uppercase;margin-bottom:.28rem;
}
.gloss--means .gloss__label{color:var(--madder)}
.gloss--use .gloss__label{color:var(--indigo)}
.gloss p{font-size:.98rem;line-height:1.6;color:var(--ink-soft)}

.reshuffle{
  display:inline-flex;align-items:center;gap:.55rem;margin-top:1.8rem;
  font-family:var(--mono);font-size:.72rem;letter-spacing:.06em;
  color:var(--madder);border:1px solid var(--madder-ghost);border-radius:2px;
  padding:.5rem .85rem;transition:background .15s ease;
}
.reshuffle:hover{background:var(--surface)}
.reshuffle svg{width:.85rem;height:.85rem;fill:none;stroke:currentColor;stroke-width:1.7}

/* ---------- contents grid ---------- */
.contents{max-width:52rem;margin:4.5rem auto 0}
.contents__grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 3rem}
.part-block{margin-bottom:2.2rem;break-inside:avoid}
.part-block h3{
  font-family:var(--mono);font-size:.64rem;letter-spacing:.12em;
  text-transform:uppercase;color:var(--muted);font-weight:400;
  margin:0 0 .6rem;padding-bottom:.4rem;border-bottom:1px solid var(--rule);
}
.part-block h3 span{color:var(--madder)}
.chapter-link{display:flex;gap:.7rem;width:100%;text-align:left;padding:.34rem 0;align-items:baseline}
.chapter-link:hover .chapter-link__t{color:var(--madder)}
.chapter-link__n{
  font-family:var(--mono);font-size:.72rem;color:var(--madder);
  min-width:1.3rem;font-variant-numeric:tabular-nums;
}
.chapter-link__t{font-size:1rem;line-height:1.3;transition:color .12s ease}

/* ---------- chapter view ---------- */
.ch-head{margin-bottom:2.4rem}
.ch-eyebrow{
  font-family:var(--mono);font-size:.65rem;letter-spacing:.13em;
  text-transform:uppercase;color:var(--muted);margin-bottom:.7rem;
}
.ch-eyebrow b{color:var(--madder);font-weight:500}
.ch-head h2{
  font-family:var(--display);font-weight:500;
  font-size:clamp(2rem,4.4vw,2.9rem);line-height:1.05;margin:0;
  letter-spacing:-.01em;text-wrap:balance;
}
.ch-open{font-size:1.06rem;line-height:1.7;margin-bottom:2.6rem}
.ch-open p:first-child::first-letter{
  font-family:var(--display);float:left;font-size:3.3em;line-height:.82;
  padding:.06em .1em 0 0;color:var(--madder);
}
.ch-foot{
  display:flex;justify-content:space-between;gap:1.5rem;
  margin-top:3.5rem;padding-top:1.3rem;border-top:1px solid var(--rule);
}
.ch-foot button{max-width:15rem;text-align:left}
.ch-foot button:last-child{text-align:right}
.ch-foot__lab{
  display:block;font-family:var(--mono);font-size:.62rem;letter-spacing:.11em;
  text-transform:uppercase;color:var(--muted);margin-bottom:.25rem;
}
.ch-foot__t{font-size:.98rem;line-height:1.3}
.ch-foot button:hover .ch-foot__t{color:var(--madder)}

/* ---------- prose (intro / note) ---------- */
.prose{font-size:1.04rem;line-height:1.72}
.prose ul{margin:0 0 1.05em;padding-left:1.1rem}
.prose li{margin-bottom:.55em}
.prose a{color:var(--indigo);text-underline-offset:2px}

/* ---------- search ---------- */
.results{list-style:none;margin:0;padding:0}
.result{padding:1.15rem 0;border-bottom:1px solid var(--rule-soft)}
.result button{display:block;width:100%;text-align:left}
.result__q{font-family:var(--display);font-size:1.12rem;line-height:1.35;margin-bottom:.35rem}
.result__meta{
  font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;color:var(--muted);
}
.result:hover .result__q{color:var(--madder)}
mark{background:var(--mark);color:var(--ink);padding:0 .1em;border-radius:1px}
.empty{color:var(--muted);font-style:italic}

/* ---------- source index ---------- */
.srcs{max-width:50rem;margin-inline:auto;columns:2;column-gap:2.8rem}
.src{break-inside:avoid;margin-bottom:1.05rem}
.src__name{font-size:1rem;font-weight:600;margin-bottom:.18rem}
.src__item{
  display:block;width:100%;text-align:left;font-size:.88rem;line-height:1.45;
  color:var(--ink-soft);padding:.08rem 0;
}
.src__item:hover{color:var(--madder)}
.src__n{font-family:var(--mono);font-size:.68rem;color:var(--muted);font-variant-numeric:tabular-nums}
.src__q{font-family:var(--mono);font-size:.66rem;color:var(--madder);font-style:normal}
.letter{
  font-family:var(--display);font-size:1.5rem;color:var(--madder);
  margin:1.6rem 0 .7rem;padding-bottom:.2rem;border-bottom:1px solid var(--rule);
  break-inside:avoid;break-after:avoid;
}
.letter:first-child{margin-top:0}

.kbd-hint{
  margin-top:3.5rem;padding-top:1.2rem;border-top:1px solid var(--rule);
  font-family:var(--mono);font-size:.66rem;letter-spacing:.05em;color:var(--muted);
}
.kbd-hint kbd{
  font-family:var(--mono);border:1px solid var(--rule);border-radius:2px;
  padding:.08rem .3rem;background:var(--surface);font-size:.9em;
}


/* ---------- cover ---------- */
.cover-wrap{display:flex;flex-direction:column;align-items:center;gap:1.6rem}
.cover{
  position:relative;width:min(30rem,100%);aspect-ratio:2/3;
  background:var(--surface);color:var(--ink);
  border-radius:1px 3px 3px 1px;overflow:hidden;
  box-shadow:
    inset 5px 0 0 -3px var(--madder-ghost),
    0 1px 1px rgba(0,0,0,.10),
    0 18px 44px rgba(0,0,0,.16);
  display:flex;flex-direction:column;
  padding:clamp(2rem,5.5%,3rem) clamp(1.6rem,7%,2.9rem);
}
/* the ruling: faint horizontal lines, as on a pricked-and-ruled leaf */
.cover::before{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,transparent 0 27px,var(--rule) 27px 28px);
  opacity:.5;
}
/* pricking marks down the outer margin, which is how the ruling was laid out */
.cover::after{
  content:"";position:absolute;top:8%;bottom:8%;right:1.05rem;width:2px;
  pointer-events:none;
  background:repeating-linear-gradient(
    to bottom,var(--madder-ghost) 0 2px,transparent 2px 28px);
  opacity:.75;
}
.cover__channel{
  position:absolute;top:0;bottom:0;left:clamp(1.05rem,4.6%,1.9rem);width:1px;
  background:var(--madder-ghost);
}
.cover__channel--in{left:clamp(1.35rem,5.9%,2.45rem)}
.cover__folio{
  position:absolute;left:clamp(1.5rem,5%,2.1rem);top:clamp(2rem,5.5%,3rem);
  font-family:var(--mono);font-size:.6rem;color:var(--madder);
  writing-mode:vertical-rl;letter-spacing:.22em;
}
.cover__body{position:relative;z-index:1;margin-top:auto;margin-bottom:auto}
.cover__eyebrow{
  font-family:var(--mono);font-size:.6rem;letter-spacing:.2em;
  text-transform:uppercase;color:var(--muted);margin-bottom:1.4rem;
}
.cover__title{
  font-family:var(--display);font-weight:500;
  font-size:clamp(2.4rem,9.5vw,3.5rem);line-height:.94;letter-spacing:-.015em;
  margin:0 0 1.15rem;text-wrap:balance;
}
.cover__hr{border:0;border-top:1px solid var(--madder);opacity:.55;margin:0 0 1.15rem;width:44%}
.cover__sub{
  font-size:.98rem;line-height:1.45;font-style:italic;color:var(--ink-soft);
  margin:0;max-width:19rem;
}
.cover__foot{
  position:relative;z-index:1;font-family:var(--mono);font-size:.6rem;
  letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
}
.cover-acts{display:flex;flex-wrap:wrap;gap:.7rem;justify-content:center}
.act{
  font-family:var(--mono);font-size:.73rem;letter-spacing:.07em;
  border:1px solid var(--madder-ghost);border-radius:2px;padding:.58rem .95rem;
  color:var(--madder);transition:background .15s ease;
}
.act:hover{background:var(--surface)}
.act--solid{background:var(--madder);border-color:var(--madder);color:var(--surface)}
.act--solid:hover{filter:brightness(1.08);background:var(--madder)}

.blurb{max-width:33rem;margin:4.5rem auto 0}
.blurb p{font-size:1.04rem;line-height:1.7}
.blurb p:first-child{font-size:1.13rem}

/* ---------- paged reading ---------- */
.paper{
  position:relative;margin-inline:auto;background:var(--surface);
  perspective:3000px;touch-action:pan-y;user-select:text;
  box-shadow:0 1px 1px rgba(0,0,0,.08),0 14px 38px rgba(0,0,0,.13);
  border-radius:1px;
}
.paper__spine{
  position:absolute;top:0;bottom:0;width:1px;background:var(--rule);
  opacity:.85;pointer-events:none;z-index:3;
}
.paper__rule{
  position:absolute;width:1px;background:var(--madder-ghost);
  opacity:.85;pointer-events:none;z-index:2;
}
.sheet{position:relative;overflow:hidden}
.flow{height:100%;column-fill:auto;column-rule:0}
.flow > *:first-child{margin-top:0}
.runhead,.folio{
  position:absolute;font-family:var(--mono);font-size:.6rem;
  letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
  pointer-events:none;z-index:3;
}
.folio{font-variant-numeric:tabular-nums;letter-spacing:.1em}

.leaf{position:absolute;z-index:6;transform-style:preserve-3d;transform-origin:left center}
.leaf__face{position:absolute;inset:0;overflow:hidden;background:var(--surface);
  backface-visibility:hidden;box-shadow:0 0 22px rgba(0,0,0,.20)}
.leaf__face--front{border-right:1px solid var(--rule)}
.leaf__face--back{transform:rotateY(180deg);background:var(--surface);border-left:1px solid var(--rule)}
/* the reverse of a leaf catches the light along the spine */
.leaf__face--back::before{content:"";position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(0,0,0,.055),transparent 30%)}
.leaf__shade{position:absolute;inset:0;pointer-events:none;opacity:0}
.leaf__face--front .leaf__shade{background:linear-gradient(90deg,rgba(0,0,0,.30),rgba(0,0,0,0) 42%)}
.leaf__face--back .leaf__shade{background:linear-gradient(90deg,rgba(0,0,0,0) 58%,rgba(0,0,0,.22))}
.leaf.is-animating{transition:transform .62s cubic-bezier(.36,.03,.24,1)}
.leaf.is-animating .leaf__shade{transition:opacity .62s ease}

.pager{
  display:flex;align-items:center;justify-content:space-between;gap:1rem;
  max-width:100%;margin:1.15rem auto 0;
}
.pager__btn{
  display:inline-flex;align-items:center;gap:.45rem;
  font-family:var(--mono);font-size:.7rem;letter-spacing:.06em;color:var(--madder);
  border:1px solid var(--madder-ghost);border-radius:2px;padding:.42rem .7rem;
}
.pager__btn:hover{background:var(--surface)}
.pager__btn[disabled]{opacity:.32;cursor:default}
.pager__btn[disabled]:hover{background:none}
.pager__where{font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;color:var(--muted)}
.swipe-hint{
  text-align:center;font-family:var(--mono);font-size:.62rem;
  letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-top:.75rem;
}

/* entries inside a paged column: the number sits above, and the ruling
   belongs to the page furniture rather than the text block */
.flow .entry{padding-bottom:1.9rem;margin-bottom:1.9rem}
.flow .entry__n{position:static;display:block;width:auto;padding:0;margin-bottom:.35rem;background:none}
.flow .entry__head{break-inside:avoid}
.flow .gloss{break-inside:avoid}
.flow .ch-head{break-after:avoid}
.flow .entry__quote{font-size:1.22rem}
.flow .ch-open{font-size:1rem;margin-bottom:2rem}
.flow .gloss p{font-size:.94rem}
.flow .prose{font-size:1rem}

.modeswitch{display:flex;gap:.35rem;margin-top:.9rem}
.modeswitch button{
  flex:1;font-family:var(--mono);font-size:.62rem;letter-spacing:.08em;
  text-transform:uppercase;padding:.34rem .2rem;border:1px solid var(--rule);
  border-radius:2px;color:var(--muted);
}
.modeswitch button[aria-pressed="true"]{
  color:var(--madder);border-color:var(--madder-ghost);background:var(--paper);
}
@media (max-width:900px){
  .blurb{margin-top:3rem}
  .pager{gap:.6rem}
}

.railtoggle{display:none}

@media (max-width:900px){
  .shell{grid-template-columns:1fr}
  .rail{
    position:static;height:auto;border-right:0;border-bottom:1px solid var(--rule);
    padding:1.1rem 1.25rem 1.4rem;
  }
  .rail__nav{display:none}
  .rail[data-open="true"] .rail__nav{display:block}
  .rail__search{margin:1rem 0 0}
  .railtoggle{
    display:flex;align-items:center;gap:.5rem;margin-top:1rem;
    font-family:var(--mono);font-size:.68rem;letter-spacing:.09em;
    text-transform:uppercase;color:var(--madder);
  }
  .main{padding:2rem 1.35rem 4rem}
  .page,.contents,.srcs{margin-inline:0}
  .reading{padding-left:1.15rem}
  .entry__n{position:static;display:block;width:auto;padding:0;margin-bottom:.4rem;background:none}
  .entry__quote{font-size:1.28rem}
  .srcs{columns:1}
  .ch-open p:first-child::first-letter{font-size:2.9em}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important}
}
</style>

<div class="shell">
  <nav class="rail" id="rail">
    <button class="rail__brand" id="brand">Lines Worth<br>Keeping</button>
    <div class="rail__colophon" id="colophon"></div>
    <button class="railtoggle" id="railtoggle" aria-expanded="false">Contents</button>
    <div class="rail__search">
      <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5 14 14"></path></svg>
      <input id="search" type="search" placeholder="Search 240 entries" aria-label="Search the book">
    </div>
    <div class="rail__nav" id="railnav">
      <div id="toc"></div>
      <div class="rail__end">
        <button data-go="cover">Cover</button>
        <button data-go="intro">Introduction</button>
        <button data-go="note">A Note on Attribution</button>
        <button data-go="index">Index of Sources</button>
        <div class="modeswitch" role="group" aria-label="Reading mode">
          <button id="mode-paged" aria-pressed="true">Paged</button>
          <button id="mode-scroll" aria-pressed="false">Scroll</button>
        </div>
      </div>
    </div>
  </nav>
  <main class="main" id="main" tabindex="-1"></main>
</div>

<script id="book-data" type="application/json">__BOOK_DATA__</script>
<script>
(function(){
  "use strict";
  var BOOK = JSON.parse(document.getElementById("book-data").textContent);
  var main = document.getElementById("main");
  var searchBox = document.getElementById("search");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)");

  var ALL = [];
  BOOK.chapters.forEach(function(ch){
    ch.entries.forEach(function(e){ ALL.push(Object.assign({chTitle:ch.title}, e)); });
  });

  function esc(s){
    return String(s).replace(/[&<>"]/g, function(c){
      return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c];
    });
  }
  function pad(n){ return n < 10 ? "00" + n : n < 100 ? "0" + n : "" + n; }
  function clamp(v,a,b){ return Math.max(a, Math.min(b, v)); }
  function store(k,v){ try{ localStorage.setItem(k, v); }catch(e){} }
  function recall(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }

  document.getElementById("colophon").textContent =
    ALL.length + " entries · " + BOOK.chapters.length + " chapters · " +
    BOOK.index.length + " sources";

  function parts(){
    var out = [], seen = {};
    BOOK.chapters.forEach(function(ch){
      if(!seen[ch.part]){ seen[ch.part] = {roman:ch.partRoman, name:ch.partName, chs:[]}; out.push(seen[ch.part]); }
      seen[ch.part].chs.push(ch);
    });
    return out;
  }

  document.getElementById("toc").innerHTML = parts().map(function(p){
    return '<div class="part"><div class="part__head"><span class="part__num">' + p.roman +
      '</span><span>' + esc(p.name) + '</span></div><ul class="toc">' +
      p.chs.map(function(c){
        return '<li><button data-go="chapter" data-n="' + c.n + '">' +
          '<span class="toc__n">' + c.n + '</span>' +
          '<span class="toc__t">' + esc(c.title) + '</span></button></li>';
      }).join("") + "</ul></div>";
  }).join("");

  /* ---------- entries ---------- */
  function entryHTML(e){
    var q = e.bare
      ? '<em>' + esc(e.quote) + '</em>'
      : '<span class="mk">“</span>' + esc(e.quote) + '<span class="mk">”</span>';
    return '<article class="entry" id="e' + e.n + '">' +
      '<div class="entry__head">' +
        '<div class="entry__n">' + pad(e.n) + '</div>' +
        '<blockquote class="entry__quote">' + q + '</blockquote>' +
        '<div class="entry__attr">' + esc(e.attribution) + '</div>' +
      '</div>' +
      '<div class="gloss gloss--means"><div class="gloss__label">What it means</div><p>' + esc(e.means) + '</p></div>' +
      '<div class="gloss gloss--use"><div class="gloss__label">How to use it</div><p>' + esc(e.use) + '</p></div>' +
      '</article>';
  }
  function hl(safeText, term){
    if(/[&<>"]/.test(term)) return safeText;
    var re = new RegExp("(" + term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
    return safeText.replace(re, "<mark>$1</mark>");
  }

  /* ================= paged reading ================= */
  var P = null;   // live pagination state, null when the view is not paged

  function mode(){ return recall("lwk:mode") === "scroll" ? "scroll" : "paged"; }
  function setMode(m, quiet){
    store("lwk:mode", m);
    document.getElementById("mode-paged").setAttribute("aria-pressed", String(m === "paged"));
    document.getElementById("mode-scroll").setAttribute("aria-pressed", String(m === "scroll"));
    if(!quiet) render();
  }

  function mountPaged(inner, head, key){
    var avail = main.clientWidth;
    var h  = clamp(window.innerHeight - 200, 420, 880);
    var pw = clamp(Math.round(h * 0.66), 280, 460);
    if(pw > avail) pw = avail;
    var spread = avail >= pw * 2 + 24 ? 2 : 1;
    var m  = Math.round(pw * 0.105);
    var vm = Math.round(h * 0.075);
    var sheetH = h - vm * 2;

    main.innerHTML =
      '<div class="paper" id="paper" style="width:' + (spread*pw) + 'px;height:' + h + 'px;padding:' + vm + 'px 0">' +
        '<div class="sheet" id="sheet" style="height:' + sheetH + 'px">' +
          '<div class="flow" id="flow" style="width:' + (spread*pw) + 'px;padding:0 ' + m + 'px;' +
            'column-width:' + (pw - 2*m) + 'px;column-gap:' + (2*m) + 'px">' + inner + '</div>' +
        '</div>' +
        '<div id="furniture"></div>' +
      '</div>' +
      '<div class="pager" id="pager" style="width:' + (spread*pw) + 'px">' +
        '<button class="pager__btn" id="prev">‹ Back</button>' +
        '<span class="pager__where" id="where"></span>' +
        '<button class="pager__btn" id="next">Turn ›</button>' +
      '</div>' +
      '<div class="swipe-hint">Swipe, or use ← →</div>';

    var flow = document.getElementById("flow");
    var pages = Math.max(1, Math.round(flow.scrollWidth / pw));
    var saved = 0;
    if(recall("lwk:at") === key) saved = parseInt(recall("lwk:page") || "0", 10) || 0;

    P = {key:key, head:head, pw:pw, spread:spread, m:m, vm:vm, h:h, sheetH:sheetH,
         pages:pages, index:0, busy:false,
         paper:document.getElementById("paper"), flow:flow,
         furn:document.getElementById("furniture")};
    goTo(clamp(saved - (saved % spread), 0, Math.max(0, pages - 1)), true);

    document.getElementById("prev").addEventListener("click", function(){ turn(-1); });
    document.getElementById("next").addEventListener("click", function(){ turn(1); });
    bindSwipe(P.paper);
  }

  function goTo(i, silent){
    P.index = clamp(i, 0, Math.max(0, P.pages - 1));
    P.flow.style.transform = "translateX(" + (-P.index * P.pw) + "px)";
    furniture();
    store("lwk:at", P.key);
    store("lwk:page", String(P.index));
  }

  function furniture(){
    var html = "", i;
    for(i = 0; i < P.spread; i++){
      var pageNo = P.index + i;
      if(pageNo >= P.pages) break;
      var x = i * P.pw;
      html += '<div class="paper__rule" style="left:' + (x + P.m - 14) + 'px;top:' + P.vm +
              'px;height:' + P.sheetH + 'px"></div>';
      html += '<div class="runhead" style="left:' + (x + P.m) + 'px;width:' + (P.pw - 2*P.m) +
              'px;top:' + Math.round(P.vm/2 - 5) + 'px;text-align:' + (i ? "right" : "left") + '">' +
              esc(P.head) + "</div>";
      html += '<div class="folio" style="left:' + x + 'px;width:' + P.pw +
              'px;bottom:' + Math.round(P.vm/2 - 5) + 'px;text-align:center">' + (pageNo + 1) + "</div>";
    }
    if(P.spread === 2 && P.index + 1 < P.pages){
      html += '<div class="paper__spine" style="left:' + P.pw + 'px"></div>';
    }
    P.furn.innerHTML = html;
    var prev = document.getElementById("prev"), next = document.getElementById("next"),
        where = document.getElementById("where");
    if(prev) prev.disabled = P.index <= 0;
    if(next) next.disabled = P.index + P.spread >= P.pages;
    if(where) where.textContent = "Page " + (P.index + 1) +
      (P.spread === 2 && P.index + 1 < P.pages ? "–" + (P.index + 2) : "") + " of " + P.pages;
  }

  function turn(dir){
    if(!P || P.busy) return;
    var target = P.index + dir * P.spread;
    if(target < 0 || target >= P.pages) return;
    if(reduce.matches){ goTo(target); return; }

    // The leaf is the right-hand page; it hinges on the spine (or, on a single
    // page, on its own left edge), and its blank reverse shows past 90 degrees.
    var face = dir > 0 ? P.index + P.spread - 1 : target + P.spread - 1;
    if(face >= P.pages) face = P.pages - 1;
    var x = (P.spread - 1) * P.pw;

    var leaf = document.createElement("div");
    leaf.className = "leaf";
    leaf.style.cssText = "left:" + x + "px;top:" + P.vm + "px;width:" + P.pw +
                         "px;height:" + P.sheetH + "px";
    var clone = P.flow.cloneNode(true);
    clone.removeAttribute("id");
    clone.style.transform = "translateX(" + (-face * P.pw) + "px)";
    var front = document.createElement("div");
    front.className = "leaf__face leaf__face--front";
    front.appendChild(clone);
    var fs = document.createElement("div"); fs.className = "leaf__shade"; front.appendChild(fs);
    var back = document.createElement("div");
    back.className = "leaf__face leaf__face--back";
    var bs = document.createElement("div"); bs.className = "leaf__shade"; back.appendChild(bs);
    leaf.appendChild(front); leaf.appendChild(back);

    leaf.style.transform = dir > 0 ? "rotateY(0deg)" : "rotateY(-180deg)";
    if(dir < 0){ bs.style.opacity = ".22"; }
    P.paper.appendChild(leaf);

    P.busy = true;
    goTo(target);

    requestAnimationFrame(function(){
      requestAnimationFrame(function(){
        leaf.classList.add("is-animating");
        leaf.style.transform = dir > 0 ? "rotateY(-180deg)" : "rotateY(0deg)";
        fs.style.opacity = dir > 0 ? ".38" : "0";
        bs.style.opacity = dir > 0 ? ".22" : "0";
      });
    });
    var done = false;
    function finish(){
      if(done) return;
      done = true;
      if(leaf.parentNode) leaf.parentNode.removeChild(leaf);
      P.busy = false;
    }
    leaf.addEventListener("transitionend", function(ev){
      if(ev.propertyName === "transform") finish();
    });
    setTimeout(finish, 900);
  }

  function bindSwipe(el){
    var x0 = 0, y0 = 0, down = false;
    el.addEventListener("pointerdown", function(ev){
      if(ev.button) return;
      down = true; x0 = ev.clientX; y0 = ev.clientY;
    });
    el.addEventListener("pointerup", function(ev){
      if(!down) return;
      down = false;
      var sel = window.getSelection();
      if(sel && String(sel).length > 2) return;
      var dx = ev.clientX - x0, dy = ev.clientY - y0;
      if(Math.abs(dx) > 42 && Math.abs(dx) > Math.abs(dy) * 1.4) turn(dx < 0 ? 1 : -1);
    });
    el.addEventListener("pointercancel", function(){ down = false; });
  }

  /* ================= views ================= */
  var lastRandom = -1;
  function randomEntry(){
    var i = Math.floor(Math.random() * ALL.length);
    if(i === lastRandom) i = (i + 1) % ALL.length;
    lastRandom = i;
    return ALL[i];
  }

  function viewCover(){
    P = null;
    main.innerHTML =
      '<div class="cover-wrap">' +
        '<div class="cover" id="cover">' +
          '<div class="cover__channel"></div><div class="cover__channel cover__channel--in"></div>' +
          '<div class="cover__folio">' + ALL.length + ' entries</div>' +
          '<div class="cover__body">' +
            '<div class="cover__eyebrow">A commonplace book</div>' +
            '<h1 class="cover__title">' + esc(BOOK.title) + '</h1>' +
            '<hr class="cover__hr">' +
            '<p class="cover__sub">' + esc(BOOK.subtitle) + '</p>' +
          '</div>' +
          '<div class="cover__foot">' + BOOK.chapters.length + ' chapters · ' +
            BOOK.index.length + ' sources · Aesop to Adam Phillips</div>' +
        '</div>' +
        '<div class="cover-acts">' +
          '<button class="act act--solid" data-go="chapter" data-n="1">Open the book</button>' +
          '<button class="act" id="anywhere">Open it anywhere</button>' +
        '</div>' +
      '</div>' +
      '<section class="blurb">' + BOOK.blurb.map(function(p){ return "<p>" + esc(p) + "</p>"; }).join("") + '</section>' +
      '<section class="contents"><div class="opener__label">Sixteen chapters, by the problem you have</div>' +
        '<div class="contents__grid">' +
        parts().map(function(p){
          return '<div class="part-block"><h3><span>Part ' + p.roman + '</span> · ' + esc(p.name) + '</h3>' +
            p.chs.map(function(c){
              return '<button class="chapter-link" data-go="chapter" data-n="' + c.n + '">' +
                '<span class="chapter-link__n">' + c.n + '</span>' +
                '<span class="chapter-link__t">' + esc(c.title) + '</span></button>';
            }).join("") + "</div>";
        }).join("") +
        '</div>' +
        '<div class="kbd-hint">Press <kbd>R</kbd> to open it anywhere · <kbd>/</kbd> to search</div>' +
      '</section>';
    document.getElementById("anywhere").addEventListener("click", function(){
      var e = randomEntry();
      pendingEntry = e.n;
      location.hash = "#/chapter/" + e.ch;
    });
  }

  function chapterInner(ch){
    return '<header class="ch-head">' +
        '<div class="ch-eyebrow">Part ' + ch.partRoman + ' · ' + esc(ch.partName) +
        ' · <b>Chapter ' + ch.n + '</b></div>' +
        '<h2>' + esc(ch.title) + '</h2></header>' +
      '<div class="ch-open">' + ch.opening + '</div>' +
      ch.entries.map(function(e){ return entryHTML(e); }).join("");
  }

  function viewChapter(n){
    var ch = BOOK.chapters.filter(function(c){ return c.n === n; })[0];
    if(!ch) return viewCover();
    if(mode() === "paged"){
      mountPaged(chapterInner(ch), "Ch " + ch.n + " · " + ch.title, "chapter/" + n);
      if(pendingEntry) jumpToEntryPage(pendingEntry);
      return;
    }
    P = null;
    var prev = BOOK.chapters.filter(function(c){ return c.n === n - 1; })[0];
    var next = BOOK.chapters.filter(function(c){ return c.n === n + 1; })[0];
    main.innerHTML =
      '<div class="page">' + chapterInner(ch) +
        '<nav class="ch-foot">' +
          (prev ? '<button data-go="chapter" data-n="' + prev.n + '"><span class="ch-foot__lab">Previous</span>' +
                  '<span class="ch-foot__t">' + esc(prev.title) + '</span></button>' : '<span></span>') +
          (next ? '<button data-go="chapter" data-n="' + next.n + '"><span class="ch-foot__lab">Next</span>' +
                  '<span class="ch-foot__t">' + esc(next.title) + '</span></button>' : '<span></span>') +
        '</nav></div>';
    var wrap = main.querySelector(".page");
    var entries = wrap.querySelectorAll(".entry");
    var host = document.createElement("div");
    host.className = "reading";
    entries[0].parentNode.insertBefore(host, entries[0]);
    Array.prototype.forEach.call(entries, function(el){ host.appendChild(el); });
  }

  function jumpToEntryPage(n){
    var el = document.getElementById("e" + n);
    pendingEntry = null;
    if(!el || !P) return;
    var page = Math.floor((el.offsetLeft + 1) / P.pw);
    goTo(page - (page % P.spread));
  }

  function viewProse(which){
    var title = which === "intro" ? "Introduction" : "A Note on Attribution";
    var inner = '<header class="ch-head"><div class="ch-eyebrow">' +
      (which === "intro" ? "Front matter" : "Back matter") + '</div>' +
      '<h2>' + title + '</h2></header>' +
      '<div class="prose">' + (which === "intro" ? BOOK.intro : BOOK.note) + '</div>';
    if(mode() === "paged"){ mountPaged(inner, title, which); return; }
    P = null;
    main.innerHTML = '<div class="page">' + inner + '</div>';
  }

  function viewIndex(){
    P = null;
    var letter = null, html = "";
    BOOK.index.forEach(function(s){
      if(s.letter !== letter){
        letter = s.letter;
        html += '<div class="letter">' + (letter === "¶" ? "Proverbs &amp; anonymous" : letter) + "</div>";
      }
      html += '<div class="src"><div class="src__name">' + esc(s.name) + "</div>" +
        s.items.map(function(i){
          return '<button class="src__item" data-goto-entry="' + i.n + '" data-ch="' + i.ch + '">' +
            '<span class="src__n">' + pad(i.n) + "</span> “" + esc(i.quote) + "”" +
            (i.q ? ' <span class="src__q">' + esc(i.q) + "</span>" : "") + "</button>";
        }).join("") + "</div>";
    });
    main.innerHTML =
      '<div class="page"><header class="ch-head"><div class="ch-eyebrow">Back matter</div>' +
        '<h2>Index of Sources</h2></header>' +
        '<p style="color:var(--muted);font-size:.95rem;max-width:34rem;margin-bottom:2rem">' +
        BOOK.index.length + ' sources across ' + ALL.length +
        ' entries. Numbers are entry numbers. Where a line is disputed or paraphrased it is marked ' +
        '<em>attributed to</em> or <em>after</em>, matching the text.</p></div>' +
      '<div class="srcs">' + html + "</div>";
  }

  function viewSearch(term){
    P = null;
    var t = term.toLowerCase();
    var hits = ALL.filter(function(e){
      return (e.quote + " " + e.attribution + " " + e.means + " " + e.use + " " + e.chTitle)
        .toLowerCase().indexOf(t) !== -1;
    });
    main.innerHTML =
      '<div class="page"><header class="ch-head"><div class="ch-eyebrow">Search</div>' +
      '<h2>' + hits.length + (hits.length === 1 ? " entry" : " entries") + " for “" + esc(term) + "”</h2></header>" +
      (hits.length
        ? '<ul class="results">' + hits.map(function(e){
            return '<li class="result"><button data-goto-entry="' + e.n + '" data-ch="' + e.ch + '">' +
              '<div class="result__q">“' + hl(esc(e.quote), term) + '”</div>' +
              '<div class="result__meta">' + pad(e.n) + " · " + esc(e.attribution) +
              " · ch " + e.ch + ", " + esc(e.chTitle) + "</div></button></li>";
          }).join("") + "</ul>"
        : '<p class="empty">Nothing here. Try a plainer word: anger, money, sleep, apology.</p>') +
      "</div>";
  }

  /* ================= routing ================= */
  var pendingEntry = null;

  function markCurrent(n){
    document.querySelectorAll(".toc button").forEach(function(b){
      b.setAttribute("aria-current", String(Number(b.dataset.n) === n));
    });
  }
  function render(){
    var h = location.hash.replace(/^#\/?/, "");
    var seg = h.split("/");
    if(seg[0] === "chapter"){ viewChapter(Number(seg[1])); markCurrent(Number(seg[1])); }
    else if(seg[0] === "intro"){ viewProse("intro"); markCurrent(0); }
    else if(seg[0] === "note"){ viewProse("note"); markCurrent(0); }
    else if(seg[0] === "index"){ viewIndex(); markCurrent(0); }
    else if(seg[0] === "search"){ viewSearch(decodeURIComponent(seg.slice(1).join("/"))); markCurrent(0); }
    else { viewCover(); markCurrent(0); }
    if(pendingEntry && !P){
      var el = document.getElementById("e" + pendingEntry);
      pendingEntry = null;
      if(el){ el.scrollIntoView(); window.scrollBy(0, -20); return; }
    }
    window.scrollTo(0, 0);
  }

  document.addEventListener("click", function(ev){
    var go = ev.target.closest("[data-go]");
    if(go){
      var kind = go.dataset.go;
      var next = kind === "chapter" ? "#/chapter/" + go.dataset.n : kind === "cover" ? "#/" : "#/" + kind;
      if(location.hash === next || (next === "#/" && !location.hash)) render();
      else location.hash = next;
      closeRail();
      return;
    }
    var jump = ev.target.closest("[data-goto-entry]");
    if(jump){
      pendingEntry = Number(jump.dataset.gotoEntry);
      var h = "#/chapter/" + jump.dataset.ch;
      if(location.hash === h) render(); else location.hash = h;
      closeRail();
    }
  });
  document.getElementById("brand").addEventListener("click", function(){
    if(location.hash && location.hash !== "#/") location.hash = "#/"; else render();
  });
  document.getElementById("mode-paged").addEventListener("click", function(){ setMode("paged"); });
  document.getElementById("mode-scroll").addEventListener("click", function(){ setMode("scroll"); });

  var rail = document.getElementById("rail");
  var toggle = document.getElementById("railtoggle");
  function closeRail(){
    if(window.matchMedia("(max-width:900px)").matches){
      rail.dataset.open = "false";
      toggle.setAttribute("aria-expanded", "false");
    }
  }
  toggle.addEventListener("click", function(){
    var open = rail.dataset.open !== "true";
    rail.dataset.open = String(open);
    toggle.setAttribute("aria-expanded", String(open));
  });

  var timer;
  searchBox.addEventListener("input", function(){
    clearTimeout(timer);
    var v = searchBox.value.trim();
    timer = setTimeout(function(){
      location.hash = v.length > 1 ? "#/search/" + encodeURIComponent(v) : "#/";
    }, 180);
  });

  document.addEventListener("keydown", function(ev){
    if(ev.target.tagName === "INPUT" || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if(ev.key === "/"){ ev.preventDefault(); searchBox.focus(); return; }
    if(ev.key === "r" || ev.key === "R"){
      var e = randomEntry();
      pendingEntry = e.n;
      var h = "#/chapter/" + e.ch;
      if(location.hash === h) render(); else location.hash = h;
      return;
    }
    if(!P) return;
    if(ev.key === "ArrowRight" || ev.key === "PageDown" || ev.key === " "){ ev.preventDefault(); turn(1); }
    else if(ev.key === "ArrowLeft" || ev.key === "PageUp"){ ev.preventDefault(); turn(-1); }
  });

  var rt;
  window.addEventListener("resize", function(){
    if(!P) return;
    clearTimeout(rt);
    rt = setTimeout(render, 220);
  });

  setMode(mode(), true);
  window.addEventListener("hashchange", render);
  render();
})();
</script>
