f it. Yours is.","use":"Keep a rough tally, for one week, of the hours you spend thinking about somebody else's good fortune. Not judging them. Counting them. Then ask what you would have done with them otherwise. Envy is expensive and it never sends an invoice, which is why nobody notices the size of the bill.","ch":6},{"n":78,"quote":"Whoever envies another confesses his superiority.","bare":false,"attribution":"Samuel Johnson","means":"Johnson has it the right way round. You cannot envy someone you consider beneath you, so the feeling is an admission, made in private, that you rank them above yourself in the thing that matters to you.","use":"Turn the confession into information. Whose success bothers you? That is your true ambition, stated by a witness who cannot be bribed. Most people spend years working out what they want. You have a shortcut, and it is uncomfortable, and it is accurate.","ch":6},{"n":79,"quote":"Our envy always lasts longer than the happiness of those we envy.","bare":false,"attribution":"François de La Rochefoucauld","means":"They got the thing. Six weeks later it had joined the furniture and they were on to the next want, exactly as you would have been. You, meanwhile, are still in the moment of their triumph, which for you has no expiry date because you never got to be bored of it.","use":"Fast-forward. The person whose life you covet is not living in the photograph. They are living in a Tuesday, with a boiler that needs replacing. You are comparing your ordinary week to their highlight, and the comparison was rigged before you started.","ch":6},{"n":80,"quote":"As rust corrupts iron, so envy corrupts man.","bare":false,"attribution":"Antisthenes","means":"Rust needs no help and no event. It needs only time, damp and neglect. It works from the inside out, on the thing that gives a structure its strength.","use":"Watch for the slow version, not the sharp one. The sharp pang passes. The slow one shows up as a permanent light contempt for someone who has done nothing to you, or as never being able to praise them without a qualification. If you find you cannot say a warm sentence about a particular person, you have found some rust.","ch":6},{"n":81,"quote":"Nothing sharpens sight like envy.","bare":false,"attribution":"Thomas Fuller","means":"Envy makes you a brilliant observer of one narrow thing. You will notice the new watch, the different job title, the holiday nobody mentioned, with a precision you cannot manage for the work you are paid to look at.","use":"When you catch yourself knowing an unreasonable amount about somebody's circumstances, ask what the attention is for. This is a genuine skill being spent on nothing. The same noticing, aimed at your own work or at a person who needs help, is worth having. Aimed here, it is just surveillance.","ch":6},{"n":82,"quote":"No one is happy who does not think himself so.","bare":false,"attribution":"Publilius Syrus","means":"The judgement is internal and it is the only one that lands. A life that looks fortunate from outside and feels insufficient from inside is experienced, from inside, as insufficient. That is where you live.","use":"Remember that you are the person somebody else is comparing themselves to. Somewhere there is a person who would take your circumstances in a heartbeat. This does not oblige you to be grateful on command. It does establish that the outside view of a life tells you almost nothing about the inside of it, including yours.","ch":6},{"n":83,"quote":"It is in the character of very few men to honour without envy a friend who has prospered.","bare":false,"attribution":"Aeschylus","means":"Aeschylus is not condemning anybody. He is reporting a base rate. Congratulating a friend without a private twinge is rare, and pretending otherwise is how people end up thinking there is something uniquely wrong with them.","use":"Lower the standard you hold yourself to. You do not have to feel pure delight. You have to behave well: send the message, mean the words, and let the twinge happen without acting on it. Conduct is the part you control. The feeling can be present and unhelpful and still not get a vote.","ch":6},{"n":84,"quote":"The envious die not once, but as often as the envied win applause.","bare":false,"attribution":"Baltasar Gracián","means":"Every announcement is a fresh small death. And because the envied person keeps living, the deaths keep coming, which makes envy the only emotion that renews its own subscription.","use":"Take the trigger out of your hand. If one person's updates reliably ruin an afternoon, mute them. Not forever, and not with a speech. Muting is not a judgement on them and it is not a defeat for you. It is declining to attend a ceremony that only ever ends one way.","ch":6},{"n":85,"quote":"The reason we struggle with insecurity is that we compare our behind the scenes with everyone else's highlight reel.","bare":false,"attribution":"Steven Furtick","means":"You have full access to your own doubts, false starts and bad mornings, and you have edited access to theirs. So the comparison is between the whole of one life and the trailer for another. It was never a fair fight.","use":"Before comparing, insist on the same footage from both sides. What was their year like, actually? You find out later, at a wedding or a funeral, that the person whose life you wanted was in the worst eighteen months of theirs while you were envying the photographs.","ch":6},{"n":86,"quote":"Every other sin hath some pleasure annexed to it, or will admit of an excuse; envy alone wants both.","bare":false,"attribution":"Robert Burton","means":"Burton's point is that this one is uniquely unrewarding. Greed at least delivers objects. Anger has a rush to it. Envy has no pleasure attached at any stage, and no defence you could make to a jury.","use":"Use the total absence of upside as leverage. With most bad habits you are giving something up. With this one you are not, which makes it the cheapest thing in your life to put down. There is nothing on the other side of the exchange to mourn.","ch":6},{"n":87,"quote":"It is better to be envied than pitied.","bare":false,"attribution":"Herodotus","means":"The line was old when Herodotus wrote it down, and it cuts both ways. Being envied means you have something. It also means being disliked for it by people who will never say so, and the price of that is real.","use":"Consider that you are on the receiving end more often than you know. Somebody resents your marriage, your job, your health, your childhood. They have never mentioned it and they never will. Hold that lightly when a friend seems oddly cool about your good news. It may not be about you at all, and it may not be within their control either.","ch":6},{"n":88,"quote":"Envy shoots at others and wounds herself.","bare":false,"attribution":"English proverb","means":"The proverb is about the mechanics of aim. You cannot fire this particular arrow at somebody else, because there is no way to deliver it. It goes off in your hand every time.","use":"When you feel the urge to diminish someone, out loud or in your head, notice that the sentence never reaches them. The colleague never hears the thing you say about their promotion in the car. Only you and the passenger seat hear it, and you are the one it changes.","ch":6},{"n":89,"quote":"Fret not thyself because of evildoers, neither be thou envious against the workers of iniquity.","bare":false,"attribution":"Psalm 37:1","means":"This is the hardest case: envying someone who got there by means you would refuse. The line does not say they will be punished. It says do not let the injustice occupy you, which is a different and more useful instruction.","use":"Separate the anger from the envy. The anger at unfairness is legitimate and can be pointed at something: a complaint, a vote, a policy, a conversation with somebody who can act. The envy is not legitimate and can be pointed at nothing. Keep the first. It is worth something. Drop the second.","ch":6},{"n":90,"quote":"Envy is ignorance; imitation is suicide.","bare":false,"attribution":"Ralph Waldo Emerson","means":"Emerson goes further than everyone else here. Envy is not merely unpleasant. It is a factual error, because it assumes their life would work if it were yours, and that assumption has never once survived contact with the details.","use":"Here is the exit, and it is the strongest one available. You cannot have their life. Not the good part on its own. It comes attached to their parents, their marriage, their health, their debts and their particular three in the morning, and the trade is all or nothing. Nobody has ever accepted the whole package on inspection. Whatever you are envying, you want a component and not the machine, and components can be bought separately.","ch":6}]},{"n":7,"title":"Friendship and Love","part":"Two","partRoman":"II","partName":"Other People","opening":"<p>Think of somebody you were close to eight years ago and have not spoken to since. Nothing happened. There was no argument, no falling out, no moment you could point at. One of you moved, replies got slower, and the thing stopped, the way a fire stops when nobody puts anything on it.</p><p>That is how most friendships end. Not in a row. In an absence of maintenance.</p><p>Which is strange, because we talk about friendship as if it were a state and not an activity. You <em>are</em> friends, in the way you are tall. But nothing about it is passive. Every friendship you still have is being held up by somebody&#x27;s small deliberate acts: the message with no purpose, the offer to help with the move, the remembering that the operation was on Tuesday. It is being held up by one of the two of you more than the other, and neither of you has ever discussed which.</p><p>The chapters around this one are about friction: listening properly, saying the hard thing, being wronged. They assume the relationship exists. This one is about the part underneath, which is affection and its upkeep, and which gets far less attention because it produces no drama and no anecdotes.</p><p>A word on love, since it is in the title and then stays in the background. The lines here treat romantic love and friendship as the same substance at different temperatures, which is what the old writers thought, and close enough to right. A marriage that survives is a friendship with extra terms and conditions.</p><p>The practical content of this chapter is small and a little embarrassing: turn up, say the warm thing out loud, and do it before you have a reason to.</p>","entries":[{"n":91,"quote":"A friend loveth at all times, and a brother is born for adversity.","bare":false,"attribution":"Proverbs 17:17","means":"Two different offices. The friend is constant, in good weather and bad, without needing a crisis to justify the contact. The second half is about who appears when things collapse, and it is a smaller list than the first.","use":"Write down the three people you would ring at two in the morning. Then ask when you last contacted any of them for no reason. The at all times part is what earns you the adversity part, and it is paid in advance, in dull ordinary weeks when nothing is wrong.","ch":7},{"n":92,"quote":"Friendship is a single soul dwelling in two bodies.","bare":false,"attribution":"Aristotle","means":"Aristotle is describing the rarest kind, the friend you do not have to explain yourself to. Not agreement on everything. Something simpler: the absence of translation. You say the half sentence and it lands.","use":"Count how many people you have this with. Two is a good number. Four is a rich life. If the answer is none, that is not a verdict on you, it is a construction project, and it takes years instead of weeks, which is the only reason most adults do not start.","ch":7},{"n":93,"quote":"Prosperity makes friends, adversity tries them.","bare":false,"attribution":"Publilius Syrus","means":"Good times attract company that costs nothing to keep. Bad times sort that company into two groups, quickly and without any announcement, and the sorting is rarely a surprise afterwards.","use":"When your own bad stretch comes, watch who appears and keep the list. Do not use it for revenge. Use it for allocation: your limited energy should go to the people who turned up, and it is remarkable how many of us spend it instead on the ones who did not, out of habit or old loyalty to a version of them that no longer exists.","ch":7},{"n":94,"quote":"We cannot tell the precise moment when friendship is formed. As in filling a vessel drop by drop, there is at last a drop which makes it run over.","bare":false,"attribution":"James Boswell","means":"There is no threshold event. No conversation converts an acquaintance into a friend. It is accumulation, and it happens below the level where you notice it happening, which is why you can rarely say when it started.","use":"Stop waiting for the significant occasion. The drops are the point: the lift to the station, the reply to a nothing message, the second time you sit next to each other. Volume matters more than depth here, at least at first. Say yes to the low-stakes invitation, which is where nearly all of it happens.","ch":7},{"n":95,"quote":"A true friend is the greatest of all blessings, and the one we take the least care of all to acquire.","bare":false,"attribution":"François de La Rochefoucauld","means":"He is pointing at a plain inconsistency. We plan for the career, the mortgage and the pension, and we leave the thing that most determines whether the years are bearable to chance and proximity.","use":"Treat it as a thing you do, not a thing that happens to you. Put it in the diary if that is what it takes. The first Tuesday of the month, that pub, whoever comes. It feels mechanical written down and it produces something that no amount of good intention ever has.","ch":7},{"n":96,"quote":"The only way to have a friend is to be one.","bare":false,"attribution":"Ralph Waldo Emerson","means":"A blunt statement about direction. The supply of people waiting to adopt you is zero. The supply of people who would respond warmly if approached first is large and untouched, because everyone is waiting on the same message from somebody else.","use":"Go first. Send the message you have been half composing for a month. Suggest the specific date instead of the vague meet up soon, which is a phrase designed to be agreed with and never acted on. The awkwardness of going first lasts about eleven seconds and is the entire price.","ch":7},{"n":97,"quote":"A hedge between keeps friendship green.","bare":false,"attribution":"English proverb","means":"Closeness needs a boundary or it turns into friction. The hedge is not a wall. It marks where you end and they begin, and its whole function is to make the shared ground pleasant instead of contested.","use":"Apply it to the practical things that quietly kill friendships: money lent, holidays shared, work done as a favour, a spare room offered indefinitely. Agree the terms out loud, early, while everyone is comfortable. It feels cold in the moment. It is the reason you are still speaking in five years.","ch":7},{"n":98,"quote":"Friendship is like money, easier made than kept.","bare":false,"attribution":"Samuel Butler","means":"Butler is being unsentimental on purpose. The making is the easy half and it is where all the attention goes. The keeping is unglamorous, repetitive and invisible. It is where friendships are won or lost.","use":"Audit the direction of effort. Take four friendships and ask who initiated the last three contacts. If it was always you, that is worth knowing without bitterness. If it was never you, that is worth knowing with some urgency. Neither answer requires a conversation. Both should change what you do next week.","ch":7},{"n":99,"quote":"Love is not love which alters when it alteration finds.","bare":false,"attribution":"William Shakespeare","means":"The test is not the good stretch. It is what happens when the other person changes: gets ill, gets difficult, loses the job, becomes less fun to be around for eighteen months. Love that only survives the pleasant version was attachment to the version, not the person.","use":"Look at who has stayed while you were at your worst. Then look at whether you have done the same for anyone. Both lists are short for everybody, and the second one is the one you have any say over.","ch":7},{"n":100,"quote":"Let there be spaces in your togetherness.","bare":false,"attribution":"Kahlil Gibran","means":"Written about marriage, and it applies to any close bond. Two people who do everything together stop having anything to bring back to each other, and the closeness starves on the thing that was meant to feed it.","use":"Keep something of your own. A friendship they are not part of, an evening that is yours, a thing you are learning badly. This is not distance and it is not a warning sign. It is what gives you something to say on Thursday that they have not already heard on Wednesday.","ch":7},{"n":101,"quote":"It is not a lack of love, but a lack of friendship that makes unhappy marriages.","bare":false,"attribution":"Friedrich Nietzsche","means":"Nietzsche is separating two things that get confused. Love is a feeling and it fluctuates for reasons neither party controls. Friendship is a practice: liking the person, being interested in their day, wanting their company when nothing is at stake. The second is what carries the years.","use":"Ask a plain question about your closest relationship. If you met them today, with nothing between you, would you want to be their friend? A yes means the foundation is there whatever the weather is doing. A no is worth sitting with, and it is not the same as not loving them.","ch":7},{"n":102,"quote":"Better is a dinner of herbs where love is, than a stalled ox and hatred therewith.","bare":false,"attribution":"Proverbs 15:17","means":"Vegetables in a warm house beat a feast in a cold one. The proposition is that the company sets the value of the occasion, and the catering is a rounding error, which everybody agrees with and almost nobody organises their life around.","use":"Lower the bar for having people over. The tidying, the cooking and the arrangements are the reason it has not happened since March. Feed them badly on a weeknight. Nobody has ever gone home disappointed by the food at a house where they felt welcome.","ch":7},{"n":103,"quote":"The comfort of having a friend may be taken away, but not that of having had one.","bare":false,"attribution":"Seneca","means":"Written to a man in grief. Seneca's argument is that the friendship is not retrospectively cancelled by its ending, and that mourning it as if the good years had been deleted is a second loss on top of the first.","use":"Applies to death and also to the ordinary drift. The friendship that quietly stopped in 2019 still happened. You were not wrong to have had it and it did not fail. Some are for a stretch of your life and not all of it, and treating those as failures makes people reluctant to start any.","ch":7},{"n":104,"quote":"There is no remedy for love but to love more.","bare":false,"attribution":"Henry David Thoreau","means":"There is no technique here and Thoreau is not offering one. The only response to caring about people, with all the exposure that involves, is more of it, because the alternative on offer is to care about nobody and that cure is worse than the disease.","use":"When you have been hurt by someone and the sensible conclusion seems to be to keep everyone further away, notice that the sensible conclusion has a cost that arrives later and lasts longer. Guarding works. That is the problem with it. Do the specific repair with the specific person. Do not lower the temperature on everybody.","ch":7},{"n":105,"quote":"There is a time to embrace, and a time to refrain from embracing.","bare":false,"attribution":"Ecclesiastes 3:5","means":"Even here there is a limit. Not every relationship is to be kept, and the effort of holding one up long after the other person stopped is not loyalty. It is habit wearing loyalty's coat.","use":"The exit for this chapter. You are allowed to let one go. The friend who only ever takes, the one you dread seeing, the one who has been unkind for years while you kept explaining it away: you can stop, and you do not owe anyone the confrontation. Reply more slowly. Do not organise the next thing. Most of these end the way they should, quietly, without either of you having to say the sentence out loud.","ch":7}]},{"n":8,"title":"Listening Properly","part":"Two","partRoman":"II","partName":"Other People","opening":"<p>Almost everyone believes they are a good listener. It sits alongside having a sense of humour in the small category of qualities nobody doubts about themselves. And yet every one of us can summon the exact feeling of not being listened to, which suggests the arithmetic does not work.</p><p>Here is what happens instead of listening. Someone begins talking. Within a sentence or two you have identified the category of thing being said, and your mind, satisfied that it knows where this is going, starts preparing: it locates a similar experience of your own, drafts an opening line, and from that point you are no longer receiving anything at all, only monitoring their speech for the gap you need.</p><p>The other failure is kinder and just as unwelcome. Someone describes a problem and you start solving it, in detail, at once, because you care and because solving is what you know how to do.</p><p>They did not want it solved. They wanted a witness.</p><p>The two needs look identical from outside and are nothing alike inside, and getting them the wrong way round accounts for a remarkable proportion of domestic friction in this country.</p><p>Real listening is quieter and more effortful than it looks. It means letting silences sit a beat longer than is comfortable. It means asking a second question after you already think you have the point. And it means tolerating the possibility that what you are about to hear will not fit the story you had already assembled about this person and their situation.</p><p>It is also, and people underestimate this badly, the most effective thing you can do to make somebody feel better. Not advice. Attention.</p>","entries":[{"n":106,"quote":"Give every man thy ear, but few thy voice.","bare":false,"attribution":"William Shakespeare","means":"Polonius is a windbag and the advice is still sound. Take in widely. Give out little. Most people run it the other way round, offering their opinion to everybody and their attention to almost nobody, then wonder why conversations feel thin.","use":"In your next group conversation, set a ratio and hold to it. Four things heard for every one contributed. You will notice how much of what you were going to say turned out to be unnecessary, and how much you had been missing while assembling it.","ch":8},{"n":107,"quote":"It is the province of knowledge to speak, and it is the privilege of wisdom to listen.","bare":false,"attribution":"Oliver Wendell Holmes","means":"Talking displays what you already have. Listening is the only mechanism by which you acquire anything new. Anyone who does all the talking in a room has spent an hour learning nothing.","use":"Notice who you are with when you talk most. It is the people you feel you have something to prove to, which is exactly backwards: you would impress them more, and understand them better, by asking two more questions than feels natural and then waiting.","ch":8},{"n":108,"quote":"He that answereth a matter before he heareth it, it is folly and shame unto him.","bare":false,"attribution":"Proverbs 18:13","means":"Answering early is not efficiency. It is guessing. You have responded to your prediction of what they were about to say, and the prediction was assembled out of your own assumptions rather than anything they told you.","use":"Someone starts explaining a problem and you think you have it by the third sentence: hold the answer. Ask them to keep going. Half the time the situation contains a detail that would have made your quick answer wrong, and mildly humiliating, in front of people.","ch":8},{"n":109,"quote":"The right word may be effective, but no word was ever as effective as a rightly timed pause.","bare":false,"attribution":"Mark Twain","means":"Silence does work that speech cannot. Leave a gap when somebody finishes and they will almost always keep going, and the second thing they say is more honest than the first.","use":"Count to three before responding. It feels like an age from inside and is invisible from outside. In a difficult conversation with a teenager, a colleague, or a friend who is holding something back, that one habit gets you more than any question you could have devised.","ch":8},{"n":110,"quote":"Silence is a true friend who never betrays.","bare":false,"attribution":"Confucius","means":"Nothing you do not say can be quoted back at you, misconstrued in the retelling, or produced at the wrong moment eighteen months later. Silence is the one reliable option in any conversation, and it is the option people reach for last.","use":"In anything charged, a family row, a meeting about redundancies, a dispute between friends where you are being invited to pick a side, default to saying less. You can always add something tomorrow. You can never remove something today.","ch":8},{"n":111,"quote":"The greatest gift you can give another is your undivided attention.","bare":false,"attribution":"traditional","means":"Undivided is the word carrying the sentence. Partial attention is not a smaller portion of the same gift. It is a different thing, and everybody feels the difference at once, even when they could not tell you what they felt.","use":"Put the phone in another room rather than face down on the table. Face down still says the call might matter more. This sounds trivial and it changes the quality of an evening more than anything you could think of to say during it.","ch":8},{"n":112,"quote":"You never really understand a person until you consider things from his point of view.","bare":false,"attribution":"Harper Lee","means":"Understanding is not agreement and it is not approval. It is the reconstruction of how the world looks from where somebody else is standing, which almost always makes behaviour that seemed baffling look, from the inside, reasonable.","use":"Take the person annoying you most this week and state their position so that they would endorse the wording. Not the caricature. The strongest version. You will find their behaviour makes sense given information or fears you had not accounted for, and now and then you will find you were the information they were frightened of.","ch":8},{"n":113,"quote":"He who does not know how to be silent does not know how to speak.","bare":false,"attribution":"Ausonius","means":"The two are a single skill. Knowing when to stop is what gives the things you do say their weight, and somebody who talks without pause has no way of signalling that any particular sentence matters more than the others.","use":"Watch what happens when the quiet one speaks in a meeting. The room turns. That is not their status; it is the scarcity. If you want your words to land, spend fewer of them and let the silences do some of the pointing.","ch":8},{"n":114,"quote":"A wise old owl sat on an oak; the more he saw the less he spoke; the less he spoke the more he heard.","bare":false,"attribution":"English nursery rhyme","means":"A children's rhyme describing a real feedback loop. Speaking less produces more information, which produces better judgement, which reduces the need to speak. It compounds, over years, in the people you think of as shrewd.","use":"For one week, in one setting, be the person who says least. A recurring meeting, Sunday lunch, the group chat. Notice what you learn about who wants what and who is deciding. It was always available and it was inaudible over your own voice.","ch":8},{"n":115,"quote":"Silence is one of the great arts of conversation.","bare":false,"attribution":"Cicero","means":"Silence described as a technique with a purpose, rather than a failure to contribute. Used well it invites, it emphasises, and it leaves the other person room to arrive somewhere they would never have reached under a steady stream of your commentary.","use":"If somebody is working through something out loud, resist filling the pauses with encouragement. \"Mm\" is enough. Every helpful interjection is a small interruption of a process that was going fine, and thinking aloud collapses the moment it starts being responded to.","ch":8},{"n":116,"quote":"Be kind, for everyone you meet is fighting a hard battle.","bare":false,"attribution":"attributed to Ian Maclaren","means":"What you can see is a fraction of what is going on. The curt reply, the missed deadline, the person who was short with you in the queue at the post office: all of it sitting on top of a situation you know nothing whatever about.","use":"When somebody behaves worse than you expected, run the charitable explanation first, even if you do not believe it. Not because they have earned it, but because it changes your response, and your response is the only part of the exchange you control. You will be right enough of the time to justify it.","ch":8},{"n":117,"quote":"From listening comes wisdom, and from speaking, repentance.","bare":false,"attribution":"Italian proverb","means":"Look at what you regret. It is almost never something you failed to say. The archive of things you wish you had kept to yourself is long and well catalogued; the archive of regretted silences is short.","use":"Use your own record. Before saying the risky thing, ask which list it is likely to join. You have decades of evidence about how this goes for you, and it is more reliable than whatever you are feeling at half past eleven at night.","ch":8},{"n":118,"quote":"The first duty of love is to listen.","bare":false,"attribution":"Paul Tillich","means":"Not to provide, protect or fix, useful as those all are. To listen, because it is the only one that requires setting your own perspective aside, and the only one that cannot be performed while thinking about something else.","use":"With the people closest to you, notice how much of the time you are half-listening because you already know what they are like. Familiarity is what erodes attention: you stop hearing them and start hearing your model of them, which was assembled years ago and has not been updated. Ask something you do not know the answer to.","ch":8},{"n":119,"quote":"Let thy speech be better than silence, or be silent.","bare":false,"attribution":"Dionysius the Elder","means":"A test with a high bar. Silence has a value of its own, so speech has to beat it rather than merely fill the space. Most conversational filler fails this and adds nothing but noise to a room that was fine before.","use":"Before speaking in a meeting, ask whether this improves on saying nothing. Agreement that three people have already expressed does not. Restating the problem does not. It is a demanding standard, it will cut what you say roughly in half, and nothing will be lost.","ch":8},{"n":120,"quote":"A friend to all is a friend to none.","bare":false,"attribution":"attributed to Aristotle","means":"Attention is finite. Spread it across everybody who wants some and each person receives a thin version, which is why the people who listen to everyone end up with nobody who knows them well.","use":"Here is your permission to stop. You do not owe deep listening to every person who wants an audience. If you are the one everybody comes to, you are allowed to say you have not got it in you today. Keep the real attention for the handful who would do the same for you.","ch":8}]},{"n":9,"title":"Saying the Hard Thing","part":"Two","partRoman":"II","partName":"Other People","opening":"<p>There is a conversation you are not having. Most people have at least one going at any time, and they can name it inside a second: the friend whose drinking has stopped being funny, the colleague who presents your work as theirs, the relative whose remarks at Christmas you have swallowed for eleven years, the flatmate and the washing-up.</p><p>You have not had it for good reasons. It will cause a scene. They will take it badly. It might not be that bad. You would rather not be the one who makes things awkward.</p><p>And underneath all of those, the real one: you are not certain enough of the relationship to test it.</p><p>The cost of not having it stays invisible, which is why the arrangement survives. Nothing bad happens today. What happens instead is slower and harder to notice: a small distance opens up, then a slightly larger one, and your affection for the person gives way to a careful management of them, until you are being pleasant to somebody you used to be close to. People rarely fall out over the hard conversation. They drift apart over the twenty they did not have.</p><p>Worth naming too: honesty has acquired a bad name because of people who use it as cover. &quot;I&#x27;m just being honest&quot; is the run-up to something cruel that the speaker wanted to say regardless.</p><p>That is not this. Saying a hard thing well takes preparation, warmth and a clear idea of what you want to change. It is more work than being blunt, not less.</p><p>So the aim is not to become somebody who says whatever they think. It is to become somebody who can say the necessary thing, once, cleanly, and then stop talking.</p>","entries":[{"n":121,"quote":"Speak the truth, but leave immediately after.","bare":false,"attribution":"Slovenian proverb","means":"Say the difficult thing and then get out of the way. Most of the damage in these conversations comes from what follows it: the elaboration, the justification, the second and third examples produced to prove you are being fair.","use":"Prepare one clear sentence. Say it. Stop. Let them respond. Do not fill the silence with softening or evidence, because every reinforcement makes the thing feel more like an ambush that was planned in advance, which, to be fair, it was.","ch":9},{"n":122,"quote":"Faithful are the wounds of a friend; but the kisses of an enemy are deceitful.","bare":false,"attribution":"Proverbs 27:6","means":"Anyone who tells you something you do not want to hear is taking a risk on your behalf. Anyone who agrees with everything you say may simply have decided you are not worth the trouble.","use":"When somebody tells you a hard truth, notice that your first instinct is to reassess them rather than the information. Sit with it for a day before responding. Then remember it when your turn comes: being the one who says it is a cost, not an indulgence.","ch":9},{"n":123,"quote":"Admonish your friends privately, but praise them openly.","bare":false,"attribution":"Publilius Syrus","means":"The setting changes the content. The same words spoken in front of other people become a performance and a humiliation, and the person spends everything they have defending their standing instead of considering what you said.","use":"Never give critical feedback with an audience, and that includes the audience of one sitting at the other end of the sofa. Then reverse it for praise. Say the good thing where other people can hear it, because the private version is worth about a tenth as much.","ch":9},{"n":124,"quote":"The truth is rarely pure and never simple.","bare":false,"attribution":"Oscar Wilde","means":"Most difficult conversations are not a clean matter of one party being right. Your account is partial, shaped by what you witnessed and what you already believed, and there exists a version of events in which you are the difficulty.","use":"Work out your own contribution before you raise anything. Say that part first, and mean it. Not as a technique for softening the blow, but because it is true, and because starting there produces a conversation rather than a verdict.","ch":9},{"n":125,"quote":"Silence gives consent.","bare":false,"attribution":"proverb","means":"Saying nothing is not neutral. Over time it reads as agreement, both to the person doing the thing and to everybody else in the room, and it gets harder every month to object to something you have watched in silence for two years.","use":"The first instance is the cheapest moment to speak. A light remark at the first dinner costs nothing; the identical remark at the fortieth is a confrontation about a decade of behaviour, and it will be received as one. If something has just started, say something while it is still small.","ch":9},{"n":126,"quote":"Better a friendly refusal than an unwilling promise.","bare":false,"attribution":"German proverb","means":"A clear no is kinder than a resentful yes. The reluctant yes costs you the task and costs them a version of your help that is worse than none at all, delivered late and with the irritation showing.","use":"Asked for something you do not want to do, say no in the moment rather than \"let me see\". The delay does not soften anything; it just extends their planning problem. \"I can't take that on\" is a complete answer and does not require a reason to follow it.","ch":9},{"n":127,"quote":"I am not bound to please thee with my answer.","bare":false,"attribution":"William Shakespeare","means":"You are not obliged to produce a response the other person will enjoy. Politeness governs how you say things. It does not oblige you to supply the answer somebody was hoping for.","use":"Feel yourself softening a no into a maybe, or an assessment into a compliment, and notice what you are managing: their feelings, or your own discomfort with their feelings. It is the second. You can be perfectly courteous and still say the thing they did not want.","ch":9},{"n":128,"quote":"Whoever is careless with the truth in small matters cannot be trusted with important matters.","bare":false,"attribution":"Albert Einstein","means":"Credibility is assembled out of small accuracies. The habit of shading things, always in the direction that makes life easier, gets noticed long before anybody mentions it, and it devalues everything else you say.","use":"Watch the tiny ones. The invented reason for being late. The enthusiasm for a plan you dislike. The \"no, it's fine\". Each is nothing on its own, and the aggregate is a reputation, and you will need people to believe you on the day something serious depends on it.","ch":9},{"n":129,"quote":"Ask yourself: is it true, is it necessary, is it kind?","bare":false,"attribution":"attributed to the Buddha","means":"Three filters, and most difficult things worth saying pass all three. The line gets used to justify silence, which misreads it. Necessary things are often unkind to hear and kind to say.","use":"Run the test in the hard direction too. If something is true and necessary and you are avoiding it because it is uncomfortable, the test says speak. Failing on \"kind\" means find a kinder way to say it. It does not mean swallow it for another year.","ch":9},{"n":130,"quote":"Speaking the truth in love.","bare":false,"attribution":"Ephesians 4:15","means":"Both halves carry weight. Truth without warmth is an attack; warmth without truth is flattery. The phrase describes the narrow thing that is actually useful, which is honesty delivered by somebody plainly on your side.","use":"Make the goodwill explicit instead of assuming it is understood. \"I'm telling you because I'd rather you heard it from me than from somebody who doesn't care.\" People can absorb a great deal of hard information when they are certain of the motive, and almost none when they are not.","ch":9},{"n":131,"quote":"A lie which is half a truth is ever the blackest of lies.","bare":false,"attribution":"Alfred, Lord Tennyson","means":"Accurate statements arranged to leave a false impression are worse than plain lies, because they arrive with deniability attached. You get the benefit of the deception and the defence of never having said anything untrue.","use":"After giving partial feedback or a partial explanation, ask what impression you left behind. If it is one you know to be wrong, and you are relying on the exact wording to protect you, you were not honest. Fix it while it is still a clarification rather than a discovery.","ch":9},{"n":132,"quote":"Praise loudly, blame softly.","bare":false,"attribution":"Russian proverb","means":"Volume should run opposite to severity. The heavier the criticism, the quieter and more private the delivery, because the content is already doing the work and added force only raises the defences.","use":"Say the serious thing more gently than the material warrants. Understatement is more devastating and better received than emphasis. If you have to raise your voice to make the point land, the point is not what is landing.","ch":9},{"n":133,"quote":"A refusal given quickly is a favour.","bare":false,"attribution":"Publilius Syrus","means":"People can plan around a no. What they cannot plan around is an ambiguous maybe they have to keep chasing, which occupies their attention for a fortnight and then delivers exactly the same answer.","use":"Answer the invitation, the request, the proposal within a day, and above all when the answer is no. The person waiting on you is holding a decision open on your account. Releasing them quickly is more generous than the drawn-out kindness you thought you were offering.","ch":9},{"n":134,"quote":"Say what you mean and mean what you say.","bare":false,"attribution":"traditional","means":"Two separate demands. The first is about clarity: no hints, no hoping they will infer it. The second is about consistency: what you said still stands after the conversation ends, including on the days when standing by it is inconvenient.","use":"Notice when you are hinting. \"It'd be nice if the kitchen got sorted at some point\" is not a request. It is a complaint wearing the costume of one, and the kitchen will still be like that on Friday. Ask for what you want, with a day attached to it.","ch":9},{"n":135,"quote":"All truths are not to be told.","bare":false,"attribution":"English proverb","means":"Not everything true is yours to say or worth the damage it does. Some observations serve nobody but the person making them, and \"I felt they ought to know\" is sometimes a cover for wanting to be the one who told them.","use":"Everything in this chapter stops here. Before raising it, ask what changes if you do. If the answer is nothing, because the thing is unalterable, long past, or purely a matter of your taste, you are allowed to leave it. Restraint is not cowardice, and you are the only one who can tell which you are exercising.","ch":9}]},{"n":10,"title":"When Someone Wrongs You","part":"Two","partRoman":"II","partName":"Other People","opening":"<p>Somebody has done something to you. Last month, or twenty years ago and you are still carrying it: the betrayal at work, the money that never came back, the friend who said the unforgivable thing at exactly the moment you were least able to hear it, the parent who was not what a parent is meant to be.</p><p>The injury is real. You are not exaggerating. And the standard advice on the subject has been close to useless.</p><p>It arrives in two flavours. One says you must forgive, ideally soon, because bitterness will poison you. Delivered by somebody who has not been through it, this sounds like a request to do the wrongdoer a favour on top of everything else. The other says stand up for yourself, get even, refuse to be a doormat. That one is more satisfying and it costs more than it returns.</p><p>What appears to be true is narrower. Carrying a grievance is expensive, and the whole of the expense is paid by you, in attention, in evenings, in the small souring of things that have nothing to do with it. Putting it down is worth doing for that reason and no nobler one. It is not a gift to them. It is housekeeping.</p><p>And putting it down does not require forgiving, forgetting, reconciling, or ever speaking to them again. Those are separate decisions, and they get bundled together so often that people stay angry for years rather than accept a package they never wanted. You can decide the matter is finished while still believing they were wholly in the wrong, still declining to have them in your house, and still telling the truth about what happened if anybody asks you.</p><p>The aim of this chapter is to get the cost off you. What happens to them is a different question, and not usually yours to decide.</p>","entries":[{"n":136,"quote":"To err is human; to forgive, divine.","bare":false,"attribution":"Alexander Pope","means":"Getting things wrong is the ordinary condition, yours included. Forgiveness is named as the harder and rarer act precisely because it does not come easily, and nobody should pretend that failing at it makes you defective.","use":"Start with the first half rather than the second. Before deciding what somebody's behaviour reveals about their character, ask whether you have ever done something of roughly that shape. Often you have, in a smaller way, and it changes the size of the thing without excusing it.","ch":10},{"n":137,"quote":"In taking revenge, a man is but even with his enemy; but in passing it over, he is superior.","bare":false,"attribution":"Francis Bacon","means":"Revenge at its very best restores parity. You have spent effort, time and a portion of your character to arrive back where you started, and the scoreboard reads nil-nil. Letting it go costs nothing further and leaves you ahead.","use":"Drafting the devastating reply, or planning the manoeuvre that will embarrass them, work out what you are actually left holding if it succeeds. Brief satisfaction. A permanent enemy. A story you cannot tell well at dinner. Then price the alternative, which is your Tuesday evening back.","ch":10},{"n":138,"quote":"Never ascribe to malice that which is adequately explained by stupidity.","bare":false,"attribution":"Hanlon's razor","means":"Most harm is not aimed. People are thoughtless, overloaded, badly informed and preoccupied with themselves, and the slight you were certain was aimed was somebody not thinking about you at all.","use":"Build the boring explanation before you decide you were targeted. They forgot. They did not know. They were dealing with something at home. If the boring version fits the facts, act on that one, because a relationship recovers from thoughtlessness and rarely from an accusation of malice.","ch":10},{"n":139,"quote":"The best revenge is to be unlike him who performed the injury.","bare":false,"attribution":"Marcus Aurelius","means":"The most durable damage anybody can do to you is to turn you into a version of themselves: suspicious, cold, ready to strike first. Staying yourself is the one outcome they cannot take.","use":"After being treated badly, watch the new habits arriving. Are you now the person who checks up, keeps a record of slights, assumes the worst as a matter of policy? Some of that is sensible caution. Watch for where it stops being about them and becomes how you treat everybody.","ch":10},{"n":140,"quote":"Revenge is a dish best served cold.","bare":false,"attribution":"proverb","means":"Usually quoted as a threat. Read it as a delay instruction instead, because the waiting period that is meant to make revenge more effective dissolves the appetite for it.","use":"Do nothing for a month, deliberately, telling yourself you are only postponing. Then revisit. The urgent need to act will have gone, and what remains is a much clearer view of whether anything needs doing at all.","ch":10},{"n":141,"quote":"He who cannot forgive others breaks the bridge over which he himself must pass.","bare":false,"attribution":"George Herbert","means":"You will need this eventually. Everybody does something that requires another person's tolerance, and the standard you enforce on others is the one waiting for you when your turn comes to be in the wrong.","use":"Deciding whether something is unforgivable, imagine having done it yourself, in circumstances where it made sense at the time. Not everything survives that test. Plenty does, and the ones that survive it are the ones to put down first.","ch":10},{"n":142,"quote":"Before you embark on a journey of revenge, dig two graves.","bare":false,"attribution":"attributed to Confucius","means":"The pursuit consumes the pursuer. A sustained campaign against a person becomes a full-time occupation that eats years, relationships and peace, and the destination is always worth less than a single day of getting there cost.","use":"Count the hours. If you are in a long dispute, a legal fight, a family feud, a running argument with a utility company, add up what it has taken so far. Sometimes the fight is still right. Make that decision knowing the price, rather than discovering it in year three.","ch":10},{"n":143,"quote":"Forgive us our trespasses, as we forgive them that trespass against us.","bare":false,"attribution":"Matthew 6:12","means":"The clause is conditional and deliberately uncomfortable. It asks to be judged by your own standard, on the reasonable grounds that somebody who requires mercy and will not extend it has not understood what they are asking for.","use":"Think of the last time you needed somebody to overlook something you did. Remember what being forgiven was like, and what it would have been like not to be. That memory argues more effectively than any assessment of the current case.","ch":10},{"n":144,"quote":"An eye for an eye only ends up making the whole world blind.","bare":false,"attribution":"attributed to Mahatma Gandhi","means":"Proportionate retaliation sounds fair and never stops. Each side's response is justified by the last one, the exchange has no natural end, and everybody involved finishes worse off than if the first injury had been absorbed and left there.","use":"Look at any long feud near you: family, neighbours, ex-partners with children between them. Notice that nobody can say who started it and everybody is certain they are responding. Somebody has to absorb one round without returning it. That is not weakness. It is the only exit anyone has found.","ch":10},{"n":145,"quote":"A wise man gets more use from his enemies than a fool from his friends.","bare":false,"attribution":"Baltasar Gracián","means":"Enemies pay you a strange compliment. They study you hard and tell the truth about your weaknesses, which friends will not do. The criticism comes wrapped in malice and it can still be accurate.","use":"After an unfair attack, wait a week, then go through it for the two per cent that lands. Discard the rest. You have been given free, unflinching information about a flaw that everybody who likes you has been too polite to mention for years.","ch":10},{"n":146,"quote":"Time heals what reason cannot.","bare":false,"attribution":"Seneca","means":"You cannot argue yourself out of a wound on schedule. Understanding why it happened, deciding it does not matter, resolving to move on: none of these work directly. What works is duration, and there is no substitute available at any price.","use":"Stop treating your continuing distress as a failure of effort. Still stinging after six months is normal, and it is not evidence that you handled it badly. Do the ordinary things, keep the person at whatever distance you need, and let the calendar do the part your reasoning cannot.","ch":10},{"n":147,"quote":"Injuries may be forgiven, but not forgotten.","bare":false,"attribution":"Aesop","means":"Forgiveness and amnesia are different things, and confusing the two is what keeps people stuck. You can release the grievance and retain the entirely sensible knowledge of what this person turned out to be capable of.","use":"If somebody insists you have forgiven them but keeps raising it because your behaviour has changed, you can say honestly: I am not angry, and I am not going to pretend it did not happen. Remembering is not punishment. It is an accurate record, and you are allowed one.","ch":10},{"n":148,"quote":"Living well is the best revenge.","bare":false,"attribution":"George Herbert","means":"The most effective response is not aimed at them at all. It is the reallocation of everything you would have spent on the grievance into a life that is plainly fine without them anywhere near it.","use":"Take the energy currently going into the imagined confrontation and put it somewhere that shows: fitness, work, people you like. This is not performed for their benefit, which is why it works. The version done for their benefit is still a relationship with them.","ch":10},{"n":149,"quote":"Forgiveness does not change the past, but it does enlarge the future.","bare":false,"attribution":"Paul Boese","means":"Nothing available to you affects what happened. The only variable left is how much of what remains the past gets to occupy, and holding the grievance is the mechanism by which it keeps claiming more.","use":"Ask what the next five years look like with this still in them, and what they look like without. If the second is better, that is your reason, and it has nothing to do with what the other person deserves or whether they ever apologise.","ch":10},{"n":150,"quote":"Trust, but verify.","bare":false,"attribution":"Russian proverb","means":"Letting something go does not oblige you to restore the arrangement that allowed it to happen. You can be entirely at peace with somebody and still not lend them money, still weigh your words, still decline to leave them alone with your affairs.","use":"Here is the part most versions of this advice leave out. If everything above feels like pressure to reconcile, ignore it. Putting the anger down and keeping your distance are compatible, and for some people that combination is the only sane one. You owe them the absence of malice. You do not owe them access.","ch":10}]},{"n":11,"title":"Persuading Without Pushing","part":"Two","partRoman":"II","partName":"Other People","opening":"<p>You have said it three times now. Slower each time. A little more evidence each time. And each time, the person across the table has become fractionally more certain they were right to begin with.</p><p>This is the standard method and it fails on almost everybody. We assume that disagreement is a shortage of information, so we supply more of it, louder, on the theory that the first delivery must have gone astray. It didn&#x27;t. They heard you. They simply arrived at a different answer, and the volume is now doing something you didn&#x27;t intend: it is telling them they are being handled.</p><p>That&#x27;s the moment the shutter comes down. Nobody announces it. There is no visible change beyond a slight stillness in the face, and from then on every word you produce lands against a wall that you built yourself, brick by brick, out of your own reasonable and well-organised evidence.</p><p>What actually moves people is duller than winning. It is changing the conditions around a position rather than attacking the position itself: removing what makes agreement expensive, giving them room to move without looking like they lost, and then having the patience to let them get there in their own time and call it their own idea.</p><p>It costs you the good bit. You don&#x27;t get the moment where they concede and everyone sees it. You get the outcome instead, sometimes weeks later, usually presented back to you as something they thought of.</p><p>Take the outcome.</p>","entries":[{"n":151,"quote":"The North Wind and the Sun","bare":true,"attribution":"Aesop","means":"The wind and the sun compete to remove a traveller's cloak. The wind blows harder and harder, and the man grips it tighter. Then the sun comes out. He takes it off himself. Force creates resistance; warmth creates willingness.","use":"Watch for repetition in your own voice. If you are saying the same sentence with more force than you used ten minutes ago, you have become the wind. Stop. Change the temperature rather than the volume, and see what happens to the grip.","ch":11},{"n":152,"quote":"It is difficult to get a man to understand something when his salary depends upon his not understanding it.","bare":false,"attribution":"Upton Sinclair","means":"People are not only working out what is true. Underneath, quietly, they are working out what is safe to believe. If your point costs someone their job, their standing, or their picture of themselves, evidence will not reach them, because evidence was never what was holding the position up.","use":"Before you make the case, price it from their side. If agreeing means admitting to a room full of colleagues that they got it wrong for two years, no argument you construct will be worth that. Build them a door. Something like \"the situation has changed\" costs them nothing and gets you the same result.","ch":11},{"n":153,"quote":"Never interrupt your enemy when he is making a mistake.","bare":false,"attribution":"attributed to Napoleon Bonaparte","means":"Spotting an error produces an almost physical urge to name it. Resist. Naming it hands the other person a correction they would otherwise have had to make themselves, and it converts a private mistake into a public event, which is the one form guaranteed to be defended.","use":"Someone is talking themselves into a hole in a meeting. Let them. Half the time they find the hole unaided, which is worth ten of you finding it for them. Save your interruptions for the ones where speaking changes the outcome rather than the scoreline.","ch":11},{"n":154,"quote":"We have two ears and one mouth, so that we may listen twice as much as we speak.","bare":false,"attribution":"attributed to Epictetus","means":"Arithmetic as a rule of life. Most people in most conversations are not listening. They are queuing, assembling their reply while the other person's mouth is still moving, waiting for the gap.","use":"Set a condition for your next difficult conversation: you may not state your position until you can summarise theirs well enough that they would say \"yes, that's it.\" It takes longer than you want. You will also discover that the disagreement is smaller than you thought, and frequently somewhere else entirely.","ch":11},{"n":155,"quote":"The best way to convince a fool he is wrong is to let him have his own way.","bare":false,"attribution":"Josh Billings","means":"Some arguments cannot be won with words, because the other person has not yet met the consequences. Experience teaches what explanation cannot, and it teaches faster.","use":"Keep this for small stakes. Your colleague wants a spreadsheet format that will fall apart by March, and the cost of it falling apart is one wasted afternoon? Let it fall apart. If the cost is the company, keep arguing. The skill is telling those two apart honestly, rather than reaching for this line whenever you are tired of trying.","ch":11},{"n":156,"quote":"A man convinced against his will is of the same opinion still.","bare":false,"attribution":"English proverb","means":"You can force the words out of someone and change nothing underneath. They nod. They stop objecting. They go on believing exactly what they believed before, with a fresh layer of resentment on top, and now you have both the original problem and a new one.","use":"Be suspicious of agreement that arrives too fast, particularly from someone with less power than you. \"Yeah, fine, you're right\" from an employee or a fifteen-year-old means the conversation has ended. It does not mean the disagreement has. Ask them what they still think, and mean it.","ch":11},{"n":157,"quote":"Seek first to understand, then to be understood.","bare":false,"attribution":"Stephen Covey","means":"Understanding is not a courtesy you perform before getting to your real point. It is the thing that makes the point possible, because until you know what someone believes, you are arguing with a version of them you invented, and winning against that version achieves nothing.","use":"Catch yourself responding to a caricature. The tell is the phrase \"so what you're saying is,\" followed by something they would never say. Ask instead. You will be wrong about their actual position more often than is comfortable.","ch":11},{"n":158,"quote":"If you want to build a ship, don't drum up men to gather wood — teach them to long for the sea.","bare":false,"attribution":"Antoine de Saint-Exupéry","means":"Instructions produce compliance. Wanting produces initiative. If people do the task only because you assigned it, you have signed up to assign every task, forever, including the ones you have not thought of yet.","use":"Spend a minute on why before you spend ten on how. Not a speech. The actual reason it matters and what it feeds into. People who understand the point will solve problems you never anticipated; people following instructions bring those problems back to your desk.","ch":11},{"n":159,"quote":"Speak softly and carry a big stick.","bare":false,"attribution":"Theodore Roosevelt","means":"Real leverage does not need announcing. Anyone who has to keep reminding you of their power is telling you how little of it they have. Quiet strength leaves the other side somewhere to go.","use":"Negotiating a salary, a rent increase, a builder's quote: say your position once, calmly, then stop talking. Do not threaten. Do not justify it three times over. The silence after a clear position does more work than any pressure you could apply, and most people cannot sit in it.","ch":11},{"n":160,"quote":"You can lead a horse to water, but you cannot make it drink.","bare":false,"attribution":"English proverb","means":"Your responsibility has an edge to it. You can supply the information, the opportunity and the encouragement. You cannot supply the wanting. Nobody can.","use":"This is the release valve for everything above. When you have done the persuading well and the person still will not move, your part is finished. Carrying on is not persuasion any more. It is nagging, and it costs you the relationship while changing nothing at all.","ch":11},{"n":161,"quote":"Men must be taught as if you taught them not, and things unknown proposed as things forgot.","bare":false,"attribution":"Alexander Pope","means":"Nobody enjoys being corrected. Most people are perfectly happy to be reminded, because a reminder implies they already knew, which lets them change position and keep their dignity in the same movement.","use":"Swap \"actually, that's wrong\" for \"didn't we find last time that...\". Same correction. The second version lets them arrive at it alongside you instead of receiving it from you. The information lands identically. The resistance does not.","ch":11},{"n":162,"quote":"When the hill will not come to Mahomet, Mahomet will go to the hill.","bare":false,"attribution":"Francis Bacon","means":"Bacon wrote it about people who bluff when reality declines to cooperate, but the plain reading is the useful one. If the obstacle will not move, you move. Adaptation is not defeat.","use":"You have tried the same approach with the same person for eight months. Stop asking why they will not change. Ask what you could change instead: the time of day, the setting, the person doing the asking, whether it happens over a desk or on a walk. Often the argument was fine all along and only the conditions were wrong.","ch":11},{"n":163,"quote":"Nothing is so contagious as enthusiasm.","bare":false,"attribution":"Samuel Taylor Coleridge","means":"Feeling travels between people faster than reasoning does, and it arrives first. Your mood in a conversation is itself an argument, and generally a stronger one than the case you prepared.","use":"Check your own state before a conversation you care about. Arrive tired and irritable and that is what the other person catches, whatever your words are doing. A quarter of an hour spent arriving in a better state beats an hour spent sharpening your points.","ch":11},{"n":164,"quote":"It is better to be defeated on principle than to win on lies.","bare":false,"attribution":"Arthur Calwell","means":"There is always a shortcut on the table: the statistic stretched a little, the emotional pressure, the argument you know is weak but that will land anyway. Winning that way spends something you cannot buy back.","use":"Notice the moment you reach for something you do not quite believe because it will work. That is the moment. Declining it may lose you this particular exchange. It is also the reason people believe you the next twenty times, which is worth more than any single argument.","ch":11},{"n":165,"quote":"Judge a man by his questions rather than his answers.","bare":false,"attribution":"attributed to Voltaire","means":"What someone asks shows what they are trying to find out, and whether they are trying to find anything out at all. A question built to trap is not a question. It is a statement wearing a question mark.","use":"Turn it on yourself mid-argument. Are these real questions, or are you laying traps? If you already know the answer you want, you are not asking. You are prosecuting. People can always tell, and the conversation ends there whether or not they say so.","ch":11}]},{"n":12,"title":"Being Wrong in Public","part":"Two","partRoman":"II","partName":"Other People","opening":"<p>You realise, halfway through defending your position, that you are wrong. Everyone is looking at you.</p><p>There is a version of the next thirty seconds in which you say so. There is another in which you find a technicality, restate the point with more confidence than you felt a minute ago, and move the conversation along before anybody can press.</p><p>Most people take the second one, at least sometimes, and it works. That is the trouble. The cover-up succeeds in the moment, which is why we keep doing it, and the costs turn up years later attached to nothing in particular.</p><p>What is happening is that being wrong registers as a threat to your standing rather than an error of fact, and the body responds accordingly: heat in the face, a defensive tightening, an urgent need to produce a sentence. That response was built for a world in which losing face in front of your group had consequences you might not survive, and it now fires over a misremembered statistic in a meeting of eleven people, most of whom will have forgotten it by lunch.</p><p>The counter-intuitive part is reliable enough to bet on. Conceding on the spot costs far less than anyone expects. Say &quot;you&#x27;re right, I had that wrong&quot; and the room does not think less of you. It thinks you are secure enough not to need the point. The person who never concedes anything is the one being discounted, and nobody ever tells them, which is why they never find out.</p><p>There is a limit, and it matters. Admitting error should be proportionate. The person who apologises for everything, at length, is doing something else, and it is not humility.</p><p>One clean correction beats a page of self-criticism.</p>","entries":[{"n":166,"quote":"A man should never be ashamed to own he has been in the wrong, which is but saying that he is wiser today than he was yesterday.","bare":false,"attribution":"Alexander Pope","means":"A neat reframing of what a correction announces. You are not confessing a defect. You are reporting an improvement. The only alternative on offer is being just as wrong tomorrow as you were yesterday, in front of the same people.","use":"Say it in those words: \"I've changed my mind on this since last week.\" It sounds different from an admission of error, describes exactly the same event, and after a few outings you will notice how little resistance there is to changing your position out loud.","ch":12},{"n":167,"quote":"The first principle is that you must not fool yourself, and you are the easiest person to fool.","bare":false,"attribution":"Richard Feynman","means":"External correction is the easy half. The hard half is catching your own errors before anybody else does, at the point where there is no pressure to look and every incentive to leave it alone.","use":"Before defending a position you are attached to, ask what evidence would change your mind. If you cannot name any, you do not have a position. You have a loyalty. That question, asked honestly and in private, catches more mistakes than any amount of external scrutiny.","ch":12},{"n":168,"quote":"A man who has committed a mistake and doesn't correct it is committing another mistake.","bare":false,"attribution":"Confucius","means":"The original error is finished and mostly forgivable. What comes next is a fresh choice, made deliberately, with full information, and it is the one people actually judge you for.","use":"Spot an old mistake still standing, the wrong figure in a document that has been circulating for a month, the thing you told somebody that turned out not to be true, and correct it now, even though the moment has passed. A late correction is awkward. Being found out is worse.","ch":12},{"n":169,"quote":"The fool doth think he is wise, but the wise man knows himself to be a fool.","bare":false,"attribution":"William Shakespeare","means":"Confidence and competence are loosely related at best, and run in opposite directions more often than anyone admits. The people most certain about a subject are the ones who have not yet discovered how much of it there is.","use":"Treat your own certainty as a piece of data rather than a conclusion. Feeling entirely sure about something outside your expertise is the moment to check, not the moment to speak. Real knowledge tends to arrive with qualifications already attached.","ch":12},{"n":170,"quote":"The greatest deception men suffer is from their own opinions.","bare":false,"attribution":"Leonardo da Vinci","means":"Once you hold a view it stops being a view and becomes the lens. Evidence in its favour registers as significant, evidence against it registers as noise, or exceptions, or the other side being unreasonable again.","use":"Once a year, read the strongest case against something you believe. Not the weak version by somebody easy to dismiss. The best one you can find, argued by someone who means it. You will usually keep your position, and you will hold it differently, with the objections inside it rather than outside.","ch":12},{"n":171,"quote":"Experience is simply the name we give our mistakes.","bare":false,"attribution":"Oscar Wilde","means":"The valuable thing people call experience is largely a record of errors already made and not repeated. There is no route to it that skips the errors, which means anybody with no visible mistakes has attempted very little.","use":"When interviewing, dating, or working out whether to trust somebody's judgement, ask what they have got wrong and what they learned. The ones who can answer specifically have been paying attention. A flawless account is a warning rather than a recommendation.","ch":12},{"n":172,"quote":"It is the mark of an educated mind to be able to entertain a thought without accepting it.","bare":false,"attribution":"after Aristotle","means":"You can pick an idea up, examine it, follow where it leads, and put it down again without ever committing to it. A great many people cannot do this. Considering an idea feels, to them, like endorsing it, so they refuse at the door.","use":"In a disagreement, try \"suppose you're right, what would follow?\" and then work it through properly. You are not conceding. You are testing. It is the fastest way to find either the flaw in their case or the flaw in yours, and both are the same useful outcome.","ch":12},{"n":173,"quote":"He who knows only his own side of the case knows little of that.","bare":false,"attribution":"John Stuart Mill","means":"You do not understand your own position until you can see what it is competing with. Somebody who has only ever heard the argument they agree with knows that it is right without knowing why, which is a weaker holding than it feels.","use":"Before arguing for something, state the opposing case well enough that a person holding it would nod along. If you cannot, you are not ready. It takes ten minutes and prevents most of the occasions on which people defend things they never examined.","ch":12},{"n":174,"quote":"Convictions are more dangerous enemies of truth than lies.","bare":false,"attribution":"Friedrich Nietzsche","means":"A lie can be checked and dropped. A conviction is defended by your identity, your sunk costs and everybody who has heard you express it, which makes it far harder to abandon even after the evidence has turned.","use":"Watch the beliefs you have stated publicly and repeatedly. Those are where your reasoning is least trustworthy, because giving them up now costs you consistency in front of people who remember. Check those first, and announce fewer views before you are settled on them.","ch":12},{"n":175,"quote":"Every man is a fool for at least five minutes a day; wisdom consists in not exceeding the limit.","bare":false,"attribution":"Elbert Hubbard","means":"Being wrong is scheduled, ordinary, unavoidable. The skill is not avoidance but brevity: notice early and stop, rather than defending the position into its second hour with reinforcements.","use":"Set yourself a limit for how long you will defend anything under pressure. Still arguing after ten minutes without a new point? You are not persuading. You are committed. Say you will think about it and leave, which is what the five minutes ending on time looks like.","ch":12},{"n":176,"quote":"I may be wrong and you may be right, and by an effort we may get nearer the truth.","bare":false,"attribution":"Karl Popper","means":"The best opening position available for a disagreement. It concedes nothing, and it removes the assumption held by both parties in most arguments, which is that one of them already has the answer and the job is transmission.","use":"Say a version of it out loud at the start. It looks formal written down and it works, because it converts the activity from a contest into a shared problem, and people argue very differently once that has been established in the first minute.","ch":12},{"n":177,"quote":"Man prefers to believe what he prefers to be true.","bare":false,"attribution":"Francis Bacon","means":"Wanting something to be so exerts a steady, invisible pressure on your assessment of whether it is. This is not a failure of intelligence. Clever people build better justifications for the conclusion they wanted at the outset.","use":"When you reach a conclusion, ask whether it happens to be the convenient one. If your careful analysis of the housing market has concluded that you should buy the house you already love, apply extra scrutiny. Not because you are wrong. Because you had a thumb on the scale.","ch":12},{"n":178,"quote":"Confess your faults one to another.","bare":false,"attribution":"James 5:16","means":"An error admitted aloud loses most of its power. Concealed, it grows, needs maintenance, and separates you from people. Said plainly to another person, it turns out to be roughly the size it always was.","use":"Got something wrong that is bothering you? Tell one person before you tell anybody else. Not for absolution. Just to hear yourself say it. Things sound enormous inside your head and ordinary in somebody's kitchen, and you will handle the public version far better for having done the private one first.","ch":12},{"n":179,"quote":"Doubt is not a pleasant condition, but certainty is absurd.","bare":false,"attribution":"Voltaire","means":"Uncertainty is uncomfortable and it is also the accurate state for most questions worth discussing. Certainty is more comfortable, and it is a claim about how you feel rather than about the evidence in front of you.","use":"Get used to \"I think\", \"probably\", \"as far as I know\". It sounds weaker and it is more accurate, and it means that on the day you say you are sure, people hear the difference. Ration certainty and it keeps its value.","ch":12},{"n":180,"quote":"Never make a defence or apology before you be accused.","bare":false,"attribution":"Charles I","means":"Pre-emptive apologising is a problem of its own. Explaining faults nobody had noticed, opening with a disclaimer, apologising for taking up time: each one points at a weakness the room had not identified, then asks the room to reassure you about it.","use":"Some readers need the reverse of this chapter. If you are somebody who apologises for everything, none of the above is for you. Your work is the opposite: say the thing without the preamble, let the small errors go by unmentioned, and save the apology for when you have actually done something.","ch":12}]},{"n":13,"title":"Being Alone","part":"Two","partRoman":"II","partName":"Other People","opening":"<p>There is a particular quality to a Sunday afternoon with nothing in it and nobody due. For some people that is the best hour of the week. For others it is the worst, and the difference between them has almost nothing to do with how much company they have and almost everything to do with whether the empty hour was chosen.</p><p>English is careless here. It has one word, alone, doing two opposite jobs. There is the alone you booked, which is quiet and restorative and ends when you want it to. And there is the alone that was done to you, by a move, a bereavement, a marriage ending, a city where you know eleven people and like two. The room looks identical from outside. Inside, they are opposite experiences, and telling a lonely person to enjoy their solitude is like telling somebody drowning to enjoy the swim.</p><p>So this chapter closes the section on other people with the subject of their absence, and it tries to hold both halves at once: that time alone is a skill worth having, and that loneliness is a real injury and not a failure of attitude.</p><p>The skill part is learnable, and it is being lost. Not because people are weaker than they were, but because it now takes deliberate effort to be alone at all. There is a device within reach that will end the aloneness in under two seconds, at any hour, and it is hard to build a tolerance for something you have never had to sit in for longer than a bus stop.</p><p>The injury part does not respond to reframing. It responds to people, and the way back to people is admitting the thing out loud to one of them, which is the hardest sentence in this book to say.</p>","entries":[{"n":181,"quote":"All of humanity's problems stem from man's inability to sit quietly in a room alone.","bare":false,"attribution":"Blaise Pascal","means":"Pascal thought most of what we do is avoidance. The busyness, the noise, the constant small errands: not pursuit of anything, but flight from a room with nothing in it. He was writing before electricity. He would have found the modern version unsurprising.","use":"Try it once, literally. Twenty minutes, no phone, no book, no music, no plan. Most people find it uncomfortable inside four minutes, which is the finding. You are not bad at relaxing. You have never practised being unaccompanied, and the discomfort is the sensation of a skill you do not have yet.","ch":13},{"n":182,"quote":"The greatest thing in the world is to know how to belong to oneself.","bare":false,"attribution":"Michel de Montaigne","means":"Montaigne means being a full person when unobserved. Not performing, not narrating, not composing the account you will give of the day. Just being there, with your own company, and finding it adequate.","use":"Notice how much of what you do is aimed at an audience, including the imaginary one. The photograph of the meal nobody asked for. The walk you would not have taken if it could not be mentioned. Try one thing this week that nobody will ever hear about.
