The discomfort of that tells you how much of you currently belongs to other people.","ch":13},{"n":183,"quote":"A wise man is never less alone than when he is alone.","bare":false,"attribution":"Cicero","means":"The claim is that solitude has contents. There is a difference between an empty room and an empty hour, and the person who has read, thought and paid attention arrives in the empty hour with company already installed.","use":"Build the furniture before you need it. The people who cope best with an unexpected quiet weekend are the ones with an interest they can enter alone: an instrument, a garden, a subject, a craft. Start one badly, now, while you are not lonely. It is much harder to acquire while you are.","ch":13},{"n":184,"quote":"Conversation enriches the understanding, but solitude is the school of genius.","bare":false,"attribution":"Edward Gibbon","means":"Two different faculties, and they run on different fuel. Talking gets you information, correction and the argument you had not thought of. Making anything requires long unbroken stretches in which nobody says anything to you at all.","use":"Look at where your good ideas arrive. The shower, the walk, the drive, the hour before anyone else is up. Not the meeting. If your week has no unbroken solitary stretch in it, you have removed the conditions for the thing you are being paid to produce, and no amount of collaboration will replace it.","ch":13},{"n":185,"quote":"Be able to be alone. Lose not the advantage of solitude.","bare":false,"attribution":"Sir Thomas Browne","means":"Note that Browne frames it as an ability, not a preference. Something you can be capable of or not, like swimming, and something that can be lost through disuse.","use":"Practise in small doses while it costs you nothing. Eat one meal a week by yourself without a screen. Go to the cinema alone. The first time is strange and the third is unremarkable, and what you are building is not a taste for solitude but an immunity to panic in it, which will matter enormously at some point you cannot currently see coming.","ch":13},{"n":186,"quote":"I never found the companion that was so companionable as solitude.","bare":false,"attribution":"Henry David Thoreau","means":"The strongest possible version of the case, from a man who overstated it and knew he was overstating it. Worth reading as a corrective and not a description, because Thoreau walked into town for dinner more often than the legend allows.","use":"Take the exaggeration as permission, not instruction. You are allowed to prefer your own company on a given evening. Cancelling because you would rather be alone is a legitimate reason and does not need to be dressed up as illness. Say you are not up to it tonight. Most people will be relieved.","ch":13},{"n":187,"quote":"Whosoever is delighted in solitude is either a wild beast or a god.","bare":false,"attribution":"Aristotle","means":"The other side, put with force. Aristotle thought humans were social by construction, and that anyone who needed nobody at all was either less than human or more than human, with the odds heavily favouring the first.","use":"Use it as a check on the story you tell about yourself. I am just not a people person is sometimes true and is more often a description of a wound. If you have found reasons to decline every invitation for six months, the reasons are probably good and the pattern is worth looking at anyway.","ch":13},{"n":188,"quote":"Solitude is fine, but you need someone to tell you that solitude is fine.","bare":false,"attribution":"Honoré de Balzac","means":"The joke is a serious one. Even the pleasure of being alone seems to require a witness, which suggests the need for other people goes deeper than company and reaches into how we know anything about our own experience.","use":"When a stretch alone starts to sour, do not solve it with more solitude. One conversation, however slight, resets the whole thing. The shop, the neighbour, the phone call to your mother. Loneliness is unusual among bad states: a small dose of the remedy works, and a large dose is not required.","ch":13},{"n":189,"quote":"In solitude, where we are least alone.","bare":false,"attribution":"Lord Byron","means":"Byron is claiming that the private hours are when you are most in your own company, and therefore least abandoned. It is a young man's line and it is beautiful and it is only true for people who like themselves that week.","use":"Test it honestly. Some weeks your own company is good company and solitude is a resource. Other weeks the interior is unkind and being alone with it is the worst available option. Learn which week you are in before you decide whether to accept the invitation, and stop applying a single policy to both.","ch":13},{"n":190,"quote":"The strongest man in the world is he who stands most alone.","bare":false,"attribution":"Henrik Ibsen","means":"The line closes a play about a man ruined for being right in public. It is about the specific solitude of holding a position nobody around you shares, which is different from having no friends, and considerably harder.","use":"Distinguish between being alone and being isolated. You can have a full social life and still be alone in what you think about the thing that matters most to you. If that is your situation, find one person who shares it, anywhere, by any means. One is enough to make a position survivable. Nought is not.","ch":13},{"n":191,"quote":"It is not good that the man should be alone.","bare":false,"attribution":"Genesis 2:18","means":"Placed at the beginning, before anything has gone wrong, which is the point. Aloneness is not framed as a consequence of some failure. It is a defect in the original design, identified and fixed on the spot.","use":"Take the pressure off yourself. If you are lonely, nothing has gone wrong with you. You are reporting a standard specification. The response is not to become the sort of person who does not need anyone, which is not available. It is to go and get some people, slowly and awkwardly, the way everybody else does.","ch":13},{"n":192,"quote":"One can be instructed in society; one is inspired only in solitude.","bare":false,"attribution":"Johann Wolfgang von Goethe","means":"A division of labour. Other people are how you find out what is already known. The other thing, the idea that is yours, arrives when nobody is talking, and it cannot be scheduled into a workshop.","use":"Protect one solitary hour a week the way you protect a meeting. Same slot, defended. Nothing in particular has to happen in it. The point is that you cannot receive anything if the line is permanently engaged, and for most people the line is now engaged from waking until sleep.","ch":13},{"n":193,"quote":"Woe to him that is alone when he falleth; for he hath not another to help him up.","bare":false,"attribution":"Ecclesiastes 4:10","means":"Coldly practical. Not about companionship or feeling. About the day something goes badly wrong and there is no one whose number you can dial, which is a logistical problem before it is an emotional one.","use":"Do the audit. Who has your spare key? Who would notice if you did not appear for three days? Who could you ring at three in the morning without it being strange? If those questions have no answers, that is not a mood, it is an exposure, and it is worth fixing with the same seriousness you would apply to an uninsured house.","ch":13},{"n":194,"quote":"Language has created the word loneliness to express the pain of being alone, and the word solitude to express the glory of being alone.","bare":false,"attribution":"Paul Tillich","means":"The distinction that this chapter rests on, stated plainly. Same room, same absence of people, two completely different experiences, and the variable is whether you chose it.","use":"Ask which one you are in before applying any advice. If it is solitude, the material about protecting it applies. If it is loneliness, ignore all of that. Reframing does nothing for loneliness and can make it worse, because it adds failure to isolation. What works is contact, repeated, even when you do not feel like it.","ch":13},{"n":195,"quote":"Better alone than in bad company.","bare":false,"attribution":"Spanish proverb","means":"A limit on everything above. The instruction to go and find people is not an instruction to accept whoever is nearest. Some company is worse than none, and staying in it out of fear of the empty room is a bad trade made by a great many people.","use":"The exit. If the choice is between a bad evening with people who make you smaller and a quiet one on your own, take the quiet one, and stop treating that as a defeat. You are permitted to have fewer friends than the number that sounds respectable. You are permitted to leave the group chat, skip the reunion, and end the friendship that has been a duty since 2015. Being alone is not the worst outcome available. It is not even close.","ch":13}]},{"n":14,"title":"Getting Started","part":"Three","partRoman":"III","partName":"The Work","opening":"<p>This is not about fear. You are not frightened of the expenses claim, the tax return, or the email to the letting agent. You have not done them for nine days, while doing a remarkable number of other things.</p><p>Procrastination gets described as laziness, which is wrong and unhelpful, since the people best at it are exhausted. What is actually happening is that the task, as it exists in your head, has no starting point. It is a cloud rather than a sequence. &quot;Sort out the finances&quot; is not something a person can begin; it is a topic. And handed a topic instead of an action, the mind does what anybody would do with a vague instruction, which is to go and find something with clearer edges, like the washing-up, or four hours of research.</p><p>The second mechanism is that we misjudge the cost of beginning. Dread peaks in the minute before you start and drops off a cliff once you are in. Everybody knows this from experience and nobody uses it, because at the moment of choosing you are feeling the peak and using it to forecast the whole afternoon.</p><p>You are pricing an hour of work at the rate of its worst ninety seconds.</p><p>So the useful moves here are mechanical rather than motivational. Shrink the task until a starting action is obvious. Lower the bar for what counts as beginning. And accept that you will feel no more like doing it next Tuesday than you do now, which means waiting until you want to is the same as not doing it.</p><p>Motivation, on the evidence, turns up after the start rather than before it. Which is inconvenient, since it puts the thing you are waiting for on the far side of the thing you are avoiding.</p>","entries":[{"n":196,"quote":"The secret of getting ahead is getting started.","bare":false,"attribution":"attributed to Mark Twain","means":"Not a slogan about ambition. An observation about where the difficulty sits, which is almost entirely at the front. The middle of a task is fine, sometimes enjoyable, and shut off from you until the first few minutes are done.","use":"Stop planning the whole thing and name the single first physical action. Not \"do the tax return\" but \"find the folder with the receipts in it\". If your next step is not something you could do in two minutes, you have not finished breaking it down.","ch":14},{"n":197,"quote":"Well begun is half done.","bare":false,"attribution":"Horace","means":"Partly about doing the opening properly, and mostly about the ratio. The effort of going from nothing to something is out of all proportion to the effort of continuing, which is why a half-finished thing sits so much more lightly than an unstarted one.","use":"Short of time? Do not skip it. Start it badly. Fifteen minutes of a rough first attempt turns the thing from a dread into a work in progress, and tomorrow you will be editing rather than beginning, which is a different order of difficulty altogether.","ch":14},{"n":198,"quote":"The best is the enemy of the good.","bare":false,"attribution":"Voltaire","means":"Holding out for the excellent version tends to produce nothing at all. The standard becomes the reason you cannot start, and a high standard that prevents work is worth less than a modest one that produces some.","use":"Decide in advance what \"good enough to send\" looks like, and set it lower than you would like. Most work has a level of polish past which nobody notices anything and only you can see it. Find that level, hit it, stop, and spend the difference on the next thing.","ch":14},{"n":199,"quote":"Do the hard jobs first. The easy jobs will take care of themselves.","bare":false,"attribution":"Dale Carnegie","means":"The unpleasant task does not sit quietly waiting while you work through the easy ones. It runs in the background all day, consuming attention, and every small job you complete first gets done under its shadow.","use":"Take the thing you least want to do and do it before you open your email. Not as discipline. For the relief. The rest of the day is lighter, and you will notice how much of your usual afternoon fatigue was the weight of that one avoided item.","ch":14},{"n":200,"quote":"Little strokes fell great oaks.","bare":false,"attribution":"Benjamin Franklin","means":"Large things yield to small repeated applications. This is obvious, and almost nobody organises their work around it. We wait for a clear day that would allow the whole job in one sitting. The clear day does not arrive.","use":"Give the big thing twenty minutes a day instead of waiting for a free Saturday. A book, a qualification, a garden, the cupboard under the stairs. Twenty minutes daily is about two full days a month, arriving in a form you can actually put in a diary.","ch":14},{"n":201,"quote":"Thinking is easy, acting is difficult, and to put one's thoughts into action is the most difficult thing in the world.","bare":false,"attribution":"Goethe","means":"Planning is pleasant. It carries the whole sense of progress and none of the exposure, which is why an afternoon of research feels productive while producing nothing that exists outside your own head.","use":"Put a hard limit on preparation. One evening of reading, then you start badly. If you have been researching a subject for a fortnight without making anything, you are no longer preparing. You are hiding, in a way nobody will criticise.","ch":14},{"n":202,"quote":"Work expands so as to fill the time available for its completion.","bare":false,"attribution":"C. Northcote Parkinson","means":"Tasks have no natural size. Given a week a job takes a week; given an afternoon the same job takes an afternoon and is no worse, because the extra time went on hesitation and second-guessing rather than substance.","use":"Give things artificially short windows. \"I'll write this in forty minutes\" produces a draft. \"I'll write this today\" produces an evening of circling the kitchen. Set a timer where you can. The constraint does the work that willpower had been failing to do.","ch":14},{"n":203,"quote":"Whatsoever thy hand findeth to do, do it with thy might.","bare":false,"attribution":"Ecclesiastes 9:10","means":"The instruction is to engage fully with whatever is actually in front of you, rather than performing half a version while wishing you were doing something else. Half-attention makes ordinary tasks longer and far more tedious.","use":"If you are going to do the dull job, do it properly and fast rather than dragging it out with your phone beside you. The distracted version takes three times as long and feels worse throughout. Full attention is the quickest way out of work you dislike.","ch":14},{"n":204,"quote":"Genius is one percent inspiration and ninety-nine percent perspiration.","bare":false,"attribution":"Thomas Edison","means":"The idea is the cheap part. Everybody has ideas. Most people have several good ones a year. What is scarce is the willingness to do the unglamorous middle section in which the idea turns into an actual thing that exists.","use":"Stop waiting for a better idea. The one you have had for two years is good enough, and quality was never its problem. Pick it up and do the boring part this week. What separates you from the people who have done it is not the concept.","ch":14},{"n":205,"quote":"Cut your coat according to your cloth.","bare":false,"attribution":"English proverb","means":"Scope the job to what you have: this much time, this much money, this much energy on a normal Wednesday. Ambitious plans built on resources you do not have fail at first contact with an ordinary week.","use":"Plan with your real available time rather than your hoped-for time. If you genuinely have four hours a week, design something that fits four hours. The plan built for the twelve hours you keep meaning to free up will collapse by the second week, and you will conclude, wrongly, that you lack discipline.","ch":14},{"n":206,"quote":"Beware the barrenness of a busy life.","bare":false,"attribution":"attributed to Socrates","means":"Activity is not progress, and busyness is the most respectable form of avoidance there is. Nobody criticises you for having too much on, which is what makes it such a good place to hide.","use":"At the end of a very busy week, ask what moved. If the answer is nothing that matters, your workload is not the problem. The problem is that the load consists of things that are easy to do and easy to justify, and the difficult important thing is being crowded out on purpose.","ch":14},{"n":207,"quote":"The gods help them that help themselves.","bare":false,"attribution":"Aesop","means":"From the fable of the carter whose wagon is stuck and who prays for assistance without putting his shoulder to the wheel. Help, luck and opportunity arrive to people already in motion, and rarely to people waiting.","use":"Notice how much you are waiting for: the right moment, somebody else's decision, a piece of luck. Then do the part available now, however small. Things do turn up, and they turn up to the people who have started and are plainly trying.","ch":14},{"n":208,"quote":"By failing to prepare, you are preparing to fail.","bare":false,"attribution":"attributed to Benjamin Franklin","means":"The counterweight to everything above. Starting at once is a virtue for tasks you understand. For anything with real consequences, a modest amount of preparation saves an enormous amount of doing.","use":"Match the preparation to the stakes and to how reversible the thing is. An email needs none. A house purchase, a business, a medical decision needs a great deal. The failure is applying the wrong one to the wrong thing, which in practice means over-preparing for the small and rushing the large.","ch":14},{"n":209,"quote":"He who begins many things finishes but few.","bare":false,"attribution":"Italian proverb","means":"Starting is the best part of any project, and the pleasure is repeatable: you can have it again and again by beginning new things and abandoning each one at the point where the work turns dull.","use":"Count your open projects honestly, including the ones you would describe as \"on hold\". If there are more than three, starting is not your problem. Starting is your favourite part. Close two, formally, before you begin anything else.","ch":14},{"n":210,"quote":"Never put off till tomorrow what may be done day after tomorrow just as well.","bare":false,"attribution":"Mark Twain","means":"Twain is joking and he is pointing at something real. A proportion of the tasks weighing on you do not need doing at all, and delay is a crude but effective way of finding out which.","use":"Here is the get-out. Look at what has been on the list longest. If it has been six months and nothing has gone wrong, treat its absence as evidence. Cross it off instead of doing it, and notice how much of the list you had imposed on yourself.","ch":14}]},{"n":15,"title":"Keeping Going","part":"Three","partRoman":"III","partName":"The Work","opening":"<p>Every long undertaking has a middle, and the middle is where it gets decided. Not at the start, which is exciting. Not at the end, which is in sight. Somewhere around week five, or month eight, or year three, when the novelty has gone completely, the finish is nowhere visible, and nobody is watching.</p><p>The middle has a texture of its own. Progress goes invisible: you are doing the same amount of work you were doing in the first month, putting in the same evenings, and it no longer produces any detectable change at all, because early progress is always the fastest progress and you have already spent it. The thing has lost its glamour by now, too. It has turned into a set of specific repetitive tasks and you know exactly what tomorrow&#x27;s will be.</p><p>This is where things stop, and they rarely stop with a decision. Almost nobody quits the language, the training plan, the business or the manuscript. They have a bad week and skip it, then a busy fortnight, and six months later it is something they used to do.</p><p>The absence of a decision is what makes it so easy.</p><p>Two things help, and neither is motivation. The first is lowering the required daily amount to something so small that you will do it on a bad day, because continuity matters more than volume and a broken chain is far harder to restart than a thin one is to keep. The second is separating the work from your feelings about it. You will feel like an impostor. You will find it dull. You will be convinced it is no good. All of that can be true while the work goes on.</p><p>Rest belongs here as well, taken properly rather than collapsed into. Endurance that ignores the body is not endurance. It is a countdown.</p>","entries":[{"n":211,"quote":"Diligence is the mother of good fortune.","bare":false,"attribution":"Miguel de Cervantes","means":"What looks like luck from outside is the visible part of a long, unglamorous run of showing up. The break arrives in a moment. The readiness to use it took eight years and nobody saw any of that.","use":"When somebody's success looks sudden, find out what they were doing for the five years before it. It is almost always the same thing, over and over, with no reward attached. That is the actual shape of the stretch you are in, and it is normal for it to feel like nothing is happening.","ch":15},{"n":212,"quote":"It does not matter how slowly you go as long as you do not stop.","bare":false,"attribution":"attributed to Confucius","means":"Rate is negotiable. Continuity is not. Slow progress compounds into something substantial, and stopped progress compounds into nothing at all, however impressive the pace was on the day before you stopped.","use":"On a bad week, cut the amount instead of skipping. Ten minutes rather than an hour. Two sentences rather than a page. It looks pointless, and it is the opposite of pointless, because what you are maintaining is no longer the output but the simple fact that this is a thing you do, which is the part that would have been hard to get back.","ch":15},{"n":213,"quote":"Never give in, never give in, never, never, never.","bare":false,"attribution":"Winston Churchill","means":"Worth knowing the rest of the sentence, since he went on to add \"except to convictions of honour and good sense\". It is not a demand that you be immovable about everything. It is about not surrendering to weariness or the simple difficulty of carrying on.","use":"Separate quitting because it is hard from quitting because it is wrong. Fatigue, boredom and a bad patch are not reasons. They are weather. A change in the actual merits is a reason. Being honest about which of the two you are looking at is the whole of the skill.","ch":15},{"n":214,"quote":"Slow and steady wins the race.","bare":false,"attribution":"Aesop","means":"The hare loses to boredom and confidence rather than to any shortage of ability. Sustainable pace beats brilliant bursts over any real distance, largely because bursts are followed by recovery periods that undo them.","use":"Set your effort at the level you could sustain in an average week, not a good one. The training plan built around your best fortnight breaks in the first difficult one. Aim to be slightly under-extended, permanently. Over a year it is much faster.","ch":15},{"n":215,"quote":"Great works are performed not by strength but by perseverance.","bare":false,"attribution":"Samuel Johnson","means":"Big things are not achieved in one heroic push. They are assembled out of many ordinary sessions, most of which felt unremarkable at the time and none of which would have looked impressive to anybody watching.","use":"Stop waiting for the day you will have the energy to make a real dent. That day will not come, or it will come once. What produces the result is a hundred adequate sessions, and today can be one of them regardless of how you feel about it.","ch":15},{"n":216,"quote":"Our greatest weakness lies in giving up. The most certain way to succeed is always to try just one more time.","bare":false,"attribution":"Thomas Edison","means":"Persistence presented as a mechanical advantage rather than a virtue. Attempt count is the one variable you control directly, unlike talent or luck or timing or who happens to read your email on a Tuesday, and it is the variable most people stop adjusting long before they have to.","use":"Having decided something has failed, make one more attempt with one thing changed. The application, the pitch, the recipe, the difficult conversation. Not indefinitely. Once. The marginal cost is small, and the number of things that work on the fourth attempt is genuinely surprising.","ch":15},{"n":217,"quote":"Step by step one goes a long way.","bare":false,"attribution":"French proverb","means":"Nobody can sustain effort towards a goal three years away, because the mind will not hold it. What people do instead is finish a series of short, completable stretches that happen to point in the same direction.","use":"Break the long thing into units with real endings. A month. A chapter. A term. Finish one, mark it, start the next. You get the satisfaction of completion at intervals, and that satisfaction is what keeps the machine running when the goal itself is too far off to see.","ch":15},{"n":218,"quote":"Constant dropping wears away a stone.","bare":false,"attribution":"Lucretius","means":"Repetition beats force over a long enough period. No individual drop does anything measurable, which is exactly why the effect is so hard to believe in while you are the drop.","use":"Keep a record so the accumulation becomes visible: days practised, miles run, words written, a line in a notebook that takes four seconds and turns an invisible process into something you can look at. Not for discipline. For evidence. The progress is invisible day to day, and without a record you will conclude that nothing is happening and stop, which is how most of it ends.","ch":15},{"n":219,"quote":"The race is not to the swift, nor the battle to the strong, but time and chance happeneth to them all.","bare":false,"attribution":"Ecclesiastes 9:11","means":"Effort does not guarantee outcome. Luck, timing and circumstance take part in every result, and pretending otherwise sets you up to read a bad outcome as a verdict on you personally.","use":"Judge yourself on what you controlled: whether you did the work, made the attempt, prepared properly. Outcomes are a joint product of your effort and the world's mood on the day. Keeping those two accounts separate is what lets you carry on after something you did well went badly.","ch":15},{"n":220,"quote":"Ever tried. Ever failed. No matter. Try again. Fail again. Fail better.","bare":false,"attribution":"Samuel Beckett","means":"Not a motivational slogan, whatever the posters suggest. Beckett is describing continuation without any promise of success, which is the actual condition of most long work. Better failure is a real improvement and it may be all you get.","use":"Ask whether this attempt failed in a more interesting way than the last one. New problems mean progress. The same problem repeating means something has to change in the method rather than in the effort, and more effort is the answer people reach for first.","ch":15},{"n":221,"quote":"Energy and persistence conquer all things.","bare":false,"attribution":"Benjamin Franklin","means":"An overstatement with a useful core. Persistence does not conquer everything. It does outlast most obstacles, because most obstacles are maintained by somebody or something with less staying power than a determined person.","use":"In any long process involving an institution, an appeal or a claim or a complaint or a diagnosis nobody will commit to, understand that the system is not neutral about whether you continue: it is quietly counting on you giving up, and it has been designed by people who know how many will. Politely, calmly, keep coming back. A remarkable number of these are decided by who is still there at the end.","ch":15},{"n":222,"quote":"He conquers who endures.","bare":false,"attribution":"Persius","means":"Two words in the Latin, and the subject is outlasting rather than overpowering. In a great many contests the winner is not the strongest party but the one still standing when everybody else has gone home.","use":"In a difficult stretch with no clear end, drop the goal of winning and adopt the goal of remaining. Still being in it in six months is a real achievement and often the decisive one. Survival is a strategy, not a consolation prize.","ch":15},{"n":223,"quote":"Rome was not built in a day.","bare":false,"attribution":"proverb","means":"The most reassuring cliché available, and worth taking seriously rather than as something to say. Everything substantial took considerably longer than it appears to have taken from outside, including the things you measure yourself against.","use":"Impatient with your own progress? Find out how long the comparable thing actually took somebody else. Not the polished version of the story. The dates. It is invariably years longer than you assumed, and knowing that changes what a reasonable pace feels like.","ch":15},{"n":224,"quote":"Many of life's failures are people who did not realise how close they were to success when they gave up.","bare":false,"attribution":"Thomas Edison","means":"You cannot see your position from inside the work. The last stretch feels identical to the middle, which means the decision to stop is always taken without knowing how much was left.","use":"Decide to stop on a good day rather than a bad one. A quitting decision made in the middle of a discouraging week is being made by the discouragement. If it still looks right on a Wednesday when things are going fine, it probably is.","ch":15},{"n":225,"quote":"Rest is not idleness, and to lie sometimes on the grass under trees on a summer's day is by no means a waste of time.","bare":false,"attribution":"John Lubbock","means":"Rest is part of the work rather than a lapse in it. Continuous effort without recovery produces diminishing output and then no output, and the collapse gets mistaken for a failure of character by everybody, including the person collapsing.","use":"Take this as the permission slip. If you have been pushing through for months and everything has gone grey, the answer is not more discipline. Take a proper break, with a defined end so it does not become the stopping. Then come back. Endurance always included the pauses.","ch":15}]},{"n":16,"title":"Knowing When to Stop","part":"Three","partRoman":"III","partName":"The Work","opening":"<p>We are taught from an early age not to give up. Persistence is a virtue, quitting is a failure of character, and every story we are told features somebody who kept going when others would not. Nobody writes books about the man who closed the shop in year two and got his weekends back, though he very likely made the better decision.</p><p>So most people are far worse at stopping than at continuing. They stay in the job, the course, the relationship, the argument, the doomed project, long past the point where anybody outside could see it.</p><p>The reason is rarely optimism. It is the money and the years already spent, which feel as though they would be wasted by stopping and are in fact wasted either way. That is the whole trap. The past has gone regardless, and the only live question is what happens to what remains.</p><p>There is a second difficulty, which is that stopping well and quitting badly look identical from any distance at all, since both consist of the same visible act, which is that a thing which was happening is now not happening. The difference lives entirely in the reasoning, and it is a difference you have to be honest with yourself about, because everybody can construct a respectable case for whichever course they were going to take anyway.</p><p>A rough test. Are you stopping because the situation has changed, or because today was hard? Would this still look right on a good Wednesday, after a decent night&#x27;s sleep? Have you asked one person with no stake in it?</p><p>This chapter is about finishing things, leaving things, and telling a lull apart from a dead end. It is also, quietly, about the fact that stopping frees up the one resource you cannot replace.</p>","entries":[{"n":226,"quote":"When you find yourself in a hole, stop digging.","bare":false,"attribution":"modern maxim, often attributed to Denis Healey","means":"The instinct when something is not working is to apply more of the same, harder. More hours, more money, more explaining. Effort applied to a failing approach makes the hole deeper rather than shallower, and does it faster.","use":"Increased your effort twice and got the same result twice? Stop increasing. Put the shovel down for a week. It feels like giving up, and it is the only way to find out whether the problem is the amount of digging or the choice of location.","ch":16},{"n":227,"quote":"There is a tide in the affairs of men which, taken at the flood, leads on to fortune; omitted, all the voyage of their life is bound in shallows.","bare":false,"attribution":"William Shakespeare","means":"Timing is a real component of outcomes and it does not wait for you to feel ready. Opportunities have windows, and the same decision taken a year late is frequently not the same decision at all.","use":"When you catch yourself saying \"not yet\" about something time-limited, ask what exactly you are waiting for and whether it will still be there when it arrives. Sometimes the honest answer is that the window is closing and you are hoping it will wait politely.","ch":16},{"n":228,"quote":"Don't throw good money after bad.","bare":false,"attribution":"English proverb","means":"What you have already spent is gone and has no bearing on whether the next pound is a good idea. Every decision starts from where you stand now rather than from what it cost to get here, and almost nobody can feel this, which is why the proverb had to be invented.","use":"Ask the outsider's question. If I arrived at this situation today, knowing what I know and owing it nothing, would I sign up for the next six months? If the answer is no, then the only thing holding you in place is the six months you have already spent, and those are gone in either version of the future, whichever one you choose.","ch":16},{"n":229,"quote":"To every thing there is a season: a time to get, and a time to lose; a time to keep, and a time to cast away.","bare":false,"attribution":"Ecclesiastes 3:6","means":"Keeping and discarding are given equal standing, as ordinary phases of one cycle. Holding on is not automatically the responsible choice, and letting go is not automatically a loss.","use":"Once a year, take stock of what you are keeping out of habit: subscriptions, commitments, roles, the volunteer position you have held for nine years. Ask of each whether it is still in its season. Most things have a natural length and we notice long after it has passed.","ch":16},{"n":230,"quote":"He will win who knows when to fight and when not to fight.","bare":false,"attribution":"Sun Tzu","means":"Choosing your engagements matters more than winning them. Somebody who fights everything, the parking notice and the misworded email and the colleague who takes credit for small things, spends themselves on trivial battles and arrives at the one that mattered with nothing left in reserve.","use":"Before entering any conflict, the complaint, the escalation, the point of principle in a meeting, ask what winning gets you and what it costs. Some fights are worth losing money over. Most are not worth the fortnight of preoccupation, and telling those apart is worth more than being right.","ch":16},{"n":231,"quote":"A poem is never finished, only abandoned.","bare":false,"attribution":"Paul Valéry","means":"Creative work has no natural completion point. There is always another revision available, so you do not finish. You decide, at some arbitrary moment, to stop and let the thing exist as it is.","use":"Set the stopping point in advance instead of waiting to feel done, because the feeling of being done does not arrive on its own and waiting for it is how projects quietly turn into hobbies. Three drafts and it goes. Two weekends and the room is painted. The alternative is not a better version. It is a thing that never leaves your hands at all.","ch":16},{"n":232,"quote":"Leave the table while you still feel like eating.","bare":false,"attribution":"Spanish proverb","means":"The right moment to stop is generally just before you want to. Food, a party, a working day, a good run of form: stop at the peak and you keep the appetite. Stop at exhaustion and you acquire an aversion.","use":"End the writing session while you still know what comes next. Leave the party while you are enjoying it. Finish the run with something in reserve. The point is not restraint. It is that tomorrow's willingness gets set by how today finished.","ch":16},{"n":233,"quote":"It is not enough to be busy. The question is: what are we busy about?","bare":false,"attribution":"Henry David Thoreau","means":"Activity supplies its own justification, which is how somebody can spend a decade being extremely busy about something that stopped mattering to them around year three.","use":"Look at the largest recurring thing in your week and ask what it is for. Not what it produces. What it is for, in terms of a life you would choose. If you cannot answer, it does not follow that you should stop. It does follow that you should find out before another year goes into it.","ch":16},{"n":234,"quote":"In everything the middle course is best: all things in excess bring trouble.","bare":false,"attribution":"Plautus","means":"Virtues turn into faults when overextended, and the point at which one turns into the other is invisible from inside the person doing it. Thoroughness becomes paralysis. Loyalty becomes staying too long. Dedication becomes the thing that wrecks your health.","use":"Ask whether the quality you are proudest of has passed its useful point. If your attention to detail now delays every piece of work, it has stopped being a strength, whatever the appraisal says. The fix is a limit, not a change of personality.","ch":16},{"n":235,"quote":"Perfection is achieved not when there is nothing more to add, but when there is nothing left to take away.","bare":false,"attribution":"Antoine de Saint-Exupéry","means":"Finishing is often a matter of subtraction. The last stage of most work is not adding the missing element. It is removing the four things obscuring what is already there.","use":"If something is nearly done and will not come together, stop adding. Cut the weakest third. The paragraph you are proudest of is frequently the one making it worse. This applies to documents, presentations, plans, and to a schedule with too much in it to work.","ch":16},{"n":236,"quote":"Half of the troubles of this life can be traced to saying yes too quickly and not saying no soon enough.","bare":false,"attribution":"Josh Billings","means":"Two separate failures with one root. The first is agreeing before you have thought. The second is continuing to honour an agreement long after it stopped making sense, out of embarrassment at changing your mind in front of somebody.","use":"Buy time at the front: \"let me check and come back to you tomorrow\" costs nothing and prevents most of it. And when you are in something you should not have agreed to, withdraw early, because the cost of pulling out rises steeply with every week you leave it.","ch":16},{"n":237,"quote":"Let go, or be dragged.","bare":false,"attribution":"Zen proverb","means":"Some things are ending whether you consent or not. The choice on offer is not between ending and continuing. It is between releasing with some dignity and being pulled along behind it.","use":"When you are fighting something already settled, a decision made, a relationship over, a job given to somebody else, notice that the fight has stopped being a strategy. Your energy is worth more spent on what comes next, and it becomes available the moment you stop.","ch":16},{"n":238,"quote":"He that fights and runs away, may turn and fight another day.","bare":false,"attribution":"English proverb, after Tacitus","means":"Withdrawal preserves the capacity to act later. Treat every retreat as a defeat and you produce people who exhaust themselves on unwinnable ground and have nothing left for the situations they could have changed.","use":"Leaving a job, a course or a project with your resources intact is a result, not a failure. Say it that way when you explain it, to other people and to yourself, because the story you tell about it determines how quickly you are able to start the next thing.","ch":16},{"n":239,"quote":"Better a lean peace than a fat victory.","bare":false,"attribution":"Dutch proverb","means":"A modest settlement now usually beats a better outcome pursued to the end. The extra you would win rarely covers what the pursuit costs in time, money and the grinding effect of a long dispute on everything else.","use":"In any argument that has dragged, work out what is still in contention and price your own time against it. Arguing over three hundred pounds and it has taken five weekends? Take the deal. Being right has a market rate and it is lower than people think.","ch":16},{"n":240,"quote":"The grass is always greener on the other side of the fence.","bare":false,"attribution":"proverb","means":"The urge to stop is not always information about the thing you want to stop. Sometimes it is the ordinary dissatisfaction of being in the middle of something real, and it will attach itself to whatever you do next with equal enthusiasm.","use":"Before leaving, check whether you have felt exactly this at the same stage of the last three things. If so, the pattern is yours and it will follow you over the fence. Stop for reasons that live in the situation, not for reasons that live in you.","ch":16}]},{"n":17,"title":"Rest and Doing Nothing","part":"Three","partRoman":"III","partName":"The Work","opening":"<p>You had a free Saturday. By eleven you had answered four emails you were not required to answer, reorganised something that did not need it, and looked twice at a list. By six you were tired in a way that had produced nothing, and the day had gone without ever starting.</p><p>That is the modern failure mode. Not overwork exactly. A refusal to be off, which is different and more exhausting, because it never resolves into either work or rest and you pay for both.</p><p>The chapter before this is about stopping a project. This one is about stopping for the day, which turns out to be harder, and the reason is that we have quietly made rest conditional. It has to be earned. It has to be deserved. It has to be optimised, so that even the hour on the sofa is somehow productive, restorative, a form of self-improvement with better branding. And a rest you have to justify is not a rest. It is unpaid work with the lights off.</p><p>There is a second thing going on, which is that stopping is when the thoughts arrive. Grief, the decision you are avoiding, the conversation you owe somebody, the question of whether the last four years have gone anywhere at all: none of it can get a word in while the diary is full, and all of it is waiting in the first quiet hour like a queue at a desk that has been closed since March. Busyness is an excellent anaesthetic and most people discover this without ever noticing they have discovered it. They only know that the empty afternoon feels bad and the full one does not.</p><p>None of which makes idleness good on its own. Empty time and restful time are not the same, and a whole day of neither working nor resting is the worst of the three.</p><p>So the aim is narrow: to be properly off, on purpose, without a defence prepared.</p>","entries":[{"n":241,"quote":"Take rest; a field that has rested gives a bountiful crop.","bare":false,"attribution":"Ovid","means":"The oldest argument for rest and still the most persuasive, because it is agricultural and not moral. Nobody thinks a fallow field is lazy. Everyone understands that the ground is doing something in the year it grows nothing.","use":"Reframe the fallow week as part of the work and not an interruption of it. If you have been flat for a fortnight, the answer is not to push harder into flat ground. Take a real week off, not a week of light email, and treat the recovery as an input with a return, because that is what it is.","ch":17},{"n":242,"quote":"Six days shalt thou labour, and do all thy work: but the seventh day is the sabbath.","bare":false,"attribution":"Exodus 20:9","means":"The oldest labour protection on record, and the striking part is that it is compulsory. Not permitted, not encouraged. Required, of everybody, including the servants and the animals, with no clause for people who feel they are behind.","use":"Adopt the structure without the theology. One fixed period, the same each week, where the work is not available. Fixed beats flexible here, because flexible means negotiable and you will lose the negotiation every time. Sunday until six. Or all of Saturday. Non-negotiable is the whole mechanism.","ch":17},{"n":243,"quote":"The bow cannot always stand bent, nor can human frailty subsist without some lawful recreation.","bare":false,"attribution":"Miguel de Cervantes","means":"A bow kept strung loses its spring. The wood takes the shape of the tension and stops returning to itself, and after that it will never again throw an arrow properly, however hard you pull.","use":"Watch for the sign that you have taken the shape: when the work stops going in even though you are at the desk. Reading the same paragraph four times is not a discipline problem. It is a bow that has been strung since March. Nothing improves until it is unstrung, and no amount of effort substitutes.","ch":17},{"n":244,"quote":"Sleep that knits up the ravelled sleave of care.","bare":false,"attribution":"William Shakespeare","means":"Sleep as repair work, done overnight, on damage accumulated during the day. Shakespeare had no science for this and got the mechanism exactly right, which is a reminder that the thing was obvious long before anybody could measure it.","use":"Treat the bad night as a cause, not a symptom. When everything feels heavier than the facts warrant, check the sleep before interrogating the life. A great deal of what presents as a crisis of meaning on Wednesday afternoon is four nights of six hours, and it resolves in a weekend instead of a year.","ch":17},{"n":245,"quote":"Leisure is the mother of philosophy.","bare":false,"attribution":"Thomas Hobbes","means":"Every idea worth having came from someone with an unaccounted hour. Not stolen time or guilty time. Genuine slack, in which the mind is free to go where it wants, which is where anything original comes from.","use":"Defend the unaccounted hour specifically. Not the hour scrolling, which is occupied, and not the hour of admin, which is work. The walk with no podcast. The bath. The sitting in the car for ten minutes after arriving. These look like nothing and they are the only conditions under which your own thoughts get a turn.","ch":17},{"n":246,"quote":"Nowhere can a man find a quieter or more untroubled retreat than in his own mind.","bare":false,"attribution":"Marcus Aurelius","means":"He is arguing against the holiday as the only unit of rest. The countryside, the coast and the hills all require arrangements and money and a fortnight in August. The interior version needs nothing and is available at eleven on a Tuesday.","use":"Stop saving rest up. If your only recovery is the annual holiday, you are running eleven months in deficit and then attempting to repay it in a fortnight, which does not work and is why the first four days of every holiday are spent ill or asleep. Small and frequent beats large and rare.","ch":17},{"n":247,"quote":"To do nothing at all is the most difficult thing in the world, the most difficult and the most intellectual.","bare":false,"attribution":"Oscar Wilde","means":"Wilde is being provocative and is also correct. Doing nothing is difficult. Most people cannot manage ten minutes of it, and the ones who look effortless at it have practised.","use":"Expect it to be hard and stop treating the difficulty as evidence that you are doing it wrong. The restlessness at minute six is normal. It passes at around minute twelve. Nobody tells you this, so most people quit at minute six and conclude that rest is not for them.","ch":17},{"n":248,"quote":"He that can take rest is greater than he that can take cities.","bare":false,"attribution":"Benjamin Franklin","means":"From the most relentlessly industrious man in America, which is what gives it weight. Franklin is not excusing idleness. He is ranking a capability, and putting the ability to stop above the ability to conquer.","use":"Notice who you admire and why. If the people you rate are all rated for their output, you have absorbed a scale with only one axis on it. Add the other one. Ask who you know who is good at being off, and what they do on a Sunday, and copy it directly instead of inventing your own.","ch":17},{"n":249,"quote":"Better is an handful with quietness, than both the hands full with travail and vexation of spirit.","bare":false,"attribution":"Ecclesiastes 4:6","means":"A comparison of two full lives, one half as productive and considerably better. The measure is not what is in the hands. It is what the getting of it cost, and whether there is any peace left over to enjoy it in.","use":"Do the sum honestly on the extra work. The overtime, the second stream of income, the side project. What does it buy, in pounds, and what does it cost, in evenings? Sometimes it is clearly worth it. Sometimes you find you are trading a great deal of quietness for a sum that would not change a single thing about your week.","ch":17},{"n":250,"quote":"There is no music in a rest, but there is the making of music in it.","bare":false,"attribution":"John Ruskin","means":"Ruskin is talking about scores and about lives. The silences in a piece of music are not absences of music. They are structural. Remove them and you do not get more music, you get noise.","use":"Look at your week as a piece of music, not a list. Where are the rests? A week with none is not a week with more in it, it is a week with no shape, which is why you cannot remember any of it by Friday. Put one silence in on purpose and notice how much more the rest of it registers.","ch":17},{"n":251,"quote":"Sleep is the golden chain that ties health and our bodies together.","bare":false,"attribution":"Thomas Dekker","means":"Written in 1609, when nobody could have explained the mechanism, and it names the relationship exactly. Sleep is not one component of health among several. It is the fastening.","use":"Fix the fastening before anything else. If you are trying to improve your diet, your exercise, your temper and your concentration all at once, and you are sleeping six hours, do the sleep first and reassess the rest in a month. Most of the list gets easier and some of it disappears.","ch":17},{"n":252,"quote":"Nature does not hurry, yet everything is accomplished.","bare":false,"attribution":"attributed to Lao Tzu","means":"A description of the rate at which things grow. Nothing in the natural world is behind schedule, and nothing in it moves faster because it is worried, and the results are extensive.","use":"Apply it to the thing you are trying to force. The recovery, the child's reading, the business in its first year, the grief. Some processes have their own clock, and hurrying them produces damage instead of speed. Ask whether your impatience is adding anything at all, or just adding suffering to a timetable it cannot change.","ch":17},{"n":253,"quote":"Come unto me, all ye that labour and are heavy laden, and I will give you rest.","bare":false,"attribution":"Matthew 11:28","means":"Whatever you make of the theology, notice who it is addressed to. Not the deserving. Not the ones who have finished. The exhausted, unconditionally, with no assessment of whether they had earned it.","use":"Drop the entrance requirement. You do not have to have completed the list to be allowed to stop. The idea that rest is a wage paid for work done is the reason you are tired, and it is worth stating plainly to yourself that nobody is checking, nobody is issuing the permission, and the permission was never required.","ch":17},{"n":254,"quote":"The hardest work is to go idle.","bare":false,"attribution":"Yiddish proverb","means":"Anyone who has been signed off sick or made redundant knows this one. Enforced idleness is not restful. It is heavy, shapeless and long, and it teaches you quickly that rest and empty time are different substances.","use":"Give the rest a shape, especially a long one. A day off with nothing in it tends to evaporate and leave you flat. A day off with one small anchor in it, a swim at eleven, someone coming at four, feels like it happened. Structure is not the enemy of rest. Structure is what makes it land.","ch":17},{"n":255,"quote":"Absence of occupation is not rest; a mind quite vacant is a mind distressed.","bare":false,"attribution":"William Cowper","means":"Cowper knew this from the inside, having spent long periods unable to work and finding it agony and not relief. Emptying the diary does not calm a mind that is loud. It removes the last thing that was drowning it out.","use":"Here is the exit. If sitting still makes it worse, stop making yourself sit still. For some people, in some periods, the useful thing is occupation: the shed, the long walk, the shift, the meal cooked for somebody. That is not a failure to rest properly. It is knowing which sort of mind you have this month. And if the vacancy is frightening and not merely uncomfortable, that is worth saying to a doctor instead of solving with a better routine.","ch":17}]},{"n":18,"title":"Money","part":"Three","partRoman":"III","partName":"The Work","opening":"<p>Most people can tell you their salary. Very few can tell you, without looking, what leaves their account each month before they have chosen anything, and fewer still could say what figure would be enough. The subject that governs more of the week than any other is the one we examine least, and the avoidance is not laziness. It is that looking properly involves finding something out.</p><p>Money is also the last thing left that people will not discuss. Sex, illness, therapy and divorce have all come out from under the table. What you earn has not, and neither has what you owe, which means almost everyone is estimating their position against other people&#x27;s spending with no access to the accounts behind it. The neighbour&#x27;s car is visible. The loan on it is not.</p><p>This chapter is about the ordinary dread and not the arithmetic. There are better books for the arithmetic and they all say the same four things. What they cannot say is why a person with enough still lies awake, why a windfall changes the mood for six weeks, why the sum you needed at thirty has quietly become the sum you need every year, or why an unopened envelope on the hall table can dominate a Sunday.</p><p>One warning, up front and repeated at the end. Everything here assumes your needs are met. Advice about wanting less, spending better and worrying about it more calmly is written for people with margin. If there is no margin, none of it applies, and the shortage is a structural problem and not a personal failing.</p>","entries":[{"n":256,"quote":"Annual income twenty pounds, annual expenditure nineteen nineteen and six, result happiness. Annual income twenty pounds, annual expenditure twenty pounds ought and six, result misery.","bare":false,"attribution":"Charles Dickens","means":"Micawber's law, delivered by a man who never once obeyed it. The margin is the whole thing. Sixpence either side of the line changes the character of a life, and the size of the income barely features in the calculation.","use":"Find your own sixpence. Not a budget. One number: what comes in, what goes out, monthly. Most people have never sat down with both figures at once and are carrying a vague dread instead of a fact. The fact is almost always less frightening than the dread, and unlike the dread it can be worked on.","ch":18},{"n":257,"quote":"The love of money is the root of all evil.","bare":false,"attribution":"1 Timothy 6:10","means":"Note the exact words, because the popular version drops the important one. Not money. The love of it. The line is about a relationship, not a substance, and it makes no claim that being paid is a moral problem.","use":"Test the relationship, not the balance. Do you check the account when nothing has changed? Does a good month improve your mood more than it should? Is there a number you keep moving? None of that is about how much you have. All of it is about how much of you the subject currently occupies.","ch":18},{"n":258,"quote":"Riches are a good handmaid, but the worst mistress.","bare":false,"attribution":"Francis Bacon","means":"Bacon is describing who is serving whom. Money used as an instrument is excellent: it buys time, safety and options. Money as the objective reorganises everything else around itself, including the decisions that were meant to be about your life.","use":"Look at your last three significant decisions. Job, house, how you spent a year. If money was a factor in all three, that is sensible. If it was the deciding factor in all three, notice that a servant has been promoted, and ask what the promotion has cost you in the categories that do not appear on a statement.","ch":18},{"n":259,"quote":"Debt is the worst poverty.","bare":false,"attribution":"Thomas Fuller","means":"Being short is a condition. Being in debt is a condition with a clock attached, and the clock is what does the damage. It converts every future month into a month that is already spoken for, which is a different kind of poverty from having little.","use":"Rank debts by what they do to your head, not only by their interest rate. The small one you are ashamed of may be costing you more in sleep than the large one you have made peace with. Clear it early even if the spreadsheet disagrees, because the spreadsheet is not the thing keeping you awake.","ch":18},{"n":260,"quote":"Beware of little expenses; a small leak will sink a great ship.","bare":false,"attribution":"Benjamin Franklin","means":"Nobody sinks from one decision. They sink from eleven subscriptions, a habit that costs four pounds a day, and a delivery charge paid two hundred times a year without ever being considered once.","use":"Print a month of transactions and read them like a stranger would. Not to feel guilty. To find the leaks, which are always in the recurring column and never in the memorable purchases. Cancel three things this week. The ones you miss can be resubscribed to in a fortnight, and most will not be.","ch":18},{"n":261,"quote":"Money often costs too much.","bare":false,"attribution":"Ralph Waldo Emerson","means":"Four words containing the whole trade. Every pound arrives at a price paid in something else: hours, health, attention, the years your children were small. The price is real and it is almost never written down anywhere.","use":"Convert the money back into life before deciding. The promotion is not twelve thousand pounds. It is twelve thousand pounds minus tax, minus the extra commute, minus the evenings, divided by the hours it takes. Do the division. Sometimes the answer is obviously yes. Sometimes you find you were about to buy something at a terrible rate.","ch":18},{"n":262,"quote":"It is better to have a permanent income than to be fascinating.","bare":false,"attribution":"Oscar Wilde","means":"Wilde, who had neither for long, being funny about a real thing. There is a romance about precarity that is only ever written by people with a safety net, and the actual experience of it is boring, frightening and bad for the work.","use":"Be suspicious of the story that struggle is good for you. It is good for a biography. In the living of it, the freelance year with no float produces worse work, not braver work. Build the boring buffer first. Three months of costs in an account you find dull is what makes the interesting choices possible.","ch":18},{"n":263,"quote":"He who buys what he does not need steals from himself.","bare":false,"attribution":"Swedish proverb","means":"The framing is the useful part. Not wasteful, which is a mild word, but theft, committed by you against a version of you who will need the money later and has no say in the matter.","use":"Put a delay between wanting and buying, sized to the amount. Anything over a hundred pounds waits a week. Keep a list of the things you nearly bought. Reading it back after a month is the cheapest financial education available, and the number of items you can no longer remember caring about will be most of them.","ch":18},{"n":264,"quote":"Wealth is the slave of a wise man and the master of a fool.","bare":false,"attribution":"Seneca","means":"Seneca was among the richest men in Rome and knew he was open to the charge of hypocrisy. His defence was that the question is not whether you have it. It is whether you could put it down.","use":"Run the thought experiment. If your income halved tomorrow, what would you lose? For some people the honest answer is comfort and a great deal of anxiety. For others it is an identity, and that is the answer worth noticing, because an identity made of money has to be defended every year for the rest of your life.","ch":18},{"n":265,"quote":"The safest way to double your money is to fold it over once and put it in your pocket.","bare":false,"attribution":"Kin Hubbard","means":"A joke about get rich schemes, made in the 1920s, and it has aged perfectly. The people selling the double are making their money from the selling and not from the thing being sold.","use":"Apply the oldest test there is. If somebody knows a reliable way to double money quickly, ask why they are telling you instead of doing it. This covers the crypto tip, the property seminar, the friend of a friend with an opportunity, and it has never once produced a satisfactory answer.","ch":18},{"n":266,"quote":"Neither a borrower nor a lender be.","bare":false,"attribution":"William Shakespeare","means":"Polonius is a windbag and this particular line survives because it is right. The rest of the speech explains why: lending loses you the money and the friend at once, and borrowing dulls the edge of your own management of things.","use":"If you lend money to someone you care about, decide in advance that it is a gift. Say so. That way there is no ledger between you, no awkwardness at Christmas, and no version of the friendship in which you are quietly keeping score. If you cannot afford to give it, you cannot afford to lend it, and saying no now is kinder than resenting them for two years.","ch":18},{"n":267,"quote":"A man is usually more careful of his money than he is of his principles.","bare":false,"attribution":"Edgar Watson Howe","means":"Howe is pointing at where the real accounting happens. We check the balance daily and the conscience annually, and we notice a small loss of the first far more readily than a large loss of the second.","use":"Notice where money has quietly become the tiebreaker. The client you would rather not work for. The thing you did not say in the meeting. Everybody has a price and there is nothing shameful in that. What is worth knowing is what yours currently is, because unexamined it tends to be lower than you would like.","ch":18},{"n":268,"quote":"The rich man is not one who is in possession of much, but one who gives much.","bare":false,"attribution":"St John Chrysostom","means":"A deliberate redefinition, from a preacher who annoyed a great many wealthy people. Wealth measured by flow instead of by holdings, and by what leaves instead of by what sits still.","use":"Give some away on a standing order, not by decision. Small and automatic beats large and occasional, because the decision is where the reluctance lives. The reported effect on the giver is out of all proportion to the sum, and it is one of the few claims in this book that is easy and cheap to test yourself.","ch":18},{"n":269,"quote":"If you would know the value of money, go and try to borrow some.","bare":false,"attribution":"Benjamin Franklin","means":"You learn the true position of a thing by trying to obtain it under pressure. Money is polite and abundant until you need it, at which point its actual terms become visible, and the terms are worst for the people who need it most.","use":"Arrange credit while you do not need it, if you are going to need it at all. The overdraft, the facility, the conversation with the bank. Doing it from a position of comfort costs almost nothing. Doing it in a crisis costs a great deal, and this asymmetry is the single most reliable unfairness in the whole subject.","ch":18},{"n":270,"quote":"Poverty is not a shame, but the being ashamed of it is.","bare":false,"attribution":"English proverb","means":"The proverb separates the condition from the feeling attached to it, and identifies the feeling as the part that does the damage. Shortage narrows your options. Shame narrows what you are willing to say about it, which narrows them further.","use":"The exit, and it matters more than anything above. If money is tight, none of this chapter is a moral test you are failing. The leaks are not the problem when the pipe is too small. Take the help, claim the thing you are entitled to, tell one person the truth about the number, and ignore the entire literature of thrift, which was written for people whose problem is appetite and not arithmetic.","ch":18}]},{"n":19,"title":"Time and Where It Goes","part":"Three","partRoman":"III","partName":"The Work","opening":"<p>Ask somebody where their money goes and they can give you a rough account. Ask where their time goes and you get a pause, then something vague about being busy.</p><p>This is odd, given that time is the more limited of the two and the only one that cannot be replaced, borrowed or earned back.</p><p>The vagueness is not an accident. Time disappears in a way money does not, because no statement arrives at the end of the month. It goes in fragments: twenty minutes here, a scrolled half hour there, an evening that somehow ended without anything happening in it, and not one of those pieces is ever large enough to register as a loss at the moment it is being taken. Then a year has gone and you cannot account for it, which is unsettling enough that most people decide not to look.</p><p>There is a second problem, which is the assumption of abundance. Everything you are putting off assumes a future roomier than the present. When work calms down. When the children are older. When I retire. Some of that future does arrive, and it is never as spacious as forecast, because whatever is filling your time now is a habit rather than a temporary condition, and habits travel.</p><p>None of this is an argument for optimising every hour. A life measured in productive units is a miserable thing, and the people who track themselves in fifteen-minute blocks are not conspicuously happier than anyone else.</p><p>The useful version is plainer. Know roughly where it goes. Spend it deliberately on the things you would defend. Be honest about how much is being taken by things you would not.</p><p>Then leave a decent quantity of it unaccounted for, on purpose. That is not a failure of the system. That is most of the point.</p>","entries":[{"n":271,"quote":"It is not that we have a short time to live, but that we waste much of it.","bare":false,"attribution":"Seneca","means":"The complaint that life is too short is, on Seneca's reading, a complaint about its length when the real trouble is its use. A life is a large quantity of time. What is short is the portion anybody spends on purpose.","use":"Before saying you have not got time for something, check whether that is true or whether it is a question of priority. \"I haven't time to read\" and \"I'd rather watch television\" are different statements and only one of them can be fixed. Saying the accurate one is where it starts.","ch":19},{"n":272,"quote":"Lost time is never found again.","bare":false,"attribution":"Benjamin Franklin","means":"Unlike almost everything else you can spend, time has no recovery mechanism. Money comes back. Health often comes back. Relationships can sometimes be repaired. The Tuesday evening is gone, and there is no version of the future in which it is returned to you.","use":"Apply it to waiting. The months spent waiting for somebody to decide, for a situation to resolve itself, for conditions to improve. Waiting feels free and costs exactly what doing costs. If you are going to wait, wait while doing something else.","ch":19},{"n":273,"quote":"How we spend our days is, of course, how we spend our lives.","bare":false,"attribution":"Annie Dillard","means":"There is no separate category called \"my life\" sitting apart from what you did on Tuesday. The sum of the ordinary days is the whole of it, which means the thing is being decided quietly, in the background, by choices so small that none of them felt like a choice while you were making it.","use":"Describe a typical day of yours out loud, honestly, and take that as the answer to what your life is. If the description bothers you, the thing to change is a Tuesday rather than a five-year plan. There is nothing else available to change.","ch":19},{"n":274,"quote":"Teach us to number our days, that we may apply our hearts unto wisdom.","bare":false,"attribution":"Psalm 90:12","means":"Counting is offered as the route to wisdom rather than to alarm. Vague awareness of mortality changes nothing at all. An actual number is what makes you reconsider how you are spending the days you have left.","use":"Do one uncomfortable sum. If your parents are seventy and you see them four times a year, work out how many visits that leaves. People find the figure shocking, and it changes behaviour where a decade of good intentions did not.","ch":19},{"n":275,"quote":"Ordinary people think merely of spending time. Great people think of using it.","bare":false,"attribution":"Arthur Schopenhauer","means":"Time can be passed or it can be directed, and the difference is not intensity. Somebody lying in a garden on purpose is using their afternoon. Somebody who has been on their phone for two hours without ever deciding to is spending it.","use":"The test is not what you are doing but whether you chose it. Three episodes because you wanted three episodes is fine. Three because the next one started on its own is not the same act. Choose the evening out loud, even when you choose exactly what you would have done anyway.","ch":19},{"n":276,"quote":"Time and tide wait for no man.","bare":false,"attribution":"Geoffrey Chaucer","means":"The world does not pause for your readiness. Children grow, parents age, opportunities close and bodies change, and none of it is waiting on you to have got round to it.","use":"Identify the thing whose window is closing: a parent's health, a child's age, a body that can still do the trip. Those take priority over everything that will still be there in five years, which is most things. Do the perishable ones first.","ch":19},{"n":277,"quote":"Nothing is ours except time.","bare":false,"attribution":"Seneca","means":"Everything else can be taken. Money, position, possessions, reputation. Time is the one holding that is unambiguously yours, and it is the one people give away most readily, generally to whoever asks first.","use":"Notice the difference between how you treat a request for your money and a request for your time. Most people would refuse, without much awkwardness, to lend a hundred pounds to somebody they would hand a whole Saturday to without being asked twice. Apply a fraction of the financial caution to the diary and watch what happens.","ch":19},{"n":278,"quote":"Better three hours too soon than a minute too late.","bare":false,"attribution":"William Shakespeare","means":"The costs of being early and being late are not symmetrical. Early costs you a wait, which is recoverable and mildly dull. Late can cost you the thing entirely, and it spends somebody else's time as well as your own.","use":"Build in more slack than seems reasonable for anything that matters: the train, the interview, the deadline. Then carry something to do with the spare twenty minutes, so the buffer stops feeling like waste and turns into reading time you would not otherwise have had.","ch":19},{"n":279,"quote":"The two most powerful warriors are patience and time.","bare":false,"attribution":"Leo Tolstoy","means":"Some problems cannot be solved and can be outlasted. Grief. A difficult colleague. A bad market. A phase a child is going through. Time does work that no amount of intervention can, provided you have not exhausted yourself intervening.","use":"Ask whether the thing in front of you needs solving or waiting out. If it is a phase, a mood, a temporary arrangement, then doing less is the strategy. Recognising which problems are on a clock saves an extraordinary amount of misdirected effort.","ch":19},{"n":280,"quote":"One cannot step twice into the same river.","bare":false,"attribution":"Heraclitus","means":"The river has moved on and so have you. Situations you are deferring will not be waiting in their present form, and returning to something after a decade means returning to a different thing, as a different person, for different reasons.","use":"Be careful with the plan to come back to something later. The city, the friendship, the ambition. Sometimes later works. But if what you want is this specific thing as it exists now, later is a different offer, and it is worth being clear about which one you are accepting.","ch":19},{"n":281,"quote":"Dost thou love life? Then do not squander time, for that is the stuff life is made of.","bare":false,"attribution":"Benjamin Franklin","means":"Not a productivity slogan. Time is identified here as the material rather than the container: a life is not lived in time, it is made out of it, which means wasting one is directly wasting the other.","use":"Find the single largest leak in your week and measure it honestly for seven days, using whatever your phone reports rather than your own estimate. Almost everybody finds one activity eating several hours a week that they would not defend out loud. Halving one leak beats any system.","ch":19},{"n":282,"quote":"The trouble is, you think you have time.","bare":false,"attribution":"Buddhist saying","means":"Every deferral rests on an assumption about the future that never gets examined and is occasionally wrong. The plan to do it later requires a later, and none of us has been issued one.","use":"Take one thing you have been postponing indefinitely, the visit, the letter, the apology, the appointment, and do it this week. Not all of them. One. The list of things people regret is remarkably consistent, and it consists almost entirely of things they assumed there would be time for.","ch":19},{"n":283,"quote":"Time is the wisest counsellor of all.","bare":false,"attribution":"Pericles","means":"Time supplies information that no amount of deliberation can produce in advance. Whether a decision was right, whether a person was trustworthy, whether the thing that felt like a disaster actually was one: those get answered by waiting, not by thinking harder about them.","use":"On a genuinely balanced decision, give it a fortnight rather than more analysis. You are not delaying. You are gathering. The answer often becomes obvious in that period with no further effort from you, because something happens that you could not have predicted.","ch":19},{"n":284,"quote":"Life is what happens to you while you're busy making other plans.","bare":false,"attribution":"attributed to John Lennon","means":"The plan gets your attention and the unplanned parts turn out to be the substance. What people describe as the best years of their lives is rarely the thing they were aiming at. It is whatever was going on alongside it while they were looking elsewhere.","use":"When you are deep in a big project, deliberately notice what is happening around the edges of it. The children. The friendships. An ordinary Thursday. The project has a completion date. The other things are happening now, once, and they are not waiting for it to finish.","ch":19},{"n":285,"quote":"Time you enjoy wasting is not wasted time.","bare":false,"attribution":"Marthe Troly-Curtin","means":"Not all value is productive value. An afternoon spent doing nothing of consequence with somebody you like is not a deduction from a life well spent. It may well be the thing all the rest of it was for.","use":"Here is the exit. If reading this chapter has left you feeling that you ought to be doing something more useful, put it down and go and waste an evening on purpose. The account is only worth keeping if some of it goes on things that never have to justify themselves.","ch":19}]},{"n":20,"title":"Getting Older","part":"Four","partRoman":"IV","partName":"The Long View","opening":"<p>Ageing does not announce itself. There is no morning on which you wake up old. What happens instead is a series of small notifications spread across decades: a knee that comments on stairs it once ignored, a reference that nobody in the room recognises, the discovery that you have become the oldest person on the team, a parent who has turned into somebody you look after.</p><p>Most of us manage this by not thinking about it, which works until it does not. The difficulty with not thinking about it is that the decisions get made anyway, by default. The trip you would do when you were fitter. The reconciliation you would get round to. The thing you were going to say to your father one day when the moment was right and the two of you were on your own. Deferred often enough, they stop being deferred and become permanent, and the transition happens with no date attached to it.</p><p>There is a great deal of unhelpful material on this subject. On one side, denial dressed as positivity: sixty is the new forty, age is only a number. On the other, a resigned dreariness that treats every decade past fifty as an exercise in decline management. Neither is much use to somebody actually in it.</p><p>What seems closer to true is that some things get worse and some get better, and the second list is longer than young people imagine: judgement, perspective, the capacity to sit with difficulty, and a substantially reduced
