 interest in what strangers make of you.</p><p>The other subject this chapter cannot avoid is death, which is why people skip these pages. Worth saying plainly: thinking about mortality does not make you morbid, and the people who have done it are better at deciding what to do with a free weekend.</p><p>All of it works better read early. It is addressed to somebody with time to change their arrangements.</p>","entries":[{"n":286,"quote":"Do not act as if you had ten thousand years to live.","bare":false,"attribution":"Marcus Aurelius","means":"Not an instruction to panic. A correction to a specific error in how we plan, which is that we behave as though the supply of years were effectively unlimited and so place the important things in a future that keeps moving away from us.","use":"Look at what is currently in the \"one day\" category. Move exactly one thing out of it into a month, with a date. Not all of them; the list is long and this is not a crisis. Just demonstrate to yourself that the category is optional.","ch":20},{"n":287,"quote":"It is not length of life, but depth of life.","bare":false,"attribution":"Ralph Waldo Emerson","means":"Duration is mostly outside your control and is not the variable that determines whether a life felt full. Density is: how much of it you were present for, and how much went past while you were thinking about something else.","use":"Notice that time runs fastest when every week resembles the last. Novelty slows it down: a new route, an unfamiliar town, a skill you are bad at. If the years are blurring, the answer is not more years. It is more variety in the ones you are having.","ch":20},{"n":288,"quote":"Nobody grows old merely by living a number of years. We grow old by deserting our ideals.","bare":false,"attribution":"Samuel Ullman","means":"Ullman separates age from ageing. What people identify as old, in somebody of any age at all, is the closure of curiosity: the point at which a person stops revising their views and begins defending them.","use":"Keep at least one thing going that you are currently bad at. An instrument, a language, a sport with people much younger than you. Being a beginner in public is unpleasant at fifty in a way it never was at fifteen, and it is the most reliable thing you can do to stay recognisable to yourself.","ch":20},{"n":289,"quote":"Life is long enough if you know how to use it.","bare":false,"attribution":"Seneca","means":"The line lands differently depending on where you are standing, and it is meant as consolation rather than reproach. A standard life is a great deal of time. The complaint that there is not enough of it is usually a complaint about the allocation.","use":"If you are forty-five and feel it is too late for something, do the arithmetic properly. Forty-five leaves perhaps thirty-five years of decent health. That is longer than everything that has happened to you since you left school, and you managed a considerable amount in that.","ch":20},{"n":290,"quote":"Remember that you must die.","bare":false,"attribution":"memento mori","means":"Two words, painted into pictures and carved onto clocks for centuries, and never intended to depress anybody. Held lightly, mortality works as a filter. It makes the trivial obviously trivial, at speed, without any argument.","use":"Stuck on a decision that is tying you in knots, ask whether it will have mattered at the end. Most things will not, which is freeing rather than bleak. It also works well on grudges, on status worries, and on the thing you have been embarrassed about since March.","ch":20},{"n":291,"quote":"The old believe everything; the middle-aged suspect everything; the young know everything.","bare":false,"attribution":"Oscar Wilde","means":"A joke about how certainty travels across a life, and Wilde's ordering is unflattering to everybody. The useful part is the middle. Suspicion of everything is its own trap, and it is where a great many people get stuck for thirty years.","use":"Watch for cynicism arriving disguised as experience. \"I've seen this before\" is sometimes wisdom and sometimes a refusal to look. If your first response to new things has become a reason they will not work, that is not judgement maturing. That is curiosity closing.","ch":20},{"n":292,"quote":"The years teach much which the days never know.","bare":false,"attribution":"Ralph Waldo Emerson","means":"Some understanding is only available at a distance. Patterns in your own behaviour, the real significance of things that happened, which people mattered and which merely took up room: none of it visible from inside the week, all of it obvious later.","use":"When you are too close to something to judge it, accept that you are too close and stop trying to judge it. Ask what somebody would make of this in ten years. That is not a trick for gaining perspective. It produces a different answer, and generally a calmer one.","ch":20},{"n":293,"quote":"As long as we are alive, death is not; when death comes, we are not.","bare":false,"attribution":"Epicurus","means":"The argument is that death cannot be experienced, so there is no moment at which it happens to you. Whether it dissolves the fear varies from person to person, and it is worth having in the drawer.","use":"If it keeps you awake, notice that what most people fear is not non-existence but the run-up: pain, dependence, leaving somebody unprovided for. Those are practical problems with practical responses, and separating them from the metaphysical part makes both easier to carry.","ch":20},{"n":294,"quote":"Grow old along with me! The best is yet to be.","bare":false,"attribution":"Robert Browning","means":"Written as a defence of later life against the assumption that all the good parts are at the front. It is optimistic rather than naive: Browning's claim is that the later section has advantages of its own, and that they are not consolation prizes.","use":"List what is better now than it was at twenty-five. Most people produce a long list: money, competence, better friendships, the end of caring what a room thinks of them. Read it whenever the culture tells you the good part is over. Your own evidence is more reliable.","ch":20},{"n":295,"quote":"The whole life of a philosopher is a preparation for death.","bare":false,"attribution":"Cicero","means":"Preparation here is not gloom. It is practical: getting your affairs in order, saying what needs saying, resolving what can still be resolved. The people who do this turn out to be less anxious rather than more.","use":"Do the administrative version this year. A will, an expression of wishes, one conversation about what you would want. It takes an afternoon, removes a background hum you had stopped noticing, and spares the people you love a set of decisions they would otherwise have to make while grieving.","ch":20},{"n":296,"quote":"Honour thy father and thy mother.","bare":false,"attribution":"Exodus 20:12","means":"However you feel about the source, the instruction becomes concrete and urgent at a particular stage of life, and it arrives at the point where the relationship has usually become complicated and the time remaining is finite.","use":"Ask the questions while you can. Where the family came from, what their childhood was like, what frightened them at your age. People report this among the few things they do not regret, and the window closes without warning.","ch":20},{"n":297,"quote":"Anyone who stops learning is old, whether at twenty or eighty. Anyone who keeps learning stays young.","bare":false,"attribution":"attributed to Henry Ford","means":"The claim is about the direction you are facing rather than the date on your birth certificate. Learning keeps you oriented forwards, and that orientation is what people are describing when they say somebody seems young.","use":"Pick one genuinely new thing a year, chosen because it interests you rather than because it is useful. Nothing has to come of it. The point is the ongoing experience of being a person who does not yet know something and is going about finding out.","ch":20},{"n":298,"quote":"Age is a matter of feeling, not of years.","bare":false,"attribution":"George William Curtis","means":"Half true, and worth holding as half. Your own sense of yourself does more than the number to determine how you live. It also does not repeal biology, and the version of this idea that ignores the body is a trap that closes slowly.","use":"Take the feeling seriously and take the maintenance seriously too. Sleep, strength, the appointments you keep putting off. The people still active in their eighties are not the ones who ignored their bodies. They are the ones who attended to them early, and dully, for years.","ch":20},{"n":299,"quote":"It is not death that a man should fear, but he should fear never beginning to live.","bare":false,"attribution":"Marcus Aurelius","means":"The greater loss is named as an unlived life rather than a finished one. What people regret at the end is omission: things not attempted, not said, not risked, each one deferred for reasons that seemed adequate at the time and cannot be reconstructed afterwards.","use":"Ask what you would regret if it stopped soon. Not the abstract answer. The specific one. Then notice that you already knew, that you have known for a while, and that what stands between you and it is a series of ordinary weeks exactly like this one.","ch":20},{"n":300,"quote":"Old age is a tyrant which forbids, upon pain of death, all the pleasures of youth.","bare":false,"attribution":"François de La Rochefoucauld","means":"A blunt line, and a corrective to everything above it. Ageing takes real things away and there is no reading of it that makes the losses good. Pretending otherwise insults anybody in the middle of them.","use":"The chapter lets you go here. You are not obliged to be serene about this. Resenting the knees, the tiredness and the funerals of friends is a reasonable response to genuine loss, and declining to perform gratitude about it does not mean you are ageing badly.","ch":20}]},{"n":21,"title":"What Actually Matters","part":"Four","partRoman":"IV","partName":"The Long View","opening":"<p>The question in the title cannot be answered in general and can be answered in particular, which is the only useful thing this chapter has to offer. Nobody can tell you what matters. What can be observed is that the priorities people state and the priorities they act on come apart, and that the gap between the two shows up in a diary and a bank statement years before it becomes visible to the person living inside it.</p><p>There is a finding from people who work with the dying, and it has the advantage of being empirical rather than philosophical. In the last weeks, nobody wishes they had worked more, earned more, or won more arguments. They talk about the people they loved and whether they ever said so, about not having lived as themselves, about the time given to things they did not care about because they felt obliged.</p><p>It is a short list. It stays much the same across very different lives.</p><p>Which is useful information, arriving slightly too late for the people supplying it. The whole value of hearing it early is the chance to act while it is still cheap: a phone call rather than a deathbed reconciliation, a change of direction at forty rather than a regret at eighty.</p><p>What follows is the closing chapter and it declines to tell you what to conclude. The quotations disagree with each other in places, which is honest. Some point towards service, some towards character, some towards the modest business of tending whatever is in front of you.</p><p>The last entry lets you off. By then you will have read two hundred and forty pieces of advice, which is a great deal more than anybody needs, and the right next step is not to read another one.</p>","entries":[{"n":301,"quote":"The unexamined life is not worth living.","bare":false,"attribution":"Socrates","means":"Said at his trial with his life on the line, so he meant it. The claim is that a life lived on autopilot, absorbing its values from whatever happened to be nearby, is missing the thing that would make it yours.","use":"Once a year, ask where your current priorities came from. Some you chose. Others arrived from your parents, your industry, or whoever you happened to be standing near at twenty-five. The ones you did not choose are worth examining, and a few will not survive it.","ch":21},{"n":302,"quote":"Waste no more time arguing about what a good man should be. Be one.","bare":false,"attribution":"Marcus Aurelius","means":"An impatient line from somebody with limited time for theory. Working out the correct position on how to live is infinitely extendable and produces nothing. The alternative is available immediately and does not require you to have finished thinking.","use":"Take whatever you already know you should do, and you do know, and do that this week instead of reading more about it. The gap in most lives is not knowledge. Nobody is failing to be kind because they have not yet encountered the argument for kindness.","ch":21},{"n":303,"quote":"No man is an island, entire of itself; every man is a piece of the continent.","bare":false,"attribution":"John Donne","means":"Independence is a story we tell ourselves. Everything you have came through other people: the language you are reading this in, the work, the roads, the person who sat with you at six while you learned which sound the letters made. Isolation is achievable, and it is a subtraction rather than an achievement.","use":"Count how many people you spoke to properly this week. If the number is low and has been low for months, treat that as a problem on the level of a health problem, because it is one. Connection is not a luxury item to be added once things settle down.","ch":21},{"n":304,"quote":"Vanity of vanities; all is vanity.","bare":false,"attribution":"Ecclesiastes 1:2","means":"The most bracing line in the Bible, and the book it comes from is oddly cheerful about it. Everything is temporary, ambition included, and rather than despairing the writer concludes that you should eat your bread, do your work, and enjoy your life.","use":"Apply it to whatever you are anxious about achieving. In a hundred years nobody will know. That is not a reason to do nothing. It is a reason to stop treating it as a verdict on your worth, and to enjoy the doing rather than staking everything on the result.","ch":21},{"n":305,"quote":"Three things in human life are important. The first is to be kind. The second is to be kind. The third is to be kind.","bare":false,"attribution":"Henry James","means":"The repetition is the argument. James is not ranking kindness first among several qualities. He is saying it occupies all three positions, and that most of what people substitute for it is a way of feeling good without the inconvenience.","use":"Test it against cost. Kindness that costs you nothing is politeness, which is fine and is not this. The real version costs time, or money, or the discomfort of getting involved in something. Once a week, do one that actually costs, and notice what it does to the week.","ch":21},{"n":306,"quote":"He who has a why to live can bear almost any how.","bare":false,"attribution":"Friedrich Nietzsche","means":"Meaning works as load-bearing structure. People endure extraordinary difficulty when it serves something they chose, and they are flattened by much less when it is attached to nothing they can name.","use":"When something has become unbearable, check whether the problem is the difficulty or the pointlessness. Hard work for a reason you believe in is tiring. Hard work for no reason you can state is corrosive, and the remedy is different: you need a why, not a rest.","ch":21},{"n":307,"quote":"Wherever there is a human being, there is an opportunity for kindness.","bare":false,"attribution":"Seneca","means":"The opportunities are not rare, dramatic, or in need of seeking out. They are continuous and small, which is why they get missed. We are waiting for something significant enough to count.","use":"Use the next dull interaction. The person at the till, the call handler, the neighbour you nod at. Not a grand gesture. Thirty seconds of treating them as a person. It is the cheapest improvement available to a day, and it works on yours as well as theirs.","ch":21},{"n":308,"quote":"Character is what you are in the dark.","bare":false,"attribution":"D.L. Moody","means":"The behaviour that counts is the unobserved kind: what you do when there is no consequence, no audience and no record being kept anywhere. Everything else is part performance, however sincerely it is meant at the time.","use":"Watch the moments with no witnesses. The extra change you were given. The form nobody will check. The anonymous person you could be rude to for free. Nothing hangs on any one of them, and together they are a fair description of who you are.","ch":21},{"n":309,"quote":"How wonderful it is that nobody need wait a single moment before starting to improve the world.","bare":false,"attribution":"Anne Frank","means":"Written by a teenager in hiding, which is the context that makes it credible rather than sentimental. There is no qualification to obtain, no position to reach and no permission required before you can start doing something useful.","use":"Pick something small, local and real, and do it now instead of waiting until you have more capacity. An hour a month somewhere it is needed. The scale of the problem is not an argument against the contribution. It is the reason most people never make one.","ch":21},{"n":310,"quote":"A society grows great when old men plant trees whose shade they know they shall never sit in.","bare":false,"attribution":"Greek proverb","means":"Some of the best things you can do pay off after you have gone. That is not a flaw in the arrangement. It is the mechanism by which anything lasting gets built, and every generation alive today is sitting in shade planted by people it never met, complaining about the weather.","use":"Do one thing this year with a payoff you will not see. Teach somebody younger. Mend something properly. Plant something slow. The absence of a return is what makes it worth doing, and it is an unexpectedly good antidote to the feeling that everything is a transaction.","ch":21},{"n":311,"quote":"It is easier to build strong children than to repair broken men.","bare":false,"attribution":"Frederick Douglass","means":"Intervening early is cheaper, kinder and more effective than repairing damage later. True of children and true of nearly everything else: the small correction now, the conversation before it becomes a rupture, the repair before it becomes a replacement.","use":"Look for where you are waiting for something to become serious enough to address. The friendship going cold. The habit growing. The child who has gone quiet. The early version takes an hour. The late version takes years and does not always work.","ch":21},{"n":312,"quote":"To be trusted is a greater compliment than to be loved.","bare":false,"attribution":"George MacDonald","means":"Love can be given for reasons that have nothing to do with your conduct. Trust has to be earned, in specific instances, over time, and it is the closest thing to an objective assessment of your character that you will ever be handed.","use":"Notice what people bring you. If they bring problems, secrets and hard questions, that is a verdict and a good one. If they do not, ask what you did with the things they brought before. Trust is granted on evidence and withdrawn the same way.","ch":21},{"n":313,"quote":"What we have done for ourselves alone dies with us; what we have done for others and the world remains.","bare":false,"attribution":"Albert Pike","means":"A rough test for durability. What you accumulate stops mattering fairly promptly. What you did for other people continues inside them, gets passed on, and outlasts any record of where it came from.","use":"Think about who influenced you most, then ask whether they ever knew. Almost certainly not, and the thing they did was ordinary to them, unmemorable, quite possibly a single sentence said in passing on a day they have entirely forgotten. You are doing this for somebody right now. Worth being deliberate about, given that you will never find out.","ch":21},{"n":314,"quote":"Let us cultivate our garden.","bare":false,"attribution":"Voltaire","means":"The last line of Candide, arrived at after every grand theory of how the world works has been tested and found wanting. The conclusion is not despair. It is that useful work on the small patch in front of you is what is actually available, and that it is enough.","use":"Overwhelmed by things you cannot affect, the news, the state of everything, turn to what is within arm's reach. Your family, your street, your work, the person in front of you. This is not a retreat from the big questions. It is the only place anybody has ever managed to answer them.","ch":21},{"n":315,"quote":"The unlived life is not worth examining.","bare":false,"attribution":"Adam Phillips","means":"Phillips is inverting Socrates, and the joke has a point inside it. Examination is meant to serve living, and it is entirely possible to spend years thinking carefully about how to live as a substitute for getting on with it.","use":"This is the exit, from the chapter and from the book. You have read a great deal of advice. The correct response to most of it is not further reflection. Close this, ring somebody you have been meaning to ring, and let the rest come back to you when you need it.","ch":21}]}],"index":[{"name":"Aeschylus","letter":"A","items":[{"n":83,"quote":"It is in the character of very few men to honour without envy a friend who has prospered.","ch":6,"q":""}]},{"name":"Aesop","letter":"A","items":[{"n":147,"quote":"Injuries may be forgiven, but not forgotten.","ch":10,"q":""},{"n":151,"quote":"The North Wind and the Sun","ch":11,"q":""},{"n":207,"quote":"The gods help them that help themselves.","ch":14,"q":""},{"n":214,"quote":"Slow and steady wins the race.","ch":15,"q":""}]},{"name":"Antisthenes","letter":"A","items":[{"n":80,"quote":"As rust corrupts iron, so envy corrupts man.","ch":6,"q":""}]},{"name":"Aristotle","letter":"A","items":[{"n":6,"quote":"Courage is the first of human qualities because it guarantees all the others.","ch":1,"q":""},{"n":39,"quote":"Anybody can become angry, that is easy; but to be angry with the right person, to the right degree, at the right time, for the right purpose, and in the right way, that is not easy.","ch":3,"q":""},{"n":92,"quote":"Friendship is a single soul dwelling in two bodies.","ch":7,"q":""},{"n":120,"quote":"A friend to all is a friend to none.","ch":8,"q":"attributed to"},{"n":172,"quote":"It is the mark of an educated mind to be able to entertain a thought without accepting it.","ch":12,"q":"after"},{"n":187,"quote":"Whosoever is delighted in solitude is either a wild beast or a god.","ch":13,"q":""}]},{"name":"Ashe, Arthur","letter":"A","items":[{"n":13,"quote":"Start where you are. Use what you have. Do what you can.","ch":1,"q":""}]},{"name":"Aurelius, Marcus","letter":"A","items":[{"n":16,"quote":"What stands in the way becomes the way.","ch":2,"q":""},{"n":29,"quote":"Loss is nothing else but change, and change is nature's delight.","ch":2,"q":""},{"n":47,"quote":"You have power over your mind, not outside events. Realise this, and you will find strength.","ch":4,"q":""},{"n":66,"quote":"Very little is needed to make a happy life; it is all within yourself, in your way of thinking.","ch":5,"q":""},{"n":139,"quote":"The best revenge is to be unlike him who performed the injury.","ch":10,"q":""},{"n":246,"quote":"Nowhere can a man find a quieter or more untroubled retreat than in his own mind.","ch":17,"q":""},{"n":286,"quote":"Do not act as if you had ten thousand years to live.","ch":20,"q":""},{"n":299,"quote":"It is not death that a man should fear, but he should fear never beginning to live.","ch":20,"q":""},{"n":302,"quote":"Waste no more time arguing about what a good man should be. Be one.","ch":21,"q":""}]},{"name":"Ausonius","letter":"A","items":[{"n":113,"quote":"He who does not know how to be silent does not know how to speak.","ch":8,"q":""}]},{"name":"Bacon, Francis","letter":"B","items":[{"n":137,"quote":"In taking revenge, a man is but even with his enemy; but in passing it over, he is superior.","ch":10,"q":""},{"n":162,"quote":"When the hill will not come to Mahomet, Mahomet will go to the hill.","ch":11,"q":""},{"n":177,"quote":"Man prefers to believe what he prefers to be true.","ch":12,"q":""},{"n":258,"quote":"Riches are a good handmaid, but the worst mistress.","ch":18,"q":""}]},{"name":"Balzac, Honoré de","letter":"B","items":[{"n":188,"quote":"Solitude is fine, but you need someone to tell you that solitude is fine.","ch":13,"q":""}]},{"name":"Beckett, Samuel","letter":"B","items":[{"n":220,"quote":"Ever tried. Ever failed. No matter. Try again. Fail again. Fail better.","ch":15,"q":""}]},{"name":"Bierce, Ambrose","letter":"B","items":[{"n":41,"quote":"Speak when you are angry and you will make the best speech you will ever regret.","ch":3,"q":""}]},{"name":"Billings, Josh","letter":"B","items":[{"n":155,"quote":"The best way to convince a fool he is wrong is to let him have his own way.","ch":11,"q":""},{"n":236,"quote":"Half of the troubles of this life can be traced to saying yes too quickly and not saying no soon enough.","ch":16,"q":""}]},{"name":"Boese, Paul","letter":"B","items":[{"n":149,"quote":"Forgiveness does not change the past, but it does enlarge the future.","ch":10,"q":""}]},{"name":"Boethius","letter":"B","items":[{"n":57,"quote":"Nothing is miserable unless you think it so.","ch":4,"q":""}]},{"name":"Bonaparte, Napoleon","letter":"B","items":[{"n":153,"quote":"Never interrupt your enemy when he is making a mistake.","ch":11,"q":"attributed to"}]},{"name":"Browne, Sir Thomas","letter":"B","items":[{"n":185,"quote":"Be able to be alone. Lose not the advantage of solitude.","ch":13,"q":""}]},{"name":"Browning, Robert","letter":"B","items":[{"n":294,"quote":"Grow old along with me! The best is yet to be.","ch":20,"q":""}]},{"name":"Buddha, the","letter":"B","items":[{"n":129,"quote":"Ask yourself: is it true, is it necessary, is it kind?","ch":9,"q":"attributed to"}]},{"name":"Bunyan, John","letter":"B","items":[{"n":70,"quote":"A man there was, though some did count him mad; the more he cast away, the more he had.","ch":5,"q":""}]},{"name":"Burton, Robert","letter":"B","items":[{"n":86,"quote":"Every other sin hath some pleasure annexed to it, or will admit of an excuse; envy alone wants both.","ch":6,"q":""}]},{"name":"Butler, Samuel","letter":"B","items":[{"n":98,"quote":"Friendship is like money, easier made than kept.","ch":7,"q":""}]},{"name":"Byron, Lord","letter":"B","items":[{"n":23,"quote":"Adversity is the first path to truth.","ch":2,"q":""},{"n":189,"quote":"In solitude, where we are least alone.","ch":13,"q":""}]},{"name":"Calwell, Arthur","letter":"C","items":[{"n":164,"quote":"It is better to be defeated on principle than to win on lies.","ch":11,"q":""}]},{"name":"Carnegie, Dale","letter":"C","items":[{"n":199,"quote":"Do the hard jobs first. The easy jobs will take care of themselves.","ch":14,"q":""}]},{"name":"Cervantes, Miguel de","letter":"C","items":[{"n":211,"quote":"Diligence is the mother of good fortune.","ch":15,"q":""},{"n":243,"quote":"The bow cannot always stand bent, nor can human frailty subsist without some lawful recreation.","ch":17,"q":""}]},{"name":"Charles I","letter":"C","items":[{"n":180,"quote":"Never make a defence or apology before you be accused.","ch":12,"q":""}]},{"name":"Chaucer, Geoffrey","letter":"C","items":[{"n":276,"quote":"Time and tide wait for no man.","ch":19,"q":""}]},{"name":"Chrysostom, St John","letter":"C","items":[{"n":268,"quote":"The rich man is not one who is in possession of much, but one who gives much.","ch":18,"q":""}]},{"name":"Churchill, Winston","letter":"C","items":[{"n":213,"quote":"Never give in, never give in, never, never, never.","ch":15,"q":""}]},{"name":"Cicero","letter":"C","items":[{"n":115,"quote":"Silence is one of the great arts of conversation.","ch":8,"q":""},{"n":183,"quote":"A wise man is never less alone than when he is alone.","ch":13,"q":""},{"n":295,"quote":"The whole life of a philosopher is a preparation for death.","ch":20,"q":""}]},{"name":"Coleridge, Samuel Taylor","letter":"C","items":[{"n":44,"quote":"To be wroth with one we love doth work like madness in the brain.","ch":3,"q":""},{"n":163,"quote":"Nothing is so contagious as enthusiasm.","ch":11,"q":""}]},{"name":"Confucius","letter":"C","items":[{"n":110,"quote":"Silence is a true friend who never betrays.","ch":8,"q":""},{"n":142,"quote":"Before you embark on a journey of revenge, dig two graves.","ch":10,"q":"attributed to"},{"n":168,"quote":"A man who has committed a mistake and doesn't correct it is committing another mistake.","ch":12,"q":""},{"n":212,"quote":"It does not matter how slowly you go as long as you do not stop.","ch":15,"q":"attributed to"}]},{"name":"Covey, Stephen","letter":"C","items":[{"n":157,"quote":"Seek first to understand, then to be understood.","ch":11,"q":""}]},{"name":"Cowper, William","letter":"C","items":[{"n":255,"quote":"Absence of occupation is not rest; a mind quite vacant is a mind distressed.","ch":17,"q":""}]},{"name":"Curie, Marie","letter":"C","items":[{"n":7,"quote":"Nothing in life is to be feared, it is only to be understood.","ch":1,"q":""}]},{"name":"Curtis, George William","letter":"C","items":[{"n":298,"quote":"Age is a matter of feeling, not of years.","ch":20,"q":""}]},{"name":"Dekker, Thomas","letter":"D","items":[{"n":251,"quote":"Sleep is the golden chain that ties health and our bodies together.","ch":17,"q":""}]},{"name":"Dickens, Charles","letter":"D","items":[{"n":256,"quote":"Annual income twenty pounds, annual expenditure nineteen nineteen and six, result happiness. Annual income twenty pounds, annual expenditure twenty pounds ought and six, result misery.","ch":18,"q":""}]},{"name":"Dillard, Annie","letter":"D","items":[{"n":273,"quote":"How we spend our days is, of course, how we spend our lives.","ch":19,"q":""}]},{"name":"Dionysius the Elder","letter":"D","items":[{"n":119,"quote":"Let thy speech be better than silence, or be silent.","ch":8,"q":""}]},{"name":"Donne, John","letter":"D","items":[{"n":303,"quote":"No man is an island, entire of itself; every man is a piece of the continent.","ch":21,"q":""}]},{"name":"Douglass, Frederick","letter":"D","items":[{"n":311,"quote":"It is easier to build strong children than to repair broken men.","ch":21,"q":""}]},{"name":"Edison, Thomas","letter":"E","items":[{"n":204,"quote":"Genius is one percent inspiration and ninety-nine percent perspiration.","ch":14,"q":""},{"n":216,"quote":"Our greatest weakness lies in giving up. The most certain way to succeed is always to try just one more time.","ch":15,"q":""},{"n":224,"quote":"Many of life's failures are people who did not realise how close they were to success when they gave up.","ch":15,"q":""}]},{"name":"Einstein, Albert","letter":"E","items":[{"n":128,"quote":"Whoever is careless with the truth in small matters cannot be trusted with important matters.","ch":9,"q":""}]},{"name":"Emerson, Ralph Waldo","letter":"E","items":[{"n":4,"quote":"Do the thing you fear and the death of fear is certain.","ch":1,"q":""},{"n":54,"quote":"Some of your hurts you have cured, and the sharpest you still have survived.","ch":4,"q":""},{"n":90,"quote":"Envy is ignorance; imitation is suicide.","ch":6,"q":""},{"n":96,"quote":"The only way to have a friend is to be one.","ch":7,"q":""},{"n":261,"quote":"Money often costs too much.","ch":18,"q":""},{"n":287,"quote":"It is not length of life, but depth of life.","ch":20,"q":""},{"n":292,"quote":"The years teach much which the days never know.","ch":20,"q":""}]},{"name":"Epictetus","letter":"E","items":[{"n":37,"quote":"It is not he who reviles or strikes you who insults you, but your opinion that these things are insulting.","ch":3,"q":""},{"n":49,"quote":"There is only one way to happiness, and that is to cease worrying about things which are beyond the power of our will.","ch":4,"q":""},{"n":61,"quote":"Wealth consists not in having great possessions, but in having few wants.","ch":5,"q":""},{"n":71,"quote":"He is a wise man who does not grieve for the things which he has not, but rejoices for those which he has.","ch":5,"q":""},{"n":154,"quote":"We have two ears and one mouth, so that we may listen twice as much as we speak.","ch":11,"q":"attributed to"}]},{"name":"Epicurus","letter":"E","items":[{"n":293,"quote":"As long as we are alive, death is not; when death comes, we are not.","ch":20,"q":""}]},{"name":"Feynman, Richard","letter":"F","items":[{"n":167,"quote":"The first principle is that you must not fool yourself, and you are the easiest person to fool.","ch":12,"q":""}]},{"name":"Ford, Henry","letter":"F","items":[{"n":297,"quote":"Anyone who stops learning is old, whether at twenty or eighty. Anyone who keeps learning stays young.","ch":20,"q":"attributed to"}]},{"name":"Frank, Anne","letter":"F","items":[{"n":309,"quote":"How wonderful it is that nobody need wait a single moment before starting to improve the world.","ch":21,"q":""}]},{"name":"Frankl, Viktor","letter":"F","items":[{"n":26,"quote":"Everything can be taken from a man but one thing: to choose one's attitude in any given set of circumstances.","ch":2,"q":""}]},{"name":"Franklin, Benjamin","letter":"F","items":[{"n":42,"quote":"Anger is never without a reason, but seldom with a good one.","ch":3,"q":""},{"n":200,"quote":"Little strokes fell great oaks.","ch":14,"q":""},{"n":208,"quote":"By failing to prepare, you are
